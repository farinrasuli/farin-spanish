{id:'story-B2-Fiction-1', level:'B2', genre:'Fiction', title:{en:"The Letter That Never Arrived", tr:"Hiç Ulaşmayan Mektup", fa:"نامه‌ای که هرگز نرسید", es:"La carta que nunca llegó"},
 text:"Elena heredó la librería de su abuelo hace tres años, y desde entonces pasa las tardes ordenando libros antiguos que casi nadie compra. Un martes por la tarde, mientras limpiaba una vieja edición de poesía, encontró un sobre amarillento escondido entre las páginas. Nunca había sido abierto.\n\nCon cuidado, Elena lo abrió y leyó la carta. Estaba fechada en 1978 y firmada por un hombre llamado Andrés. En ella, le decía a una mujer llamada Carmen que la amaba y que, en cuanto ella regresara de su viaje, la estaría esperando en la estación. La carta nunca fue enviada — probablemente se quedó olvidada entre las páginas de aquel libro durante casi cincuenta años.\n\nElena no podía dejar de pensar en Andrés y Carmen. Se preguntaba qué habría pasado si aquella carta hubiera llegado a tiempo. Tal vez Carmen habría vuelto, o tal vez ya era demasiado tarde para los dos. Decidió investigar. Preguntó a los vecinos más ancianos del barrio si alguien recordaba a una pareja con esos nombres.\n\nUna señora mayor le contó que, aunque no conocía a Andrés directamente, su madre le había hablado una vez de un joven que esperaba cartas que nunca llegaban. Le dijo que ese hombre había trabajado en la estación de tren durante años, siempre mirando hacia la puerta cada vez que sonaba el silbato.\n\nElena buscó registros antiguos y, semanas después, descubrió que Andrés había muerto hacía quince años, soltero, sin hijos. Nunca supo si Carmen había vuelto o no. La joven decidió publicar la carta en el periódico local, con la esperanza de que algún familiar la reconociera.\n\nDos semanas más tarde, una mujer entró en la librería. Dijo que era la sobrina de Carmen y que su tía había fallecido hacía años, siempre hablando de un amor de juventud que había perdido por un malentendido. Las dos mujeres se miraron en silencio, sorprendidas de que una simple carta, escondida durante décadas, todavía pudiera unir a dos familias.\n\nEsa noche, Elena guardó la carta original en una caja de cristal y la puso en el escaparate de la librería, junto a una nota: 'Algunas historias merecen ser contadas, aunque lleguen tarde.'",

{id:'story-B2-Adventure-1', level:'B2', genre:'Adventure', title:{en:"Lost in the Sierra", tr:"Sierra'da Kayıp", fa:"گم‌شده در سیه‌را", es:"Perdidos en la sierra"},
 text:"Cuatro amigos — Marcos, Lucía, Rubén y Paula — decidieron pasar el fin de semana haciendo senderismo en la Sierra Nevada. Habían planeado la ruta con cuidado, pero, aunque el pronóstico anunciaba buen tiempo, las nubes empezaron a oscurecerse apenas dos horas después de empezar la caminata.\n\n'Deberíamos haber revisado el pronóstico otra vez antes de salir', dijo Rubén, mirando el cielo con preocupación. Lucía respondió que, si hubieran esperado un día más, se habrían perdido la mejor luz para fotografiar la cumbre. Nadie podía saber que una tormenta se acercaba tan rápido.\n\nCuando empezó a llover con fuerza, el grupo buscó refugio bajo unas rocas grandes. El sendero, cubierto de barro, ya no era visible, y el móvil de Marcos no tenía señal. Paula sugirió que esperaran hasta que pasara lo peor de la tormenta antes de continuar. Todos estuvieron de acuerdo, aunque el frío empezaba a ser un problema serio.\n\nDespués de casi tres horas, la lluvia por fin paró. El grupo salió del refugio, pero el paisaje se veía completamente diferente bajo la niebla. Estaban perdidos. Rubén sacó la brújula que siempre llevaba en la mochila y, guiándose por ella, el grupo caminó en dirección al valle, donde probablemente encontrarían el sendero principal otra vez.\n\nDespués de dos horas caminando, escucharon voces. Era un equipo de rescate que había sido enviado por el parque nacional en cuanto los guardas notaron que el grupo no había regresado a la hora prevista. El jefe del equipo les explicó que, si no hubieran encendido una fogata pequeña para mantenerse calientes, habría sido mucho más difícil localizarlos entre la niebla.\n\nYa de vuelta en el pueblo, Paula bromeó diciendo que la próxima vez llevarían dos brújulas y menos optimismo. Marcos, todavía temblando de frío, admitió que nunca había sentido tanto miedo — ni tanto alivio. El guarda forestal les recordó que, la próxima vez que planearan una excursión así, avisaran siempre a alguien de su ruta exacta.\n\nEsa noche, alrededor de una sopa caliente, los cuatro amigos brindaron por haber vuelto sanos y salvos, y prometieron que la aventura, aunque inolvidable, no se repetiría de la misma manera.",

{id:'story-B2-Romance-1', level:'B2', genre:'Romance', title:{en:"Letters Across the Ocean", tr:"Okyanusun Ötesinden Mektuplar", fa:"نامه‌هایی از آن‌سوی اقیانوس", es:"Cartas al otro lado del océano"},
 text:"Valentina vive en Buenos Aires y trabaja como traductora. Hace ocho meses, empezó a intercambiar correos electrónicos con Diego, un profesor de historia que vive en Sevilla. Se conocieron por casualidad en un foro sobre literatura latinoamericana, y lo que comenzó como una simple conversación sobre libros se convirtió, poco a poco, en algo mucho más profundo.\n\nCada noche, Valentina espera con impaciencia que llegue un nuevo mensaje de Diego. Él le escribe sobre su ciudad, sus estudiantes y los libros que está leyendo; ella le cuenta sobre el tango, su familia y los proyectos de traducción en los que trabaja. Aunque nunca se han visto en persona, ambos sienten que se conocen desde hace años.\n\nUna noche, Diego le escribió: 'Ojalá pudiera cruzar el océano ahora mismo solo para tomar un café contigo.' Valentina sonrió al leerlo y le respondió que, si él viajara a Argentina, ella le mostraría toda la ciudad, calle por calle. Los dos sabían que las palabras escondían algo más que amistad.\n\nDespués de meses de dudas, Diego finalmente le preguntó si le gustaría que él visitara Buenos Aires durante las vacaciones de verano. Valentina le dijo que sí, aunque estaba nerviosa; nunca antes había conocido en persona a alguien tan importante para ella a través de una pantalla.\n\nEl día de la llegada de Diego, Valentina esperó en el aeropuerto con el corazón acelerado. Cuando por fin lo vio caminando hacia ella, se dio cuenta de que su voz era exactamente como la imaginaba. 'Eres tal como te describías en tus cartas', le dijo ella, sonriendo. Él respondió que había tenido miedo de que la realidad no fuera tan buena como la había imaginado, pero que se equivocó por completo.\n\nPasaron dos semanas explorando la ciudad juntos: comieron asado, bailaron tango en una milonga pequeña y caminaron por el Río de la Plata al atardecer. Antes de que Diego regresara a España, ambos prometieron que, pasara lo que pasara, seguirían escribiéndose — pero esta vez, planeando el próximo encuentro en persona.\n\nDesde entonces, se han visto tres veces más. Y aunque el océano sigue separándolos, ya no sienten la misma distancia de antes.",

{id:'story-B2-Thriller-1', level:'B2', genre:'Thriller', title:{en:"The Encrypted Message", tr:"Şifreli Mesaj", fa:"پیام رمزگذاری‌شده", es:"El mensaje cifrado"},
 text:"Renata trabaja como analista de ciberseguridad en una empresa financiera de Madrid. Una noche, mientras revisaba los registros del servidor, encontró un mensaje cifrado que no debería haber estado allí. El código no coincidía con ningún protocolo interno de la compañía.\n\nDecidió quedarse hasta tarde para investigar. Después de varias horas, logró descifrar parte del mensaje: contenía una lista de cuentas bancarias y una fecha — la próxima madrugada. Renata dudaba que fuera una simple prueba del departamento técnico; algo no encajaba.\n\nLlamó a su colega Tomás, el único en quien confiaba de verdad. Él le dijo que tuviera cuidado, que no informara a nadie más hasta que estuvieran seguros de lo que habían encontrado. 'Si esto es lo que creo que es', le advirtió Tomás, 'alguien dentro de la empresa está moviendo dinero de forma ilegal.'\n\nJuntos revisaron los archivos antiguos y descubrieron que, meses atrás, varias transacciones sospechosas habían sido aprobadas por la misma cuenta de administrador. Esa cuenta pertenecía a Héctor Salcedo, el director financiero, un hombre que todos en la oficina respetaban profundamente.\n\nRenata no podía creerlo. Recordó que, apenas la semana pasada, Héctor le había asegurado que todo estaba en orden y que no se preocupara por las auditorías. Ahora esas palabras sonaban completamente distintas.\n\nEsa madrugada, mientras Renata y Tomás vigilaban el sistema en tiempo real, vieron cómo una gran cantidad de dinero era transferida silenciosamente a una cuenta en el extranjero. Sin dudarlo, Renata activó el protocolo de emergencia y bloqueó la transacción segundos antes de que se completara.\n\nA la mañana siguiente, la policía fue avisada y Héctor Salcedo fue detenido en el aeropuerto, justo cuando intentaba tomar un vuelo hacia otro país. Se descubrió que llevaba planeando el fraude durante casi dos años, esperando el momento perfecto para desaparecer con el dinero.\n\nEn la investigación oficial, se confirmó que, si Renata no hubiera revisado esos registros esa noche, el dinero jamás habría sido recuperado. La empresa le ofreció un ascenso, pero ella solo pidió unas vacaciones — necesitaba dormir tranquila, sin pensar en códigos ni en cuentas bancarias, al menos por un tiempo.",

{id:'story-B2-Documentary-1', level:'B2', genre:'Documentary', title:{en:"The Last Fishermen of the Village", tr:"Köyün Son Balıkçıları", fa:"آخرین ماهیگیران روستا", es:"Los últimos pescadores del pueblo"},
 text:"En un pequeño pueblo de la costa gallega, la pesca ha sido durante generaciones la principal forma de vida. Sin embargo, en los últimos veinte años, el número de familias que dependen del mar ha disminuido drásticamente. Este documental cuenta la historia de quienes todavía se resisten a abandonar esa tradición.\n\nDon Ramón, de setenta y tres años, lleva pescando desde que tenía doce. 'Cuando yo era joven, aquí vivían más de doscientos pescadores', explica frente a la cámara. 'Ahora, apenas quedamos quince.' Según él, el problema empezó cuando las grandes empresas pesqueras comenzaron a operar barcos industriales que capturaban en unas horas lo que antes tomaba semanas.\n\nLos científicos entrevistados en el documental explican que, si no se controla la sobrepesca, muchas especies marinas podrían desaparecer por completo en las próximas décadas. Una bióloga marina afirmó que ojalá los gobiernos actuaran con más rapidez, porque cada año que pasa sin regulaciones estrictas hace más difícil que el ecosistema se recupere.\n\nLos hijos de los pescadores, mientras tanto, han elegido otros caminos. Marta, la hija de Don Ramón, se mudó a la ciudad para estudiar ingeniería. Cuenta que su padre nunca la presionó para que continuara con la tradición familiar, aunque siempre esperó, en secreto, que alguno de sus hijos quisiera quedarse con el barco.\n\nA pesar de las dificultades, algunos jóvenes del pueblo han decidido regresar, motivados por un nuevo modelo: la pesca sostenible. Iván, de veintiocho años, fue uno de los primeros en certificar su barco bajo normas ecológicas. 'Me dijeron que era una locura volver al pueblo', cuenta Iván, 'pero creo que, si hacemos las cosas de otra manera, todavía hay futuro para nosotros.'\n\nEl documental también muestra cómo se ha creado una cooperativa local que vende el pescado directamente a los restaurantes de la región, sin intermediarios, lo que permite a los pescadores obtener mejores precios. Esta iniciativa fue apoyada por la universidad de la zona, que ofreció asesoría técnica gratuita durante el primer año.\n\nAl final del documental, Don Ramón observa el mar desde el muelle mientras el sol se pone. 'No sé cuánto tiempo más podré salir a pescar', dice, 'pero mientras pueda, seguiré haciéndolo. Este mar me ha dado toda mi vida.' Sus palabras resumen el espíritu de un pueblo que se niega a dejar morir su historia, aunque el futuro sea incierto.",

{id:'story-A2-Fiction-1', level:'A2', genre:'Fiction', title:{en:'The Letter That Never Arrived', tr:'Hiç Ulaşmayan Mektup', fa:'نامه‌ای که هرگز نرسید', es:'La carta que nunca llegó'},
 text:"Elena limpiaba el ático de la casa de su abuela cuando encontró una caja vieja de madera. Dentro había fotos en blanco y negro, botones y, al fondo, una carta amarilla con el sobre cerrado. La carta tenía una dirección de Barcelona y estaba fechada en 1965, pero nunca se envió.\n\nElena la abrió con cuidado. Su abuela, que se llamaba Rosa, le escribía a un hombre llamado Tomás. Le decía que lo quería mucho y que esperaba verlo pronto. Elena no sabía quién era Tomás; su abuela nunca hablaba de él.\n\nAl día siguiente, Elena buscó la dirección en internet y descubrió que la calle todavía existía. Decidió viajar a Barcelona para investigar. Cuando llegó, preguntó en las tiendas del barrio si alguien conocía a un hombre llamado Tomás. Una anciana que vendía flores la miró con sorpresa.\n\n'Tomás vivía aquí hace muchos años', dijo la anciana. 'Se mudó a Argentina en 1966, pero antes de irse, hablaba todo el tiempo de una mujer que se llamaba Rosa.'\n\nElena sintió un nudo en la garganta. Su abuela y Tomás se amaron mucho, pero la vida los separó. Esa noche, Elena escribió una carta para su abuela, aunque ella murió hace dos años, y la guardó junto a la carta original.\n\nCuando volvió a casa, Elena entendió algo importante: a veces el amor no llega a tiempo, pero siempre deja una huella. Desde entonces, guarda las dos cartas en una caja nueva, como recuerdo de una historia que casi nadie conoció.",

{id:'story-A2-Adventure-1', level:'A2', genre:'Adventure', title:{en:'Lost in the Jungle', tr:'Ormanda Kaybolanlar', fa:'گم‌شده در جنگل', es:'Perdidos en la selva'},
 text:"Marco y Lucía viajaron a Costa Rica para hacer un recorrido por la selva. Un guía local los llevó por un sendero cerca de un volcán. Caminaron durante horas y vieron monos, pájaros de colores y árboles enormes.\n\nPor la tarde, el guía se detuvo a hablar por radio y les dijo que esperaran cerca de un río mientras él revisaba el camino. Pasaron veinte minutos y el guía no volvió. Marco y Lucía lo llamaron, pero nadie respondió. Empezaba a llover y el cielo se ponía oscuro.\n\n'Tenemos que encontrar refugio antes de la tormenta', dijo Lucía.\n\nCaminaron por el sendero que recordaban, pero pronto se dieron cuenta de que estaban perdidos. La lluvia era muy fuerte y el río sonaba cada vez más cerca. Marco recordó algo que su padre le enseñó de niño: seguir el sonido del agua río abajo siempre lleva a un lugar habitado.\n\nCaminaron junto al río durante casi una hora, mojados y cansados. Finalmente, vieron una luz entre los árboles. Era la cabaña de un guardaparques, que los recibió con café caliente y toallas secas.\n\n'Ustedes tuvieron suerte', les dijo el guardaparques. 'Muchas personas se pierden en esta selva y no encuentran el camino tan rápido.'\n\nEsa noche, el guía los encontró gracias a la radio del guardaparques. Marco y Lucía estaban agotados, pero felices. Aprendieron que en la selva siempre hay que estar preparados y que la calma, más que el miedo, ayuda a resolver los problemas.",

{id:'story-A2-Romance-1', level:'A2', genre:'Romance', title:{en:'The Language Exchange', tr:'Dil Değişimi', fa:'تبادل زبان', es:'Un intercambio de idiomas'},
 text:"Hace seis meses, Camila decidió aprender español y se registró en una aplicación para practicar con hablantes nativos. Así conoció a Mateo, un chico de Bogotá que quería mejorar su inglés. Al principio, solo se escribían mensajes cortos para corregir errores de gramática.\n\nCon el tiempo, las conversaciones se hicieron más largas. Camila le contaba a Mateo sobre su trabajo y su familia, y él le hablaba de su ciudad y de su pasión por la fotografía. Hablaban casi todos los días, aunque nunca se veían en persona.\n\nUn día, Mateo le escribió que iba a viajar a la ciudad de Camila por trabajo. Ella se puso muy nerviosa, pero también estaba feliz. Decidieron encontrarse en un café del centro.\n\nCuando Camila llegó, reconoció a Mateo enseguida, aunque solo conocía sus fotos. Los dos se rieron porque estaban igual de nerviosos. Hablaron en español y en inglés, mezclando los dos idiomas sin darse cuenta.\n\nEsa tarde caminaron por la ciudad durante horas y Mateo tomó muchas fotos. Antes de despedirse, él le dijo que ese viaje fue mucho mejor de lo que esperaba, gracias a ella.\n\nDespués de ese encuentro, Camila y Mateo siguieron hablando, pero ya no solo para practicar idiomas. Un año después, Camila viajó a Bogotá para conocer a la familia de Mateo. Esta vez no necesitó ninguna aplicación para encontrarlo: él la esperaba en el aeropuerto con un cartel que decía '¡Bienvenida a casa!'.",

{id:'story-A2-Thriller-1', level:'A2', genre:'Thriller', title:{en:'The Sound in the Hallway', tr:'Koridordaki Ses', fa:'صدایی در راهرو', es:'El sonido en el pasillo'},
 text:"Sara vivía sola en un apartamento pequeño en el quinto piso. Esa noche, trabajaba hasta tarde en su computadora cuando escuchó un ruido extraño en el pasillo. Parecía el sonido de pasos lentos, seguidos de silencio.\n\nAl principio, pensó que era su imaginación, pero el ruido continuó. Se levantó despacio y miró por la mirilla de la puerta. No vio a nadie, pero las luces del pasillo estaban apagadas, algo que nunca pasaba.\n\nEl corazón le latía muy rápido. Sara recordó que su vecina, la señora Ruiz, siempre dejaba una nota si iba a estar fuera. Esa noche no había ninguna nota. Decidió llamar a la policía, pero su teléfono no tenía señal dentro del apartamento.\n\nCon mucho miedo, Sara abrió la puerta despacio. El pasillo estaba completamente oscuro y silencioso. Caminó hacia la escalera, buscando el interruptor de la luz, cuando algo la tocó en el hombro. Sara gritó y se dio la vuelta rápidamente.\n\nEra el señor Torres, el portero del edificio.\n\n'Perdón, no quise asustarte', dijo él. 'Se rompió un cable esta tarde y estamos arreglando las luces del pasillo. Escuché tu puerta y vine a avisarte.'\n\nSara respiró profundo y se rio de su propio miedo. Le agradeció al portero y volvió a su apartamento. Esa noche, antes de dormir, revisó dos veces que la puerta estuviera cerrada con llave.\n\nAl día siguiente, Sara les contó la historia a sus amigas y todas se rieron juntas, aunque ella admitió que, por unos minutos, sintió un miedo muy real.",

{id:'story-A2-Documentary-1', level:'A2', genre:'Documentary', title:{en:'How Tango Was Born', tr:'Tango Nasıl Doğdu', fa:'تانگو چگونه متولد شد', es:'Cómo nació el tango'},
 text:"A finales del siglo XIX, miles de inmigrantes de Europa llegaron a Buenos Aires buscando una vida mejor. Venían de Italia, España y otros países, y muchos vivían en barrios pobres cerca del puerto. Extrañaban su tierra y no tenían mucho dinero para divertirse.\n\nEn esos barrios, los inmigrantes empezaron a mezclar la música que traían de sus países con ritmos africanos y criollos que ya existían en Argentina. De esa mezcla nació el tango, un baile y una música llenos de emoción y nostalgia.\n\nAl principio, la sociedad elegante de Buenos Aires no aceptaba el tango porque lo consideraba un baile vulgar, propio de los barrios pobres. Se bailaba en bares y patios, no en salones elegantes. Sin embargo, cuando el tango llegó a París en la década de 1910, los europeos lo recibieron con entusiasmo.\n\nCuando los porteños se enteraron de que en Europa amaban el tango, empezaron a verlo de otra manera. Poco a poco, el baile se hizo popular también entre las clases altas de Argentina. Compositores como Carlos Gardel escribieron canciones que se hicieron famosas en todo el mundo.\n\nHoy, el tango es Patrimonio Cultural de la Humanidad, según la UNESCO. En las calles de Buenos Aires, todavía se puede ver a parejas bailando tango, un recuerdo vivo de aquellos inmigrantes que un día llegaron con la nostalgia de su tierra y la convirtieron en arte.",

{id:"story-C1-Fiction-1", level:"C1", genre:"Fiction", title:{en:"The Weight of Silence", tr:"Sessizliğin Ağırlığı", fa:"سنگینی سکوت", es:"El peso del silencio"},
 text:"Hacía casi diez años que Elena no pisaba aquella casa, y, sin embargo, el olor a café recién hecho seguía siendo exactamente el mismo. Se detuvo un instante frente a la puerta, dudando si tocar el timbre o marcharse antes de que su padre notara su presencia.\n\nNo hubiera vuelto si su hermano no le hubiese suplicado que lo hiciera. 'Se está muriendo, Elena', le había dicho por teléfono, con una voz que apenas reconocía. 'Por más que lo odies, es tu padre, y quizá te arrepientas toda la vida si no vienes.'\n\nCuando finalmente entró, encontró a un hombre disminuido, envuelto en mantas, cuya mirada —antes autoritaria, casi feroz— se había vuelto extrañamente dócil. Él la observó largo rato antes de hablar, como si estuviera reconstruyendo, rasgo a rasgo, el rostro de la niña que una vez había sido.\n\n—No esperaba que vinieras —murmuró, sin ocultar cierto asombro.\n\n—Yo tampoco esperaba venir —respondió ella, sentándose en el borde de la cama sin saber muy bien qué hacer con las manos.\n\nDurante un rato ninguno de los dos dijo nada. El silencio, sin embargo, no era el mismo silencio hostil que Elena recordaba de su adolescencia; era otra cosa, algo más parecido al peso de todo lo que jamás se habían atrevido a decirse. Ella pensó que, quizá, el hecho de que ambos hubieran cambiado tanto en una década no bastaba para borrar los años de reproches, pero tampoco impedía que, ahora, sentados frente a frente, sintiera una compasión que no esperaba sentir.\n\nSu padre le contó, con frases entrecortadas por la fatiga, que llevaba meses arrepintiéndose de no haberla buscado antes, que había querido escribirle cientos de veces y que el orgullo —esa vieja costumbre familiar— se lo había impedido siempre. Elena, por su parte, admitió que también ella había preferido el rencor a la incertidumbre de un reencuentro que temía que doliera aún más.\n\nCuando se despidieron esa noche, no hubo abrazos ni promesas solemnes; apenas un apretón de manos, torpe y sincero. Pero, mientras caminaba hacia el coche bajo la lluvia, Elena se dio cuenta de que algo, por fin, se había aflojado dentro de ella. No era perdón, todavía no. Era, simplemente, el primer paso hacia algo que se le parecía.\n\nSe prometió a sí misma volver la semana siguiente, aunque no supiera todavía qué encontraría al hacerlo, ni si el tiempo que les quedaba alcanzaría para decirse todo aquello que habían callado durante tantos años. Por primera vez en mucho tiempo, sin embargo, no sintió miedo de intentarlo.",

{id:"story-C1-Adventure-1", level:"C1", genre:"Adventure", title:{en:"The Last Peak", tr:"Son Zirve", fa:"آخرین قله", es:"La última cima"},
 text:"Llevaban cuatro días ascendiendo cuando la tormenta los sorprendió a más de seis mil metros de altitud. Nadie había previsto que el clima cambiara tan abruptamente; el pronóstico, consultado apenas dos días antes, prometía cielos despejados hasta el fin de semana.\n\n—Tenemos que buscar refugio ya —gritó Ramiro, luchando por hacerse oír sobre el viento—. Si seguimos subiendo con esta visibilidad, alguien va a caerse.\n\nValentina, la más experimentada del grupo, dudó. Habían planeado esa expedición durante casi dos años; abandonar tan cerca de la cima le parecía casi una traición a sí misma. Sin embargo, sabía que insistir sería una imprudencia que ninguno de ellos podría permitirse pagar.\n\n—De acuerdo —cedió finalmente—. Volveremos al campamento tres. Pero en cuanto amaine, lo intentaremos otra vez.\n\nEl descenso resultó ser mucho más peligroso que la subida. Fue entonces cuando ocurrió el accidente: Diego, el más joven del equipo, resbaló sobre una placa de hielo oculta bajo la nieve reciente y quedó colgando del arnés, suspendido sobre un precipicio cuya profundidad nadie se atrevía a calcular.\n\n—¡No te sueltes! —le ordenó Valentina, mientras aseguraba la cuerda alrededor de una roca cercana con manos que apenas sentía por el frío.\n\nDurante los minutos que tardaron en izarlo, nadie dijo una palabra; el silencio se llenó únicamente del jadeo colectivo y del silbido incesante del viento. Cuando por fin lograron subirlo, Diego, pálido y temblando, apenas pudo balbucear un agradecimiento entrecortado.\n\nEsa noche, refugiados en las tiendas, nadie durmió bien. Ramiro admitió que, de no ser por la rapidez de Valentina, la expedición se habría convertido en una tragedia que habría marcado sus vidas para siempre. Valentina, por su parte, insistió en que cualquiera de ellos habría hecho lo mismo.\n\nAl amanecer, contra todo pronóstico, el cielo se despejó. La montaña, imponente y silenciosa, parecía observarlos con una indiferencia casi burlona, como si el drama de la noche anterior no hubiera significado nada para ella. Fue Diego quien, sorprendentemente, propuso continuar.\n\n—Hemos llegado hasta aquí —dijo, todavía con la voz quebrada—. Sería absurdo rendirse justo ahora.\n\nValentina sonrió por primera vez en dos días. Comprendió, mientras se preparaban para reanudar el ascenso, que aquella montaña no solo pondría a prueba sus cuerpos, sino también su capacidad de confiar los unos en los otros cuando todo pareciera perdido.",

{id:"story-C1-Romance-1", level:"C1", genre:"Romance", title:{en:"Letters Never Sent", tr:"Hiç Gönderilmeyen Mektuplar", fa:"نامه‌هایی که هرگز فرستاده نشدند", es:"Cartas nunca enviadas"},
 text:"Cuando Inés encontró la caja de madera en el desván de su abuela, no imaginaba que contendría casi treinta años de cartas jamás enviadas. Todas iban dirigidas a un tal Roberto, y todas, sin excepción, comenzaban con la misma frase: 'Querido Roberto, espero que estés bien, dondequiera que estés.'\n\nSu abuela, Carmen, había fallecido dos semanas antes, dejando tras de sí una vida que su familia creía conocer por completo. Sin embargo, aquellas cartas revelaban un amor que nadie había sospechado, oculto durante décadas bajo capas de silencio y rutina doméstica.\n\nIntrigada, Inés decidió investigar quién había sido aquel hombre. Tras varias semanas de búsqueda, descubrió que Roberto había sido el gran amor de juventud de Carmen, antes de que la guerra los separara para siempre. Se habían prometido reencontrarse, pero las cartas que ambos se enviaban durante el conflicto dejaron de llegar sin explicación, y cada uno, con el tiempo, asumió que el otro lo había olvidado.\n\nCarmen se casó años después con el abuelo de Inés, un hombre bueno al que llegó a querer profundamente, aunque —según confesaba en una de las últimas cartas— nunca de la misma manera en que había querido a Roberto. 'No es que no fuera feliz', escribió Carmen en una carta fechada apenas un año antes de su muerte, 'sino que una parte de mí siempre se preguntó qué habría sido de nosotros si la guerra no nos hubiera separado.'\n\nMovida por una mezcla de curiosidad y ternura, Inés localizó, casi por casualidad, a un hijo de Roberto que vivía en otra ciudad. Le envió una carta —esta vez sí, enviada— explicando quién era y adjuntando una copia de una de las páginas de su abuela.\n\nLa respuesta llegó semanas después: Roberto había muerto hacía diez años, pero durante toda su vida había conservado, guardado con el mismo cuidado, un pequeño retrato de una joven Carmen sonriente. Nunca se había casado.\n\nInés lloró al leer aquello, no de tristeza exactamente, sino por la belleza terrible de un amor que había sobrevivido a la distancia, a la guerra y al tiempo, sin necesitar jamás ser correspondido en persona para ser real. Guardó las cartas en la misma caja de madera y decidió que, algún día, se las contaría a sus propios hijos.\n\nAquella noche, antes de dormir, releyó una vez más la última carta de su abuela y comprendió algo que jamás había entendido del todo: que amar a alguien profundamente y construir una vida con otra persona no eran, después de todo, mutuamente excluyentes.",

{id:"story-C1-Thriller-1", level:"C1", genre:"Thriller", title:{en:"The Last Guest", tr:"Son Misafir", fa:"آخرین مهمان", es:"El último huésped"},
 text:"El hotel llevaba cerrado desde octubre, pero Marina había insistido en pasar allí su última noche antes de que la propiedad fuera vendida definitivamente. Como gerente durante quince años, sentía que se lo debía al edificio, aunque ninguno de sus antiguos compañeros hubiera entendido semejante sentimentalismo.\n\nNo estaba sola, sin embargo. Alguien —o algo— llevaba moviéndose por los pasillos desde que había anochecido. Al principio pensó que serían simples crujidos propios de un edificio antiguo, pero cuando escuchó pasos claros en el piso superior, decidió que era momento de investigar, aunque cada instinto le advertía que no lo hiciera.\n\nSubió las escaleras con una linterna cuya luz temblaba tanto como su pulso. En el tercer piso, la puerta de la habitación 314 —la misma habitación en la que, años atrás, un huésped había desaparecido sin dejar rastro— estaba entreabierta.\n\n—¿Hay alguien ahí? —preguntó, con una voz que apenas reconoció como propia.\n\nNadie respondió. Empujó la puerta despacio. La habitación, cubierta de polvo, parecía intacta desde el día del incidente: la cama sin deshacer, una maleta abandonada junto al armario, y, sobre el escritorio, un cuaderno abierto que ella jamás había visto antes.\n\nSe acercó, casi sin atreverse a respirar, y leyó la última página escrita, cuya tinta parecía sorprendentemente reciente: 'Si estás leyendo esto, significa que finalmente has vuelto. Llevo quince años esperando a que alguien se atreviera a subir.'\n\nUn escalofrío le recorrió la espalda. Nadie sabía que ella regresaría esa noche; ni siquiera lo había decidido hasta última hora. Fue entonces cuando escuchó, a su espalda, la puerta cerrarse con un golpe seco.\n\n—No deberías haber subido —dijo una voz, tan cerca que sintió el aliento en la nuca.\n\nMarina giró bruscamente, pero no había nadie. Solo la ventana, abierta de par en par, dejaba entrar el viento frío de la noche. Sobre el cristal, escrita con el dedo en el vaho, apareció una sola palabra: quédate.\n\nEl corazón le latía con tal violencia que temió que se le escapara del pecho. Corrió hacia la puerta, forcejeó con el picaporte, que parecía atascado, hasta que finalmente cedió. Bajó las escaleras a toda velocidad, sin atreverse a mirar atrás, convencida de que, fuera lo que fuese lo que habitaba aquel hotel, llevaba mucho tiempo esperando exactamente a alguien como ella.",

{id:"story-C1-Documentary-1", level:"C1", genre:"Documentary", title:{en:"The Memory of Water", tr:"Suyun Hafızası", fa:"حافظه آب", es:"La memoria del agua"},
 text:"El lago Poopó, en el altiplano boliviano, fue durante siglos el segundo cuerpo de agua más grande del país. Hoy, sin embargo, apenas queda un vestigio de lo que fue: un lecho reseco, agrietado por el sol, donde antes navegaban embarcaciones de pescadores.\n\nSegún explican los científicos que han estudiado el fenómeno durante la última década, la desaparición del lago no obedece a una sola causa, sino a la confluencia de varios factores: el cambio climático, que ha reducido drásticamente las precipitaciones en la región; el desvío de ríos tributarios para la agricultura y la minería; y un ciclo natural de sequías que, aunque siempre había existido, nunca antes había coincidido con una presión humana tan intensa sobre el ecosistema.\n\n'Lo que estamos presenciando no es simplemente la pérdida de un lago', afirma la bióloga Rosario Quispe, quien ha dedicado gran parte de su carrera a documentar el desastre. 'Es la desaparición de una forma entera de vida que dependía de él.'\n\nLas comunidades indígenas uru-murato, que durante generaciones habían basado su subsistencia en la pesca, se han visto obligadas a emigrar hacia las ciudades en busca de trabajo. Muchos de ellos, que jamás habían vivido lejos del agua, describen la experiencia como una suerte de exilio forzado dentro de su propio país.\n\nDon Faustino Torrez, de setenta y tres años, es uno de los últimos pescadores que quedan en la zona. 'Cuando yo era niño', recuerda, mientras camina sobre lo que antes era el fondo del lago, 'este lugar estaba lleno de aves, de peces, de vida. Ahora solo hay polvo y sal.'\n\nLos intentos de recuperación, hasta el momento, han resultado insuficientes. Aunque el gobierno boliviano ha anunciado planes para desviar agua de otras cuencas hacia el Poopó, muchos expertos dudan de que dicha solución sea sostenible a largo plazo, dado que no ataca las causas estructurales del problema.\n\nLo que ha sucedido con el Poopó, advierten los especialistas, podría convertirse en un anticipo de lo que le espera a otros ecosistemas de la región andina si no se toman medidas urgentes. El caso boliviano se ha transformado, así, en un símbolo incómodo de una crisis climática que, lejos de ser un fenómeno lejano, ya está redefiniendo la vida de miles de personas.\n\nPara don Faustino, sin embargo, el debate científico resulta secundario frente a una pérdida mucho más íntima. 'Uno no sabe lo que tiene', dice, mirando el horizonte vacío, 'hasta que lo ve desaparecer frente a sus propios ojos.'",

{id:"story-B1-Fiction-1", level:"B1", genre:"Fiction", title:{en:"The Red Notebook", tr:"Kırmızı Defter", fa:"دفترچه قرمز", es:"El cuaderno rojo"},
 text:"Elena ha trabajado en la misma librería de segunda mano durante cinco años, pero nunca ha encontrado nada como esto. Un martes por la tarde, mientras ordena una caja de libros donados, descubre un cuaderno rojo escondido entre las páginas de una novela vieja. No tiene nombre en la portada, solo un montón de poemas escritos a mano y algunas frases sueltas sobre el amor y la soledad.\n\nElena empieza a leer y no puede parar. 'Ojalá que la persona que escribió esto todavía viva en esta ciudad', piensa mientras pasa las páginas con cuidado. Ha leído el cuaderno tres veces esta semana y cada vez encuentra un detalle nuevo: una fecha, el nombre de una calle, una inicial — la letra M.\n\nSu compañera de trabajo, Rosa, duda que valga la pena buscar al autor. 'No creo que sea buena idea meterte en la vida de un desconocido', le dice. Pero Elena no puede dejarlo así. Si ella escribiera algo tan personal y lo perdiera, le gustaría que alguien intentara devolvérselo.\n\nDespués de días de investigación, Elena descubre que el cuaderno perteneció a un hombre llamado Mateo, quien donó una caja de libros de su padre después de que este falleciera. Elena, nerviosa, decide llamarlo por teléfono.\n\n'Creo que tengo algo suyo', le dice. 'Era de mi padre', responde Mateo con la voz quebrada. 'Pensé que se había perdido para siempre'.\n\nSe encuentran esa misma tarde en la librería. Mateo lee los poemas de su padre por primera vez en años, y sus ojos se llenan de lágrimas. Le da las gracias a Elena por no haber tirado el cuaderno.\n\nDesde entonces, Elena y Mateo se han hecho amigos. Cada mes, él le lleva un café y hablan sobre libros, sobre su padre y sobre todas las historias pequeñas que esperan, escondidas, a que alguien las encuentre.",

{id:"story-B1-Adventure-1", level:"B1", genre:"Adventure", title:{en:"The River Expedition", tr:"Nehir Seferi", fa:"اکسپدیشن رودخانه", es:"La expedición del río"},
 text:"Valentina siempre ha soñado con hacer una expedición en kayak por el río Futaleufú, en la Patagonia. Por fin, después de ahorrar durante un año, ha llegado el momento. Junto con tres compañeros y un guía llamado Tomás, empieza el viaje una mañana fresca de enero.\n\nLos primeros kilómetros son tranquilos. Reman por un tramo ancho del río, rodeados de montañas verdes. 'Para llegar al campamento antes de la noche, tenemos que avanzar rápido', explica Tomás. Todos están de acuerdo y siguen remando con energía.\n\nA media tarde, el cielo cambia de color. Tomás mira las nubes con preocupación. 'No me gusta que el clima cambie tan rápido', dice. 'Es posible que haya una tormenta antes de que lleguemos'. Valentina siente un poco de miedo, pero confía en la experiencia del guía.\n\nEfectivamente, empieza a llover con fuerza. El río, antes tranquilo, ahora tiene corrientes fuertes. 'Si yo fuera ustedes, remaría hacia esa orilla ahora mismo', grita Tomás por encima del ruido del agua. El grupo obedece de inmediato y logra llegar a tierra firme.\n\nPasan la tormenta bajo un refugio de rocas, empapados pero a salvo. Cuando para de llover, Tomás sonríe. 'Han hecho un trabajo excelente hoy. No todos mantienen la calma en una situación así'.\n\nEsa noche, alrededor del fuego, Valentina piensa en lo que ha vivido. Nunca había sentido tanto miedo ni tanta emoción al mismo tiempo, pero logró superarlo.\n\nAl día siguiente, el grupo continúa el viaje bajo un cielo despejado. El río, ahora calmado otra vez, los lleva hacia el siguiente campamento. Valentina sabe que esta aventura va a cambiar la forma en que ve sus propios límites.",

{id:"story-B1-Romance-1", level:"B1", genre:"Romance", title:{en:"Unsent Letters", tr:"Gönderilmemiş Mektuplar", fa:"نامه‌های نفرستاده", es:"Cartas sin enviar"},
 text:"Hace tres meses, Andrés conoció a Camila en un tren nocturno de Madrid a Lisboa. Hablaron durante horas sobre música, sobre sus trabajos y sobre los lugares que querían conocer algún día. Cuando el tren llegó a su destino, intercambiaron solo el nombre de pila — ninguno pensó en pedir un número de teléfono.\n\nDesde entonces, Andrés ha escrito una carta a Camila cada semana, aunque nunca las ha enviado porque no tiene su dirección. Le cuenta sobre su trabajo nuevo, sobre el libro que está leyendo, sobre lo mucho que espera que ella también piense en aquel viaje.\n\n'Ojalá que algún día pueda encontrarte de nuevo', escribe en una de las cartas. 'No creo que sea normal pensar tanto en alguien que conocí en un tren, pero contigo fue diferente'.\n\nUn viernes, Andrés decide visitar el mismo café donde Camila mencionó que trabajaba una amiga suya en Lisboa. Es una posibilidad pequeña, casi absurda, pero él piensa que, si no lo intenta, siempre se preguntará qué habría pasado.\n\nEn el café, pregunta por la amiga de Camila. La camarera lo mira sorprendida. '¿Andrés?', pregunta. '¿El del tren? Camila ha hablado de ti todo este tiempo. Pensaba que nunca la ibas a buscar'.\n\nEsa misma tarde, la camarera le da el número de Camila. Con las manos temblorosas, Andrés le envía un mensaje: 'Hola, soy el chico del tren. Tengo un montón de cartas que nunca te envié'.\n\nCamila responde en segundos: '¿Cuándo podemos vernos? Tengo muchas ganas de leerlas'.\n\nEsa noche, en el mismo café donde todo casi termina antes de empezar, Andrés y Camila se reencuentran. Por primera vez, él le entrega, en persona, todas las cartas que había escrito para ella.",

{id:"story-B1-Thriller-1", level:"B1", genre:"Thriller", title:{en:"The Neighbor on the Fifth Floor", tr:"Beşinci Kattaki Komşu", fa:"همسایه طبقه پنجم", es:"El vecino del quinto piso"},
 text:"Desde que Natalia se mudó a este edificio, algo en el vecino del quinto piso le ha llamado la atención. Nunca lo ha visto de día. Sale solo de noche, siempre con una bolsa grande, y nunca saluda a nadie en el ascensor.\n\nUna noche, Natalia escucha ruidos extraños que vienen del piso de arriba: pasos rápidos, algo que se arrastra por el suelo, una puerta que se cierra de golpe. 'No es normal que alguien haga tanto ruido a esta hora', piensa, y decide contárselo a su amiga Beatriz.\n\n'No creo que sea nada peligroso', le dice Beatriz por teléfono. 'A lo mejor solo trabaja de noche'. Pero Natalia no está tan segura. Si ella fuera él, ¿por qué evitaría tanto el contacto con los vecinos?\n\nDurante la semana siguiente, Natalia empieza a fijarse en más detalles. El vecino ha recibido varios paquetes grandes, todos entregados de madrugada. Además, las cortinas de su apartamento siempre están cerradas, incluso en pleno día.\n\nUna noche, Natalia decide esperar en el pasillo cuando escucha la puerta del vecino abrirse. Su corazón late con fuerza. El hombre sale, la mira un segundo y baja rápido las escaleras sin decir nada.\n\nCuriosa y un poco asustada, Natalia toca la puerta del apartamento. Nadie responde, pero la puerta, sin cerrar bien, se abre un poco. Dentro, no hay nada extraño: solo lienzos, pinturas y pinceles por todas partes.\n\nAl día siguiente, el vecino la busca en el pasillo. 'Perdón si te he asustado', dice. 'Soy pintor y trabajo de noche porque es cuando mejor me concentro. Las entregas son de material para mis cuadros'.\n\nNatalia se siente un poco tonta, pero también aliviada. A veces, el misterio más grande solo esconde a alguien que simplemente vive diferente.",

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    const parsed = JSON.parse(raw);
    if(parsed.profile && parsed.profile.completedDiagnostic) parsed.view = parsed.view === 'diagnostic-intro' ? 'dashboard' : parsed.view;
    const merged = Object.assign(freshState(), parsed);
    if(!merged.progress.completedStories) merged.progress.completedStories = [];
    if(!merged.progress.srs) merged.progress.srs = {};
    if(!merged.progress.badgesEarnedAt) merged.progress.badgesEarnedAt = {};
    if(merged.progress.reviewsCompleted===undefined) merged.progress.reviewsCompleted = 0;
    if(merged.progress.writingRoundsDone===undefined) merged.progress.writingRoundsDone = 0;
    if(merged.progress.speakingRoundsDone===undefined) merged.progress.speakingRoundsDone = 0;
    if(!merged.progress.roadmapChecked) merged.progress.roadmapChecked = {};
    if(merged.profile.levelStage===undefined) merged.profile.levelStage = 1;
    if(!merged.progress.dailyTasksChecked) merged.progress.dailyTasksChecked = {};
    if(merged.progress.dailyTasksDate===undefined) merged.progress.dailyTasksDate = null;
    if(merged.profile.dashboardIntroShown===undefined) merged.profile.dashboardIntroShown = true;
    if(merged.profile.wantsContact===undefined) merged.profile.wantsContact = false;
    if(merged.profile.contactPhone===undefined) merged.profile.contactPhone = '';
    if(!merged.profile.goals || !merged.profile.goals.length){
      merged.profile.goals = merged.profile.motivationTag ? [merged.profile.motivationTag] : [];
    }
    return merged;
  }catch(e){ return freshState(); }
}
function save(){ state.lang = LANG; localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let navHistory = [];
let newlyEarnedBadges = [];
function pushHistoryEntry(){
  try{ history.pushState({t:Date.now()}, ''); }catch(e){}
}
function go(view, params){
  resetConfirmPending = false;
  navHistory.push({view: state.view, params: state.viewParams});

  else { state.view = state.profile.completedDiagnostic ? 'dashboard' : 'diagnostic-intro'; state.viewParams = {}; }

}

function markDailyVisit(){
  const today = todayISO();
  const p = state.progress;
  if(p.lastActiveDate !== today){
    const yd = new Date(); yd.setDate(yd.getDate()-1);
    const y = localDateStr(yd);
    p.streak = (p.lastActiveDate === y) ? p.streak + 1 : 1;
    p.lastActiveDate = today;
    return true;
  }
  return false;
}
function markActivity(){

  state.progress.sessionsExplored += 1;

    if(state.progress.badgesEarnedAt[b.id]) return;
    if(b.check(state)){

      newlyEarnedBadges.push(b.id);
    }
  });
}

/* ============================= SPACED REPETITION (SRS) ============================= */
const LEITNER_INTERVALS = [1,2,4,7,14]; // days per box 1-5
function localDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return localDateStr(new Date()); }
function updateSRS(itemId, kind, pct){
  const srs = state.progress.srs;
  const entry = srs[itemId] || {kind, box:0};
  if(pct >= 0.8) entry.box = Math.min(entry.box + 1, LEITNER_INTERVALS.length - 1);
  else if(pct < 0.5) entry.box = 0;
  const days = LEITNER_INTERVALS[entry.box];
  entry.kind = kind;
  entry.due = new Date(Date.now() + days*86400000).toISOString().slice(0,10);
  srs[itemId] = entry;
}
function dueItems(){
  const today = todayISO();
  return Object.keys(state.progress.srs).filter(id => state.progress.srs[id].due <= today);
}
function progressArrForKind(kind){
  return kind==='grammar' ? state.progress.completedTraps
       : kind==='vocab' ? state.progress.completedVocabSets
       : kind==='story' ? state.progress.completedStories
       : state.progress.completedScenes;
}
function relativeDate(iso){
  if(!iso) return '—';
  const today = todayISO();
  const yd = new Date(); yd.setDate(yd.getDate()-1);
  const y = localDateStr(yd);
  if(iso === today) return L('Today','Bugün','امروز','Hoy');
  if(iso === y) return L('Yesterday','Dün','دیروز','Ayer');
  return new Date(iso).toLocaleDateString(LANG==='tr'?'tr-TR':undefined,{month:'short', day:'numeric'});
}

/* ============================= HELPERS ============================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderLessonText(text, accentVar){
  const color = accentVar || '--cat-gram';
  const sentences = (text.match(/[^.!?]+[.!?]+(\s+|$)/g) || [text]).map(s=>s.trim()).filter(Boolean);
  const blocks = [];
  let buf = [];
  const flush = () => { if(buf.length){ blocks.push({type:'p', text:buf.join(' ')}); buf = []; } };
  sentences.forEach(s=>{
    const lastColon = s.lastIndexOf(':');
    if(lastColon > 0 && lastColon < s.length-1){
      const label = s.slice(0,lastColon).trim();
      const after = s.slice(lastColon+1);
      const commaCount = (after.match(/,/g)||[]).length;
      const items = after.replace(/[.!?]+\s*$/,'').split(',').map(x=>x.trim()).filter(Boolean);
      const clean = !/[()]/.test(after) && label.length <= 60 && items.every(it=>it.length<=40 && it.length>0);
      if(commaCount >= 2 && clean){
        flush();
        blocks.push({type:'pattern', label, items});
        return;
      }
    }
    buf.push(s);
    if(buf.length>=2) flush();
  });
  flush();
  return blocks.map(b=>{
    if(b.type==='pattern'){
      return `<div style="margin-top:12px;">
        <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(${color});">${esc(b.label)}</div>
        <div class="row" style="flex-wrap:wrap; gap:6px; margin-top:6px;">
          ${b.items.map(it=>`<span dir="ltr" style="background:var(--bg-elevated); border:1.5px solid var(${color}-soft); color:var(--ink); padding:4px 11px; border-radius:999px; font-size:13px; font-weight:700;">${esc(it)}</span>`).join('')}
        </div>
      </div>`;
    }
    return `<p style="margin-top:12px; font-size:15px; line-height:1.7; color:var(--ink);">${esc(b.text)}</p>`;
  }).join('');
}
function structureExplanation(text){
  const sentences = (text.match(/[^.!?]+[.!?]+(\s+|$)/g) || [text]).map(s=>s.trim()).filter(Boolean);
  if(sentences.length <= 1) return {hook:null, rest:text, tip:null};
  const hook = sentences[0];
  const tipRe = /\b(trick|tip|remember|mnemonic|trap|handy)\b|ipucu|tüyo|tuzak|unutma|hatırla|ترفند|نکته|یادت|تله|فراموش|truco|consejo|trampa|recuerda/i;
  let tip = null;
  const restSentences = [];
  for(let i=1;i<sentences.length;i++){
    if(!tip && tipRe.test(sentences[i])){ tip = sentences[i]; }
    else restSentences.push(sentences[i]);
  }
  return {hook, rest: restSentences.join(' '), tip};
}
function tapMark(word, meaning){
  return meaning ? `<mark class="vocab-hl" data-action="show-word-meaning" data-word="${esc(word)}" data-meaning="${esc(meaning)}">${esc(word)}</mark>` : '<b>'+esc(word)+'</b>';
}
function highlightWord(sentence, word, meaning){
  const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
  const m = sentence.match(re);
  if(!m) return esc(sentence);
  const i = m.index;
  return esc(sentence.slice(0,i)) + tapMark(m[0], meaning) + esc(sentence.slice(i+m[0].length));
}
let VOCAB_GLOSSARY = null;
function buildVocabGlossary(){
  const map = {};
  VOCAB_SETS.forEach(set=>{
    set.cards.forEach(c=>{
      const key = c.word.toLowerCase();
      if(!map[key]) map[key] = L(c.meaning.en, c.meaning.tr, c.meaning.fa, c.meaning.es);
    });
  });
  return map;
}
function glossify(text){
  if(!VOCAB_GLOSSARY) VOCAB_GLOSSARY = buildVocabGlossary();
  const words = Object.keys(VOCAB_GLOSSARY).sort((a,b)=>b.length-a.length);
  if(!words.length) return esc(text);
  const pattern = words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')).join('|');
  const re = new RegExp('\\b(?:'+pattern+')\\b', 'gi');
  let result = '', last = 0, m;
  while((m = re.exec(text))){
    result += esc(text.slice(last, m.index)) + tapMark(m[0], VOCAB_GLOSSARY[m[0].toLowerCase()]);
    last = m.index + m[0].length;
    if(re.lastIndex === m.index) re.lastIndex++;
  }
  result += esc(text.slice(last));
  return result;
}

function showWordTooltip(el){

  let top = rect.top - tipRect.height - 12;
  if(top < 8){ tip.classList.add('tip-below'); top = rect.bottom + 12; }
  else{ tip.classList.add('tip-above'); }

}
function highlightStoryVocab(text, vocab){
  if(!vocab || !vocab.length) return esc(text);
  const escRe = (w) => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
  const variantMap = {};
  const allVariants = [];
  const addVariant = (form, meaning) => {
    const key = (form||'').toLowerCase();
    if(key && !variantMap[key]){ variantMap[key] = meaning; allVariants.push(form); }
  };
  // Story vocab is often listed in dictionary form (infinitive verbs, bare nouns
  // with a default article) but appears conjugated/inflected in the actual text —
  // so beyond the exact word, also index a bare stem that \w* can extend to match
  // whatever form actually shows up (aflojarse -> "afloj" matches "aflojado", etc).
  vocab.forEach(v=>{
    const w = (v.word||'').trim();
    if(!w) return;
    const meaning = L(v.en, v.tr, v.fa);
    addVariant(w, meaning);
    const noArticle = w.replace(/^(el|la|los|las|un|una)\s+/i, '');
    if(noArticle !== w) addVariant(noArticle, meaning);
    if(!/\s/.test(noArticle) && noArticle.length >= 5){
      let base = noArticle;
      const reflexive = /^([a-záéíóúñü]+)(ar|er|ir)se$/i.exec(base);
      if(reflexive) base = reflexive[1] + reflexive[2];
      const inf = /^([a-záéíóúñü]{3,})(ar|er|ir)$/i.exec(base);
      if(inf) addVariant(inf[1], meaning);
      else{
        const genderStem = /^([a-záéíóúñü]{4,}?)(os|as|o|a)$/i.exec(base);
        if(genderStem) addVariant(genderStem[1], meaning);
      }
    }
  });
  allVariants.sort((a,b)=>b.length-a.length);
  const pattern = allVariants.map(escRe).join('|');
  const re = new RegExp('\\b(?:'+pattern+')[\\wáéíóúñüÁÉÍÓÚÑÜ]*', 'gi');
  let result = '', last = 0, m;
  while((m = re.exec(text))){
    const lower = m[0].toLowerCase();
    let meaning = variantMap[lower];
    if(!meaning){
      let best = '';
      allVariants.forEach(v=>{ const vl=v.toLowerCase(); if(lower.indexOf(vl)===0 && vl.length>best.length) best = vl; });
      if(best) meaning = variantMap[best];
    }
    result += esc(text.slice(last, m.index)) + tapMark(m[0], meaning);
    last = m.index + m[0].length;
    if(re.lastIndex === m.index) re.lastIndex++;
  }
  result += esc(text.slice(last));
  return result;
}

function buildDailyTasks(p){
  const priorityThemeMap = {grammar:'grammar', vocab:'vocab', listening:'speaking', speaking:'speaking'};
  const focusTheme = priorityThemeMap[p.priorityArea] || 'grammar';
  const focusTask = DAILY_TASK_POOL.find(t=>t.theme===focusTheme) || DAILY_TASK_POOL[0];
  const rest = DAILY_TASK_POOL.filter(t=>t.id!==focusTask.id);
  const seed = dateSeed(todayISO());
  const offset = seed % rest.length;
  const rotated = rest.slice(offset).concat(rest.slice(0, offset));
  return [focusTask, rotated[0], rotated[1]];
}

function buildRoadmap(profile){
  const goals = (profile.goals && profile.goals.length) ? profile.goals : (profile.motivationTag ? [profile.motivationTag] : []);
  const gPoolAll = GRAMMAR_ITEMS.filter(g=>g.level===profile.level);
  const vPoolAll = VOCAB_SETS.filter(s=>s.level===profile.level && s.category==='vocab');
  const slPoolAll = VOCAB_SETS.filter(s=>s.level===profile.level && s.category==='slang');
  const matchesGoal = arr => arr.filter(x=>x.goals && x.goals.some(gk=>goals.includes(gk)));
  const vPoolGoal = matchesGoal(vPoolAll);
  const slPoolGoal = matchesGoal(slPoolAll);
  const vPool = vPoolGoal.length ? vPoolGoal : vPoolAll;
  const slPool = slPoolGoal.length ? slPoolGoal : slPoolAll;
  // Grammar rules stay the same for every goal — only reorder so goal-flavored examples surface first.
  const primaryGoal = goals.find(gk => gPoolAll.some(g=>g.goalVariant && g.goalVariant[gk])) || goals[0] || null;
  const gPool = (primaryGoal && gPoolAll.some(g=>g.goalVariant && g.goalVariant[primaryGoal]))
    ? gPoolAll.filter(g=>g.goalVariant && g.goalVariant[primaryGoal]).concat(gPoolAll.filter(g=>!(g.goalVariant && g.goalVariant[primaryGoal])))
    : gPoolAll;
  const stage = profile.levelStage===2 ? 2 : 1;
  const gHalf = Math.ceil(gPool.length/2);
  const gSlice = stage===1 ? gPool.slice(0, gHalf) : gPool.slice(gHalf);
  const items = [];
  const sessionLink = (topic) => whatsappLink(L(
    "Hi! I'm "+profile.name+". I'd like to book a speaking session"+(topic?' on "'+topic+'"':'')+".",
    'Merhaba! Ben '+profile.name+'. '+(topic?'"'+topic+'" konulu ':'')+'bir konuşma seansı ayırtmak istiyorum.',
    'سلام! من '+profile.name+' هستم. می‌خواهم یک جلسه مکالمه'+(topic?' درباره «'+topic+'»':'')+' رزرو کنم.',
    '¡Hola! Soy '+profile.name+'. Quiero reservar una sesión de conversación'+(topic?' sobre "'+topic+'"':'')+'.'
  )+leadInfoSuffix(profile));
  const pushSession = (topic) => items.push({type:'session', refId:null, goal:primaryGoal, waLink:sessionLink(topic), title:L('Live speaking session','Canlı konuşma seansı','جلسه زنده مکالمه','Sesión de conversación en vivo')});
  // Drillers repeat-to-learn, and anyone who flagged vocab as their weak spot gets a warm-up rep first.
  if(stage===1 && (profile.priorityArea==='vocab' || profile.learnerType==='driller') && vPool.length){
    items.push({type:'vocab', refId:vPool[0].id, goal:primaryGoal, title:L('Vocab warm-up','Kelime ısınması','گرم‌کردن با کلمات','Calentamiento de vocabulario')+': '+setTitle(vPool[0])});
  }
  let vi = vPool.length ? (stage===2 ? Math.ceil(vPool.length/2) : 0) : 0;
  let sli = slPool.length ? (stage===2 ? Math.ceil(slPool.length/2) : 0) : 0;
  gSlice.forEach((g, i)=>{
    items.push({type:'grammar', refId:g.id, goal:primaryGoal, title:L('Grammar','Dilbilgisi','گرامر','Gramática')+': '+grammarTitle(g)});
    if(i % 2 === 1 && vPool.length){
      const v = vPool[vi % vPool.length]; vi++;
      items.push({type:'vocab', refId:v.id, goal:primaryGoal, title:L('Vocab','Kelime','کلمات','Vocabulario')+': '+setTitle(v)});
    }
    // Immersive learners absorb best in context, so slang lands early instead of only at the end.
    if(profile.learnerType==='immersive' && slPool.length && i===1){
      const sl = slPool[sli % slPool.length]; sli++;
      items.push({type:'slang', refId:sl.id, goal:primaryGoal, title:L('Slang','Argo','اصطلاحات','Argot')+': '+setTitle(sl)});
    }
    if(i === Math.max(Math.floor(gSlice.length/2)-1, 0)){
      pushSession(grammarTitle(g));
    }
  });
  if(slPool.length){
    const sl = slPool[sli % slPool.length];
    items.push({type:'slang', refId:sl.id, goal:primaryGoal, title:L('Slang','Argo','اصطلاحات','Argot')+': '+setTitle(sl)});
  }
  // Talkers (and anyone who said listening/speaking is their weak spot) get an extra live rep.
  if((profile.learnerType==='talker' || profile.priorityArea==='listening') && stage===1){
    pushSession(null);
  }
  pushSession(null);
  return items.map((it,idx)=>Object.assign({n:idx+1}, it));
}

function progressRing(percent, color, trackColor, size, strokeWidth){
  size = size || 56; strokeWidth = strokeWidth || 5;
  const r = (size - strokeWidth) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, percent));
  const offset = c * (1 - pct/100);
  return `<div class="ring-wrap" style="width:${size}px; height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${trackColor}" stroke-width="${strokeWidth}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
    </svg>
    <span class="ring-label" style="font-size:${Math.round(size*0.24)}px; color:${color};">${pct}%</span>
  </div>`;
}

function pickGreeting(p, dueCount){
  const priorityTheme = {grammar:'grammar', vocab:'vocab', listening:'speaking', speaking:'speaking'}[p.priorityArea];
  const eligible = GREETINGS.filter(g=>{
    if(g.theme==='general' || g.theme==='story') return true;
    if(g.theme==='review') return dueCount>0;
    return g.theme===priorityTheme;
  });
  const bucket = Math.floor(Date.now()/(10*60*1000));
  const g = eligible[bucket % eligible.length];
  return L(g.en,g.tr,g.fa,g.es).replace('{name}', '<bdi>'+esc(p.name)+'</bdi>');

function renderDiagReview(){
  const p = state.profile, arch = ARCHETYPES[p.motivationTag];
  const roadmap = buildRoadmap(p);
  const TYPE_META = {
    grammar:{ic:ICONS.dumbbell, c:'gram', label:L('Grammar','Dilbilgisi','گرامر','Gramática')},
    vocab:{ic:ICONS.cards, c:'voc', label:L('Vocabulary','Kelime','واژگان','Vocabulario')},
    slang:{ic:ICONS.cards, c:'diag', label:L('Slang','Argo','اصطلاحات','Argot')},
    session:{ic:ICONS.chat, c:'lis', label:L('Speaking session','Konuşma seansı','جلسه مکالمه','Sesión de conversación')}
  };
  const rc = state.progress.roadmapChecked;
  const doneCount = roadmap.filter((_,i)=>rc[i]).length;

  function roadmapRow(item, idx){
    const m = TYPE_META[item.type];
    const checked = !!rc[idx];
    const isSession = item.type === 'session';
    const iconBg = isSession ? 'var(--bg-elevated)' : 'var(--cat-'+m.c+'-soft)';
    const rowBg = isSession ? 'background:var(--cat-lis-soft); border-color:var(--cat-lis-soft);' : '';
    const subtitle = isSession
      ? L('Recommended — message on WhatsApp',"Önerilir — WhatsApp'tan mesaj at",'پیشنهادی — در واتس‌اپ پیام بده','Recomendado — escribe por WhatsApp')
      : ((item.goal && GOALS_META[item.goal]) ? goalMetaLabel(item.goal)+' · '+m.label : m.label);
    let studyOpenTag, studyCloseTag;
    if(isSession){
      studyOpenTag = '<a class="roadmap-study" target="_top" rel="noopener" href="'+item.waLink+'">';
      studyCloseTag = '</a>';
    } else if(item.type==='grammar'){
      studyOpenTag = '<button class="roadmap-study" data-action="nav" data-view="grammar-trap" data-id="'+item.refId+'" data-goal="'+(item.goal||'')+'">';
      studyCloseTag = '</button>';
    } else {
      const cat = item.type==='slang' ? 'slang' : 'vocab';
      studyOpenTag = '<button class="roadmap-study" data-action="nav" data-view="vocab-set-intro" data-id="'+item.refId+'" data-goal="'+(item.goal||'')+'" data-cat="'+cat+'">';
      studyCloseTag = '</button>';
    }
    return `<div class="roadmap-row ${checked?'roadmap-done':''}" style="${rowBg}">
      ${studyOpenTag}
        <span class="item-ic" style="background:${iconBg}; color:var(--cat-${m.c});">${m.ic}</span>
        <div class="item-body">
          <div class="item-sub" style="margin-top:0; ${isSession?'color:var(--cat-lis);':''}">${esc(subtitle)}</div>
          <div class="item-title" style="${checked?'text-decoration:line-through;':''}">${esc(item.title)}</div>
        </div>
      ${studyCloseTag}
      <button class="roadmap-check ${checked?'checked':''}" data-action="toggle-roadmap-item" data-idx="${idx}" aria-label="${L('Mark done','Tamamlandı say','علامت‌زدن به‌عنوان انجام‌شده','Marcar como hecho')}">${checked ? ICONS.check : '<span class="circle"></span>'}</button>
    </div>`;
  }

  const pendingRows = []; const doneRows = [];
  roadmap.forEach((it,idx)=>{ (rc[idx] ? doneRows : pendingRows).push(roadmapRow(it, idx)); });

  return `<div class="fade-in">
    ${sectionHead(L('Your Plan','Planın','برنامه تو','Tu Plan'), L(arch.blurb.en,arch.blurb.tr,arch.blurb.fa,arch.blurb.es))}
    <div class="screen" style="padding-top:0;">
      <div class="card-flat" style="margin-bottom:14px;">
        <div class="row between" style="align-items:center;">
          <div>
            <div style="font-weight:700; font-size:14px;">${esc(displayLevel(p))} ${L('roadmap','yol haritası','نقشه راه','hoja de ruta')}</div>
            <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">${L('Check everything off to reach','Hepsini işaretle ve şuraya ulaş:','همه را علامت بزن تا برسی به','Marca todo para llegar a')} ${esc(nextDisplayLevel(p))}</div>
          </div>
          <div class="num" style="font-weight:800; font-size:15px; color:var(--cat-lis);">${doneCount}/${roadmap.length}</div>
        </div>
        <div class="progress-track" style="margin-top:10px;"><div class="progress-fill" style="width:${(doneCount/roadmap.length)*100}%; background:var(--cat-lis);"></div></div>
      </div>
      <div class="stack" style="gap:8px;">
        ${pendingRows.join('')}
      </div>
      ${doneRows.length ? `
      <h2 class="display" style="font-size:14px; margin:22px 0 10px; color:var(--ink-soft);">${L('Completed','Tamamlanan','تکمیل‌شده','Completado')} (${doneRows.length})</h2>
      <div class="stack" style="gap:8px;">
        ${doneRows.join('')}
      </div>` : ''}
      <a class="btn btn-primary" style="margin-top:18px; width:100%; justify-content:center;" target="_top" rel="noopener" href="${whatsappLink(L("Hi! I'm "+p.name+". I'd like to start my course.","Merhaba! Ben "+p.name+". Kursuma başlamak istiyorum.","سلام! من "+p.name+" هستم. می‌خواهم دوره‌ام را شروع کنم.","¡Hola! Soy "+p.name+". Quiero empezar mi curso.")+leadInfoSuffix(p))}">${L('Start your course','Kursuna başla','شروع دوره‌ات','Empieza tu curso')}</a>
      <button class="btn btn-ghost" style="margin-top:10px;" data-action="retake-diagnostic">${L('Redo my diagnostic','Testimi yeniden yap','دوباره انجام‌دادن آزمون','Rehacer mi diagnóstico')}</button>
    </div>
  </div>`;
}

  const vShown = vTagged.length ? vTagged : VOCAB_SETS.filter(s=>s.level===level && s.category==='vocab');
  const slTagged = VOCAB_SETS.filter(s=>s.level===level && s.category==='slang' && s.goals.includes(goal));
  const slShown = slTagged.length ? slTagged : VOCAB_SETS.filter(s=>s.level===level && s.category==='slang');

    const done = state.progress.completedVocabSets.includes(s.id);

      ${done ? `<span class="pill badge-done">${ICONS.check}</span>` : `<span class="chevron">${ICONS.chev}</span>`}
    </button>`;
  };
  return `<div class="fade-in">
    ${sectionHead(goalMetaLabel(goal)+' · '+level, L('Everything in this level, focused on your goal.','Bu seviyedeki her şey hedefine göre.','هر چیزی در این سطح، متمرکز بر هدف تو.','Todo lo de este nivel, enfocado en tu meta.'))}

      <div class="tab-row">
        ${g.tabs.map(t=>`<button class="tab-btn ${tab===t?'active':''}" data-action="set-goal-tab" data-tab="${t}">${tabLabel(t)}</button>`).join('')}
      </div>
      ${tab==='grammar' ? `<div class="stack" style="gap:8px;">
        ${gItems.map(t=>{

        }).join('')}

      ${tab==='vocab' ? `<div class="stack" style="gap:8px;">${vShown.map(s=>setRow(s, ICONS.cards, 'voc')).join('')}</div>` : ''}
      ${tab==='slang' ? `<div class="stack" style="gap:8px;">${slShown.map(s=>setRow(s, ICONS.cards, 'lis')).join('')}</div>` : ''}

function buildPracticeRound(goal, level, difficulty){
  const vPoolAll = VOCAB_SETS.filter(s=>s.level===level && s.category==='vocab');
  const slPoolAll = VOCAB_SETS.filter(s=>s.level===level && s.category==='slang');
  const gPoolAll = GRAMMAR_ITEMS.filter(g=>g.level===level);
  const vTagged = vPoolAll.filter(s=>s.goals.includes(goal));
  const slTagged = slPoolAll.filter(s=>s.goals.includes(goal));
  const vSets = vTagged.length ? vTagged : vPoolAll;
  const slSets = slTagged.length ? slTagged : slPoolAll;
  const flattenCards = sets => sets.reduce((acc,s)=>acc.concat(s.cards), []);
  const vCards = flattenCards(vSets);
  const slCards = flattenCards(slSets);
  const pick = (arr, n) => {
    const pool = arr.slice(), out = [];
    while(out.length < n && pool.length) out.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
    return out;
  };
  const wordCount = difficulty==='easy' ? 1 : difficulty==='medium' ? 2 : 3;
  const words = pick(vCards, wordCount).map(c=>({
    word: c.word,
    meaning: L(c.meaning.en, c.meaning.tr, c.meaning.fa, c.meaning.es),
    note: c.note ? L(c.note.en, c.note.tr, c.note.fa, c.note.es) : null,
    sentence: c.sentence || null
  }));
  let grammar = null;
  if(difficulty !== 'easy' && gPoolAll.length){
    const withVariant = gPoolAll.filter(g=>g.goalVariant && g.goalVariant[goal]);
    const gSource = withVariant.length ? withVariant : gPoolAll;
    const gItem = gSource[Math.floor(Math.random()*gSource.length)];
    grammar = {title: grammarTitle(gItem), markerWord: gItem.blank.word, exp: L(gItem.exp.en, gItem.exp.tr, gItem.exp.fa, gItem.exp.es)};
  }
  let slang = null;
  if(difficulty === 'difficult' && slCards.length){

function checkPracticeAnswer(round, text){
  const clean = (text||'').trim();

    const wholePattern = new RegExp('\\b'+escaped+'\\w*','i');

    const verbStem = /^(.{2,}?)(ar|er|ir)$/.exec(firstWord);

  const slangSpotted = round.slang ? lower.includes(round.slang.word.toLowerCase()) : null;

let studioRecognition = null;
function studioSpeechSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function stopStudioMic(){
  if(studioRecognition){ try{ studioRecognition.onend = null; studioRecognition.stop(); }catch(e){} studioRecognition = null; }
}
function toggleStudioMic(){
  if(studioRecognition){ studioRecognition.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  const rec = new SR();
  rec.lang = 'es-ES'; rec.interimResults = true; rec.continuous = true;
  let finalText = state.viewParams.transcript || '';
  studioRecognition = rec;
  render();
  rec.onresult = (e)=>{
    let interim = '';
    for(let i=e.resultIndex; i<e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) finalText += (finalText ? ' ' : '') + r[0].transcript.trim();
      else interim += r[0].transcript;
    }
    const ta = document.getElementById('studio-answer-input');
    if(ta) ta.value = (finalText + ' ' + interim).trim();
  };
  rec.onerror = ()=>{ studioRecognition = null; render(); };
  rec.onend = ()=>{
    studioRecognition = null;
    state.viewParams.transcript = finalText.trim();
    save(); render();
  };
  rec.start();
}

      </div>`}

}
function renderGrammarTrap(id){
  const t = GRAMMAR_ITEMS.find(x=>x.id===id);
  if(!t) return renderComingSoon();
  const goal = state.viewParams.goal;
  const variant = goal && t.goalVariant && t.goalVariant[goal];
  const wrong = (variant && variant.wrong) ? variant.wrong : t.wrong;
  const right = (variant && variant.right) ? variant.right : t.right;
  const wrong2 = (variant && variant.wrong2) ? variant.wrong2 : t.wrong2;
  const right2 = (variant && variant.right2) ? variant.right2 : t.right2;
  const exampleBadge = (n) => `<span style="display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--cat-gram); color:#fff; font-size:11px; font-weight:800; flex:0 0 auto;">${n}</span>`;
  return `<div class="fade-in">
    ${sectionHead(grammarTitle(t), '')}
    <div class="screen" style="padding-top:0;">
      <div class="card-flat" style="position:relative; overflow:hidden; background:linear-gradient(160deg, var(--cat-gram-soft) 0%, var(--bg-elevated) 130%); border-color:var(--cat-gram-soft);">
        ${claySparkles()}
        <div class="row" style="gap:9px; align-items:center;">
          <span class="item-ic" style="background:var(--bg-elevated); box-shadow:var(--shadow); color:var(--cat-gram); flex:0 0 auto; width:36px; height:36px;">${ICONS.book}</span>
          <div class="eyebrow" style="color:var(--cat-gram); font-size:12.5px;">${L('The rule','Kural','قاعده','La regla')}</div>
        </div>
        ${(() => { const st = structureExplanation(L(t.exp.en,t.exp.tr,t.exp.fa,t.exp.es)); return `
        ${st.hook ? `<p style="margin-top:12px; font-size:16.5px; font-weight:800; line-height:1.55; color:var(--ink);">${esc(st.hook)}</p>` : ''}
        ${renderLessonText(st.rest, '--cat-gram')}
        ${st.tip ? `<div style="margin-top:14px; padding:11px 13px; border-radius:14px; background:var(--bg-elevated); display:flex; gap:10px; align-items:flex-start; border:1.5px solid var(--cat-gram-soft);">
          <span style="display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--cat-gram-soft); flex:0 0 auto; font-size:13px;">💡</span>
          <div style="font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.5; padding-top:3px;">${esc(st.tip)}</div>
        </div>` : ''}`; })()}
      </div>

      <div class="row" style="gap:7px; align-items:center; margin:22px 0 10px;">
        ${exampleBadge(1)}
        <h3 class="display" style="font-size:13.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;">${L('Example','Örnek','مثال','Ejemplo')}</h3>
      </div>
      <div class="contrast" dir="ltr">
        <div class="contrast-line wrong"><b>✗</b><span class="txt">${glossify(wrong)}</span></div>
        <div class="contrast-line right"><b>✓</b><span class="txt">${glossify(right)}</span></div>
      </div>

      ${wrong2 && right2 ? `
      <div class="row" style="gap:7px; align-items:center; margin:22px 0 10px;">
        ${exampleBadge(2)}
        <h3 class="display" style="font-size:13.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;">${L('Example','Örnek','مثال','Ejemplo')}</h3>
      </div>
      <div class="contrast" dir="ltr">
        <div class="contrast-line wrong"><b>✗</b><span class="txt">${glossify(wrong2)}</span></div>
        <div class="contrast-line right"><b>✓</b><span class="txt">${glossify(right2)}</span></div>
      </div>` : ''}

      <p style="margin-top:18px; font-size:12.5px; color:var(--ink-faint); text-align:center;">${L('💬 Tap any word above to see what it means.','💬 Anlamını görmek için yukarıdaki bir kelimeye dokun.','💬 برای دیدن معنی، روی هر کلمه بالا لمس کن.','💬 Toca cualquier palabra de arriba para ver su significado.')}</p>

      <button class="btn btn-primary" style="margin-top:14px;" data-action="start-grammar-quiz" data-id="${t.id}">${L("Got it — let's practice!","Anladım — hadi pratik yapalım!","فهمیدم — بریم تمرین کنیم!","¡Entendido — a practicar!")}</button>
    </div>
  </div>`;
}

/* ============================= QUIZ ENGINE (shared) ============================= */
function grammarQuizQuestions(item){
  const why = L(item.exp.en, item.exp.tr, item.exp.fa, item.exp.es);
  const pickLabel = L('Which sentence is correct?','Hangi cümle doğru?','کدام جمله درست است؟','¿Qué oración es correcta?');
  const pickQ = (right, wrong) => { const opts = shuffle([right, wrong]); return {prompt:pickLabel, options:opts, correct:opts.indexOf(right), why}; };
  const fillQ = (blank) => { const opts = shuffle([blank.word, ...blank.distractors]); return {prompt:blank.sentence, options:opts, correct:opts.indexOf(blank.word), why}; };
  const tfLabel = L('True or false: this sentence is correct.','Doğru mu yanlış mı: bu cümle doğru.','درست یا نادرست: این جمله درست است.','Verdadero o falso: esta oración es correcta.');
  const tfQ = (sentence, isCorrect) => { const opts = shuffle([L('True','Doğru','درست','Verdadero'), L('False','Yanlış','نادرست','Falso')]); const answer = isCorrect ? L('True','Doğru','درست','Verdadero') : L('False','Yanlış','نادرست','Falso'); return {prompt:tfLabel+'\n"'+sentence+'"', options:opts, correct:opts.indexOf(answer), why}; };
  return shuffle([
    pickQ(item.right, item.wrong),
    pickQ(item.right2, item.wrong2),
    pickQ(item.right, item.wrong2),
    pickQ(item.right2, item.wrong),
    fillQ(item.blank),
    fillQ(item.blank2),
    tfQ(item.right, true),
    tfQ(item.wrong2, false),
    tfQ(item.right2, true),
    tfQ(item.wrong, false)
  ]).slice(0, 8);
}
function vocabQuizQuestions(s){
  const sibling = VOCAB_SETS.filter(x=>x.level===s.level && x.category===s.category).flatMap(x=>x.cards);
  const blankOf = (c) => {
    const re = new RegExp(c.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
    return c.sentence.replace(re, '_____');
  };
  const fillQ = (c) => {
    const pool = sibling.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
    const distractors = shuffle(pool).slice(0,3).map(x=>x.word);
    const options = shuffle([c.word, ...distractors]);
    return {prompt: blankOf(c), options, correct: options.indexOf(c.word)};
  };
  const reverseLabel = L('Which sentence uses this word?','Bu kelimeyi hangi cümle kullanıyor?','کدام جمله از این کلمه استفاده می‌کند؟','¿Qué oración usa esta palabra?');
  const reverseQ = (c) => {
    const others = s.cards.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
    const pool = others.length>=2 ? others : sibling.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
    const distractorCards = shuffle(pool).slice(0,2);
    const correctOpt = blankOf(c);
    const options = shuffle([correctOpt, ...distractorCards.map(blankOf)]);
    return {prompt: reverseLabel + '\n"' + c.word + '"', options, correct: options.indexOf(correctOpt)};
  };
  const tfLabel = L('True or false: this word fits the sentence.','Doğru mu yanlış mı: bu kelime cümleye uyuyor.','درست یا نادرست: این کلمه با جمله مطابقت دارد.','Verdadero o falso: esta palabra encaja en la oración.');
  const tfQ = (c, i) => {
    const isTrue = i % 2 === 0;
    let filled;
    if(isTrue){
      filled = c.sentence;
    } else {
      const sameSet = s.cards.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
      const pool = sameSet.length ? sameSet : sibling.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
      const wrongCard = shuffle(pool)[0];
      filled = blankOf(c).replace('_____', wrongCard.word);
    }
    const opts = shuffle([L('True','Doğru','درست','Verdadero'), L('False','Yanlış','نادرست','Falso')]);
    const answer = isTrue ? L('True','Doğru','درست','Verdadero') : L('False','Yanlış','نادرست','Falso');
    return {prompt: tfLabel+'\n"'+filled+'"', options: opts, correct: opts.indexOf(answer)};
  };
  const all = [...s.cards.map(fillQ), ...s.cards.map(reverseQ), ...s.cards.map(tfQ)];
  return shuffle(all).slice(0, Math.min(3*s.cards.length, 24));
}
function storyQuizQuestions(s){ return s.quiz.slice(); }
function buildReviewQuiz(){
  const due = dueItems().slice(0, 5);
  const mixed = [];
  due.forEach(id=>{
    const entry = state.progress.srs[id];
    let source, generator;
    if(entry.kind==='grammar'){ source = GRAMMAR_ITEMS.find(x=>x.id===id); generator = grammarQuizQuestions; }
    else if(entry.kind==='vocab'){ source = VOCAB_SETS.find(x=>x.id===id); generator = vocabQuizQuestions; }
    else if(entry.kind==='story'){ source = STORY_LIBRARY.find(x=>x.id===id); generator = storyQuizQuestions; }
    if(!source) return;
    const qs = generator(source).slice(0, 3);
    qs.forEach(q=>{ q.itemId = id; q.kind = entry.kind; });
    mixed.push(...qs);
  });
  return shuffle(mixed);
}
function questionTimeLimit(item){ return item.options.length <= 2 ? 15 : 20; }
function startQuiz(kind, contextId, questions, backView, backParams){
  questions.forEach(qq=>{ if(qq.itemId===undefined){ qq.itemId = contextId; qq.kind = kind; } });
  const timeLimit = questionTimeLimit(questions[0]);
  state.quiz = {kind, contextId, questions, index:0, correct:0, answered:false, selected:null, results:[], backView, backParams: backParams || {}, timeLimit, deadline: Date.now()+timeLimit*1000, lastTickSecond:null};
  go('quiz');
}
function handleQuizTimeout(){
  const q = state.quiz;
  if(!q || q.answered) return;
  if(!q.results) q.results = [];
  q.answered = true; q.selected = -1;
  q.results[q.index] = false;
  save(); render();
}
let quizTimerInterval = setInterval(function(){
  const q = state.quiz;
  if(state.view !== 'quiz' || !q || q.answered || !q.deadline) return;
  const remainingMs = q.deadline - Date.now();
  const remaining = Math.max(remainingMs/1000, 0);
  const fillEl = document.getElementById('quiz-timer-fill');
  const textEl = document.getElementById('quiz-timer-text');
  if(fillEl) fillEl.style.width = Math.max((remaining/q.timeLimit)*100, 0)+'%';
  if(textEl) textEl.textContent = Math.ceil(remaining);
  const wholeSecond = Math.ceil(remaining);
  if(wholeSecond !== q.lastTickSecond && wholeSecond > 0){
    q.lastTickSecond = wholeSecond;
    playTick(q.timeLimit - wholeSecond, q.timeLimit);
  }
  if(remainingMs <= 0){

/* Builds a Bach-Prelude-style broken-chord arpeggio (root,3rd,5th,8ve,3rd,5th,8ve,3rd)
   for each chord in a progression — this is literally how BWV 846 is constructed,
   just with a representative (not note-for-note transcribed) chord sequence. */
function arpeggiateProgression(chordNames, beats){
  const out = [];
  chordNames.forEach(name=>{
    const t = CHORDS[name];
    [0,1,2,3,1,2,3,1].forEach(i=>out.push([t[i], beats]));
  });

/* Repeats a phrase/cycle until it covers at least minBeats worth of music, so the
   exact duration is guaranteed at runtime regardless of how the source cycle is
   written (rather than hand-computing a repeat count, which is easy to get wrong). */
function repeatToBeats(cycle, minBeats){
  const cycleBeats = cycle.reduce((s,n)=>s+n[1], 0);
  const reps = Math.max(1, Math.ceil(minBeats / cycleBeats));
  let out = [];
  for(let i=0;i<reps;i++) out = out.concat(cycle);
  return out;
}
