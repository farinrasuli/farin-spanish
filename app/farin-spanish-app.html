<meta charset="UTF-8">
<title>Farin Spanish</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdfbf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farin Spanish">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfbf8; --bg-elevated:#ffffff; --bg-sunken:#f0efe9;
    --ink:#14332e; --ink-soft:#4d6b66; --ink-faint:#8aa19c;
    --border:#e5e1d8; --border-soft:#eeebe3;
    --accent:#ff7a59; --accent-ink:#ffffff; --accent-soft:#ffe7de; --accent-strong:#e85c3b;
    --cat-diag:#A99BEA; --cat-diag-soft:#ece5ff;
    --cat-gram:#FFA53D; --cat-gram-soft:#ffedd1;
    --cat-voc:#5FC9B8; --cat-voc-soft:#d6f5ef;
    --cat-lis:#FF8FB3; --cat-lis-soft:#ffe1ef;
    --cat-story:#7C93FF; --cat-story-soft:#e5eaff;
    --cat-review:#FFD166; --cat-review-soft:#fff3d2;
    --success:#2ecc71; --success-soft:#dff7e7;
    --error:#ff4444; --error-soft:#ffe1df;
    --shadow:0 1px 2px rgba(20,51,46,.08), 0 8px 24px -12px rgba(20,51,46,.22);
    --glow-badge:0 0 0 2px rgba(46,204,113,.55), 0 0 30px 4px rgba(46,204,113,.55);
    --radius:28px;
    --clay-orange:#FFA53D; --clay-orange-deep:#E8790A;
    --clay-coral:#FF6F5E; --clay-coral-deep:#E44736;
    --clay-lavender:#A99BEA; --clay-lavender-deep:#7C68D6;
    --clay-sage:#8FAE85; --clay-sage-deep:#5F8455;
    --clay-sky:#4FC3E8; --clay-sky-deep:#1F8FB0;
    --clay-shadow:inset 0 2px 3px rgba(255,255,255,.4), inset 0 -14px 22px -10px rgba(0,0,0,.2), 0 14px 30px -12px rgba(0,0,0,.32);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14201f; --bg-elevated:#1c2b28; --bg-sunken:#0e1715;
      --ink:#eef5f2; --ink-soft:#a9c2bd; --ink-faint:#77938d;
      --border:#2b433d; --border-soft:#203330;
      --accent:#ff8a6b; --accent-ink:#1a1210; --accent-soft:#3a281f; --accent-strong:#ffa382;
      --cat-diag:#a78bfa; --cat-diag-soft:#2e2350;
      --cat-gram:#ffb648; --cat-gram-soft:#3a2a10;
      --cat-voc:#2dd4bf; --cat-voc-soft:#0f3630;
      --cat-lis:#ff6bab; --cat-lis-soft:#3a1c2c;
      --cat-story:#7c93ff; --cat-story-soft:#232a4a;
      --cat-review:#ffd83d; --cat-review-soft:#3a3012;
      --success:#4ade80; --success-soft:#1c3a28;
      --error:#ff6b6b; --error-soft:#3d2420;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --glow-badge:0 0 0 2px rgba(74,222,128,.5), 0 0 30px 4px rgba(74,222,128,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14201f; --bg-elevated:#1c2b28; --bg-sunken:#0e1715;
    --ink:#eef5f2; --ink-soft:#a9c2bd; --ink-faint:#77938d;
    --border:#2b433d; --border-soft:#203330;
    --accent:#ff8a6b; --accent-ink:#1a1210; --accent-soft:#3a281f; --accent-strong:#ffa382;
    --cat-diag:#a78bfa; --cat-diag-soft:#2e2350;
    --cat-gram:#ffb648; --cat-gram-soft:#3a2a10;
    --cat-voc:#2dd4bf; --cat-voc-soft:#0f3630;
    --cat-lis:#ff6bab; --cat-lis-soft:#3a1c2c;
    --cat-story:#7c93ff; --cat-story-soft:#232a4a;
    --cat-review:#ffd83d; --cat-review-soft:#3a3012;
    --success:#4ade80; --success-soft:#1c3a28;
    --error:#ff6b6b; --error-soft:#3d2420;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#fdfbf8; --bg-elevated:#ffffff; --bg-sunken:#f0efe9;
    --ink:#14332e; --ink-soft:#4d6b66; --ink-faint:#8aa19c;
    --border:#e5e1d8; --border-soft:#eeebe3;
    --accent:#ff7a59; --accent-ink:#ffffff; --accent-soft:#ffe7de; --accent-strong:#e85c3b;
    --cat-diag:#A99BEA; --cat-diag-soft:#ece5ff;
    --cat-gram:#FFA53D; --cat-gram-soft:#ffedd1;
    --cat-voc:#5FC9B8; --cat-voc-soft:#d6f5ef;
    --cat-lis:#FF8FB3; --cat-lis-soft:#ffe1ef;
    --cat-story:#7C93FF; --cat-story-soft:#e5eaff;
    --cat-review:#FFD166; --cat-review-soft:#fff3d2;
    --success:#2ecc71; --success-soft:#dff7e7;
    --error:#ff4444; --error-soft:#ffe1df;
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:84px;}
  @media (min-width:481px){
    body{background:var(--bg-sunken);}
    #app{min-height:100dvh; box-shadow:var(--shadow); border-left:1px solid var(--border); border-right:1px solid var(--border);}
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  p{margin:0;}
  button{font:inherit; cursor:pointer;}
  input{font:inherit;}
  .visually-hidden{position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  .heart-wrap{position:relative; display:inline-flex; vertical-align:-3px;}
  .heart-pulse{display:inline-flex; animation:heart-beat 1.7s ease-in-out infinite;}
  @keyframes heart-beat{0%,100%{transform:scale(1);} 50%{transform:scale(1.18);}}
  .sparkle{position:absolute; width:7px; height:7px; background:currentColor; clip-path:polygon(50% 0%,61% 35%,100% 50%,61% 65%,50% 100%,39% 65%,0% 50%,39% 35%); opacity:0; animation:sparkle-twinkle 1.8s ease-in-out infinite;}
  .sparkle-1{top:-6px; right:-8px; animation-delay:0s;}
  .sparkle-2{bottom:-4px; left:-9px; width:5px; height:5px; animation-delay:.6s;}
  .sparkle-3{top:1px; right:13px; width:5px; height:5px; animation-delay:1.2s;}
  @keyframes sparkle-twinkle{0%,100%{opacity:0; transform:scale(0) rotate(0deg);} 50%{opacity:1; transform:scale(1) rotate(25deg);}}

  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint);}
  .display{font-family:'Fredoka',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-weight:700; letter-spacing:-.02em;}
  .num{font-variant-numeric:tabular-nums; font-family:'Plus Jakarta Sans',-apple-system,sans-serif; font-weight:800;}

  /* ---- topbar ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 8px; gap:10px;}
  .wordmark{font-weight:800; font-size:19px; letter-spacing:-.01em;}
  .wordmark span{color:var(--accent);}
  .streak-chip{display:flex; align-items:center; gap:5px; background:var(--bg-elevated); border:1px solid var(--border); padding:6px 10px 6px 8px; border-radius:999px; font-weight:700; font-size:13px;}
  .icon-btn{background:none; border:1px solid var(--border); width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:0 0 auto;}
  .icon-btn:hover{color:var(--ink); border-color:var(--ink-faint);}
  .lang-btn{background:var(--bg-elevated); border:1px solid var(--border); border-radius:999px; height:34px; padding:0 12px; font-weight:800; font-size:12px; letter-spacing:.03em; color:var(--ink-soft); flex:0 0 auto;}
  .lang-btn:hover{color:var(--ink); border-color:var(--ink-faint);}

  /* ---- generic layout ---- */
  .screen{padding:4px 20px 28px;}
  .stack{display:flex; flex-direction:column; gap:14px;}
  .row{display:flex; align-items:center; gap:10px;}
  .between{justify-content:space-between;}

  .card{background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .card-flat{background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px; box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 10px 22px -14px rgba(20,51,46,.22);}
  .badge-unlock-shine{position:relative; overflow:hidden; box-shadow:var(--glow-badge), var(--shadow); animation:badge-pulse 1.6s ease-in-out infinite;}
  .badge-unlock-shine::after{content:''; position:absolute; top:-60%; left:-60%; width:35%; height:220%; background:linear-gradient(120deg, transparent, rgba(255,255,255,.8), transparent); transform:rotate(22deg); animation:badge-shine-sweep 2.2s ease-in-out infinite; pointer-events:none;}
  @keyframes badge-pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.02);}}
  @keyframes badge-shine-sweep{0%{left:-60%;} 55%{left:130%;} 100%{left:130%;}}
  .card-name{background:radial-gradient(circle at 88% -14%, rgba(255,255,255,.6), transparent 55%), linear-gradient(135deg, var(--cat-diag-soft) 0%, var(--bg-elevated) 145%); border-color:var(--cat-diag-soft);}
  .greeting-banner{position:relative; display:flex; align-items:center; justify-content:center; text-align:center; background:var(--accent-soft); color:var(--accent-strong); border-radius:var(--radius); padding:15px 16px; font-weight:800; font-size:17px; margin-bottom:14px;}
  .greeting-banner .sparkle-1{top:6px; right:10%;}
  .greeting-banner .sparkle-2{bottom:8px; left:8%; width:5px; height:5px;}
  .greeting-banner .sparkle-3{top:40%; right:22%; width:5px; height:5px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; padding:13px 20px; font-weight:700; font-size:15px; border:1px solid transparent; width:100%; transition:transform .08s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
  .btn-whatsapp{background:#2e9e5b; color:#fff;}
  .btn-sm{padding:9px 14px; font-size:13px; width:auto;}
  .btn-block{width:100%;}
  .link-btn{background:none;border:none;color:var(--ink-soft); font-size:13px; font-weight:600; text-decoration:underline; padding:6px;}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.02em;}
  .badge-recommended{background:var(--accent-soft); color:var(--accent-strong);}
  .badge-done{background:var(--success-soft); color:var(--success);}

  .progress-track{height:7px; background:var(--bg-sunken); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease;}

  /* ---- diagnostic ---- */
  .diag-hero{padding:26px 20px 14px; text-align:center; position:relative;}
  .diag-hero .display{font-size:28px; line-height:1.15;}
  .compass-mark{width:56px;height:56px;border-radius:20px;background:var(--cat-diag-soft);color:var(--cat-diag);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .opt-list{display:flex; flex-direction:column; gap:10px;}
  .opt{display:flex; align-items:center; gap:12px; text-align:start; padding:15px 16px; border-radius:22px; border:1.5px solid var(--border); background:var(--bg-elevated); color:var(--ink); width:100%;}
  .opt:hover{border-color:var(--ink-faint);}
  .opt.selected{border-color:var(--accent); background:var(--accent-soft);}
  .opt .opt-ic{flex:0 0 auto; color:var(--ink-faint);}
  .opt.selected .opt-ic{color:var(--accent-strong);}
  .opt-main{font-weight:600; font-size:15px;}
  .opt-sub{font-size:12.5px; color:var(--ink-faint); margin-top:1px;}

  .q-progress{display:flex; gap:6px; padding:16px 20px 0;}
  .q-progress i{flex:1; height:4px; border-radius:2px; background:var(--border);}
  .q-progress i.done{background:var(--accent);}

  .name-input{width:100%; padding:15px 16px; border-radius:22px; border:1.5px solid var(--border); background:var(--bg-elevated); color:var(--ink); font-size:16px;}
  .name-input:focus{border-color:var(--accent);}
  .field-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; display:block;}
  .unlock-error{background:var(--error-soft); color:var(--error); border-radius:14px; padding:10px 13px; font-size:13px; font-weight:600;}
  .lead-box{width:100%; resize:none; border:1.5px dashed var(--border); border-radius:14px; background:var(--bg-sunken); color:var(--ink); font-family:inherit; font-size:13px; line-height:1.6; padding:12px 13px; -webkit-user-select:all; user-select:all;}
  .lead-box:focus{border-color:var(--accent); border-style:solid;}

  /* ---- tiles (bento, claymorphism) ---- */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .tile{position:relative; overflow:hidden; border-radius:32px; padding:18px; text-align:start; border:none; color:#fff; display:flex; flex-direction:column; justify-content:flex-end; gap:3px; min-height:152px; box-shadow:var(--clay-shadow); background-image:radial-gradient(circle at 14% 10%, rgba(255,255,255,.4), transparent 46%);}
  .tile::before{content:''; position:absolute; top:-35%; left:-25%; width:65%; height:190%; background:linear-gradient(120deg, rgba(255,255,255,.4), rgba(255,255,255,0) 65%); transform:rotate(-16deg); pointer-events:none;}
  .tile .sparkle{color:#fff;}

  /* ---- clay banner (Speaking Club / Story World hero, glassy + sparkly) ---- */
  .clay-banner{position:relative; overflow:hidden; border-radius:32px; padding:26px 20px 22px; color:#fff; box-shadow:var(--clay-shadow); background-image:radial-gradient(circle at 12% 8%, rgba(255,255,255,.4), transparent 46%); margin-bottom:16px;}
  .clay-banner::before{content:''; position:absolute; top:-35%; left:-25%; width:65%; height:190%; background:linear-gradient(120deg, rgba(255,255,255,.4), rgba(255,255,255,0) 65%); transform:rotate(-16deg); pointer-events:none;}
  .clay-banner .sparkle{color:#fff;}
  .clay-banner-illustration{width:104px; height:104px; object-fit:contain; display:block; margin:0 auto 12px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.18)); animation:tile-float 4.5s ease-in-out infinite;}
  .clay-banner-title{font-family:'Fredoka',-apple-system,sans-serif; font-weight:700; font-size:19px; text-align:center; color:#fff; letter-spacing:-.01em;}
  .clay-banner-sub{font-size:12.5px; color:rgba(255,255,255,.9); text-align:center; margin-top:6px; font-weight:600; line-height:1.4;}

  /* ---- profile character card (glassy, sparkly, colored) ---- */
  .character-card{position:relative; overflow:hidden; border:none; border-radius:32px; padding:20px 20px 24px; text-align:center; margin-top:10px; box-shadow:var(--clay-shadow); background-image:radial-gradient(circle at 14% 8%, rgba(255,255,255,.4), transparent 46%);}
  .character-card::before{content:''; position:absolute; top:-35%; left:-25%; width:65%; height:190%; background:linear-gradient(120deg, rgba(255,255,255,.4), rgba(255,255,255,0) 65%); transform:rotate(-16deg); pointer-events:none;}
  .character-card .sparkle{color:#fff;}
  .character-portrait{width:210px; height:210px; object-fit:contain; display:block; margin:0 auto 4px; filter:drop-shadow(0 12px 14px rgba(0,0,0,.2)); animation:tile-float 4.5s ease-in-out infinite; position:relative; z-index:1;}
  .tile-ic{width:36px;height:36px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .tile-illustration{position:absolute; top:6px; right:2px; width:72px; height:72px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.16));}
  .tile-illustration img, .tile-illustration svg{width:100%; height:100%; object-fit:contain; animation:tile-float 4.5s ease-in-out infinite;}
  .tile:nth-child(2) .tile-illustration img{animation-delay:.3s;}
  .tile:nth-child(3) .tile-illustration img{animation-delay:.6s;}
  .tile:nth-child(4) .tile-illustration img{animation-delay:.9s;}
  .tile:nth-child(5) .tile-illustration svg{animation-delay:1.2s;}
  @keyframes tile-float{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-5px) rotate(-2deg);}}
  .tile-title{font-weight:800; font-size:15px; color:#fff;}
  .tile-sub{font-size:11.5px; color:rgba(255,255,255,.88); font-weight:700;}

  /* ---- hero card (dashboard, bold color-block + progress ring) ---- */
  .hero-card{width:100%; text-align:start; border:none; border-radius:28px; padding:22px 20px; color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow); background-image:radial-gradient(circle at 88% -18%, rgba(255,255,255,.5), transparent 55%);}
  .hero-eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.78);}
  .hero-name{font-size:23px; margin-top:5px; color:#fff;}
  .hero-pill{background:rgba(255,255,255,.22); color:#fff;}
  .ring-wrap{position:relative; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800;}

  /* ---- stat chips (icon-badge stats, shared by dashboard + profile) ---- */
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .stat-box{display:flex; align-items:center; gap:8px; background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:22px; padding:9px 8px;}
  .stat-box-ic{flex:0 0 auto; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .stat-box-ic svg{width:15px; height:15px;}
  .stat-num{font-size:15px; font-weight:800; line-height:1.15;}
  .stat-lab{font-size:9.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin-top:1px;}

  /* ---- featured tile (roadmap hero card in the dashboard grid) ---- */
  .tile-featured{width:100%; text-align:start; border:none; border-radius:26px; padding:18px 18px 16px; color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow); background-image:radial-gradient(circle at 92% 0%, rgba(255,255,255,.35), transparent 60%);}
  .tile-featured-title{font-weight:800; font-size:16px; margin-top:4px; color:#fff;}
  .tile-featured-ic{flex:0 0 auto; width:38px; height:38px; border-radius:14px; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center;}
  .tile-featured-progress{display:flex; align-items:center; gap:10px; margin-top:16px;}
  .tile-featured-progress .progress-track{flex:1; background:rgba(255,255,255,.28);}
  .tile-featured-progress span{font-size:12px; font-weight:700; color:rgba(255,255,255,.92); flex:0 0 auto;}

  /* ---- badges ---- */
  .badge-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
  .badge-cell{border-radius:var(--radius); padding:14px 8px; text-align:center; border:1px solid var(--border-soft); background:var(--bg-elevated); display:flex; flex-direction:column; align-items:center; gap:7px; box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 10px 20px -14px rgba(20,51,46,.2);}
  .badge-cell.locked{opacity:.45; box-shadow:none;}
  .badge-cell .badge-ic{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 2px 3px rgba(255,255,255,.4), inset 0 -6px 10px -4px rgba(0,0,0,.18);}
  .badge-cell .badge-name{font-size:10.5px; font-weight:700; line-height:1.25;}

  /* ---- list rows ---- */
  .item-row{display:flex; align-items:center; gap:13px; padding:15px 16px; border-radius:22px; border:1px solid var(--border-soft); background:var(--bg-elevated); width:100%; text-align:start;}
  .item-row:hover{border-color:var(--ink-faint);}
  .item-ic{flex:0 0 auto; width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .item-body{flex:1; min-width:0;}
  .item-title{font-weight:700; font-size:14.5px;}
  .item-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .chevron{color:var(--ink-faint); flex:0 0 auto;}

  /* ---- roadmap rows (study link + separate done toggle) ---- */
  .roadmap-row{display:flex; align-items:stretch; border-radius:22px; border:1px solid var(--border-soft); background:var(--bg-elevated); overflow:hidden;}
  .roadmap-study{flex:1; display:flex; align-items:center; gap:13px; padding:15px 14px; text-align:start; min-width:0; background:none; border:none; color:inherit; text-decoration:none;}
  .roadmap-check{flex:0 0 auto; width:46px; display:flex; align-items:center; justify-content:center; border:none; border-left:1px solid var(--border-soft); background:none; color:var(--ink-faint);}

function renderPracticeRecommendation(profile){
  const rec = PRACTICE_RECOMMENDATION[profile.priorityArea] || PRACTICE_RECOMMENDATION.grammar;
  return `<div class="card" style="margin-top:14px;">
    <div class="eyebrow">${L('Your game plan','Senin oyun planın','برنامه بازی تو','Tu plan de juego')}</div>
    <p style="font-size:13.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5;">${esc(L(rec.blurb.en,rec.blurb.tr,rec.blurb.fa,rec.blurb.es))}</p>
    <div class="stack" style="gap:8px; margin-top:14px;">
      ${PRACTICE_SECTIONS.map(sec=>{
        const emphasized = rec.emphasize.includes(sec.key);
        return `<button class="item-row" data-action="nav" data-view="${sec.view}">
          <span class="item-ic" style="background:var(--cat-${sec.cat}-soft); color:var(--cat-${sec.cat});">${ICONS[sec.icon]}</span>
          <div class="item-body">
            <div class="item-title">${esc(L(sec.label.en,sec.label.tr,sec.label.fa,sec.label.es))}</div>
          </div>
          ${emphasized ? `<span class="pill badge-recommended">${L('Start here','Buradan başla','از اینجا شروع کن','Empieza aquí')}</span>` : `<span class="chevron">${ICONS.chev}</span>`}
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

{id:'g-A1-4', level:'A1', title:{en:'Plural nouns & agreement', tr:'Çoğul İsimler ve Uyum', fa:'جمع اسم‌ها و مطابقت', es:'Sustantivos plurales y concordancia'},
 exp:{en:'Add -s to nouns ending in a vowel and -es to nouns ending in a consonant. Articles and adjectives must also become plural to match: la casa → las casas grandes.',
      tr:'Ünlü ile biten isimlere -s, ünsüz ile bitenlere -es eklenir. Tanımlıklar ve sıfatlar da isme uyacak şekilde çoğul olmalıdır: la casa → las casas grandes.',
      fa:'به اسم‌هایی که با حرف صدادار تمام می‌شوند -s و به اسم‌هایی که با حرف بی‌صدا تمام می‌شوند -es اضافه می‌کنیم. حروف تعریف و صفت‌ها هم باید جمع شوند تا با اسم مطابقت داشته باشند: la casa → las casas grandes.',
      es:'Añade -s a los sustantivos terminados en vocal y -es a los terminados en consonante. Los artículos y adjetivos también deben pasar a plural para concordar: la casa → las casas grandes.'},
 wrong:'Los casa son grande.', right:'Las casas son grandes.',
 blank:{sentence:'Tengo dos ___ nuevos.', word:'libros', distractors:['libro','libras']},
 wrong2:'Las ciudad son bonitas.', right2:'Las ciudades son bonitas.',
 blank2:{sentence:'Hay tres ___ en la mesa.', word:'flores', distractors:['flor','floras']}},

{id:'g-A1-5', level:'A1', title:{en:'Regular -AR verbs (present tense)', tr:'Düzenli -AR Fiilleri (şimdiki zaman)', fa:'افعال باقاعده -AR (زمان حال)', es:'Verbos regulares -AR (presente)'},
 exp:{en:'Most Spanish verbs ending in -ar follow a fixed pattern in the present tense. Drop -ar and add: -o, -as, -a, -amos, -áis, -an. Example with hablar (to speak): hablo, hablas, habla, hablamos, habláis, hablan.',
      tr:'-ar ile biten çoğu İspanyolca fiil şimdiki zamanda sabit bir kalıp izler. -ar eki atılır ve şunlar eklenir: -o, -as, -a, -amos, -áis, -an. Örnek, hablar (konuşmak): hablo, hablas, habla, hablamos, habláis, hablan.',
      fa:'اغلب فعل‌های اسپانیایی که به -ar ختم می‌شوند در زمان حال از یک الگوی ثابت پیروی می‌کنند. -ar را حذف کرده و این پسوندها را اضافه می‌کنیم: -o, -as, -a, -amos, -áis, -an. مثال با hablar (صحبت کردن): hablo, hablas, habla, hablamos, habláis, hablan.',
      es:'La mayoría de los verbos en español terminados en -ar siguen un patrón fijo en presente. Se quita -ar y se añade: -o, -as, -a, -amos, -áis, -an. Ejemplo con hablar: hablo, hablas, habla, hablamos, habláis, hablan.'},
 wrong:'Ella hablar español muy bien.', right:'Ella habla español muy bien.',
 blank:{sentence:'Nosotros ___ mucho por teléfono.', word:'hablamos', distractors:['hablan','hablas']},
 wrong2:'Tú trabaja los sábados.', right2:'Tú trabajas los sábados.',
 blank2:{sentence:'Ellos ___ en una oficina.', word:'trabajan', distractors:['trabaja','trabajamos']}},

{id:'g-A1-6', level:'A1', title:{en:'Regular -ER/-IR verbs (present tense)', tr:'Düzenli -ER/-IR Fiilleri (şimdiki zaman)', fa:'افعال باقاعده -ER/-IR (زمان حال)', es:'Verbos regulares -ER/-IR (presente)'},
 exp:{en:'-er and -ir verbs share almost the same present-tense endings. Comer (to eat): como, comes, come, comemos, coméis, comen. Vivir (to live): vivo, vives, vive, vivimos, vivís, viven — only the "we" and "you-all" forms differ from -er verbs.',
      tr:'-er ve -ir fiilleri şimdiki zamanda neredeyse aynı ekleri paylaşır. Comer (yemek yemek): como, comes, come, comemos, coméis, comen. Vivir (yaşamak): vivo, vives, vive, vivimos, vivís, viven — yalnızca "biz" ve "sizler" biçimleri -er fiillerinden farklıdır.',
      fa:'افعال -er و -ir تقریباً پسوندهای یکسانی در زمان حال دارند. Comer (خوردن): como, comes, come, comemos, coméis, comen. Vivir (زندگی کردن): vivo, vives, vive, vivimos, vivís, viven — فقط صورت‌های «ما» و «شما (جمع)» با افعال -er فرق دارند.',
      es:'Los verbos -er e -ir comparten casi las mismas terminaciones en presente. Comer: como, comes, come, comemos, coméis, comen. Vivir: vivo, vives, vive, vivimos, vivís, viven — solo las formas de "nosotros" y "vosotros" son distintas de los verbos -er.'},
 wrong:'Yo come pizza los viernes.', right:'Yo como pizza los viernes.',
 blank:{sentence:'¿Dónde ___ tú?', word:'vives', distractors:['vive','vivo']},
 wrong2:'Nosotros vive en Madrid.', right2:'Nosotros vivimos en Madrid.',
 blank2:{sentence:'Ellos ___ frutas todos los días.', word:'comen', distractors:['come','comemos']}},

{id:'g-A1-7', level:'A1', title:{en:'The verb TENER (to have) & expressions', tr:'"Tener" Fiili (sahip olmak) ve Kalıplar', fa:'فعل Tener (داشتن) و عبارات آن', es:'El verbo TENER y sus expresiones'},
 exp:{en:'Tener means "to have": tengo, tienes, tiene, tenemos, tenéis, tienen. It\'s also used in fixed expressions where English uses "to be": tener hambre (to be hungry), tener sed (to be thirsty), tener sueño (to be sleepy), and tener + age (to be __ years old).',
      tr:'Tener "sahip olmak" demektir: tengo, tienes, tiene, tenemos, tenéis, tienen. Ayrıca İngilizce/Türkçede "olmak" ile ifade edilen bazı kalıplarda kullanılır: tener hambre (aç olmak), tener sed (susamış olmak), tener sueño (uykulu olmak) ve tener + yaş (__ yaşında olmak).',
      fa:'Tener یعنی «داشتن»: tengo, tienes, tiene, tenemos, tenéis, tienen. همچنین در عبارات ثابتی به کار می‌رود که فارسی از «بودن» استفاده می‌کند: tener hambre (گرسنه بودن)، tener sed (تشنه بودن)، tener sueño (خواب‌آلود بودن) و tener + سن (__ ساله بودن).',
      es:'Tener significa "poseer, tener": tengo, tienes, tiene, tenemos, tenéis, tienen. También se usa en expresiones fijas: tener hambre, tener sed, tener sueño, y tener + edad (tener __ años).'},
 wrong:'Yo soy veinte años.', right:'Yo tengo veinte años.',
 blank:{sentence:'Ella ___ mucha hambre.', word:'tiene', distractors:['tienes','tengo']},
 wrong2:'Nosotros somos mucho sueño.', right2:'Nosotros tenemos mucho sueño.',
 blank2:{sentence:'¿Cuántos años ___ tú?', word:'tienes', distractors:['tiene','tengo']}},

{id:'g-A1-8', level:'A1', title:{en:'GUSTAR (to like)', tr:'"Gustar" Fiili (hoşlanmak)', fa:'فعل Gustar (دوست داشتن)', es:'GUSTAR (gustar)'},
 exp:{en:'Gustar works backwards from "to like": the thing you like is the subject, and the person is marked with me/te/le/nos/os/les. Use gusta if one thing is liked, gustan if several: me gusta el café, me gustan los perros.',
      tr:'Gustar, "hoşlanmak" fiilinin tersine işler: hoşlanılan şey özne olur, kişi ise me/te/le/nos/os/les ile belirtilir. Tek bir şey hoşlanılıyorsa gusta, birden fazlaysa gustan kullanılır: me gusta el café, me gustan los perros.',
      fa:'Gustar برعکس فعل «دوست داشتن» عمل می‌کند: چیزی که دوستش داری فاعل جمله می‌شود و شخص با me/te/le/nos/os/les مشخص می‌شود. اگر یک چیز دوست داشته شود gusta و اگر چند چیز باشد gustan به کار می‌رود: me gusta el café، me gustan los perros.',
      es:'Gustar funciona al revés de lo que esperarías: lo que te gusta es el sujeto de la oración, y la persona se marca con me/te/le/nos/os/les. Se usa gusta si es una sola cosa y gustan si son varias: me gusta el café, me gustan los perros.'},
 wrong:'Yo gusto el café.', right:'Me gusta el café.',
 blank:{sentence:'A ella ___ los perros.', word:'le gustan', distractors:['le gusta','gusta']},
 wrong2:'Nosotros gustamos la música.', right2:'Nos gusta la música.',
 blank2:{sentence:'¿Te ___ las películas de terror?', word:'gustan', distractors:['gusta','gustas']}},

{id:'g-A1-9', level:'A1', title:{en:'Question words', tr:'Soru Kelimeleri', fa:'کلمات پرسشی', es:'Palabras interrogativas'},
 exp:{en:'Common question words: qué (what), quién (who), dónde (where), cuándo (when), cómo (how), cuánto (how much/many), por qué (why). Spanish questions use an upside-down question mark at the start (¿) and often flip the subject and verb.',
      tr:'Yaygın soru kelimeleri: qué (ne), quién (kim), dónde (nerede), cuándo (ne zaman), cómo (nasıl), cuánto (ne kadar), por qué (neden). İspanyolca sorularda başa ters soru işareti (¿) konur ve genellikle özne ile fiil yer değiştirir.',
      fa:'کلمات پرسشی رایج: qué (چه)، quién (چه کسی)، dónde (کجا)، cuándo (چه زمانی)، cómo (چگونه)، cuánto (چقدر)، por qué (چرا). جمله‌های پرسشی اسپانیایی با یک علامت سؤال وارونه (¿) در ابتدا شروع می‌شوند و اغلب جای فاعل و فعل عوض می‌شود.',
      es:'Palabras interrogativas comunes: qué, quién, dónde, cuándo, cómo, cuánto, por qué. Las preguntas en español llevan un signo de interrogación invertido al principio (¿) y muchas veces invierten el orden de sujeto y verbo.'},
 wrong:'Tú vives dónde?', right:'¿Dónde vives tú?',
 blank:{sentence:'¿___ te llamas?', word:'Cómo', distractors:['Qué','Dónde']},
 wrong2:'Él vive dónde ahora?', right2:'¿Dónde vive él ahora?',
 blank2:{sentence:'¿___ cuesta el billete?', word:'Cuánto', distractors:['Cuándo','Cómo']}},

{id:'g-A1-10', level:'A1', title:{en:'Negation & possessive adjectives', tr:'Olumsuzluk ve İyelik Sıfatları', fa:'منفی‌سازی و صفات ملکی', es:'Negación y adjetivos posesivos'},
 exp:{en:'To make a sentence negative, put "no" right before the verb: yo no hablo francés. Possessive adjectives (mi, tu, su, nuestro) go before the noun and must agree in number — mi/mis, tu/tus, su/sus.',
      tr:'Bir cümleyi olumsuz yapmak için "no" fiilin hemen önüne konur: yo no hablo francés. İyelik sıfatları (mi, tu, su, nuestro) isimden önce gelir ve sayı bakımından uyumlu olmalıdır — mi/mis, tu/tus, su/sus.',
      fa:'برای منفی کردن جمله، «no» درست قبل از فعل می‌آید: yo no hablo francés. صفات ملکی (mi, tu, su, nuestro) قبل از اسم می‌آیند و باید از نظر تعداد مطابقت داشته باشند — mi/mis، tu/tus، su/sus.',
      es:'Para negar una oración, coloca "no" justo antes del verbo: yo no hablo francés. Los adjetivos posesivos (mi, tu, su, nuestro) van antes del sustantivo y deben concordar en número — mi/mis, tu/tus, su/sus.'},
 wrong:'No yo hablo francés.', right:'Yo no hablo francés.',
 blank:{sentence:'Esta es ___ casa.', word:'mi', distractors:['mis','me']},
 wrong2:'Estos son mis amigo.', right2:'Estos son mis amigos.',
 blank2:{sentence:'¿Dónde están ___ llaves?', word:'tus', distractors:['tu','su']}}
];

{id:'slang-A1', level:'A1', category:'slang', goals:['everyday'], title:{en:'Daily Slang', tr:'Günlük Argo', fa:'اصطلاحات روزمره', es:'Argot cotidiano'}, cards:[
  {word:'¡Qué padre! / ¡Qué guay!', sentence:'¡Qué padre está tu carro nuevo!', meaning:{en:'How cool! (México: qué padre, España: qué guay)', tr:'Ne harika! (Meksika: qué padre, İspanya: qué guay)', fa:'چقدر باحال! (مکزیک: qué padre، اسپانیا: qué guay)', es:'¡Qué genial! (México: qué padre, España: qué guay)'},
   note:{en:'A casual way to say something is awesome — the exact phrase varies by country.', tr:'Bir şeyin harika olduğunu söylemenin gündelik yolu — ülkeye göre değişir.', fa:'راهی خودمانی برای گفتن اینکه چیزی فوق‌العاده است — بسته به کشور فرق می‌کند.', es:'Una forma informal de decir que algo es genial — la expresión exacta cambia según el país.'}},
  {word:'vale', sentence:'¿Nos vemos a las ocho? — Vale.', meaning:{en:'Okay / alright (very common in Spain).', tr:"Tamam / peki (İspanya'da çok yaygın).", fa:'باشه / اوکی (در اسپانیا خیلی رایج).', es:'Vale / de acuerdo (muy común en España).'},
   note:{en:'Used constantly in Spain to mean "okay" or to confirm you understood.', tr:"İspanya'da «tamam» anlamında ya da anladığını onaylamak için sürekli kullanılır.", fa:'در اسپانیا مدام برای گفتن «باشه» یا تأیید فهمیدن چیزی استفاده می‌شود.', es:'Se usa constantemente en España para decir "de acuerdo" o confirmar que entendiste.'}},

   note:{en:'A relaxed way to tell someone not to worry about something small.', tr:'Birine küçük bir şey için endişelenmemesini söylemenin rahat bir yolu.', fa:'راهی خودمانی برای گفتن به کسی که نگران چیز کوچکی نباشد.', es:'Una forma relajada de decirle a alguien que no se preocupe por algo pequeño.'}},

  {word:'oye', sentence:'Oye, ¿tienes un minuto?', meaning:{en:'Hey (used to get attention).', tr:'Hey (dikkat çekmek için).', fa:'هی (برای جلب توجه).', es:'Oye (se usa para llamar la atención de alguien).'},

  {word:'un montón', sentence:'Te quiero un montón.', meaning:{en:'A lot / tons.', tr:'Bir sürü / çok fazla.', fa:'خیلی زیاد.', es:'Mucho / un montón.'},

   note:{en:'Casual greeting — qué onda leans Mexican, qué tal works everywhere.', tr:"Samimi bir selamlama — qué onda daha çok Meksika'da kullanılır, qué tal her yerde geçerlidir.", fa:'احوال‌پرسی خودمانی — qué onda بیشتر مکزیکی است، qué tal همه‌جا کاربرد دارد.', es:'Saludo informal — qué onda es más mexicano, qué tal funciona en cualquier país.'}},
  {word:'estar en las nubes', sentence:'Perdón, estaba en las nubes.', meaning:{en:'To be daydreaming / not paying attention.', tr:'Dalıp gitmek / hayal kurmak.', fa:'در رؤیا بودن / حواس‌پرت بودن.', es:'Estar distraído, sin prestar atención.'},

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();

    if(parsed.profile && parsed.profile.completedDiagnostic) parsed.view = parsed.view === 'diagnostic-intro' ? 'dashboard' : parsed.view;
    const merged = Object.assign(freshState(), parsed);
    if(!merged.progress.completedStories) merged.progress.completedStories = [];

  else { state.view = state.profile.completedDiagnostic ? 'dashboard' : 'diagnostic-intro'; state.viewParams = {}; }
  save(); render(); window.scrollTo(0,0);
}

const LEITNER_INTERVALS = [1,2,4,7,14]; // days per box 1-5
function localDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return localDateStr(new Date()); }
function updateSRS(itemId, kind, pct){
  const srs = state.progress.srs;
  const entry = srs[itemId] || {kind, box:0};
  if(pct >= 0.8) entry.box = Math.min(entry.box + 1, LEITNER_INTERVALS.length - 1);
  else if(pct < 0.5) entry.box = 0;
  const days = LEITNER_INTERVALS[entry.box];
  entry.kind = kind;
  entry.due = new Date(Date.now() + days*86400000).toISOString().slice(0,10);
  srs[itemId] = entry;
}
function dueItems(){
  const today = todayISO();
  return Object.keys(state.progress.srs).filter(id => state.progress.srs[id].due <= today);
}
function progressArrForKind(kind){
  return kind==='grammar' ? state.progress.completedTraps
       : kind==='vocab' ? state.progress.completedVocabSets
       : kind==='story' ? state.progress.completedStories
       : state.progress.completedScenes;
}
function relativeDate(iso){
  if(!iso) return '—';
  const today = todayISO();
  const yd = new Date(); yd.setDate(yd.getDate()-1);
  const y = localDateStr(yd);
  if(iso === today) return L('Today','Bugün','امروز','Hoy');
  if(iso === y) return L('Yesterday','Dün','دیروز','Ayer');
  return new Date(iso).toLocaleDateString(LANG==='tr'?'tr-TR':undefined,{month:'short', day:'numeric'});
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function highlightWord(sentence, word){
  const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
  const m = sentence.match(re);
  if(!m) return esc(sentence);
  const i = m.index;
  return esc(sentence.slice(0,i)) + '<b>' + esc(m[0]) + '</b>' + esc(sentence.slice(i+m[0].length));
}
function highlightStoryVocab(text, vocab){
  const words = (vocab||[]).map(v=>v.word).filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!words.length) return esc(text);
  const pattern = words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  const re = new RegExp('\\b(?:'+pattern+')\\b', 'gi');
  let result = '', last = 0, m;
  while((m = re.exec(text))){
    result += esc(text.slice(last, m.index)) + '<mark class="vocab-hl">' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  result += esc(text.slice(last));
  return result;
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function dateSeed(str){ let h = 0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; } return h; }
const DAILY_TASK_POOL = [
  {id:'grammar-round', ic:'dumbbell', cat:'gram', theme:'grammar', view:'grammar-list', title:{en:'Finish one Grammar Gym round', tr:'Bir Dilbilgisi Salonu turu bitir', fa:'یک تمرین باشگاه گرامر را تمام کن', es:'Termina una ronda del Gimnasio de Gramática'}},
  {id:'vocab-set', ic:'cards', cat:'voc', theme:'vocab', view:'vocab-list', title:{en:'Learn a new set in Word Play', tr:"Kelime Oyunu'nda yeni bir set öğren", fa:'یک مجموعه جدید در بازی با کلمات یاد بگیر', es:'Aprende un set nuevo en el Juego de Palabras'}},
  {id:'story-read', ic:'book', cat:'story', theme:'story', view:'story-list', title:{en:'Read one story in Story World', tr:"Hikaye Dünyası'nda bir hikaye oku", fa:'یک داستان در دنیای داستان بخوان', es:'Lee una historia en el Mundo de Historias'}},
  {id:'speak-aloud', ic:'chat', cat:'lis', theme:'speaking', view:'speaking-club', title:{en:'Say 5 phrases out loud today', tr:'Bugün yüksek sesle 5 ifade söyle', fa:'امروز ۵ عبارت را با صدای بلند بگو', es:'Di 5 frases en voz alta hoy'}},
  {id:'slang-pickup', ic:'cards', cat:'diag', theme:'vocab', view:'vocab-list', title:{en:'Pick up 3 new slang phrases', tr:'3 yeni argo ifade öğren', fa:'۳ اصطلاح عامیانه جدید یاد بگیر', es:'Aprende 3 frases de argot nuevas'}},
  {id:'roadmap-progress', ic:'compass', cat:'diag', theme:'roadmap', view:'diag-intro-review', title:{en:'Check off one step in Your Roadmap', tr:"Yol Haritan'da bir adımı işaretle", fa:'یک قدم در نقشه راهت را علامت بزن', es:'Marca un paso en tu Hoja de Ruta'}}
];
function buildDailyTasks(p){
  const priorityThemeMap = {grammar:'grammar', vocab:'vocab', listening:'speaking', speaking:'speaking'};
  const focusTheme = priorityThemeMap[p.priorityArea] || 'grammar';
  const focusTask = DAILY_TASK_POOL.find(t=>t.theme===focusTheme) || DAILY_TASK_POOL[0];
  const rest = DAILY_TASK_POOL.filter(t=>t.id!==focusTask.id);
  const seed = dateSeed(todayISO());
  const offset = seed % rest.length;
  const rotated = rest.slice(offset).concat(rest.slice(0, offset));
  return [focusTask, rotated[0], rotated[1]];
}
function displayLevel(p){ return p.levelStage===2 ? p.level+'.2' : p.level; }
function nextDisplayLevel(p){
  if(p.levelStage===1) return p.level+'.2';
  const li = LEVELS.indexOf(p.level);
  return li < LEVELS.length-1 ? LEVELS[li+1] : p.level;
}
function buildRoadmap(profile){
  const goals = (profile.goals && profile.goals.length) ? profile.goals : (profile.motivationTag ? [profile.motivationTag] : []);
  const gPoolAll = GRAMMAR_ITEMS.filter(g=>g.level===profile.level);
  const vPoolAll = VOCAB_SETS.filter(s=>s.level===profile.level && s.category==='vocab');
  const slPoolAll = VOCAB_SETS.filter(s=>s.level===profile.level && s.category==='slang');
  const matchesGoal = arr => arr.filter(x=>x.goals && x.goals.some(gk=>goals.includes(gk)));
  const vPoolGoal = matchesGoal(vPoolAll);
  const slPoolGoal = matchesGoal(slPoolAll);
  const vPool = vPoolGoal.length ? vPoolGoal : vPoolAll;
  const slPool = slPoolGoal.length ? slPoolGoal : slPoolAll;
  // Grammar rules stay the same for every goal — only reorder so goal-flavored examples surface first.
  const primaryGoal = goals.find(gk => gPoolAll.some(g=>g.goalVariant && g.goalVariant[gk])) || goals[0] || null;
  const gPool = (primaryGoal && gPoolAll.some(g=>g.goalVariant && g.goalVariant[primaryGoal]))
    ? gPoolAll.filter(g=>g.goalVariant && g.goalVariant[primaryGoal]).concat(gPoolAll.filter(g=>!(g.goalVariant && g.goalVariant[primaryGoal])))
    : gPoolAll;
  const stage = profile.levelStage===2 ? 2 : 1;
  const gHalf = Math.ceil(gPool.length/2);
  const gSlice = stage===1 ? gPool.slice(0, gHalf) : gPool.slice(gHalf);
  const items = [];
  const sessionLink = (topic) => whatsappLink(L(
    "Hi! I'm "+profile.name+". I'd like to book a speaking session"+(topic?' on "'+topic+'"':'')+".",
    'Merhaba! Ben '+profile.name+'. '+(topic?'"'+topic+'" konulu ':'')+'bir konuşma seansı ayırtmak istiyorum.',
    'سلام! من '+profile.name+' هستم. می‌خواهم یک جلسه مکالمه'+(topic?' درباره «'+topic+'»':'')+' رزرو کنم.',
    '¡Hola! Soy '+profile.name+'. Quiero reservar una sesión de conversación'+(topic?' sobre "'+topic+'"':'')+'.'
  )+leadInfoSuffix(profile));
  const pushSession = (topic) => items.push({type:'session', refId:null, goal:primaryGoal, waLink:sessionLink(topic), title:L('Live speaking session','Canlı konuşma seansı','جلسه زنده مکالمه','Sesión de conversación en vivo')});
  // Drillers repeat-to-learn, and anyone who flagged vocab as their weak spot gets a warm-up rep first.
  if(stage===1 && (profile.priorityArea==='vocab' || profile.learnerType==='driller') && vPool.length){
    items.push({type:'vocab', refId:vPool[0].id, goal:primaryGoal, title:L('Vocab warm-up','Kelime ısınması','گرم‌کردن با کلمات','Calentamiento de vocabulario')+': '+setTitle(vPool[0])});
  }
  let vi = vPool.length ? (stage===2 ? Math.ceil(vPool.length/2) : 0) : 0;
  let sli = slPool.length ? (stage===2 ? Math.ceil(slPool.length/2) : 0) : 0;
  gSlice.forEach((g, i)=>{
    items.push({type:'grammar', refId:g.id, goal:primaryGoal, title:L('Grammar','Dilbilgisi','گرامر','Gramática')+': '+grammarTitle(g)});
    if(i % 2 === 1 && vPool.length){
      const v = vPool[vi % vPool.length]; vi++;
      items.push({type:'vocab', refId:v.id, goal:primaryGoal, title:L('Vocab','Kelime','کلمات','Vocabulario')+': '+setTitle(v)});
    }
    // Immersive learners absorb best in context, so slang lands early instead of only at the end.
    if(profile.learnerType==='immersive' && slPool.length && i===1){
      const sl = slPool[sli % slPool.length]; sli++;
      items.push({type:'slang', refId:sl.id, goal:primaryGoal, title:L('Slang','Argo','اصطلاحات','Argot')+': '+setTitle(sl)});
    }
    if(i === Math.max(Math.floor(gSlice.length/2)-1, 0)){
      pushSession(grammarTitle(g));
    }
  });
  if(slPool.length){
    const sl = slPool[sli % slPool.length];
    items.push({type:'slang', refId:sl.id, goal:primaryGoal, title:L('Slang','Argo','اصطلاحات','Argot')+': '+setTitle(sl)});
  }
  // Talkers (and anyone who said listening/speaking is their weak spot) get an extra live rep.
  if((profile.learnerType==='talker' || profile.priorityArea==='listening') && stage===1){
    pushSession(null);
  }
  pushSession(null);
  return items.map((it,idx)=>Object.assign({n:idx+1}, it));
}

function progressRing(percent, color, trackColor, size, strokeWidth){
  size = size || 56; strokeWidth = strokeWidth || 5;
  const r = (size - strokeWidth) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, percent));
  const offset = c * (1 - pct/100);
  return `<div class="ring-wrap" style="width:${size}px; height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${trackColor}" stroke-width="${strokeWidth}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
    </svg>
    <span class="ring-label" style="font-size:${Math.round(size*0.24)}px; color:${color};">${pct}%</span>
  </div>`;
}

function pickGreeting(p, dueCount){
  const priorityTheme = {grammar:'grammar', vocab:'vocab', listening:'speaking', speaking:'speaking'}[p.priorityArea];
  const eligible = GREETINGS.filter(g=>{
    if(g.theme==='general' || g.theme==='story') return true;
    if(g.theme==='review') return dueCount>0;
    return g.theme===priorityTheme;
  });
  const bucket = Math.floor(Date.now()/(10*60*1000));
  const g = eligible[bucket % eligible.length];
  return L(g.en,g.tr,g.fa,g.es).replace('{name}', '<bdi>'+esc(p.name)+'</bdi>');
}

    grammar:{ic:ICONS.dumbbell, c:'gram', label:L('Grammar','Dilbilgisi','گرامر','Gramática')},

function renderGoalLevelDetail(goal, level){
  const g = GOALS_META[goal];
  const tab = g.tabs.includes(state.viewParams.tab) ? state.viewParams.tab : 'grammar';
  const gItems = GRAMMAR_ITEMS.filter(x=>x.level===level);
  const vTagged = VOCAB_SETS.filter(s=>s.level===level && s.category==='vocab' && s.goals.includes(goal));
  const vShown = vTagged.length ? vTagged : VOCAB_SETS.filter(s=>s.level===level && s.category==='vocab');
  const slTagged = VOCAB_SETS.filter(s=>s.level===level && s.category==='slang' && s.goals.includes(goal));
  const slShown = slTagged.length ? slTagged : VOCAB_SETS.filter(s=>s.level===level && s.category==='slang');
  const setRow = (s, ic, tint) => {
    const done = state.progress.completedVocabSets.includes(s.id);
    return `<button class="item-row" data-action="nav" data-view="vocab-set" data-id="${s.id}" data-goal="${goal}">
      <span class="item-ic" style="background:var(--cat-${tint}-soft); color:var(--cat-${tint});">${ic}</span>
      <div class="item-body"><div class="item-title">${esc(setTitle(s))}</div></div>
      ${done ? `<span class="pill badge-done">${ICONS.check}</span>` : `<span class="chevron">${ICONS.chev}</span>`}
    </button>`;
  };
  return `<div class="fade-in">
    ${sectionHead(goalMetaLabel(goal)+' · '+level, L('Everything in this level, focused on your goal.','Bu seviyedeki her şey hedefine göre.','هر چیزی در این سطح، متمرکز بر هدف تو.','Todo lo de este nivel, enfocado en tu meta.'))}
    <div class="screen" style="padding-top:0;">
      <div class="tab-row">
        ${g.tabs.map(t=>`<button class="tab-btn ${tab===t?'active':''}" data-action="set-goal-tab" data-tab="${t}">${tabLabel(t)}</button>`).join('')}
      </div>
      ${tab==='grammar' ? `<div class="stack" style="gap:8px;">
        ${gItems.map(t=>{
          const done = state.progress.completedTraps.includes(t.id);
          return `<button class="item-row" data-action="nav" data-view="grammar-trap" data-id="${t.id}" data-goal="${goal}">
            <span class="item-ic" style="background:var(--cat-gram-soft); color:var(--cat-gram);">${ICONS.dumbbell}</span>
            <div class="item-body"><div class="item-title">${esc(grammarTitle(t))}</div></div>
            ${done ? `<span class="pill badge-done">${ICONS.check}</span>` : `<span class="chevron">${ICONS.chev}</span>`}
          </button>`;
        }).join('')}
      </div>` : ''}
      ${tab==='vocab' ? `<div class="stack" style="gap:8px;">${vShown.map(s=>setRow(s, ICONS.cards, 'voc')).join('')}</div>` : ''}
      ${tab==='slang' ? `<div class="stack" style="gap:8px;">${slShown.map(s=>setRow(s, ICONS.cards, 'lis')).join('')}</div>` : ''}
      ${tab==='strategy' ? `<div class="stack" style="gap:10px;">
        ${EXAM_STRATEGY.map(c=>`<div class="card-flat">
          <div class="row" style="gap:10px; align-items:flex-start;">
            <span class="item-ic" style="background:var(--cat-diag-soft); color:var(--cat-diag); flex:0 0 auto;">${ICONS[c.icon]}</span>
            <div>
              <div class="item-title">${esc(L(c.title.en,c.title.tr,c.title.fa,c.title.es))}</div>
              <p style="font-size:13px; color:var(--ink-soft); margin-top:4px;">${esc(L(c.body.en,c.body.tr,c.body.fa,c.body.es))}</p>
            </div>
          </div>
        </div>`).join('')}
      </div>` : ''}
      ${tab==='culture' ? `<div class="stack" style="gap:12px;">
        ${IMMIGRATION_CULTURE.map(c=>`<div class="card-flat">
          <div class="item-title">${esc(L(c.country.en,c.country.tr,c.country.fa,c.country.es))}</div>

            ${c.tips.map(tip=>`<li style="font-size:13px; color:var(--ink-soft); margin-bottom:6px;">${esc(L(tip.en,tip.tr,tip.fa,tip.es))}</li>`).join('')}
          </ul>
        </div>`).join('')}
      </div>` : ''}
    </div>
  </div>`;
}

function buildPracticeRound(goal, level, difficulty){
  const vPoolAll = VOCAB_SETS.filter(s=>s.level===level && s.category==='vocab');
  const slPoolAll = VOCAB_SETS.filter(s=>s.level===level && s.category==='slang');
  const gPoolAll = GRAMMAR_ITEMS.filter(g=>g.level===level);
  const vTagged = vPoolAll.filter(s=>s.goals.includes(goal));
  const slTagged = slPoolAll.filter(s=>s.goals.includes(goal));
  const vSets = vTagged.length ? vTagged : vPoolAll;
  const slSets = slTagged.length ? slTagged : slPoolAll;
  const flattenCards = sets => sets.reduce((acc,s)=>acc.concat(s.cards), []);
  const vCards = flattenCards(vSets);
  const slCards = flattenCards(slSets);
  const pick = (arr, n) => {
    const pool = arr.slice(), out = [];
    while(out.length < n && pool.length) out.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
    return out;
  };
  const wordCount = difficulty==='easy' ? 1 : difficulty==='medium' ? 2 : 3;
  const words = pick(vCards, wordCount).map(c=>({
    word: c.word,
    meaning: L(c.meaning.en, c.meaning.tr, c.meaning.fa, c.meaning.es),
    note: c.note ? L(c.note.en, c.note.tr, c.note.fa, c.note.es) : null,
    sentence: c.sentence || null
  }));
  let grammar = null;
  if(difficulty !== 'easy' && gPoolAll.length){
    const withVariant = gPoolAll.filter(g=>g.goalVariant && g.goalVariant[goal]);
    const gSource = withVariant.length ? withVariant : gPoolAll;
    const gItem = gSource[Math.floor(Math.random()*gSource.length)];
    grammar = {title: grammarTitle(gItem), markerWord: gItem.blank.word, exp: L(gItem.exp.en, gItem.exp.tr, gItem.exp.fa, gItem.exp.es)};
  }
  let slang = null;
  if(difficulty === 'difficult' && slCards.length){
    const s = pick(slCards, 1)[0];
    slang = {word: s.word, meaning: L(s.meaning.en, s.meaning.tr, s.meaning.fa, s.meaning.es)};
  }
  const minWords = difficulty==='easy' ? 4 : difficulty==='medium' ? 12 : 30;
  const minSentences = difficulty==='easy' ? 1 : difficulty==='medium' ? 2 : 3;
  const topicPool = (PRACTICE_TOPICS[goal] && PRACTICE_TOPICS[goal][difficulty]) || [];
  const topicItem = topicPool.length ? topicPool[Math.floor(Math.random()*topicPool.length)] : null;
  const topic = topicItem ? L(topicItem.en, topicItem.tr, topicItem.fa, topicItem.es) : null;
  return {difficulty, goal, level, words, grammar, slang, minWords, minSentences, topic};
}

function looksLikeRealWord(w){

  if(w.length<=2) return SHORT_WORD_WHITELIST.has(w);
  if(w.length>16) return false;
  if(!/[aeiouyáéíóúü]/i.test(w)) return false;
  if(/[^aeiouáéíóúü]{4,}/i.test(w)) return false;
  if(/(.)\1{2,}/i.test(w)) return false;
  if(/^(qwert|werty|asdf|sdfg|zxcv|xcvb|jklm|hjkl|wasd)/i.test(w)) return false;
  return true;
}
function checkTextLooksReal(text, extraWords){

    if(COMMON_SPANISH_WORDS.has(t) || COMMON_SPANISH_WORDS.has(stem) || known.has(t) || looksLikeRealWord(t)) recognized++;
    if(SUBJECT_WORDS.has(t)) hasSubject = true;
    if(COMMON_VERBS.has(t) || COMMON_VERBS.has(stem)) hasVerb = true;
    freq[t] = (freq[t]||0)+1;
  });

  const maxFreq = Math.max.apply(null, Object.values(freq));
  const tooRepetitive = tokens.length>=5 && (maxFreq/tokens.length) > 0.35;

function grammarUsedInContext(text, markerWord){
  const marker = markerWord.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re = new RegExp('\\b'+marker+'\\b','i');
  return text.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean).some(s=>{
    if(!re.test(s)) return false;
    return s.split(/\s+/).filter(Boolean).length >= 3;
  });
}
function checkPracticeAnswer(round, text){
  const clean = (text||'').trim();
  const lower = clean.toLowerCase();
  const wordsHit = [], wordsMissed = [];
  round.words.forEach(w=>{
    const escaped = w.word.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
    const wholePattern = new RegExp('\\b'+escaped+'\\w*','i');
    const firstWord = w.word.toLowerCase().split(' ')[0];
    // Spanish verbs are stored in the infinitive (e.g. "trabajar") but students naturally
    // conjugate them ("trabajo", "trabaja") — match on the verb stem, not just the infinitive.
    const verbStem = /^(.{2,}?)(ar|er|ir)$/.exec(firstWord);
    const stems = [stemWord(firstWord)];
    if(verbStem) stems.push(verbStem[1]);
    const stemPatterns = stems.map(s=>new RegExp('\\b'+s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*','i'));
    if(wholePattern.test(lower) || stemPatterns.some(re=>re.test(lower))) wordsHit.push(w.word);
    else wordsMissed.push(w.word);
  });
  const wc = clean ? clean.split(/\s+/).filter(Boolean).length : 0;
  const sc = clean.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean).length;
  const lengthOk = wc >= round.minWords && sc >= round.minSentences;
  const grammarSpotted = round.grammar ? grammarUsedInContext(clean, round.grammar.markerWord) : null;
  const slangSpotted = round.slang ? lower.includes(round.slang.word.toLowerCase()) : null;
  const extraKnownWords = round.words.map(w=>w.word).concat(round.grammar?[round.grammar.markerWord]:[]).concat(round.slang?[round.slang.word]:[]);
  const realCheck = checkTextLooksReal(clean, extraKnownWords.join(' ').split(/\s+/));
  const looksReal = clean.length ? realCheck.isReal : false;
  const hasStructure = clean.length ? realCheck.hasStructure : false;

  const weights = round.difficulty==='easy' ? {vocab:70, length:30, grammar:0, slang:0}
    : round.difficulty==='medium' ? {vocab:50, length:30, grammar:20, slang:0}
    : {vocab:40, length:20, grammar:20, slang:20};
  const vocabPct = round.words.length ? wordsHit.length/round.words.length : 1;
  const wcPct = round.minWords ? Math.min(wc/round.minWords, 1) : 1;
  const scPct = round.minSentences ? Math.min(sc/round.minSentences, 1) : 1;
  const lengthPct = (wcPct+scPct)/2;
  let score = vocabPct*weights.vocab + lengthPct*weights.length;
  if(weights.grammar) score += (grammarSpotted ? 1 : 0)*weights.grammar;
  if(weights.slang) score += (slangSpotted ? 1 : 0)*weights.slang;
  score = Math.max(0, Math.min(100, Math.round(score)));
  if(!looksReal) score = Math.min(score, 15);
  else if(!hasStructure) score = Math.min(score, 40);

  return {wordsHit, wordsMissed, wc, sc, lengthOk, grammarSpotted, slangSpotted, looksReal, hasStructure, score, passed: score>=60 && looksReal && hasStructure};
}

  if(result.lengthOk){
    lines.push({ok:true, text: L(
      `Good length — ${result.wc} words across ${result.sc} sentence${result.sc>1?'s':''}.`,
      `İyi bir uzunluk — ${result.sc} cümlede ${result.wc} kelime.`,
      `طول خوبی داشت — ${result.wc} کلمه در ${result.sc} جمله.`,
      `Buena extensión — ${result.wc} palabras en ${result.sc} oración${result.sc>1?'es':''}.`
    )});
  } else {
    lines.push({ok:false, text: L(
      `Add more detail — you wrote ${result.wc} word${result.wc===1?'':'s'} in ${result.sc} sentence${result.sc===1?'':'s'}; aim for at least ${round.minWords} words across ${round.minSentences}+ sentences.`,
      `Daha fazla detay ekle — ${result.sc} cümlede ${result.wc} kelime yazdın; en az ${round.minWords} kelime ve ${round.minSentences}+ cümle hedefle.`,
      `جزئیات بیشتری اضافه کن — ${result.wc} کلمه در ${result.sc} جمله نوشتی؛ حداقل ${round.minWords} کلمه و ${round.minSentences}+ جمله هدف بگیر.`,
      `Añade más detalle — escribiste ${result.wc} palabra${result.wc===1?'':'s'} en ${result.sc} oración${result.sc===1?'':'es'}; apunta a al menos ${round.minWords} palabras en ${round.minSentences}+ oraciones.`
    )});
  }
  if(round.grammar){
    if(result.grammarSpotted){
      lines.push({ok:true, text: L(
        `Nice — you used "${round.grammar.title}".`,
        `Harika — "${round.grammar.title}" yapısını kullandın.`,
        `عالی — از «${round.grammar.title}» استفاده کردی.`,
        `Bien — usaste "${round.grammar.title}".`
      )});
    } else {
      lines.push({ok:false, text: L(
        `Bonus: weave in "${round.grammar.title}" for extra polish — ${round.grammar.exp}`,
        `Bonus: daha parlak olması için "${round.grammar.title}" yapısını ekle — ${round.grammar.exp}`,
        `امتیاز اضافه: «${round.grammar.title}» را هم اضافه کن — ${round.grammar.exp}`,
        `Extra: incluye "${round.grammar.title}" para un toque más pulido — ${round.grammar.exp}`
      )});
    }
  }
  if(round.slang){
    if(result.slangSpotted){
      lines.push({ok:true, text: L(
        `Great — you used the slang "${round.slang.word}"!`,
        `Harika — "${round.slang.word}" argosunu kullandın!`,
        `عالی — از اصطلاح «${round.slang.word}» استفاده کردی!`,
        `¡Genial — usaste el argot "${round.slang.word}"!`
      )});
    } else {
      lines.push({ok:false, text: L(
        `Bonus: try the slang "${round.slang.word}" (${round.slang.meaning}) next time.`,
        `Bonus: bir dahaki sefere "${round.slang.word}" argosunu dene (${round.slang.meaning}).`,
        `امتیاز اضافه: دفعه بعد اصطلاح «${round.slang.word}» را امتحان کن (${round.slang.meaning}).`,
        `Extra: prueba el argot "${round.slang.word}" (${round.slang.meaning}) la próxima vez.`
      )});
    }
  }
  if(result.wordsMissed.length===0){
    const bonus = round.words.find(w=>w.note);
    if(bonus) lines.push({ok:true, text: L('Bonus tip: ','Bonus ipucu: ','نکته اضافه: ','Consejo extra: ') + bonus.note});
  }
  return lines;
}

let studioRecognition = null;
function studioSpeechSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function stopStudioMic(){
  if(studioRecognition){ try{ studioRecognition.onend = null; studioRecognition.stop(); }catch(e){} studioRecognition = null; }
}
function toggleStudioMic(){
  if(studioRecognition){ studioRecognition.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
  let finalText = state.viewParams.transcript || '';
  studioRecognition = rec;
  render();
  rec.onresult = (e)=>{
    let interim = '';
    for(let i=e.resultIndex; i<e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) finalText += (finalText ? ' ' : '') + r[0].transcript.trim();
      else interim += r[0].transcript;
    }
    const ta = document.getElementById('studio-answer-input');
    if(ta) ta.value = (finalText + ' ' + interim).trim();
  };
  rec.onerror = ()=>{ studioRecognition = null; render(); };
  rec.onend = ()=>{
    studioRecognition = null;
    state.viewParams.transcript = finalText.trim();
    save(); render();
  };
  rec.start();
}

/* ============================= QUIZ ENGINE (shared) ============================= */
function grammarQuizQuestions(item){
  const why = L(item.exp.en, item.exp.tr, item.exp.fa, item.exp.es);
  const pickLabel = L('Which sentence is correct?','Hangi cümle doğru?','کدام جمله درست است؟','¿Qué oración es correcta?');
  const pickQ = (right, wrong) => { const opts = shuffle([right, wrong]); return {prompt:pickLabel, options:opts, correct:opts.indexOf(right), why}; };
  const fillQ = (blank) => { const opts = shuffle([blank.word, ...blank.distractors]); return {prompt:blank.sentence, options:opts, correct:opts.indexOf(blank.word), why}; };
  const tfLabel = L('True or false: this sentence is correct.','Doğru mu yanlış mı: bu cümle doğru.','درست یا نادرست: این جمله درست است.','Verdadero o falso: esta oración es correcta.');
  const tfQ = (sentence, isCorrect) => { const opts = shuffle([L('True','Doğru','درست','Verdadero'), L('False','Yanlış','نادرست','Falso')]); const answer = isCorrect ? L('True','Doğru','درست','Verdadero') : L('False','Yanlış','نادرست','Falso'); return {prompt:tfLabel+'\n"'+sentence+'"', options:opts, correct:opts.indexOf(answer), why}; };
  return shuffle([
    pickQ(item.right, item.wrong),
    pickQ(item.right2, item.wrong2),
    pickQ(item.right, item.wrong2),
    pickQ(item.right2, item.wrong),
    fillQ(item.blank),
    fillQ(item.blank2),
    tfQ(item.right, true),
    tfQ(item.wrong2, false),
    tfQ(item.right2, true),
    tfQ(item.wrong, false)
  ]).slice(0, 8);
}
function vocabQuizQuestions(s){
  const sibling = VOCAB_SETS.filter(x=>x.level===s.level && x.category===s.category).flatMap(x=>x.cards);
  const blankOf = (c) => {
    const re = new RegExp(c.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
    return c.sentence.replace(re, '_____');
  };
  const fillQ = (c) => {
    const pool = sibling.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
    const distractors = shuffle(pool).slice(0,3).map(x=>x.word);
    const options = shuffle([c.word, ...distractors]);
    return {prompt: blankOf(c), options, correct: options.indexOf(c.word)};
  };
  const reverseLabel = L('Which sentence uses this word?','Bu kelimeyi hangi cümle kullanıyor?','کدام جمله از این کلمه استفاده می‌کند؟','¿Qué oración usa esta palabra?');
  const reverseQ = (c) => {
    const others = s.cards.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
    const pool = others.length>=2 ? others : sibling.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
    const distractorCards = shuffle(pool).slice(0,2);
    const correctOpt = blankOf(c);
    const options = shuffle([correctOpt, ...distractorCards.map(blankOf)]);
    return {prompt: reverseLabel + '\n"' + c.word + '"', options, correct: options.indexOf(correctOpt)};
  };
  const tfLabel = L('True or false: this word fits the sentence.','Doğru mu yanlış mı: bu kelime cümleye uyuyor.','درست یا نادرست: این کلمه با جمله مطابقت دارد.','Verdadero o falso: esta palabra encaja en la oración.');
  const tfQ = (c, i) => {
    const isTrue = i % 2 === 0;
    let filled;
    if(isTrue){
      filled = c.sentence;
    } else {
      const sameSet = s.cards.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
      const pool = sameSet.length ? sameSet : sibling.filter(x=>x.word.toLowerCase()!==c.word.toLowerCase());
      const wrongCard = shuffle(pool)[0];
      filled = blankOf(c).replace('_____', wrongCard.word);
    }
    const opts = shuffle([L('True','Doğru','درست','Verdadero'), L('False','Yanlış','نادرست','Falso')]);
    const answer = isTrue ? L('True','Doğru','درست','Verdadero') : L('False','Yanlış','نادرست','Falso');
    return {prompt: tfLabel+'\n"'+filled+'"', options: opts, correct: opts.indexOf(answer)};
  };
  const all = [...s.cards.map(fillQ), ...s.cards.map(reverseQ), ...s.cards.map(tfQ)];
  return shuffle(all).slice(0, Math.min(3*s.cards.length, 24));
}
function storyQuizQuestions(s){ return s.quiz.slice(); }
function buildReviewQuiz(){
  const due = dueItems().slice(0, 5);
  const mixed = [];
  due.forEach(id=>{
    const entry = state.progress.srs[id];
    let source, generator;
    if(entry.kind==='grammar'){ source = GRAMMAR_ITEMS.find(x=>x.id===id); generator = grammarQuizQuestions; }
    else if(entry.kind==='vocab'){ source = VOCAB_SETS.find(x=>x.id===id); generator = vocabQuizQuestions; }
    else if(entry.kind==='story'){ source = STORY_LIBRARY.find(x=>x.id===id); generator = storyQuizQuestions; }
    if(!source) return;
    const qs = generator(source).slice(0, 3);
    qs.forEach(q=>{ q.itemId = id; q.kind = entry.kind; });
    mixed.push(...qs);
  });
  return shuffle(mixed);
}

function startQuiz(kind, contextId, questions, backView, backParams){
  questions.forEach(qq=>{ if(qq.itemId===undefined){ qq.itemId = contextId; qq.kind = kind; } });
  const timeLimit = questionTimeLimit(questions[0]);
  state.quiz = {kind, contextId, questions, index:0, correct:0, answered:false, selected:null, results:[], backView, backParams: backParams || {}, timeLimit, deadline: Date.now()+timeLimit*1000, lastTickSecond:null};
  go('quiz');
}
function handleQuizTimeout(){
  const q = state.quiz;
  if(!q || q.answered) return;
  if(!q.results) q.results = [];
  q.answered = true; q.selected = -1;
  q.results[q.index] = false;
  save(); render();
}
let quizTimerInterval = setInterval(function(){
  const q = state.quiz;
  if(state.view !== 'quiz' || !q || q.answered || !q.deadline) return;
  const remainingMs = q.deadline - Date.now();
  const remaining = Math.max(remainingMs/1000, 0);
  const fillEl = document.getElementById('quiz-timer-fill');
  const textEl = document.getElementById('quiz-timer-text');
  if(fillEl) fillEl.style.width = Math.max((remaining/q.timeLimit)*100, 0)+'%';
  if(textEl) textEl.textContent = Math.ceil(remaining);
  const wholeSecond = Math.ceil(remaining);
  if(wholeSecond !== q.lastTickSecond && wholeSecond > 0){
    q.lastTickSecond = wholeSecond;
    playTick(q.timeLimit - wholeSecond, q.timeLimit);
  }
  if(remainingMs <= 0){
    handleQuizTimeout();
  }
}, 100);

/* Builds a Bach-Prelude-style broken-chord arpeggio (root,3rd,5th,8ve,3rd,5th,8ve,3rd)
   for each chord in a progression — this is literally how BWV 846 is constructed,
   just with a representative (not note-for-note transcribed) chord sequence. */
function arpeggiateProgression(chordNames, beats){
  const out = [];
  chordNames.forEach(name=>{
    const t = CHORDS[name];
    [0,1,2,3,1,2,3,1].forEach(i=>out.push([t[i], beats]));
  });
  return out;
}
/* Repeats a phrase/cycle until it covers at least minBeats worth of music, so the
   exact duration is guaranteed at runtime regardless of how the source cycle is
   written (rather than hand-computing a repeat count, which is easy to get wrong). */
function repeatToBeats(cycle, minBeats){
  const cycleBeats = cycle.reduce((s,n)=>s+n[1], 0);
  const reps = Math.max(1, Math.ceil(minBeats / cycleBeats));
  let out = [];
  for(let i=0;i<reps;i++) out = out.concat(cycle);
  return out;
}

function ensureReverbBus(){
  if(reverbSend || !audioCtx) return;
  const t = audioCtx.currentTime;
  const delay = audioCtx.createDelay(1.0);
  delay.delayTime.setValueAtTime(0.24, t);
  const feedback = audioCtx.createGain();
  feedback.gain.setValueAtTime(0.32, t);
  const damp = audioCtx.createBiquadFilter();
  damp.type = 'lowpass';
  damp.frequency.setValueAtTime(2200, t);
  const wet = audioCtx.createGain();
  wet.gain.setValueAtTime(0.28, t);
  delay.connect(damp); damp.connect(feedback); feedback.connect(delay);
  delay.connect(wet); wet.connect(audioCtx.destination);
  reverbSend = delay;
}
/* Ambient background texture per genre — rain, brown noise, or a fireplace —
   layered quietly under the piano melody. All synthesized from noise buffers,
   no audio files needed. */
const GENRE_TEXTURE = { Fiction:'rain', Adventure:'brown', Romance:'fireplace', Thriller:'brown', Documentary:'fireplace' };
const GENRE_TEXTURE_ONLY = { Documentary:true };
let textureNodes = null;
let textureTimer = null;
function createNoiseBuffer(seconds, brown){
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * seconds));
  const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  if(brown){
    let last = 0;
    for(let i=0;i<len;i++){
      const white = Math.random()*2-1;
      last += 0.02*white;
      if(last > 1) last = 1; if(last < -1) last = -1;
      data[i] = last*3.2;
    }
  } else {
    for(let i=0;i<len;i++) data[i] = Math.random()*2-1;
  }
  return buffer;
}
function scheduleTextureDetail(kind){
  if(!audioCtx || storyMusicMuted || !textureNodes) return;
  const t = audioCtx.currentTime + 0.02;
  let dur, filt, freqLo, freqHi, peak;
  if(kind === 'rain'){
    dur = 0.15 + Math.random()*0.1;
    filt = audioCtx.createBiquadFilter(); filt.type = 'bandpass';
    filt.frequency.setValueAtTime(2500 + Math.random()*2000, t); filt.Q.setValueAtTime(3, t);
    peak = 0.05 + Math.random()*0.03;
  } else {
    dur = 0.06 + Math.random()*0.05;
    filt = audioCtx.createBiquadFilter(); filt.type = 'highpass';
    filt.frequency.setValueAtTime(1800, t);
    peak = 0.06 + Math.random()*0.05;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = createNoiseBuffer(dur, false);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
  src.start(t); src.stop(t + dur + 0.05);
  const nextIn = kind === 'rain' ? (150 + Math.random()*250) : (900 + Math.random()*2200);
  textureTimer = setTimeout(()=>scheduleTextureDetail(kind), nextIn);
}
function stopTexture(){
  if(textureTimer){ clearTimeout(textureTimer); textureTimer = null; }
  const nodes = textureNodes;
  textureNodes = null;
  if(!nodes || !audioCtx) return;
  try{
    const t = audioCtx.currentTime;
    nodes.layers.forEach(layer=>{
      layer.gain.gain.cancelScheduledValues(t);
      layer.gain.gain.setValueAtTime(layer.gain.gain.value, t);
      layer.gain.gain.linearRampToValueAtTime(0.0001, t + 0.8);
    });
    setTimeout(()=>{ nodes.layers.forEach(layer=>{ try{ layer.src.stop(); }catch(e){} }); }, 900);
    if(nodes.flickerTimer) clearInterval(nodes.flickerTimer);
  }catch(e){}
}
function makeLoopedNoiseLayer(t, brown, filterType, filterFreq, targetGain, fadeIn){
  const src = audioCtx.createBufferSource();
  src.buffer = createNoiseBuffer(4, brown);
  src.loop = true;
  const filt = audioCtx.createBiquadFilter();
  filt.type = filterType;
  filt.frequency.setValueAtTime(filterFreq, t);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(targetGain, t + fadeIn);
  src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
  src.start(t);
  return {src, gain};
}

      const wobble = 0.03 + Math.random()*0.03;
      flame.gain.gain.cancelScheduledValues(ft);
      flame.gain.gain.setValueAtTime(flame.gain.gain.value, ft);
      flame.gain.gain.linearRampToValueAtTime(wobble, ft + 0.25 + Math.random()*0.3);
    }, 350);
  } else {
    layers.push(makeLoopedNoiseLayer(t, true, 'lowpass', 900, 0.09, 2.5));
  }
  textureNodes = {layers, flickerTimer};
  if(kind === 'rain' || kind === 'fireplace') scheduleTextureDetail(kind);
}
function playSoftNote(cfg, freq, t, dur){
  const filt = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(cfg.cutoff, t);
  filt.Q.setValueAtTime(0.6, t);
  const peak = 0.15 * (0.9 + Math.random()*0.2);
  gain.gain.setValueAtTime(0.0001, t);
  const extraOscs = [];
  if(cfg.char === 'bowed'){
    // slow bow-like swell + vibrato, violin-ish
    gain.gain.exponentialRampToValueAtTime(peak, t + 0.4);
    gain.gain.setTargetAtTime(0.0001, t + dur*0.4, dur*0.4);
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.setValueAtTime(5.2, t);
    lfoGain.gain.setValueAtTime(freq*0.006, t);
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    lfo.start(t); lfo.stop(t + dur);
    osc.connect(filt);
    osc.start(t); osc.stop(t + dur);
    extraOscs.push(osc, lfo);
  } else {
    // soft mallet/pluck attack + natural decay, extended past the note's own
    // rhythmic slot so it overlaps the next note (legato) instead of a dry blip —
    // piano / hang-drum-like, with a quiet octave overtone for warmth
    gain.gain.exponentialRampToValueAtTime(peak, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    osc.connect(filt);
    osc.start(t); osc.stop(t + dur);
    extraOscs.push(osc);
    const overtoneGain = audioCtx.createGain();
    overtoneGain.gain.setValueAtTime(0.3, t);
    const overtone = audioCtx.createOscillator();
    overtone.type = 'sine';
    overtone.frequency.setValueAtTime(freq*2, t);
    overtone.connect(overtoneGain); overtoneGain.connect(filt);
    overtone.start(t); overtone.stop(t + dur);
    extraOscs.push(overtone);
  }
  filt.connect(gain); gain.connect(audioCtx.destination);
  if(reverbSend) gain.connect(reverbSend);
  return {oscs: extraOscs, gain};
}
function scheduleNextNote(){
  if(!audioCtx || storyMusicMuted || !storyMusicCfg) return;
  const cfg = storyMusicCfg;
  const step = cfg.seq[storyMusicStep % cfg.seq.length];
  const freq = NOTE_FREQ[step[0]], beats = step[1];
  const t = audioCtx.currentTime + 0.05 + (Math.random()-0.5)*0.02;
  const dur = beats * cfg.tempo * 1.7;
  const played = playSoftNote(cfg, freq, t, dur);
  if(storyMusicNodes){
    storyMusicNodes.oscs.push(...played.oscs);
    storyMusicNodes.gains.push(played.gain);
  }
  storyMusicStep++;
  let waitBeats = beats;
  if(storyMusicStep % cfg.seq.length === 0) waitBeats += 1.5;
  storyMusicTimer = setTimeout(scheduleNextNote, waitBeats * cfg.tempo * 1000);
}
function stopStoryMusic(){
  if(storyMusicTimer){ clearTimeout(storyMusicTimer); storyMusicTimer = null; }
  storyMusicCfg = null;
  stopTexture();
  const nodes = storyMusicNodes;
  storyMusicNodes = null;
  if(!nodes || !audioCtx) return;
  try{
    const t = audioCtx.currentTime;
    nodes.gains.forEach(g=>{
      try{
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(g.gain.value, t);
        g.gain.linearRampToValueAtTime(0.0001, t + 0.4);
      }catch(e){}
    });
    setTimeout(()=>{ nodes.oscs.forEach(o=>{ try{ o.stop(); }catch(e){} }); }, 500);
  }catch(e){}
}
function startStoryMusic(genre){
  stopStoryMusic();
  if(storyMusicMuted) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    ensureReverbBus();
    startTexture(genre);
    if(!GENRE_TEXTURE_ONLY[genre]){
      storyMusicCfg = GENRE_MELODY[genre] || GENRE_MELODY.Fiction;
      storyMusicStep = 0;
      storyMusicNodes = {oscs:[], gains:[]};
      scheduleNextNote();
    }
  }catch(e){}
}
function playClickSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(760, t);
    osc.frequency.exponentialRampToValueAtTime(420, t + 0.08);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.16, t + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.11);
  }catch(e){}
}
function playTick(elapsed, total){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const progress = Math.min(Math.max(elapsed/total, 0), 1);
    const freq = 520 + progress*520;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.09, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.08);
  }catch(e){}
}
function bindEvents(root){
  root.onclick = function(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    const handler = HANDLERS[action];
    if(handler){ playClickSound(); handler(el, e); }
  };
}

    go('diagnostic-intro');

  'toggle-roadmap-item'(el){
    const idx = el.dataset.idx;
    const rc = state.progress.roadmapChecked;
    rc[idx] = !rc[idx];
    const roadmap = buildRoadmap(state.profile);
    const allDone = roadmap.every((_,i)=>rc[i]);

        const li = LEVELS.indexOf(state.profile.level);

        state.profile.levelStage = 1;
      } else {
        state.profile.levelStage = 2;
      }
      state.progress.roadmapChecked = {};
    }
    save(); render();
  },
  'toggle-daily-task'(el){
    const id = el.dataset.id;
    const dc = state.progress.dailyTasksChecked;
    dc[id] = !dc[id];
    save(); render();
  },
  'reset-all'(){
    if(!resetConfirmPending){ resetConfirmPending = true; render(); return; }
    resetConfirmPending = false;

    state = freshState();
    LANG = lang;
    save();
    render();
  },
  'open-settings'(){ go('settings'); },
  'nav'(el){
    const view = el.dataset.view;
    const params = {id: el.dataset.id};
    if(view==='grammar-list' || view==='grammar-trap') params.level = state.viewParams.level || state.profile.level;
    if(view==='vocab-list' || view==='vocab-set'){ params.level = state.viewParams.level || state.profile.level; params.cat = el.dataset.cat || state.viewParams.cat || 'vocab'; }

  'set-level'(el){ state.viewParams.level = el.dataset.level; save(); render(); },
  'set-cat'(el){ state.viewParams.cat = el.dataset.cat; save(); render(); },
  'set-goal-tab'(el){ state.viewParams.tab = el.dataset.tab; save(); render(); },
  'set-story-genre'(el){ state.viewParams.genre = el.dataset.genre; save(); render(); },
  'toggle-edit-goals'(){ state.viewParams.editingGoals = !state.viewParams.editingGoals; render(); },

  'studio-pick-goal'(el){ state.viewParams.goal = el.dataset.goal; render(); },
  'studio-pick-difficulty'(el){ state.viewParams.difficulty = el.dataset.difficulty; render(); },
  'studio-start-round'(){

  'studio-new-round'(){

    save(); render();
  },
  'studio-change-difficulty'(){
    stopStudioMic();
    const vp = state.viewParams;
    go('studio-setup', {mode: vp.mode, goal: vp.goal, difficulty: null});
  },
  'studio-check-answer'(){
    const vp = state.viewParams;
    const ta = document.getElementById('studio-answer-input');
    const text = ta ? ta.value : (vp.transcript || '');

    vp.transcript = text; vp.checked = true; vp.result = result;
    if(result.passed){
      const key = vp.mode==='writing' ? 'writingRoundsDone' : 'speakingRoundsDone';
      state.progress[key] = (state.progress[key]||0) + 1;
    }
    save();
    if(result.passed) checkBadges();
    render();

  'studio-mic-toggle'(){ toggleStudioMic(); },

  'start-grammar-quiz'(el){
    const t = GRAMMAR_ITEMS.find(x=>x.id===el.dataset.id);
    const goal = state.viewParams.goal;
    const variant = goal && t.goalVariant && t.goalVariant[goal];
    const effective = variant ? Object.assign({}, t, variant) : t;
    const backView = goal ? 'goal-level-detail' : 'grammar-list';
    const backParams = goal ? {goal, level: state.viewParams.level, tab:'grammar'} : {level: state.viewParams.level};
    startQuiz('grammar', t.id, grammarQuizQuestions(effective), backView, backParams);

    const backParams = goal ? {goal, level: state.viewParams.level, tab: state.viewParams.cat==='slang'?'slang':'vocab'} : {level: state.viewParams.level, cat: state.viewParams.cat};
    startQuiz('vocab', s.id, vocabQuizQuestions(s), backView, backParams);

  'start-story-quiz'(el){
    const s = STORY_LIBRARY.find(x=>x.id===el.dataset.id);
    startQuiz('story', s.id, s.quiz, 'story-list', {level: state.viewParams.level});
  },
  'start-review'(){
    const mixed = buildReviewQuiz();
    if(!mixed.length) return;
    startQuiz('review', null, mixed, 'dashboard', {});
  },
  'quiz-answer'(el){
    const q = state.quiz, i = +el.dataset.i;
    if(q.answered) return;
    if(!q.results) q.results = [];
    q.answered = true; q.selected = i;
    const isCorrect = i === q.questions[q.index].correct;
    if(isCorrect) q.correct++;
    q.results[q.index] = isCorrect;
    save(); render();
  },
  'quiz-next'(){
    const q = state.quiz;
    q.index++; q.answered = false; q.selected = null;
    if(q.index < q.questions.length){
      q.timeLimit = questionTimeLimit(q.questions[q.index]);
      q.deadline = Date.now() + q.timeLimit*1000;
      q.lastTickSecond = null;
    }
    if(q.index >= q.questions.length){
      if(q.contextId){
        const arr = progressArrForKind(q.kind);
        if(!arr.includes(q.contextId)) arr.push(q.contextId);
        updateSRS(q.contextId, q.kind, q.correct/q.questions.length);
      } else {
        const byItem = {};
        q.questions.forEach((qq,idx)=>{
          const id = qq.itemId, kind = qq.kind;
          if(!byItem[id]) byItem[id] = {kind, correct:0, total:0};
          byItem[id].total++;
          if(q.results[idx]) byItem[id].correct++;
        });
        Object.keys(byItem).forEach(id=>{
          const {kind, correct, total} = byItem[id];
          const arr = progressArrForKind(kind);
          if(!arr.includes(id)) arr.push(id);
          updateSRS(id, kind, correct/total);
        });
        state.progress.reviewsCompleted = (state.progress.reviewsCompleted||0) + 1;
      }
      markActivity();
    }
    save(); render();
