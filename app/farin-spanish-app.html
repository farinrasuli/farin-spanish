    const lfoGain = audioCtx.createGain();
    lfo.frequency.setValueAtTime(5.2, t);
    lfoGain.gain.setValueAtTime(freq*0.006, t);
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    lfo.start(t); lfo.stop(t + dur);
    osc.connect(filt);
    osc.start(t); osc.stop(t + dur);
    extraOscs.push(osc, lfo);
  } else {
    // soft mallet/pluck attack + natural decay, extended past the note's own
    // rhythmic slot so it overlaps the next note (legato) instead of a dry blip —
    // piano / hang-drum-like, with a quiet octave overtone for warmth
    gain.gain.exponentialRampToValueAtTime(peak, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    osc.connect(filt);
    osc.start(t); osc.stop(t + dur);
    extraOscs.push(osc);
    const overtoneGain = audioCtx.createGain();
    overtoneGain.gain.setValueAtTime(0.3, t);
    const overtone = audioCtx.createOscillator();
    overtone.type = 'sine';
    overtone.frequency.setValueAtTime(freq*2, t);
    overtone.connect(overtoneGain); overtoneGain.connect(filt);
    overtone.start(t); overtone.stop(t + dur);
    extraOscs.push(overtone);
  }
  filt.connect(gain); gain.connect(audioCtx.destination);
  if(reverbSend) gain.connect(reverbSend);
  return {oscs: extraOscs, gain};
}
function scheduleNextNote(){
  if(!audioCtx || storyMusicMuted || !storyMusicCfg) return;
  const cfg = storyMusicCfg;
  const step = cfg.seq[storyMusicStep % cfg.seq.length];
  const freq = NOTE_FREQ[step[0]], beats = step[1];
  const t = audioCtx.currentTime + 0.05 + (Math.random()-0.5)*0.02;
  const dur = beats * cfg.tempo * 1.7;
  const played = playSoftNote(cfg, freq, t, dur);
  if(storyMusicNodes){
    storyMusicNodes.oscs.push(...played.oscs);
    storyMusicNodes.gains.push(played.gain);
  }
  storyMusicStep++;
  let waitBeats = beats;
  if(storyMusicStep % cfg.seq.length === 0) waitBeats += 1.5;
  storyMusicTimer = setTimeout(scheduleNextNote, waitBeats * cfg.tempo * 1000);
}
function stopStoryMusic(){
  if(storyMusicTimer){ clearTimeout(storyMusicTimer); storyMusicTimer = null; }
  storyMusicCfg = null;
  stopTexture();
  const nodes = storyMusicNodes;
  storyMusicNodes = null;
  if(!nodes || !audioCtx) return;
  try{
    const t = audioCtx.currentTime;
    nodes.gains.forEach(g=>{
      try{
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(g.gain.value, t);
        g.gain.linearRampToValueAtTime(0.0001, t + 0.4);
      }catch(e){}
    });
    setTimeout(()=>{ nodes.oscs.forEach(o=>{ try{ o.stop(); }catch(e){} }); }, 500);
  }catch(e){}
}
function startStoryMusic(genre){
  stopStoryMusic();
  if(storyMusicMuted) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    ensureReverbBus();
    startTexture(genre);
    if(!GENRE_TEXTURE_ONLY[genre]){
      storyMusicCfg = GENRE_MELODY[genre] || GENRE_MELODY.Fiction;
      storyMusicStep = 0;
      storyMusicNodes = {oscs:[], gains:[]};
      scheduleNextNote();
    }
  }catch(e){}
}
function playClickSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(760, t);
    osc.frequency.exponentialRampToValueAtTime(420, t + 0.08);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.16, t + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.11);
  }catch(e){}
}
function playTick(elapsed, total){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const progress = Math.min(Math.max(elapsed/total, 0), 1);
    const freq = 520 + progress*520;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.09, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.08);
  }catch(e){}
}
function bindEvents(root){
  root.onclick = function(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    const handler = HANDLERS[action];
    if(handler){ playClickSound(); handler(el, e); }
  };
}

const HANDLERS = {
  'show-word-meaning'(el){ showWordTooltip(el); },
  'toggle-lang'(){ LANG = LANG==='tr' ? 'fa' : LANG==='fa' ? 'en' : LANG==='en' ? 'es' : 'tr'; save(); render(); },
  'set-lang'(el){ LANG = el.dataset.lang; save(); render(); },
  'diag-start'(){ go('diagnostic-step'); },
  'diag-goal-toggle'(el){
    if(el.disabled) return;
    const v = el.dataset.value;
    const goals = state.diag.goals || (state.diag.goals = []);
    const i = goals.indexOf(v);
    if(i>-1) goals.splice(i,1);
    else if(goals.length < 3) goals.push(v);
    save(); render();
  },
  'diag-goal-continue'(){
    if(!state.diag.goals || !state.diag.goals.length) return;
    state.diag.step = 1; save(); render(); pushHistoryEntry();
  },
  'diag-level'(el){ state.diag.level = el.dataset.value; state.diag.step = 2; save(); render(); pushHistoryEntry(); },
  'diag-learner'(el){ state.diag.learnerType = el.dataset.value; state.diag.step = 3; save(); render(); pushHistoryEntry(); },
  'diag-priority'(el){ state.diag.priorityArea = el.dataset.value; state.diag.step = 4; save(); render(); pushHistoryEntry(); },
  'unlock-submit'(){
    const nameEl = document.getElementById('unlock-name');
    const name = (nameEl && nameEl.value || '').trim();
    if(name.length < 2){
      state.viewParams = {showError:true, name};
      render();
      return;
    }
    const d = state.diag;
    state.profile = {
      name, motivationTag:d.goals[0], goals:d.goals.slice(), archetype:ARCHETYPES[d.goals[0]].name.en,
      level:d.level, levelStage:1, learnerType:d.learnerType, priorityArea:d.priorityArea, completedDiagnostic:true, dashboardIntroShown:false
    };
    save();
    go('dashboard');
  },
  'retake-diagnostic'(){
    state.diag = {step:0, goals:[], level:null, learnerType:null, priorityArea:null};
    state.profile.completedDiagnostic = false;
    save();
    go('diagnostic-intro');
  },
  'toggle-roadmap-item'(el){
    const idx = el.dataset.idx;
    const rc = state.progress.roadmapChecked;
    rc[idx] = !rc[idx];
    const roadmap = buildRoadmap(state.profile);
    const allDone = roadmap.every((_,i)=>rc[i]);
    if(allDone){
      if(state.profile.levelStage === 2){
        const li = LEVELS.indexOf(state.profile.level);
        if(li < LEVELS.length-1) state.profile.level = LEVELS[li+1];
        state.profile.levelStage = 1;
      } else {
        state.profile.levelStage = 2;
      }
      state.progress.roadmapChecked = {};
    }
    save(); render();
  },
  'toggle-daily-task'(el){
    const id = el.dataset.id;
    const dc = state.progress.dailyTasksChecked;
    dc[id] = !dc[id];
    save(); render();
  },
  'reset-all'(){
    if(!resetConfirmPending){ resetConfirmPending = true; render(); return; }
    resetConfirmPending = false;
    const lang = LANG;
    state = freshState();
    LANG = lang;
    save();
    render();
  },
  'open-settings'(){ go('settings'); },
  'nav'(el){
    const view = el.dataset.view;
    const params = {id: el.dataset.id};
    if(view==='grammar-list' || view==='grammar-trap') params.level = state.viewParams.level || state.profile.level;
    if(view==='vocab-list' || view==='vocab-set' || view==='vocab-set-intro'){ params.level = state.viewParams.level || state.profile.level; params.cat = el.dataset.cat || state.viewParams.cat || 'vocab'; }
    if(view==='story-list' || view==='story-detail') params.level = state.viewParams.level || state.profile.level;
    if(['goal-levels','goal-level-detail','grammar-trap','vocab-set','vocab-set-intro'].includes(view)){
      const goal = el.dataset.goal || state.viewParams.goal;
      if(goal) params.goal = goal;
    }
    if(view==='goal-level-detail'){ params.level = el.dataset.level || state.viewParams.level || state.profile.level; params.tab = 'grammar'; }
    go(view, params);
  },
  'set-level'(el){ state.viewParams.level = el.dataset.level; save(); render(); },
  'set-cat'(el){ state.viewParams.cat = el.dataset.cat; save(); render(); },
  'set-goal-tab'(el){ state.viewParams.tab = el.dataset.tab; save(); render(); },
  'set-story-genre'(el){ state.viewParams.genre = el.dataset.genre; save(); render(); },
  'toggle-edit-goals'(){ state.viewParams.editingGoals = !state.viewParams.editingGoals; render(); },
  'toggle-profile-goal'(el){
    const key = el.dataset.goal;
    const goals = state.profile.goals;
    const i = goals.indexOf(key);
    if(i>-1) goals.splice(i,1);
    else if(goals.length<3) goals.push(key);
    if(goals.length) state.profile.motivationTag = goals[0];
    save(); render();
  },
  'studio-pick-mode'(el){
    const mode = el.dataset.mode;
    const goals = (state.profile.goals && state.profile.goals.length) ? state.profile.goals : GOAL_ORDER;
    go('studio-setup', {mode, goal: goals[0], difficulty: null});
  },
  'studio-pick-goal'(el){ state.viewParams.goal = el.dataset.goal; render(); },
  'studio-pick-difficulty'(el){ state.viewParams.difficulty = el.dataset.difficulty; render(); },
  'studio-start-round'(){
    const vp = state.viewParams;
    if(!vp.difficulty) return;
    const round = buildPracticeRound(vp.goal, state.profile.level, vp.difficulty);
    go('studio-round', {mode: vp.mode, goal: vp.goal, difficulty: vp.difficulty, round, transcript:'', checked:false, result:null});
  },
  'studio-new-round'(){
    stopStudioMic();
    const vp = state.viewParams;
    const round = buildPracticeRound(vp.goal, state.profile.level, vp.difficulty);
    state.viewParams = Object.assign({}, vp, {round, transcript:'', checked:false, result:null});
    save(); render();
  },
  'studio-change-difficulty'(){
    stopStudioMic();
    const vp = state.viewParams;
    go('studio-setup', {mode: vp.mode, goal: vp.goal, difficulty: null});
  },
  'studio-check-answer'(){
    const vp = state.viewParams;
    const ta = document.getElementById('studio-answer-input');
    const text = ta ? ta.value : (vp.transcript || '');
    const result = checkPracticeAnswer(vp.round, text);
    vp.transcript = text; vp.checked = true; vp.result = result;
    if(result.passed){
      const key = vp.mode==='writing' ? 'writingRoundsDone' : 'speakingRoundsDone';
      state.progress[key] = (state.progress[key]||0) + 1;
    }
    save();
    if(result.passed) checkBadges();
    render();
  },
  'studio-mic-toggle'(){ toggleStudioMic(); },
  'flip-card'(){ state.viewParams.flipped = !state.viewParams.flipped; render(); },
  'vocab-next'(el){ const i = +el.dataset.i; go('vocab-set', {id: el.dataset.id, cardIndex: i+1, flipped:false, level:state.viewParams.level, cat:state.viewParams.cat, goal:state.viewParams.goal}); },
  'vocab-prev'(el){ const i = +el.dataset.i; go('vocab-set', {id: el.dataset.id, cardIndex: i-1, flipped:false, level:state.viewParams.level, cat:state.viewParams.cat, goal:state.viewParams.goal}); },
  'start-grammar-quiz'(el){
    const t = GRAMMAR_ITEMS.find(x=>x.id===el.dataset.id);
    const goal = state.viewParams.goal;
    const variant = goal && t.goalVariant && t.goalVariant[goal];
    const effective = variant ? Object.assign({}, t, variant) : t;
    const backView = goal ? 'goal-level-detail' : 'grammar-list';
    const backParams = goal ? {goal, level: state.viewParams.level, tab:'grammar'} : {level: state.viewParams.level};
    startQuiz('grammar', t.id, grammarQuizQuestions(effective), backView, backParams);
  },
  'start-vocab-quiz'(el){
    const s = VOCAB_SETS.find(x=>x.id===el.dataset.id);
    const goal = state.viewParams.goal;
    const backView = goal ? 'goal-level-detail' : 'vocab-list';
    const backParams = goal ? {goal, level: state.viewParams.level, tab: state.viewParams.cat==='slang'?'slang':'vocab'} : {level: state.viewParams.level, cat: state.viewParams.cat};
    startQuiz('vocab', s.id, vocabQuizQuestions(s), backView, backParams);
  },
  'start-story-quiz'(el){
    const s = STORY_LIBRARY.find(x=>x.id===el.dataset.id);
    startQuiz('story', s.id, s.quiz, 'story-list', {level: state.viewParams.level});
  },
  'start-review'(){
    const mixed = buildReviewQuiz();
    if(!mixed.length) return;
    startQuiz('review', null, mixed, 'dashboard', {});
  },
  'quiz-answer'(el){
    const q = state.quiz, i = +el.dataset.i;
    if(q.answered) return;
    if(!q.results) q.results = [];
    q.answered = true; q.selected = i;
    const isCorrect = i === q.questions[q.index].correct;
    if(isCorrect) q.correct++;
    q.results[q.index] = isCorrect;
    save(); render();
  },
  'quiz-next'(){
    const q = state.quiz;
    q.index++; q.answered = false; q.selected = null;
    if(q.index < q.questions.length){
      q.timeLimit = questionTimeLimit(q.questions[q.index]);
      q.deadline = Date.now() + q.timeLimit*1000;
      q.lastTickSecond = null;
    }
    if(q.index >= q.questions.length){
      if(q.contextId){
        const arr = progressArrForKind(q.kind);
        if(!arr.includes(q.contextId)) arr.push(q.contextId);
        updateSRS(q.contextId, q.kind, q.correct/q.questions.length);
      } else {
        const byItem = {};
        q.questions.forEach((qq,idx)=>{
          const id = qq.itemId, kind = qq.kind;
          if(!byItem[id]) byItem[id] = {kind, correct:0, total:0};
          byItem[id].total++;
          if(q.results[idx]) byItem[id].correct++;
        });
        Object.keys(byItem).forEach(id=>{
          const {kind, correct, total} = byItem[id];
          const arr = progressArrForKind(kind);
          if(!arr.includes(id)) arr.push(id);
          updateSRS(id, kind, correct/total);
        });
        state.progress.reviewsCompleted = (state.progress.reviewsCompleted||0) + 1;
      }
      markActivity();
    }
    save(); render();
  },
  'quiz-back-to-list'(){ const q = state.quiz; go(q.backView, q.backParams || {}); },
  'copy-phone'(el){
    const original = el.textContent;
    copyText(displayPhone()).then(()=>{
      el.textContent = L('Copied!','Kopyalandı!','کپی شد!','¡Copiado!');
      setTimeout(()=>{ el.textContent = original; }, 1500);
    });
  },
  'toggle-contact-optin'(el){
    state.profile.wantsContact = el.checked;
    save();
    render();
  },
  'save-contact-optin'(){
    const phoneEl = document.getElementById('contact-optin-phone');
    const phone = (phoneEl && phoneEl.value || '').trim();
    state.profile.contactPhone = phone;
    save();
    if(phone){
      const p = state.profile;
      const msg = L("Hi! I'm "+p.name+" and I'd like the teacher to reach out to me on WhatsApp at "+phone+".",
                    'Merhaba! Ben '+p.name+' ve öğretmenin WhatsApp üzerinden '+phone+' numarasından bana ulaşmasını isterim.',
                    'سلام! من '+p.name+' هستم و می‌خواهم معلم از طریق واتس‌اپ با شماره '+phone+' با من تماس بگیرد.',
                    '¡Hola! Soy '+p.name+' y me gustaría que el profesor se pusiera en contacto conmigo por WhatsApp al '+phone+'.')
                  + leadInfoSuffix(p);
      window.open(whatsappLink(msg), '_blank', 'noopener');
    }
    const status = document.getElementById('contact-optin-status');
    if(status){
      status.style.display = 'block';
      setTimeout(()=>{ status.style.display = 'none'; }, 2000);
    }
  },
  'toggle-story-music'(){
    storyMusicMuted = !storyMusicMuted;
    localStorage.setItem('farinMusicMuted', storyMusicMuted ? '1' : '0');
    if(storyMusicMuted){ stopStoryMusic(); currentMusicStoryId = null; }
    else if(state.view === 'story-detail'){
      const s = STORY_LIBRARY.find(x=>x.id===state.viewParams.id);
      if(s){ currentMusicStoryId = s.id; startStoryMusic(s.genre); }
    }
    render();
  },
  'back'(){ try{ history.back(); }catch(e){ goBack(); } }
};

if(state.profile.completedDiagnostic && markDailyVisit()){ save(); }
