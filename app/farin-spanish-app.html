  {word:'demandar', sentence:'La empresa decidió demandar a su antiguo socio.', meaning:{en:"To sue / to file a lawsuit.", tr:"Dava açmak.", fa:"شکایت کردن / دادخواهی کردن.", es:"Iniciar un proceso legal contra alguien."}},
  {word:'la justicia', sentence:'Muchos ciudadanos exigen más justicia social.', meaning:{en:"Justice.", tr:"Adalet.", fa:"عدالت.", es:"El principio de dar a cada quien lo que le corresponde."}},
  {word:'culpable', sentence:'El acusado fue declarado culpable por unanimidad.', meaning:{en:"Guilty.", tr:"Suçlu.", fa:"مقصر / گناهکار.", es:"Que cometió un delito o una falta."}},
  {word:'inocente', sentence:'Después del juicio, la corte lo declaró inocente.', meaning:{en:"Innocent.", tr:"Masum.", fa:"بی‌گناه.", es:"Que no cometió el delito del que se le acusa."}}
]},

{id:'v-B2-4', level:'B2', category:'vocab', goals:['everyday'], title:{en:"Mental Health & Wellbeing", tr:"Ruh Sağlığı ve İyi Oluş", fa:"سلامت روان و بهزیستی", es:"Salud mental y bienestar"}, cards:[
  {word:'el estrés', sentence:'El estrés del trabajo le está afectando el sueño.', meaning:{en:"Stress.", tr:"Stres.", fa:"استرس.", es:"Una tensión física o mental causada por presión o exigencias."}},
  {word:'la ansiedad', sentence:'Empezó terapia para controlar su ansiedad.', meaning:{en:"Anxiety.", tr:"Kaygı / anksiyete.", fa:"اضطراب.", es:"Una sensación intensa de nerviosismo o preocupación."}},
  {word:'el autocuidado', sentence:'Dedicar tiempo al autocuidado mejora tu bienestar general.', meaning:{en:"Self-care.", tr:"Öz bakım.", fa:"خودمراقبتی.", es:"Las acciones que haces para cuidar tu salud física y emocional."}},
  {word:'sanar', sentence:'Necesita tiempo para sanar después de la pérdida.', meaning:{en:"To heal.", tr:"İyileşmek.", fa:"التیام یافتن / بهبود یافتن.", es:"Recuperarse de una herida física o emocional."}},
  {word:'el equilibrio emocional', sentence:'La meditación le ayuda a mantener el equilibrio emocional.', meaning:{en:"Emotional balance.", tr:"Duygusal denge.", fa:"تعادل عاطفی.", es:"Un estado de estabilidad en las emociones."}},
  {word:'el agotamiento', sentence:'Sufrió un agotamiento después de meses de exceso de trabajo.', meaning:{en:"Burnout / exhaustion.", tr:"Tükenmişlik.", fa:"فرسودگی.", es:"Un cansancio extremo, físico o mental."}},
  {word:'la terapia', sentence:'Empezar terapia fue una de las mejores decisiones de su vida.', meaning:{en:"Therapy.", tr:"Terapi.", fa:"روان‌درمانی.", es:"Un tratamiento profesional para problemas emocionales o psicológicos."}},
  {word:'apoyar', sentence:'Sus amigos la apoyaron durante todo el proceso.', meaning:{en:"To support.", tr:"Desteklemek.", fa:"حمایت کردن.", es:"Ayudar y acompañar a alguien."}},
  {word:'la autoestima', sentence:'Trabajar en su autoestima cambió por completo su vida.', meaning:{en:"Self-esteem.", tr:"Özsaygı.", fa:"عزت نفس.", es:"La valoración que una persona tiene de sí misma."}},
  {word:'desahogarse', sentence:'Necesitaba desahogarse con alguien de confianza.', meaning:{en:"To vent / to get something off your chest.", tr:"İçini dökmek.", fa:"دل خالی کردن / درد دل کردن.", es:"Expresar libremente lo que uno siente para sentirse mejor."}}
]},

{id:'v-B2-5', level:'B2', category:'vocab', goals:['exam'], title:{en:"History & Civilization", tr:"Tarih ve Medeniyet", fa:"تاریخ و تمدن", es:"Historia y civilización"}, cards:[
  {word:'el imperio', sentence:'El imperio romano dominó gran parte de Europa.', meaning:{en:"The empire.", tr:"İmparatorluk.", fa:"امپراتوری.", es:"Un conjunto de territorios gobernados por un solo poder."}},
  {word:'la civilización', sentence:'Esa civilización antigua construyó pirámides impresionantes.', meaning:{en:"The civilization.", tr:"Medeniyet.", fa:"تمدن.", es:"Una sociedad avanzada con su propia cultura y organización."}},
  {word:'la conquista', sentence:'La conquista transformó por completo la región.', meaning:{en:"The conquest.", tr:"Fetih.", fa:"فتح / تسخیر.", es:"El acto de tomar control de un territorio por la fuerza."}},
  {word:'la independencia', sentence:'El país celebra su independencia cada mes de julio.', meaning:{en:"Independence.", tr:"Bağımsızlık.", fa:"استقلال.", es:"La libertad de un país frente a otro poder."}},
  {word:'la revolución', sentence:'La revolución cambió el sistema político para siempre.', meaning:{en:"The revolution.", tr:"Devrim.", fa:"انقلاب.", es:"Un cambio profundo y a menudo violento en la sociedad o el gobierno."}},
  {word:'el legado', sentence:'Su legado cultural sigue vivo hoy en día.', meaning:{en:"The legacy.", tr:"Miras.", fa:"میراث.", es:"Lo que una persona o época deja para las siguientes generaciones."}},
  {word:'la colonia', sentence:'La región fue colonia de otro país durante tres siglos.', meaning:{en:"The colony.", tr:"Sömürge.", fa:"مستعمره.", es:"Un territorio controlado y gobernado por otra nación."}},
  {word:'el tratado', sentence:'Ambos países firmaron un tratado de paz.', meaning:{en:"The treaty.", tr:"Antlaşma.", fa:"پیمان / معاهده.", es:"Un acuerdo oficial entre dos o más países."}},
  {word:'la dinastía', sentence:'Esa dinastía gobernó durante más de doscientos años.', meaning:{en:"The dynasty.", tr:"Hanedan.", fa:"سلسله.", es:"Una serie de gobernantes de la misma familia."}},
  {word:'el patrimonio', sentence:'La ciudad protege su patrimonio histórico con mucho cuidado.', meaning:{en:"Heritage.", tr:"Miras / kültürel varlık.", fa:"میراث فرهنگی.", es:"Los bienes culturales o históricos que se heredan del pasado."}}
]},

{id:'v-B2-6', level:'B2', category:'vocab', goals:['exam','career'], title:{en:"Debate & Opinion", tr:"Tartışma ve Görüş Bildirme", fa:"مناظره و بیان نظر", es:"Debate y opinión"}, cards:[
  {word:'a mi parecer', sentence:'A mi parecer, deberíamos invertir más en educación.', meaning:{en:"In my view / it seems to me.", tr:"Bana kalırsa.", fa:"به نظر من.", es:"Expresión para dar una opinión personal."}},
  {word:'estar de acuerdo', sentence:'Estoy totalmente de acuerdo con tu propuesta.', meaning:{en:"To agree.", tr:"Aynı fikirde olmak.", fa:"موافق بودن.", es:"Compartir la misma opinión que otra persona."}},
  {word:'discrepar', sentence:'Discrepo de esa idea por varias razones.', meaning:{en:"To disagree.", tr:"Aynı fikirde olmamak.", fa:"مخالف بودن.", es:"No estar de acuerdo con algo."}},
  {word:'el argumento', sentence:'Su argumento se basaba en datos sólidos.', meaning:{en:"The argument.", tr:"Argüman / gerekçe.", fa:"استدلال.", es:"Un razonamiento que apoya una idea u opinión."}},
  {word:'refutar', sentence:'El científico refutó la teoría con nuevas pruebas.', meaning:{en:"To refute / to disprove.", tr:"Çürütmek.", fa:"رد کردن (استدلال).", es:"Demostrar que algo es incorrecto."}},
  {word:'por un lado... por otro lado', sentence:'Por un lado, el plan ahorra dinero; por otro lado, tarda más tiempo.', meaning:{en:"On one hand... on the other hand.", tr:"Bir yandan... öte yandan.", fa:"از یک طرف... از طرف دیگر.", es:"Estructura para presentar dos aspectos opuestos de un tema."}},
  {word:'convencer', sentence:'Logró convencer a todo el comité con su presentación.', meaning:{en:"To convince.", tr:"İkna etmek.", fa:"متقاعد کردن.", es:"Lograr que alguien cambie de opinión o acepte algo."}},
  {word:'el punto de vista', sentence:'Cada persona tiene un punto de vista diferente sobre el tema.', meaning:{en:"Point of view.", tr:"Bakış açısı.", fa:"دیدگاه.", es:"La perspectiva u opinión personal de alguien."}},
  {word:'la postura', sentence:'Cambió de postura después de escuchar los nuevos datos.', meaning:{en:"Stance / position.", tr:"Tutum / duruş.", fa:"موضع.", es:"La opinión o posición que alguien mantiene sobre un tema."}},
  {word:'en resumen', sentence:'En resumen, necesitamos más tiempo para decidir.', meaning:{en:"In summary / to sum up.", tr:"Özetle.", fa:"در نتیجه / خلاصه اینکه.", es:"Expresión para cerrar una idea con una conclusión breve."}}
]},

{id:'v-B2-7', level:'B2', category:'vocab', goals:['everyday','exam'], title:{en:"Art & Literature", tr:"Sanat ve Edebiyat", fa:"هنر و ادبیات", es:"Arte y literatura"}, cards:[
  {word:'la obra maestra', sentence:'Esa novela se considera una obra maestra de la literatura.', meaning:{en:"The masterpiece.", tr:"Başyapıt.", fa:"شاهکار.", es:"Una obra de gran valor artístico."}},
  {word:'el autor / la autora', sentence:'La autora firmó libros durante toda la tarde.', meaning:{en:"The author.", tr:"Yazar.", fa:"نویسنده.", es:"La persona que escribe una obra literaria."}},
  {word:'el argumento', sentence:'El argumento de la novela gira en torno a un secreto familiar.', meaning:{en:"The plot.", tr:"Konu (kurgu).", fa:"طرح داستان.", es:"La trama o historia principal de una obra."}},
  {word:'la crítica', sentence:'La película recibió muy buena crítica.', meaning:{en:"The review / criticism.", tr:"Eleştiri.", fa:"نقد.", es:"La opinión o evaluación profesional de una obra."}},
  {word:'el retrato', sentence:'El pintor terminó el retrato en solo dos semanas.', meaning:{en:"The portrait.", tr:"Portre.", fa:"پرتره.", es:"Una pintura o imagen que representa a una persona."}},
  {word:'la editorial', sentence:'La editorial publicó su primer libro el año pasado.', meaning:{en:"The publishing house.", tr:"Yayınevi.", fa:"انتشارات.", es:"La empresa que publica libros."}},
  {word:'inspirarse', sentence:'El artista se inspiró en su ciudad natal para esta colección.', meaning:{en:"To be inspired / to draw inspiration.", tr:"İlham almak.", fa:"الهام گرفتن.", es:"Recibir ideas creativas de algo o alguien."}},
  {word:'la metáfora', sentence:'El poema usa una metáfora del mar para hablar del tiempo.', meaning:{en:"The metaphor.", tr:"Metafor / eğretileme.", fa:"استعاره.", es:"Una figura literaria que compara dos cosas sin usar 'como'."}},
  {word:'el escenario', sentence:'Los actores ensayaron en el escenario toda la mañana.', meaning:{en:"The stage.", tr:"Sahne.", fa:"صحنه‌ی نمایش.", es:"El espacio donde se representa una obra de teatro."}},
  {word:'conmovedor', sentence:'El final de la película fue realmente conmovedor.', meaning:{en:"Moving / touching.", tr:"Dokunaklı.", fa:"تأثیرگذار / دل‌انگیز.", es:"Que provoca una fuerte emoción."}}
]},

{id:'v-B2-8', level:'B2', category:'vocab', goals:['travel'], title:{en:"Adventure & Extreme Nature", tr:"Macera ve Vahşi Doğa", fa:"ماجراجویی و طبیعت خشن", es:"Aventura y naturaleza extrema"}, cards:[
  {word:'el acantilado', sentence:'Saltó del acantilado atado a una cuerda de escalada.', meaning:{en:"The cliff.", tr:"Uçurum.", fa:"صخره / پرتگاه.", es:"Una pared de roca alta y vertical, muchas veces junto al mar."}},
  {word:'la selva', sentence:'Pasaron una semana explorando la selva amazónica.', meaning:{en:"The jungle.", tr:"Yağmur ormanı / vahşi orman.", fa:"جنگل انبوه.", es:"Un bosque denso y tropical."}},
  {word:'sobrevivir', sentence:'Lograron sobrevivir tres días sin comida ni refugio.', meaning:{en:"To survive.", tr:"Hayatta kalmak.", fa:"زنده ماندن.", es:"Seguir vivo a pesar de una situación peligrosa."}},
  {word:'la corriente', sentence:'La corriente del río era demasiado fuerte para nadar.', meaning:{en:"The current.", tr:"Akıntı.", fa:"جریان (آب).", es:"El movimiento del agua en un río o mar."}},
  {word:'el riesgo', sentence:'Escalar esa montaña implica un riesgo enorme.', meaning:{en:"The risk.", tr:"Risk.", fa:"خطر / ریسک.", es:"La posibilidad de que algo malo ocurra."}},
  {word:'la cumbre', sentence:'Llegaron a la cumbre justo antes del amanecer.', meaning:{en:"The summit / peak.", tr:"Zirve.", fa:"قله.", es:"El punto más alto de una montaña."}},
  {word:'el naufragio', sentence:'Los marineros sobrevivieron al naufragio agarrados a una tabla.', meaning:{en:"The shipwreck.", tr:"Gemi enkazı / batık.", fa:"غرق شدن کشتی.", es:"El hundimiento de un barco."}},
  {word:'la tormenta', sentence:'Una tormenta inesperada los obligó a cambiar de ruta.', meaning:{en:"The storm.", tr:"Fırtına.", fa:"طوفان.", es:"Un fenómeno climático violento con viento y lluvia fuertes."}},
  {word:'la brújula', sentence:'Sin la brújula, se habrían perdido en el bosque.', meaning:{en:"The compass.", tr:"Pusula.", fa:"قطب‌نما.", es:"Un instrumento que indica la dirección."}},
  {word:'el peligro', sentence:'Ignoraron el peligro y siguieron adelante de todos modos.', meaning:{en:"The danger.", tr:"Tehlike.", fa:"خطر.", es:"Una situación que puede causar daño."}}
]},

{id:'v-B2-9', level:'B2', category:'vocab', goals:['everyday','exam'], title:{en:"Ecology & Sustainability", tr:"Ekoloji ve Sürdürülebilirlik", fa:"محیط‌زیست و پایداری", es:"Ecología y sostenibilidad"}, cards:[
  {word:'el calentamiento global', sentence:'El calentamiento global provoca cambios drásticos en el clima.', meaning:{en:"Global warming.", tr:"Küresel ısınma.", fa:"گرمایش جهانی.", es:"El aumento gradual de la temperatura del planeta."}},
  {word:'reciclar', sentence:'En esta ciudad todos reciclan el plástico y el papel.', meaning:{en:"To recycle.", tr:"Geri dönüştürmek.", fa:"بازیافت کردن.", es:"Volver a usar un material para reducir la basura."}},
  {word:'la huella de carbono', sentence:'Viajar en avión aumenta mucho tu huella de carbono.', meaning:{en:"Carbon footprint.", tr:"Karbon ayak izi.", fa:"ردپای کربن.", es:"La cantidad de gases contaminantes que produce una persona o actividad."}},
  {word:'renovable', sentence:'La energía solar es una fuente renovable.', meaning:{en:"Renewable.", tr:"Yenilenebilir.", fa:"تجدیدپذیر.", es:"Que se puede reponer de forma natural y no se agota."}},
  {word:'la extinción', sentence:'Esa especie está en peligro de extinción.', meaning:{en:"Extinction.", tr:"Yok olma / tükeniş.", fa:"انقراض.", es:"La desaparición total de una especie."}},
  {word:'la deforestación', sentence:'La deforestación destruye el hábitat de muchos animales.', meaning:{en:"Deforestation.", tr:"Ormansızlaşma.", fa:"جنگل‌زدایی.", es:"La destrucción de los bosques."}},
  {word:'contaminar', sentence:'Las fábricas contaminan el río con productos químicos.', meaning:{en:"To pollute.", tr:"Kirletmek.", fa:"آلوده کردن.", es:"Ensuciar el aire, el agua o la tierra con sustancias dañinas."}},
  {word:'el desperdicio', sentence:'Reducir el desperdicio de alimentos ayuda al planeta.', meaning:{en:"Waste.", tr:"İsraf / atık.", fa:"هدررفت / زباله.", es:"Lo que se tira o se malgasta sin necesidad."}},
  {word:'el ecosistema', sentence:'Ese ecosistema alberga cientos de especies únicas.', meaning:{en:"The ecosystem.", tr:"Ekosistem.", fa:"بوم‌سازگان / اکوسیستم.", es:"El conjunto de seres vivos y su entorno natural."}},
  {word:'concienciar', sentence:'La campaña busca concienciar a la gente sobre el reciclaje.', meaning:{en:"To raise awareness.", tr:"Bilinçlendirmek.", fa:"آگاه‌سازی کردن.", es:"Hacer que alguien tome conciencia de un problema."}}
]},

{id:'v-B2-10', level:'B2', category:'vocab', goals:['everyday','exam'], title:{en:"Psychology & Human Behavior", tr:"Psikoloji ve İnsan Davranışı", fa:"روان‌شناسی و رفتار انسانی", es:"Psicología y comportamiento humano"}, cards:[
  {word:'el comportamiento', sentence:'Su comportamiento cambió mucho después del accidente.', meaning:{en:"Behavior.", tr:"Davranış.", fa:"رفتار.", es:"La manera en que actúa una persona."}},
  {word:'la percepción', sentence:'Nuestra percepción del tiempo cambia según la edad.', meaning:{en:"Perception.", tr:"Algı.", fa:"ادراک.", es:"La forma en que interpretamos algo a través de los sentidos."}},
  {word:'el subconsciente', sentence:'Muchos de nuestros miedos vienen del subconsciente.', meaning:{en:"The subconscious.", tr:"Bilinçaltı.", fa:"ناخودآگاه.", es:"La parte de la mente que actúa sin que seamos totalmente conscientes de ella."}},
  {word:'la motivación', sentence:'Perdió la motivación después de varios fracasos.', meaning:{en:"Motivation.", tr:"Motivasyon.", fa:"انگیزه.", es:"El impulso que lleva a una persona a actuar."}},
  {word:'el prejuicio', sentence:'Es importante reconocer nuestros propios prejuicios.', meaning:{en:"Prejudice / bias.", tr:"Önyargı.", fa:"پیش‌داوری.", es:"Una opinión negativa formada sin conocer bien algo o a alguien."}},
  {word:'la empatía', sentence:'La empatía nos ayuda a entender lo que siente otra persona.', meaning:{en:"Empathy.", tr:"Empati.", fa:"همدلی.", es:"La capacidad de comprender los sentimientos de otra persona."}},
  {word:'el instinto', sentence:'Actuó por instinto y salió corriendo del edificio.', meaning:{en:"Instinct.", tr:"İçgüdü.", fa:"غریزه.", es:"Una reacción natural, sin pensarlo, ante una situación."}},
  {word:'manipular', sentence:'Intentó manipular la conversación a su favor.', meaning:{en:"To manipulate.", tr:"Manipüle etmek.", fa:"دستکاری کردن (روانی).", es:"Influir en alguien de forma injusta o engañosa."}},
  {word:'el rasgo de personalidad', sentence:'La curiosidad es un rasgo de personalidad muy valioso.', meaning:{en:"Personality trait.", tr:"Kişilik özelliği.", fa:"ویژگی شخصیتی.", es:"Una característica que define la forma de ser de alguien."}},
  {word:'reprimir', sentence:'Reprimir tus emociones durante mucho tiempo no es saludable.', meaning:{en:"To repress / suppress.", tr:"Bastırmak (duyguları).", fa:"سرکوب کردن (احساسات).", es:"Contener o no expresar un sentimiento."}}
]},

{id:'slang-B2', level:'B2', category:'slang', goals:['everyday'], title:{en:"Daily Slang (Advanced)", tr:"Günlük Argo (İleri Düzey)", fa:"اصطلاحات روزمره (پیشرفته)", es:"Argot cotidiano (avanzado)"}, cards:[
  {word:'estar en la luna', sentence:'Perdona, ¿qué dijiste? Estaba en la luna.', meaning:{en:"To be daydreaming / completely distracted.", tr:"Dalgın olmak / aklı başka yerde olmak.", fa:"حواس‌پرت بودن / تو فکر بودن.", es:"Estar totalmente distraído, sin prestar atención."},
   note:{en:"Similar to 'estar en las nubes,' but implies you're especially checked out of the conversation.", tr:"'Estar en las nubes' ifadesine benzer, ama sohbetten özellikle kopmuş olduğunu ima eder.", fa:"شبیه 'estar en las nubes' است، اما نشان می‌دهد که فرد به‌طور خاص از مکالمه بیرون رفته.", es:"Parecida a 'estar en las nubes', pero da a entender que estás especialmente ausente de la conversación."}},
  {word:'no tener pelos en la lengua', sentence:'Mi jefa no tiene pelos en la lengua, siempre dice lo que piensa.', meaning:{en:"To speak one's mind bluntly / not mince words.", tr:"Dobra dobra konuşmak.", fa:"رک و پوست‌کنده حرف زدن.", es:"Hablar con total franqueza, sin filtrar lo que se piensa."},
   note:{en:"A vivid idiom — literally 'to have no hairs on your tongue,' meaning nothing holds your words back.", tr:"Canlı bir deyim — kelimenin tam anlamıyla 'dilinde kıl olmamak', yani sözlerini hiçbir şey tutmaz.", fa:"اصطلاحی تصویری — به معنای واقعی 'مو روی زبان نداشتن'، یعنی چیزی جلوی حرف زدنت را نمی‌گیرد.", es:"Un modismo muy visual — literalmente 'no tener pelos en la lengua', es decir, nada frena lo que dices."}},
  {word:'estar hasta las narices', sentence:'Estoy hasta las narices de tantas reuniones inútiles.', meaning:{en:"To be fed up / totally sick of something.", tr:"Bir şeyden bıkmak, gına gelmek.", fa:"از چیزی به‌شدت خسته/کلافه بودن.", es:"Estar completamente harto de algo."},
   note:{en:"A strong, common way to express frustration — more emphatic than simply 'estar cansado.'", tr:"Sinirlenmeyi ifade etmenin güçlü ve yaygın bir yolu — sadece 'estar cansado' demekten daha vurgulu.", fa:"راهی قوی و رایج برای بیان ناراحتی — تأکیدی‌تر از صرفاً گفتن 'estar cansado'.", es:"Una forma fuerte y común de expresar frustración — más enfática que simplemente decir 'estar cansado'."}},
  {word:'dar en el clavo', sentence:'Con esa idea diste en el clavo, es justo lo que necesitábamos.', meaning:{en:"To hit the nail on the head / get it exactly right.", tr:"Tam üstüne basmak / tam isabet etmek.", fa:"دقیقاً درست گفتن / به‌هدف زدن.", es:"Acertar exactamente en algo."},
   note:{en:"Literally 'to hit the nail' — used when someone identifies a problem or solution perfectly.", tr:"Kelimenin tam anlamıyla 'çiviye vurmak' — biri bir sorunu ya da çözümü tam isabetle bulduğunda kullanılır.", fa:"به معنای واقعی 'به میخ زدن' — وقتی کسی مشکل یا راه‌حلی را کاملاً درست تشخیص می‌دهد به کار می‌رود.", es:"Literalmente 'golpear el clavo' — se usa cuando alguien identifica un problema o solución con precisión."}},
  {word:'ser pan comido', sentence:'No te preocupes por el examen, va a ser pan comido.', meaning:{en:"To be a piece of cake / very easy.", tr:"Çocuk oyuncağı olmak.", fa:"خیلی آسان بودن / مثل آب خوردن.", es:"Ser algo muy fácil de hacer."},
   note:{en:"Literally 'eaten bread' — the Spanish equivalent of the English 'piece of cake.'", tr:"Kelimenin tam anlamıyla 'yenmiş ekmek' — İngilizcedeki 'piece of cake' ifadesinin İspanyolca karşılığı.", fa:"به معنای واقعی 'نان خورده‌شده' — معادل اسپانیایی اصطلاح انگلیسی 'piece of cake'.", es:"Literalmente 'pan que ya se comió' — el equivalente en español de 'a piece of cake' en inglés."}},
  {word:'tomar el pelo', sentence:'¿En serio ganaste la lotería o me estás tomando el pelo?', meaning:{en:"To pull someone's leg / tease.", tr:"Birini kandırmak / dalga geçmek.", fa:"کسی را دست انداختن / سر به سرش گذاشتن.", es:"Bromear con alguien haciéndole creer algo falso."},
   note:{en:"Extremely common — don't take it literally, it has nothing to do with actual hair!", tr:"Çok yaygın kullanılır — kelimenin tam anlamıyla düşünmeyin, gerçek saçla ilgisi yoktur!", fa:"بسیار رایج است — به معنای واقعی کلمه فکر نکن، هیچ ربطی به موی واقعی ندارد!", es:"Muy común — no lo tomes literalmente, ¡no tiene nada que ver con el pelo de verdad!"}},
  {word:'estar como una cabra', sentence:'Mi tío está como una cabra, siempre inventa historias increíbles.', meaning:{en:"To be a bit crazy / eccentric (affectionately).", tr:"Biraz kaçık olmak (sevecen bir şekilde).", fa:"کمی دیوانه/عجیب بودن (از سر محبت).", es:"Ser un poco loco o excéntrico, de forma cariñosa."},
   note:{en:"Playful, not offensive — usually said about someone endearingly quirky.", tr:"Şakacı bir ifadedir, kırıcı değildir — genellikle sevimli bir şekilde tuhaf biri için kullanılır.", fa:"شوخ‌طبعانه است، نه توهین‌آمیز — معمولاً درباره‌ی کسی که رفتار بامزه و عجیبی دارد گفته می‌شود.", es:"Es una expresión cariñosa, no ofensiva — se usa para alguien peculiar de forma entrañable."}},
  {word:'costar un ojo de la cara', sentence:'Ese apartamento en el centro le costó un ojo de la cara.', meaning:{en:"To cost an arm and a leg / be very expensive.", tr:"Çok pahalıya mal olmak.", fa:"خیلی گران تمام شدن.", es:"Ser extremadamente caro."},
   note:{en:"A dramatic idiom for something outrageously expensive — very similar to the English equivalent.", tr:"Aşırı derecede pahalı bir şey için kullanılan dramatik bir deyim — İngilizce karşılığına çok benzer.", fa:"اصطلاحی اغراق‌آمیز برای چیزی که به‌طرز عجیبی گران است — بسیار شبیه معادل انگلیسی آن.", es:"Un modismo exagerado para algo increíblemente caro — muy parecido a su equivalente en inglés."}},
  {word:'ponerse las pilas', sentence:'Si quieres aprobar el examen, tienes que ponerte las pilas.', meaning:{en:"To get your act together / start putting in effort.", tr:"Kendini toparlamak / işe koyulmak.", fa:"دست‌به‌کار شدن / جدی شدن.", es:"Empezar a esforzarse más, ponerse activo."},
   note:{en:"Literally 'to put in your batteries' — a common way to tell someone (or yourself) to get energized.", tr:"Kelimenin tam anlamıyla 'pillerini takmak' — birine (ya da kendine) enerji toplaması gerektiğini söylemenin yaygın bir yolu.", fa:"به معنای واقعی 'باتری‌هایت را بگذار' — راهی رایج برای گفتن به کسی (یا خودت) که باید پرانرژی شود.", es:"Literalmente 'colocarse las baterías' — una forma común de decirle a alguien (o a ti mismo) que se active."}},
  {word:'estar forrado', sentence:'Desde que vendió la empresa, está forrado.', meaning:{en:"To be loaded / very rich.", tr:"Parayı basmak / çok zengin olmak.", fa:"خیلی پولدار بودن / پول پارو کردن.", es:"Tener mucho dinero."},

]}
