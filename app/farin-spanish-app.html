  {word:'estar nervioso/a', sentence:'Estoy nerviosa por la entrevista de mañana.', meaning:{en:'To be nervous.', tr:'Gergin olmak.', fa:'مضطرب بودن.', es:'Sentir inquietud o tensión.'}},
  {word:'estar cansado/a', sentence:'Estoy muy cansado, trabajé todo el día.', meaning:{en:'To be tired.', tr:'Yorgun olmak.', fa:'خسته بودن.', es:'Sentir falta de energía.'}},
  {word:'estar sorprendido/a', sentence:'Me quedé sorprendido con la noticia.', meaning:{en:'To be surprised.', tr:'Şaşırmış olmak.', fa:'شگفت‌زده بودن.', es:'Sentir sorpresa por algo inesperado.'}},
  {word:'estar aburrido/a', sentence:'Los niños estaban aburridos durante el viaje largo.', meaning:{en:'To be bored.', tr:'Sıkılmış olmak.', fa:'حوصله‌اش سر رفته بودن.', es:'Sentir falta de interés o entretenimiento.'}},
  {word:'sentirse solo/a', sentence:'A veces se siente solo cuando viaja por trabajo.', meaning:{en:'To feel lonely.', tr:'Yalnız hissetmek.', fa:'احساس تنهایی کردن.', es:'Sentir la falta de compañía.'}},
  {word:'estar orgulloso/a', sentence:'Estoy muy orgulloso de mi hija.', meaning:{en:'To be proud.', tr:'Gurur duymak.', fa:'افتخار کردن.', es:'Sentir satisfacción por un logro propio o ajeno.'}}
]},

{id:'v-A2-10', level:'A2', category:'vocab', goals:['travel'], title:{en:'Airport & Travel', tr:'Havalimanı ve Seyahat', fa:'فرودگاه و سفر', es:'El aeropuerto y los viajes'}, cards:[
  {word:'el pasaporte', sentence:'No olvides tu pasaporte en casa.', meaning:{en:'Passport.', tr:'Pasaport.', fa:'گذرنامه.', es:'Documento necesario para viajar a otro país.'}},
  {word:'la maleta', sentence:'Hice la maleta la noche anterior.', meaning:{en:'Suitcase.', tr:'Bavul.', fa:'چمدان.', es:'El equipaje que llevas en un viaje.'}},
  {word:'el equipaje de mano', sentence:'Solo llevo equipaje de mano en este viaje.', meaning:{en:'Carry-on luggage.', tr:'El bagajı.', fa:'چمدان دستی (بار همراه).', es:'El equipaje pequeño que se lleva dentro del avión.'}},
  {word:'facturar el equipaje', sentence:'Tenemos que facturar el equipaje antes de pasar seguridad.', meaning:{en:'To check in luggage.', tr:'Bagajı teslim etmek.', fa:'تحویل دادن چمدان (چک‌این کردن بار).', es:'Entregar las maletas grandes antes de abordar el avión.'}},
  {word:'la puerta de embarque', sentence:'Nuestro vuelo sale por la puerta de embarque doce.', meaning:{en:'Boarding gate.', tr:'Biniş kapısı.', fa:'گیت سوار شدن.', es:'El lugar por donde se sube al avión.'}},
  {word:'el embarque', sentence:'El embarque comienza treinta minutos antes del vuelo.', meaning:{en:'Boarding.', tr:'Uçağa biniş.', fa:'سوار شدن به هواپیما.', es:'El proceso de subir al avión.'}},
  {word:'el retraso', sentence:'Hay un retraso de dos horas por el mal tiempo.', meaning:{en:'Delay.', tr:'Gecikme.', fa:'تأخیر.', es:'El tiempo extra que tarda algo en llegar o salir.'}},
  {word:'la aduana', sentence:'Tuvimos que esperar mucho en la aduana.', meaning:{en:'Customs.', tr:'Gümrük.', fa:'گمرک.', es:'El lugar donde revisan el equipaje al entrar a un país.'}},
  {word:'el asiento', sentence:'Prefiero un asiento junto a la ventana.', meaning:{en:'Seat.', tr:'Koltuk.', fa:'صندلی.', es:'El lugar donde te sientas en el avión.'}},
  {word:'aterrizar / despegar', sentence:'El avión va a aterrizar en diez minutos.', meaning:{en:'To land / to take off.', tr:'İniş yapmak / kalkış yapmak.', fa:'فرود آمدن / بلند شدن (پرواز کردن).', es:'Tocar tierra un avión o dejar el suelo para volar.'}}
]},

{id:'slang-A2', level:'A2', category:'slang', goals:['everyday'], title:{en:'More Daily Slang', tr:'Daha Fazla Günlük Argo', fa:'اصطلاحات روزمره بیشتر', es:'Más argot cotidiano'}, cards:[
  {word:'¡Qué rollo! / ¡Qué lata!', sentence:'Tengo que trabajar el sábado, ¡qué rollo!', meaning:{en:'What a drag! / What a pain! (Spain: qué rollo, some Latin America: qué lata)', tr:'Ne sıkıcı! (İspanya: qué rollo, bazı Latin Amerika ülkeleri: qué lata)', fa:'چه حوصله‌سربر! (اسپانیا: qué rollo، برخی کشورهای آمریکای لاتین: qué lata)', es:'¡Qué fastidio! (España: qué rollo, algunos países de América Latina: qué lata)'},
   note:{en:'Used to complain casually about something annoying or boring.', tr:'Sinir bozucu ya da sıkıcı bir şeyden gündelik şekilde şikayet etmek için kullanılır.', fa:'برای گلایه‌ی خودمانی از چیزی آزاردهنده یا خسته‌کننده استفاده می‌شود.', es:'Se usa para quejarse de manera informal de algo molesto o aburrido.'}},
  {word:'estar en las nubes', sentence:'Perdón, no te escuché, estaba en las nubes.', meaning:{en:'To be daydreaming / not paying attention.', tr:'Dalgın olmak, hayal kurmak.', fa:'حواس‌پرت بودن، تو رویا بودن.', es:'Estar distraído, sin prestar atención.'},
   note:{en:"Literally \"to be in the clouds\" — a friendly way to admit you weren't listening.", tr:'Kelimenin tam anlamıyla "bulutlarda olmak" — dinlemediğini itiraf etmenin samimi bir yolu.', fa:'به معنای واقعی «در ابرها بودن» — راهی دوستانه برای اعتراف به اینکه گوش نمی‌دادی.', es:'Literalmente "estar en las nubes" — una forma amistosa de admitir que no estabas prestando atención.'}},
  {word:'dar plantón / dejar plantado', sentence:'Quedamos a las siete y me dio plantón.', meaning:{en:'To stand someone up.', tr:'Birini ekmek (buluşmaya gelmemek).', fa:'سر قرار نیامدن، کسی را کاشتن.', es:'No presentarse a una cita con alguien.'},
   note:{en:"Common when someone doesn't show up for a planned meeting or date.", tr:'Biri planlanan bir buluşmaya veya randevuya gelmediğinde kullanılır.', fa:'وقتی کسی سر قرار یا ملاقات از پیش تعیین‌شده نمی‌آید، به کار می‌رود.', es:'Se usa cuando alguien no se presenta a una cita planeada.'}},
  {word:'estar hasta las narices', sentence:'Estoy hasta las narices de este tráfico.', meaning:{en:'To be totally fed up.', tr:'Bıkmak, gına gelmek.', fa:'به‌شدت خسته و کلافه بودن.', es:'Estar completamente harto de algo.'},
   note:{en:"A very common — and very Spanish — way to say you can't take something anymore.", tr:'Bir şeye artık dayanamadığını söylemenin çok yaygın ve çok İspanyolvari bir yolu.', fa:'راهی بسیار رایج (و کاملاً اسپانیایی) برای گفتن اینکه دیگر تحمل چیزی را نداری.', es:'Una forma muy común de decir que ya no aguantas algo más.'}},
  {word:'¡Qué fuerte!', sentence:'¿En serio te despidieron? ¡Qué fuerte!', meaning:{en:"Wow, that's intense! / No way!", tr:'Vay canına, bu çok fena! / Yok artık!', fa:'وای چقدر عجیب! / نه بابا!', es:'¡Vaya, qué impresión! / ¡No puede ser!'},
   note:{en:'A strong reaction to surprising or shocking news.', tr:'Şaşırtıcı ya da şoke edici bir habere verilen güçlü bir tepki.', fa:'واکنشی قوی به خبری تعجب‌آور یا شوکه‌کننده.', es:'Una reacción fuerte a una noticia sorprendente o impactante.'}},
  {word:'ni de broma', sentence:'¿Vas a saltar en paracaídas? — Ni de broma.', meaning:{en:'No way / not a chance.', tr:'Kesinlikle olmaz / asla.', fa:'اصلاً / امکان نداره.', es:'De ninguna manera / ni hablar.'},
   note:{en:'A firm, informal way to refuse something — stronger than a simple "no."', tr:'Bir şeyi reddetmenin kesin ve samimi bir yolu — basit bir "hayır"dan daha güçlü.', fa:'راهی قاطع و خودمانی برای رد کردن چیزی — قوی‌تر از یک «نه» ساده.', es:'Una forma firme e informal de rechazar algo — más fuerte que un simple "no".'}},
  {word:'estar sin blanca / estar pelado', sentence:'No puedo salir esta semana, estoy sin blanca.', meaning:{en:'To be broke / out of money (Spain: sin blanca, Latin America: pelado).', tr:'Meteliksiz olmak, parasız olmak (İspanya: sin blanca, Latin Amerika: pelado).', fa:'بی‌پول بودن (اسپانیا: sin blanca، آمریکای لاتین: pelado).', es:'No tener dinero (España: sin blanca, América Latina: pelado).'},
   note:{en:'A casual way to say you have no money left this month.', tr:'Bu ay hiç paranın kalmadığını söylemenin gündelik bir yolu.', fa:'راهی خودمانی برای گفتن اینکه این ماه هیچ پولی برایت نمانده.', es:'Una forma informal de decir que no te queda dinero este mes.'}},
  {word:'meter la pata', sentence:'Metí la pata y le conté la sorpresa antes de tiempo.', meaning:{en:'To mess up / put your foot in it.', tr:'Pot kırmak, çuvallamak.', fa:'گند زدن، سوتی دادن.', es:'Cometer un error, decir o hacer algo indebido.'},
   note:{en:'Perfect for admitting you made an awkward mistake, like revealing a secret.', tr:'Bir sırrı ifşa etmek gibi utandırıcı bir hata yaptığını itiraf etmek için tam yerinde.', fa:'مناسب برای اعتراف به یک اشتباه خجالت‌آور، مثل لو دادن یک راز.', es:'Perfecto para admitir que cometiste un error incómodo, como revelar un secreto.'}},
  {word:'un montón', sentence:'Te quiero un montón.', meaning:{en:'A lot / a ton.', tr:'Çok fazla, bir sürü.', fa:'خیلی زیاد.', es:'Mucho, en gran cantidad.'},
   note:{en:'A warm, casual intensifier — friendlier than simply saying "mucho."', tr:'Sıcak ve samimi bir vurgu sözcüğü — sadece "mucho" demekten daha içten.', fa:'یک تشدیدکننده‌ی گرم و خودمانی — دوستانه‌تر از گفتن ساده‌ی «mucho».', es:'Un intensificador cálido e informal — más cercano que decir simplemente "mucho".'}},
  {word:'echar de menos / extrañar', sentence:'Te echo de menos desde que te fuiste.', meaning:{en:'To miss someone (Spain: echar de menos, Latin America: extrañar).', tr:'Birini özlemek (İspanya: echar de menos, Latin Amerika: extrañar).', fa:'دلتنگ کسی بودن (اسپانیا: echar de menos، آمریکای لاتین: extrañar).', es:'Sentir la falta de alguien (España: echar de menos, América Latina: extrañar).'},
   note:{en:'One of the most useful phrases for talking about people or places far away.', tr:'Uzaktaki insanlar veya yerler hakkında konuşmak için en kullanışlı ifadelerden biri.', fa:'یکی از کاربردی‌ترین عبارت‌ها برای صحبت درباره‌ی افراد یا مکان‌های دور.', es:'Una de las frases más útiles para hablar de personas o lugares lejanos.'}}
]}
,
{id:"v-C1-1", level:"C1", category:"vocab", goals:["exam","career"], title:{en:"Academic Language & Essay Writing", tr:"Akademik Dil ve Deneme Yazımı", fa:"زبان آکادمیک و نگارش مقاله", es:"Lenguaje académico y el ensayo"}, cards:[
  {word:"la tesis", sentence:"Su tesis doctoral analiza el impacto del cambio climático en la agricultura andina.", meaning:{en:"Thesis — the central claim a text sets out to prove, or a doctoral dissertation.", tr:"Tez — bir metnin kanıtlamaya çalıştığı temel iddia ya da doktora tezi.", fa:"رساله/تز — ادعای اصلی که یک متن قصد اثبات آن را دارد، یا پایان‌نامه دکتری.", es:"La afirmación central que un texto busca demostrar, o una disertación doctoral."}},
  {word:"el argumento", sentence:"Cada párrafo debe desarrollar un solo argumento con claridad.", meaning:{en:"Argument — a line of reasoning used to support a claim.", tr:"Argüman — bir iddiayı desteklemek için kullanılan mantık zinciri.", fa:"استدلال — زنجیره منطقی‌ای که برای پشتیبانی از یک ادعا استفاده می‌شود.", es:"Una línea de razonamiento que sostiene una afirmación."}},
  {word:"la premisa", sentence:"Todo el ensayo se derrumba si la premisa inicial es falsa.", meaning:{en:"Premise — the basic assumption an argument is built on.", tr:"Öncül — bir argümanın üzerine kurulduğu temel varsayım.", fa:"مقدمه منطقی — فرض پایه‌ای که یک استدلال بر آن بنا می‌شود.", es:"La suposición básica sobre la que se construye un argumento."}},
  {word:"refutar", sentence:"El autor refuta punto por punto las críticas de sus opositores.", meaning:{en:"To refute — to prove an argument wrong with counter-evidence.", tr:"Çürütmek — karşı kanıtlarla bir argümanın yanlış olduğunu göstermek.", fa:"رد کردن — با شواهد متقابل نادرستی یک استدلال را نشان دادن.", es:"Demostrar con contraargumentos que una afirmación es incorrecta."}},
  {word:"la evidencia", sentence:"La evidencia empírica respalda su hipótesis inicial.", meaning:{en:"Evidence — the facts or data that support a claim.", tr:"Kanıt — bir iddiayı destekleyen olgular veya veriler.", fa:"شواهد — واقعیت‌ها یا داده‌هایی که از یک ادعا حمایت می‌کنند.", es:"Los hechos o datos que respaldan una afirmación."}},
  {word:"el matiz", sentence:"Hay que captar los matices del argumento para no simplificarlo en exceso.", meaning:{en:"Nuance — a subtle shade of meaning or distinction.", tr:"İnce ayrım — anlamda ince bir fark ya da ayrım.", fa:"ظرافت — تفاوتی ظریف در معنا.", es:"Una diferencia sutil de significado."}},
  {word:"la conclusión", sentence:"La conclusión retoma la tesis sin repetirla palabra por palabra.", meaning:{en:"Conclusion — the closing section that ties together an essay's central argument.", tr:"Sonuç — bir denemenin ana argümanını bir araya toplayan kapanış bölümü.", fa:"نتیجه‌گیری — بخش پایانی که استدلال اصلی یک مقاله را جمع‌بندی می‌کند.", es:"La sección final que une el argumento central de un ensayo."}},
  {word:"coherente", sentence:"El texto es coherente porque cada idea se conecta lógicamente con la siguiente.", meaning:{en:"Coherent — logically connected and easy to follow.", tr:"Tutarlı — mantıksal olarak bağlantılı ve takip edilmesi kolay.", fa:"منسجم — از نظر منطقی مرتبط و قابل پیگیری.", es:"Conectado de forma lógica y fácil de seguir."}},
  {word:"el enfoque", sentence:"El estudio adopta un enfoque interdisciplinario poco común.", meaning:{en:"Approach — the particular angle or method used to examine a topic.", tr:"Yaklaşım — bir konuyu incelemek için kullanılan özel açı ya da yöntem.", fa:"رویکرد — زاویه یا روش خاصی که برای بررسی یک موضوع استفاده می‌شود.", es:"El ángulo o método particular con el que se examina un tema."}},
  {word:"sintetizar", sentence:"Al final del capítulo, la autora sintetiza los hallazgos principales.", meaning:{en:"To synthesize — to combine separate ideas into a unified summary.", tr:"Sentezlemek — ayrı fikirleri birleşik bir özette bir araya getirmek.", fa:"جمع‌بندی کردن — یافته‌های جداگانه را در یک خلاصه یکپارچه گرد آوردن.", es:"Combinar ideas separadas en un resumen unificado."}}
]},

{id:"v-C1-2", level:"C1", category:"vocab", goals:["career","exam"], title:{en:"Diplomacy & International Relations", tr:"Diplomasi ve Uluslararası İlişkiler", fa:"دیپلماسی و روابط بین‌الملل", es:"Diplomacia y relaciones internacionales"}, cards:[
  {word:"la cumbre", sentence:"Los líderes se reunieron en la cumbre para discutir la crisis energética.", meaning:{en:"Summit — a high-level meeting between heads of state or leading officials.", tr:"Zirve — devlet başkanları veya üst düzey yetkililer arasındaki yüksek seviyeli toplantı.", fa:"نشست سران — دیدار سطح بالا میان روسای کشورها یا مقامات ارشد.", es:"Una reunión de alto nivel entre jefes de estado o altos funcionarios."}},
  {word:"el tratado", sentence:"Ambos países firmaron un tratado de cooperación económica.", meaning:{en:"Treaty — a formal written agreement between countries.", tr:"Antlaşma — ülkeler arasında resmi, yazılı bir anlaşma.", fa:"معاهده — توافق‌نامه رسمی و کتبی میان کشورها.", es:"Un acuerdo formal y escrito entre países."}},
  {word:"negociar", sentence:"Los diplomáticos negociaron durante toda la noche para evitar el conflicto.", meaning:{en:"To negotiate — to discuss something formally to reach an agreement.", tr:"Müzakere etmek — bir anlaşmaya varmak için resmi olarak görüşmek.", fa:"مذاکره کردن — بحث رسمی برای رسیدن به یک توافق.", es:"Discutir algo formalmente para llegar a un acuerdo."}},
  {word:"la soberanía", sentence:"El país defiende con firmeza su soberanía territorial.", meaning:{en:"Sovereignty — a nation's full authority to govern itself.", tr:"Egemenlik — bir ulusun kendini yönetme tam yetkisi.", fa:"حاکمیت — اختیار کامل یک ملت برای اداره خودش.", es:"La autoridad plena de una nación para gobernarse a sí misma."}},
  {word:"el embajador", sentence:"La nueva embajadora presentó sus credenciales al presidente.", meaning:{en:"Ambassador — a country's official representative abroad.", tr:"Büyükelçi — bir ülkenin yurt dışındaki resmi temsilcisi.", fa:"سفیر — نماینده رسمی یک کشور در خارج.", es:"El representante oficial de un país en el extranjero."}},
  {word:"las sanciones", sentence:"La comunidad internacional impuso sanciones económicas al régimen.", meaning:{en:"Sanctions — penalties imposed to pressure a country to change its behavior.", tr:"Yaptırımlar — bir ülkeyi tutumunu değiştirmeye zorlamak için uygulanan cezalar.", fa:"تحریم‌ها — مجازات‌هایی که برای وادار کردن یک کشور به تغییر رفتار اعمال می‌شود.", es:"Penalizaciones impuestas para presionar a un país a cambiar su conducta."}},
  {word:"mediar", sentence:"Un país neutral se ofreció a mediar entre las partes en conflicto.", meaning:{en:"To mediate — to help two sides reach an agreement as a neutral party.", tr:"Arabuluculuk yapmak — tarafsız bir taraf olarak iki tarafın anlaşmasına yardımcı olmak.", fa:"میانجی‌گری کردن — به‌عنوان طرف بی‌طرف به دو طرف در رسیدن به توافق کمک کردن.", es:"Ayudar a dos partes a llegar a un acuerdo como parte neutral."}},
  {word:"el consenso", sentence:"Tras horas de debate, los ministros alcanzaron un consenso.", meaning:{en:"Consensus — general agreement reached by a group.", tr:"Uzlaşı — bir grup tarafından ulaşılan genel anlaşma.", fa:"اجماع — توافق کلی که یک گروه به آن دست می‌یابد.", es:"Un acuerdo general alcanzado por un grupo."}},
  {word:"la delegación", sentence:"La delegación española llegó a la cumbre con una propuesta clara.", meaning:{en:"Delegation — a group of representatives sent to act on behalf of others.", tr:"Heyet — başkaları adına hareket etmek üzere gönderilen temsilciler grubu.", fa:"هیئت نمایندگی — گروهی از نمایندگان که برای نمایندگی از دیگران فرستاده شده‌اند.", es:"Un grupo de representantes enviado para actuar en nombre de otros."}},
  {word:"ratificar", sentence:"El Senado debe ratificar el acuerdo antes de que entre en vigor.", meaning:{en:"To ratify — to formally approve an agreement, making it official.", tr:"Onaylamak — bir anlaşmayı resmileştirmek üzere resmen kabul etmek.", fa:"تصویب کردن — به‌طور رسمی تأیید کردن یک توافق تا رسمیت یابد.", es:"Aprobar formalmente un acuerdo para que entre en vigor."}}
]},

{id:"v-C1-3", level:"C1", category:"vocab", goals:["exam","everyday"], title:{en:"Philosophy & Ethics", tr:"Felsefe ve Etik", fa:"فلسفه و اخلاق", es:"Filosofía y ética"}, cards:[
  {word:"el dilema", sentence:"El filósofo plantea un dilema moral sin solución sencilla.", meaning:{en:"Dilemma — a situation requiring a choice between equally difficult options.", tr:"İkilem — eşit derecede zor seçenekler arasında karar gerektiren durum.", fa:"دوراهی اخلاقی — موقعیتی که نیازمند انتخاب میان گزینه‌های به‌یک‌اندازه دشوار است.", es:"Una situación que exige elegir entre opciones igualmente difíciles."}},
  {word:"la moral", sentence:"Su moral personal choca con las normas de la sociedad en la que vive.", meaning:{en:"Morality — a person's principles of right and wrong.", tr:"Ahlak — bir kişinin doğru ve yanlışa dair ilkeleri.", fa:"اخلاق — اصول یک فرد درباره درست و نادرست.", es:"Los principios de una persona sobre lo correcto y lo incorrecto."}},
  {word:"el libre albedrío", sentence:"Los filósofos aún debaten si el libre albedrío realmente existe.", meaning:{en:"Free will — the ability to choose one's actions freely, without predetermination.", tr:"Özgür irade — önceden belirlenmeden kendi eylemlerini özgürce seçebilme yetisi.", fa:"اراده آزاد — توانایی انتخاب آزادانه اعمال خود، بدون از پیش تعیین‌شدگی.", es:"La capacidad de elegir las propias acciones libremente, sin predeterminación."}},
  {word:"cuestionar", sentence:"Un buen filósofo cuestiona incluso sus propias creencias más firmes.", meaning:{en:"To question — to challenge or doubt an idea instead of accepting it blindly.", tr:"Sorgulamak — bir fikri körü körüne kabul etmek yerine ona meydan okumak ya da şüphe etmek.", fa:"زیر سؤال بردن — به‌جای پذیرفتن کورکورانه یک ایده، آن را به چالش کشیدن.", es:"Desafiar o dudar de una idea en lugar de aceptarla ciegamente."}},
  {word:"la existencia", sentence:"El ensayo explora el sentido de la existencia humana.", meaning:{en:"Existence — the state or fact of being alive or real.", tr:"Varoluş — canlı ya da gerçek olma durumu.", fa:"هستی — حالت یا واقعیت زنده یا واقعی بودن.", es:"El estado o hecho de estar vivo o de ser real."}},
  {word:"el razonamiento", sentence:"Su razonamiento es impecable, aunque la conclusión resulte incómoda.", meaning:{en:"Reasoning — the logical process of thinking through an argument.", tr:"Muhakeme — bir argümanı düşünerek işleme mantıksal süreç.", fa:"استدلال — فرایند منطقی اندیشیدن درباره یک استدلال.", es:"El proceso lógico de pensar a través de un argumento."}},
  {word:"la virtud", sentence:"Aristóteles consideraba la moderación una virtud esencial.", meaning:{en:"Virtue — a positive moral quality or trait of character.", tr:"Erdem — olumlu bir ahlaki nitelik ya da karakter özelliği.", fa:"فضیلت — یک ویژگی یا صفت اخلاقی مثبت.", es:"Una cualidad o rasgo de carácter moralmente positivo."}},
  {word:"el relativismo", sentence:"El relativismo moral sostiene que no existen verdades éticas universales.", meaning:{en:"Relativism — the view that truth or morality depends on perspective, not on absolutes.", tr:"Görelilik — doğrunun ya da ahlakın mutlak değil, bakış açısına bağlı olduğu görüşü.", fa:"نسبی‌گرایی — دیدگاهی که می‌گوید حقیقت یا اخلاق به دیدگاه بستگی دارد، نه به مطلق‌ها.", es:"La postura de que la verdad o la moral dependen de la perspectiva, no de algo absoluto."}},
  {word:"la conciencia", sentence:"Actuó en contra de su conciencia y después se arrepintió.", meaning:{en:"Conscience — the inner sense of right and wrong that guides behavior.", tr:"Vicdan — davranışı yönlendiren doğru ve yanlışa dair içsel his.", fa:"وجدان — احساس درونی درست و نادرست که رفتار را هدایت می‌کند.", es:"El sentido interno de lo correcto y lo incorrecto que guía la conducta."}},
  {word:"trascender", sentence:"El arte, según ella, permite trascender los límites del lenguaje.", meaning:{en:"To transcend — to go beyond the usual or expected limits.", tr:"Aşmak, ötesine geçmek — olağan ya da beklenen sınırların ötesine geçmek.", fa:"فراتر رفتن — از حدود معمول یا مورد انتظار عبور کردن.", es:"Ir más allá de los límites habituales o esperados."}}
]},

{id:"v-C1-4", level:"C1", category:"vocab", goals:["career","exam"], title:{en:"Global Economy", tr:"Küresel Ekonomi", fa:"اقتصاد جهانی", es:"Economía global"}, cards:[
  {word:"la inflación", sentence:"La inflación erosiona el poder adquisitivo de los salarios.", meaning:{en:"Inflation — a general rise in prices that reduces purchasing power.", tr:"Enflasyon — satın alma gücünü azaltan genel fiyat artışı.", fa:"تورم — افزایش عمومی قیمت‌ها که قدرت خرید را کاهش می‌دهد.", es:"Un aumento general de precios que reduce el poder adquisitivo."}},
  {word:"el producto interno bruto", sentence:"El producto interno bruto del país creció un tres por ciento este año.", meaning:{en:"Gross domestic product (GDP) — the total value of goods and services a country produces.", tr:"Gayri safi yurt içi hasıla (GSYİH) — bir ülkenin ürettiği mal ve hizmetlerin toplam değeri.", fa:"تولید ناخالص داخلی — ارزش کل کالاها و خدماتی که یک کشور تولید می‌کند.", es:"El valor total de los bienes y servicios que produce un país."}},
  {word:"la desigualdad", sentence:"La desigualdad de ingresos ha aumentado en las últimas dos décadas.", meaning:{en:"Inequality — an unequal distribution of wealth, income, or opportunity.", tr:"Eşitsizlik — servet, gelir veya fırsatların adaletsiz dağılımı.", fa:"نابرابری — توزیع ناعادلانه ثروت، درآمد یا فرصت.", es:"Una distribución desigual de la riqueza, el ingreso o las oportunidades."}},
  {word:"el mercado emergente", sentence:"Muchas empresas buscan expandirse en mercados emergentes como el sudeste asiático.", meaning:{en:"Emerging market — a developing economy that is growing rapidly and industrializing.", tr:"Gelişmekte olan pazar — hızla büyüyen ve sanayileşen bir gelişmekte olan ekonomi.", fa:"بازار نوظهور — اقتصادی در حال توسعه که به‌سرعت رشد و صنعتی می‌شود.", es:"Una economía en desarrollo que crece rápidamente y se está industrializando."}},
  {word:"invertir", sentence:"Decidió invertir sus ahorros en fondos indexados.", meaning:{en:"To invest — to put money into something with the expectation of future profit.", tr:"Yatırım yapmak — gelecekte kâr beklentisiyle para koymak.", fa:"سرمایه‌گذاری کردن — گذاشتن پول در چیزی با انتظار سود آینده.", es:"Poner dinero en algo con la expectativa de obtener ganancias en el futuro."}},
  {word:"la deuda", sentence:"La deuda pública del país alcanzó un nivel histórico.", meaning:{en:"Debt — money that is owed to another party.", tr:"Borç — başka bir tarafa borçlu olunan para.", fa:"بدهی — پولی که به طرف دیگری بدهکار هستند.", es:"Dinero que se le debe a otra parte."}},
  {word:"la recesión", sentence:"Los economistas temen que la economía entre en recesión el próximo año.", meaning:{en:"Recession — a period of significant economic decline.", tr:"Durgunluk — önemli bir ekonomik gerileme dönemi.", fa:"رکود — دوره‌ای از افت اقتصادی چشمگیر.", es:"Un período de declive económico significativo."}},
  {word:"el arancel", sentence:"El gobierno impuso un nuevo arancel a las importaciones de acero.", meaning:{en:"Tariff — a tax imposed on imported or exported goods.", tr:"Gümrük vergisi — ithal veya ihraç edilen mallara uygulanan vergi.", fa:"تعرفه — مالیاتی که بر کالاهای وارداتی یا صادراتی اعمال می‌شود.", es:"Un impuesto sobre bienes importados o exportados."}},
  {word:"la oferta y la demanda", sentence:"Los precios se ajustan según la oferta y la demanda del mercado.", meaning:{en:"Supply and demand — the balance between how much of something is available and how much people want it.", tr:"Arz ve talep — bir şeyin ne kadar mevcut olduğu ile insanların onu ne kadar istediği arasındaki denge.", fa:"عرضه و تقاضا — تعادل میان میزان موجودی یک چیز و میزان تقاضای مردم برای آن.", es:"El equilibrio entre cuánto hay disponible de algo y cuánto lo quiere la gente."}},
  {word:"sostenible", sentence:"Las empresas buscan modelos de crecimiento más sostenibles a largo plazo.", meaning:{en:"Sustainable — able to continue over the long term without depleting resources.", tr:"Sürdürülebilir — kaynakları tüketmeden uzun vadede devam edebilen.", fa:"پایدار — قادر به ادامه در بلندمدت بدون از بین بردن منابع.", es:"Que puede continuar a largo plazo sin agotar los recursos."}}
]},

{id:"v-C1-5", level:"C1", category:"vocab", goals:["exam","everyday"], title:{en:"Literature & Criticism", tr:"Edebiyat ve Eleştiri", fa:"ادبیات و نقد", es:"Literatura y crítica"}, cards:[
  {word:"la trama", sentence:"La trama de la novela se desarrolla en tres ciudades distintas.", meaning:{en:"Plot — the sequence of events that make up a story.", tr:"Olay örgüsü — bir hikayeyi oluşturan olaylar dizisi.", fa:"طرح داستان — دنباله‌ای از رویدادها که یک داستان را می‌سازند.", es:"La secuencia de eventos que componen una historia."}},
  {word:"el narrador", sentence:"El narrador de la novela es un testigo poco confiable.", meaning:{en:"Narrator — the voice that tells the story.", tr:"Anlatıcı — hikayeyi anlatan ses.", fa:"راوی — صدایی که داستان را روایت می‌کند.", es:"La voz que cuenta la historia."}},
  {word:"la metáfora", sentence:"El poeta usa la metáfora del río para hablar del paso del tiempo.", meaning:{en:"Metaphor — a figure of speech that describes something as if it were something else.", tr:"Metafor — bir şeyi başka bir şeymiş gibi anlatan söz sanatı.", fa:"استعاره — آرایه‌ای ادبی که چیزی را طوری توصیف می‌کند که گویی چیز دیگری است.", es:"Una figura retórica que describe algo como si fuera otra cosa."}},
  {word:"el simbolismo", sentence:"El simbolismo del cuervo negro recorre toda la obra.", meaning:{en:"Symbolism — the use of objects or images to represent deeper ideas.", tr:"Sembolizm — daha derin fikirleri temsil etmek için nesne veya imgelerin kullanılması.", fa:"نمادگرایی — استفاده از اشیا یا تصاویر برای نمایش ایده‌های عمیق‌تر.", es:"El uso de objetos o imágenes para representar ideas más profundas."}},
  {word:"la prosa", sentence:"Su prosa es densa, pero recompensa al lector paciente.", meaning:{en:"Prose — ordinary written or spoken language, without a poetic structure.", tr:"Düzyazı — şiirsel bir yapısı olmayan sıradan yazılı veya sözlü dil.", fa:"نثر — زبان معمولی نوشتاری یا گفتاری، بدون ساختار شعری.", es:"El lenguaje escrito u oral ordinario, sin estructura poética."}},
  {word:"el desenlace", sentence:"El desenlace sorprende incluso a los lectores más atentos.", meaning:{en:"Ending — the final resolution of a story's plot.", tr:"Sonuç bölümü — bir hikayenin olay örgüsünün nihai çözümü.", fa:"فرجام — حل نهایی طرح یک داستان.", es:"La resolución final de la trama de una historia."}},
  {word:"verosímil", sentence:"Aunque es ficción, los personajes resultan totalmente verosímiles.", meaning:{en:"Believable — realistic enough to seem true.", tr:"İnandırıcı — gerçek gibi görünecek kadar gerçekçi.", fa:"باورپذیر — به اندازه کافی واقع‌گرایانه که راست به نظر برسد.", es:"Suficientemente realista como para parecer cierto."}},
  {word:"el protagonista", sentence:"El protagonista se enfrenta a un conflicto interno constante.", meaning:{en:"Protagonist — the main character of a story.", tr:"Başkahraman — bir hikayenin ana karakteri.", fa:"شخصیت اصلی — کاراکتر اصلی یک داستان.", es:"El personaje principal de una historia."}},
  {word:"la crítica literaria", sentence:"La crítica literaria tardó años en reconocer el valor de esta autora.", meaning:{en:"Literary criticism — the analysis and evaluation of literary works.", tr:"Edebiyat eleştirisi — edebi eserlerin analizi ve değerlendirilmesi.", fa:"نقد ادبی — تحلیل و ارزیابی آثار ادبی.", es:"El análisis y la evaluación de obras literarias."}},
  {word:"aludir", sentence:"El autor alude a la mitología griega sin nombrarla directamente.", meaning:{en:"To allude — to refer to something indirectly.", tr:"İma etmek, gönderme yapmak — bir şeye dolaylı olarak atıfta bulunmak.", fa:"اشاره کردن — به چیزی به‌طور غیرمستقیم اشاره کردن.", es:"Referirse a algo de manera indirecta."}}
]},

{id:"v-C1-6", level:"C1", category:"vocab", goals:["career","exam"], title:{en:"Media & Advanced Journalism", tr:"Medya ve İleri Düzey Gazetecilik", fa:"رسانه و روزنامه‌نگاری پیشرفته", es:"Medios y periodismo avanzado"}, cards:[
  {word:"la primicia", sentence:"El periódico obtuvo la primicia gracias a una fuente anónima.", meaning:{en:"Scoop — an exclusive news story reported before anyone else.", tr:"Özel haber (scoop) — başka herkesten önce haberleştirilen özel bir haber.", fa:"خبر انحصاری — خبری که قبل از هرکس دیگری منتشر شده.", es:"Una noticia exclusiva publicada antes que cualquier otro medio."}},
  {word:"el editorial", sentence:"El editorial del diario critica la nueva política migratoria.", meaning:{en:"Editorial — an article expressing the publication's official opinion.", tr:"Başyazı — yayının resmi görüşünü ifade eden makale.", fa:"سرمقاله — مقاله‌ای که نظر رسمی نشریه را بیان می‌کند.", es:"Un artículo que expresa la opinión oficial de la publicación."}},
  {word:"la censura", sentence:"Varios periodistas denuncian la censura ejercida por el gobierno.", meaning:{en:"Censorship — the suppression of information or speech.", tr:"Sansür — bilgi veya ifadenin bastırılması.", fa:"سانسور — سرکوب اطلاعات یا بیان.", es:"La supresión de información o expresión."}},
  {word:"imparcial", sentence:"Un buen reportero debe presentar los hechos de manera imparcial.", meaning:{en:"Impartial — not favoring one side over another.", tr:"Tarafsız — bir tarafı diğerine kayırmayan.", fa:"بی‌طرف — طرفدار یک طرف بر طرف دیگر نبودن.", es:"Que no favorece a un lado sobre otro."}},
  {word:"la fuente", sentence:"El artículo cita varias fuentes que prefirieron mantener el anonimato.", meaning:{en:"Source — a person or document that provides information for a story.", tr:"Kaynak — bir habere bilgi sağlayan kişi veya belge.", fa:"منبع — فرد یا سندی که اطلاعاتی برای یک خبر فراهم می‌کند.", es:"Una persona o documento que aporta información para una noticia."}},
  {word:"el titular", sentence:"El titular exageraba los hechos para captar más lectores.", meaning:{en:"Headline — the title of a news article, meant to grab attention.", tr:"Manşet — dikkat çekmeyi amaçlayan bir haberin başlığı.", fa:"تیتر — عنوان یک مقاله خبری که برای جلب توجه طراحی شده.", es:"El título de un artículo de noticias, pensado para captar la atención."}},
  {word:"la desinformación", sentence:"La desinformación se propaga más rápido en las redes sociales.", meaning:{en:"Disinformation — false information spread deliberately to mislead.", tr:"Dezenformasyon — insanları yanıltmak için kasıtlı olarak yayılan yanlış bilgi.", fa:"اطلاعات نادرست عمدی — اطلاعات غلطی که عمداً برای گمراه کردن پخش می‌شود.", es:"Información falsa difundida deliberadamente para engañar."}},
  {word:"investigar", sentence:"El periodista pasó meses investigando el caso de corrupción.", meaning:{en:"To investigate — to look into something carefully to uncover facts.", tr:"Araştırmak, soruşturmak — gerçekleri ortaya çıkarmak için bir şeyi dikkatlice incelemek.", fa:"تحقیق کردن — به‌دقت بررسی کردن چیزی برای کشف حقایق.", es:"Examinar algo cuidadosamente para descubrir los hechos."}},
  {word:"la audiencia", sentence:"El programa perdió audiencia tras el cambio de horario.", meaning:{en:"Audience — the group of people watching, reading, or listening to something.", tr:"İzleyici kitlesi — bir şeyi izleyen, okuyan veya dinleyen kişiler grubu.", fa:"مخاطبان — گروهی از افرادی که چیزی را تماشا، مطالعه یا گوش می‌دهند.", es:"El grupo de personas que ve, lee o escucha algo."}},
  {word:"difundir", sentence:"La cadena decidió difundir la noticia en todos sus canales.", meaning:{en:"To broadcast — to distribute information widely.", tr:"Yaymak, yayınlamak — bilgiyi geniş çapta dağıtmak.", fa:"پخش کردن — توزیع گسترده اطلاعات.", es:"Distribuir información ampliamente."}}
]},

{id:"v-C1-7", level:"C1", category:"vocab", goals:["exam","career"], title:{en:"Advanced Science & Research", tr:"İleri Bilim ve Araştırma", fa:"علم پیشرفته و پژوهش", es:"Ciencia avanzada e investigación"}, cards:[
  {word:"la hipótesis", sentence:"La hipótesis inicial fue rechazada tras analizar los datos.", meaning:{en:"Hypothesis — a proposed explanation to be tested through research.", tr:"Hipotez — araştırmayla test edilmek üzere önerilen açıklama.", fa:"فرضیه — توضیحی پیشنهادی که قرار است از طریق پژوهش آزموده شود.", es:"Una explicación propuesta que se pone a prueba mediante la investigación."}},
  {word:"el experimento", sentence:"El experimento se repitió tres veces para confirmar los resultados.", meaning:{en:"Experiment — a controlled test used to examine a hypothesis.", tr:"Deney — bir hipotezi incelemek için kullanılan kontrollü test.", fa:"آزمایش — تست کنترل‌شده‌ای که برای بررسی یک فرضیه استفاده می‌شود.", es:"Una prueba controlada que se usa para examinar una hipótesis."}},
  {word:"la variable", sentence:"Los investigadores controlaron todas las variables externas posibles.", meaning:{en:"Variable — a factor that can change and affect an experiment's results.", tr:"Değişken — değişebilen ve bir deneyin sonuçlarını etkileyebilen faktör.", fa:"متغیر — عاملی که می‌تواند تغییر کند و بر نتایج یک آزمایش تأثیر بگذارد.", es:"Un factor que puede cambiar y afectar los resultados de un experimento."}},
  {word:"los datos", sentence:"Los datos recopilados abarcan más de diez años de observaciones.", meaning:{en:"Data — facts and statistics collected for analysis.", tr:"Veri — analiz için toplanan olgular ve istatistikler.", fa:"داده‌ها — واقعیت‌ها و آمارهایی که برای تحلیل جمع‌آوری شده‌اند.", es:"Hechos y estadísticas recopilados para su análisis."}},
  {word:"la muestra", sentence:"El estudio se basó en una muestra de dos mil participantes.", meaning:{en:"Sample — a subset selected to represent a larger group in research.", tr:"Örneklem — araştırmada daha büyük bir grubu temsil etmek için seçilen alt küme.", fa:"نمونه — زیرمجموعه‌ای که برای نمایندگی گروهی بزرگ‌تر در پژوهش انتخاب می‌شود.", es:"Un subconjunto seleccionado para representar a un grupo más grande en una investigación."}},
  {word:"comprobar", sentence:"Los científicos aún deben comprobar si el efecto se mantiene a largo plazo.", meaning:{en:"To verify — to confirm that something is true through evidence.", tr:"Doğrulamak — bir şeyin kanıtlarla gerçek olduğunu onaylamak.", fa:"تأیید کردن — تأیید درستی چیزی از طریق شواهد.", es:"Confirmar que algo es cierto mediante evidencia."}},
  {word:"el hallazgo", sentence:"El hallazgo podría cambiar por completo el tratamiento de la enfermedad.", meaning:{en:"Finding — a significant result or discovery from research.", tr:"Bulgu — araştırmadan elde edilen önemli bir sonuç veya keşif.", fa:"یافته — نتیجه یا کشف مهمی که از پژوهش به دست می‌آید.", es:"Un resultado o descubrimiento significativo de una investigación."}},
  {word:"la revisión por pares", sentence:"El artículo pasó por un riguroso proceso de revisión por pares.", meaning:{en:"Peer review — the evaluation of research by other experts in the field before publication.", tr:"Hakem denetimi — bir araştırmanın yayınlanmadan önce alandaki diğer uzmanlar tarafından değerlendirilmesi.", fa:"داوری همتا — ارزیابی یک پژوهش توسط سایر متخصصان همان حوزه پیش از انتشار.", es:"La evaluación de una investigación por otros expertos del campo antes de su publicación."}},
  {word:"replicar", sentence:"Otros laboratorios no lograron replicar los resultados del estudio original.", meaning:{en:"To replicate — to repeat a study to see if the same results occur.", tr:"Tekrarlamak — aynı sonuçların ortaya çıkıp çıkmadığını görmek için bir çalışmayı tekrarlamak.", fa:"تکرار کردن — تکرار یک مطالعه برای دیدن اینکه آیا همان نتایج به دست می‌آید.", es:"Repetir un estudio para ver si se obtienen los mismos resultados."}},
  {word:"el algoritmo", sentence:"El algoritmo procesa millones de datos en cuestión de segundos.", meaning:{en:"Algorithm — a set of rules or steps a computer follows to solve a problem.", tr:"Algoritma — bir bilgisayarın bir sorunu çözmek için izlediği kurallar veya adımlar dizisi.", fa:"الگوریتم — مجموعه‌ای از قوانین یا مراحل که یک رایانه برای حل یک مسئله دنبال می‌کند.", es:"Un conjunto de reglas o pasos que sigue una computadora para resolver un problema."}}
]},

{id:"v-C1-8", level:"C1", category:"vocab", goals:["travel","everyday"], title:{en:"Contemporary Art", tr:"Çağdaş Sanat", fa:"هنر معاصر", es:"Arte contemporáneo"}, cards:[
  {word:"la instalación", sentence:"La instalación ocupa toda la sala principal del museo.", meaning:{en:"Installation — a large-scale, often immersive artwork made for a specific space.", tr:"Enstalasyon — belirli bir mekân için yapılan, genellikle sürükleyici, büyük ölçekli sanat eseri.", fa:"نصب هنری — اثر هنری بزرگ‌مقیاس و اغلب فراگیر که برای فضایی خاص ساخته می‌شود.", es:"Una obra de arte a gran escala, a menudo inmersiva, hecha para un espacio específico."}},
  {word:"la vanguardia", sentence:"El movimiento formó parte de la vanguardia artística de los años sesenta.", meaning:{en:"Avant-garde — art that is experimental and ahead of its time.", tr:"Avangart — deneysel ve zamanının ötesinde olan sanat.", fa:"آوانگارد — هنر تجربی و پیشرو نسبت به زمان خودش.", es:"Arte experimental que está adelantado a su época."}},
  {word:"el lienzo", sentence:"El pintor cubrió el lienzo con capas de color intenso.", meaning:{en:"Canvas — the fabric surface a painting is created on.", tr:"Tuval — bir resmin üzerinde yapıldığı kumaş yüzey.", fa:"بوم نقاشی — سطح پارچه‌ای که یک نقاشی روی آن ساخته می‌شود.", es:"La superficie de tela sobre la que se crea una pintura."}},
  {word:"la exposición", sentence:"La exposición reúne obras de artistas latinoamericanos emergentes.", meaning:{en:"Exhibition — a public display of artworks.", tr:"Sergi — sanat eserlerinin halka açık sergilenmesi.", fa:"نمایشگاه — ارائه عمومی آثار هنری.", es:"Una muestra pública de obras de arte."}},
  {word:"provocador", sentence:"Su obra más provocadora generó un debate nacional.", meaning:{en:"Provocative — deliberately intended to challenge or unsettle viewers.", tr:"Kışkırtıcı — izleyicileri kasıtlı olarak sarsmak ya da meydan okumak amacıyla yapılan.", fa:"تحریک‌آمیز — به‌عمد قصد به چالش کشیدن یا آشفته کردن بینندگان.", es:"Que busca deliberadamente desafiar o inquietar a quien lo observa."}},
  {word:"la crítica de arte", sentence:"La crítica de arte calificó la muestra de revolucionaria.", meaning:{en:"Art criticism — the analysis and evaluation of visual artworks.", tr:"Sanat eleştirisi — görsel sanat eserlerinin analizi ve değerlendirilmesi.", fa:"نقد هنری — تحلیل و ارزیابی آثار هنری تجسمی.", es:"El análisis y la evaluación de obras de arte visual."}},
  {word:"la obra maestra", sentence:"Muchos consideran este mural la obra maestra del artista.", meaning:{en:"Masterpiece — an artist's finest or most celebrated work.", tr:"Başyapıt — bir sanatçının en iyi veya en ünlü eseri.", fa:"شاهکار — بهترین یا مشهورترین اثر یک هنرمند.", es:"La obra más destacada o celebrada de un artista."}},
  {word:"abstracto", sentence:"Su estilo abstracto rechaza cualquier representación literal de la realidad.", meaning:{en:"Abstract — art that does not attempt to represent reality accurately.", tr:"Soyut — gerçekliği doğru bir şekilde temsil etmeye çalışmayan sanat.", fa:"انتزاعی — هنری که سعی نمی‌کند واقعیت را دقیق بازنمایی کند.", es:"Arte que no intenta representar la realidad de forma literal."}},
  {word:"el curador", sentence:"La curadora seleccionó cada pieza con una narrativa en mente.", meaning:{en:"Curator — the person who selects and organizes works for an exhibition.", tr:"Küratör — bir sergi için eserleri seçen ve düzenleyen kişi.", fa:"کیوریتور — فردی که آثار را برای یک نمایشگاه انتخاب و سازمان‌دهی می‌کند.", es:"La persona que selecciona y organiza las obras para una exposición."}},
  {word:"la performance", sentence:"La artista realizó una performance de seis horas frente al público.", meaning:{en:"Performance art — live art in which the artist's actions are the artwork itself.", tr:"Performans sanatı — sanatçının eylemlerinin bizzat sanat eseri olduğu canlı sanat.", fa:"هنر اجرا — هنر زنده‌ای که در آن اعمال هنرمند خودِ اثر هنری است.", es:"Arte en vivo en el que las acciones del artista son la obra misma."}}
]},

{id:"v-C1-9", level:"C1", category:"vocab", goals:["immigration","everyday"], title:{en:"Society & Cultural Change", tr:"Toplum ve Kültürel Değişim", fa:"جامعه و تغییر فرهنگی", es:"Sociedad y cambio cultural"}, cards:[
  {word:"la globalización", sentence:"La globalización ha transformado la manera en que las culturas interactúan.", meaning:{en:"Globalization — the growing interconnection of economies and cultures worldwide.", tr:"Küreselleşme — dünya çapında ekonomilerin ve kültürlerin giderek artan birbirine bağlılığı.", fa:"جهانی‌شدن — به‌هم‌پیوستگی روزافزون اقتصادها و فرهنگ‌ها در سراسر جهان.", es:"La creciente interconexión de economías y culturas en todo el mundo."}},
  {word:"la identidad", sentence:"Muchos inmigrantes reconstruyen su identidad al vivir entre dos culturas.", meaning:{en:"Identity — a person's sense of who they are, shaped by culture, values, and experience.", tr:"Kimlik — kültür, değerler ve deneyimle şekillenen, bir kişinin kim olduğuna dair algısı.", fa:"هویت — حس یک فرد از اینکه کیست، که با فرهنگ، ارزش‌ها و تجربه شکل می‌گیرد.", es:"El sentido que tiene una persona de quién es, moldeado por la cultura, los valores y la experiencia."}},
  {word:"el prejuicio", sentence:"El prejuicio suele nacer del desconocimiento, no de la experiencia.", meaning:{en:"Prejudice — an unfair, preconceived opinion not based on experience.", tr:"Önyargı — deneyime dayanmayan, adaletsiz ve önceden oluşmuş görüş.", fa:"پیش‌داوری — نظری ناعادلانه و از پیش‌تعیین‌شده که بر پایه تجربه نیست.", es:"Una opinión injusta y preconcebida que no se basa en la experiencia."}},
  {word:"la inclusión", sentence:"La empresa promueve políticas activas de inclusión laboral.", meaning:{en:"Inclusion — the practice of ensuring everyone feels welcomed and valued.", tr:"Kapsayıcılık — herkesin karşılanmış ve değerli hissetmesini sağlama pratiği.", fa:"فراگیری — رویه‌ای برای اطمینان از اینکه همه احساس پذیرفته‌شدن و ارزشمندی می‌کنند.", es:"La práctica de asegurar que todos se sientan bienvenidos y valorados."}},
  {word:"la brecha generacional", sentence:"La brecha generacional se nota especialmente en el uso de la tecnología.", meaning:{en:"Generation gap — the differences in attitudes and values between age groups.", tr:"Kuşak farkı — yaş grupları arasındaki tutum ve değer farklılıkları.", fa:"شکاف نسلی — تفاوت‌های نگرشی و ارزشی میان گروه‌های سنی.", es:"Las diferencias de actitudes y valores entre grupos de edad."}},
  {word:"adaptarse", sentence:"Le costó adaptarse a las nuevas costumbres del país.", meaning:{en:"To adapt — to adjust to a new environment or set of circumstances.", tr:"Uyum sağlamak — yeni bir ortama veya koşullara alışmak.", fa:"سازگار شدن — تطبیق یافتن با محیط یا شرایط جدید.", es:"Ajustarse a un nuevo entorno o conjunto de circunstancias."}},
  {word:"la costumbre", sentence:"Es costumbre en muchos países saludar con dos besos.", meaning:{en:"Custom — a traditional practice common within a society or culture.", tr:"Gelenek — bir toplum veya kültürde yaygın olan geleneksel uygulama.", fa:"رسم — رویه‌ای سنتی که در یک جامعه یا فرهنگ رایج است.", es:"Una práctica tradicional común dentro de una sociedad o cultura."}},
  {word:"el estereotipo", sentence:"Los medios a menudo perpetúan estereotipos dañinos.", meaning:{en:"Stereotype — an oversimplified, widely held idea about a group of people.", tr:"Klişe — bir grup insan hakkında aşırı basitleştirilmiş, yaygın kanı.", fa:"کلیشه — ایده‌ای بیش‌ازحد ساده‌شده و رایج درباره گروهی از افراد.", es:"Una idea excesivamente simplificada y muy extendida sobre un grupo de personas."}},
  {word:"la diversidad", sentence:"La diversidad cultural de la ciudad se refleja en su gastronomía.", meaning:{en:"Diversity — the presence of a wide variety of people, backgrounds, or ideas.", tr:"Çeşitlilik — çok çeşitli insanların, geçmişlerin veya fikirlerin varlığı.", fa:"تنوع — حضور طیف گسترده‌ای از افراد، پیشینه‌ها یا ایده‌ها.", es:"La presencia de una amplia variedad de personas, orígenes o ideas."}},
  {word:"arraigado", sentence:"Es una tradición profundamente arraigada en la cultura local.", meaning:{en:"Deeply rooted — firmly established and hard to change.", tr:"Kök salmış — sağlam biçimde yerleşmiş ve değiştirilmesi zor.", fa:"ریشه‌دار — به‌شدت جاافتاده و دشوار برای تغییر.", es:"Firmemente establecido y difícil de cambiar."}}
]},

{id:"v-C1-10", level:"C1", category:"vocab", goals:["career"], title:{en:"Negotiation & Leadership", tr:"Müzakere ve Liderlik", fa:"مذاکره و رهبری", es:"Negociación y liderazgo"}, cards:[
  {word:"liderar", sentence:"Fue elegida para liderar el equipo durante la fusión de las empresas.", meaning:{en:"To lead — to guide or direct a group of people.", tr:"Liderlik etmek, yönetmek — bir grup insanı yönlendirmek veya idare etmek.", fa:"رهبری کردن — هدایت یا رهبری یک گروه از افراد.", es:"Guiar o dirigir a un grupo de personas."}},
  {word:"la estrategia", sentence:"Su estrategia de negociación se basó en escuchar antes de hablar.", meaning:{en:"Strategy — a carefully planned approach to achieving a goal.", tr:"Strateji — bir hedefe ulaşmak için dikkatle planlanmış yaklaşım.", fa:"راهبرد — رویکردی با دقت برنامه‌ریزی‌شده برای رسیدن به یک هدف.", es:"Un enfoque cuidadosamente planeado para alcanzar un objetivo."}},
  {word:"ceder", sentence:"Ninguna de las partes quería ceder en el precio final.", meaning:{en:"To concede — to give up part of one's position in a negotiation.", tr:"Taviz vermek — bir müzakerede kendi konumunun bir kısmından vazgeçmek.", fa:"کوتاه آمدن — دست کشیدن از بخشی از موضع خود در یک مذاکره.", es:"Renunciar a parte de la propia postura en una negociación."}},
  {word:"el punto muerto", sentence:"Las conversaciones llegaron a un punto muerto tras semanas de debate.", meaning:{en:"Deadlock — a situation where no progress can be made.", tr:"Çıkmaz nokta — ilerleme kaydedilemeyen durum.", fa:"بن‌بست — وضعیتی که هیچ پیشرفتی در آن ممکن نیست.", es:"Una situación en la que no se puede avanzar."}},
  {word:"persuadir", sentence:"Logró persuadir a los inversores con datos concretos.", meaning:{en:"To persuade — to convince someone through argument or reasoning.", tr:"İkna etmek — birini argüman veya mantık yoluyla ikna etmek.", fa:"متقاعد کردن — قانع کردن کسی از طریق استدلال یا منطق.", es:"Convencer a alguien mediante argumentos o razonamiento."}},
  {word:"la propuesta", sentence:"La propuesta final incluía condiciones más favorables para ambas partes.", meaning:{en:"Proposal — a formal suggestion put forward for consideration.", tr:"Teklif — değerlendirilmek üzere sunulan resmi öneri.", fa:"پیشنهاد — پیشنهاد رسمی که برای بررسی ارائه می‌شود.", es:"Una sugerencia formal presentada para su consideración."}},
  {word:"comprometerse", sentence:"El director se comprometió a revisar la política salarial.", meaning:{en:"To commit — to formally promise to do something.", tr:"Taahhüt etmek — bir şeyi yapmayı resmen söz vermek.", fa:"متعهد شدن — رسماً قول انجام کاری را دادن.", es:"Prometer formalmente hacer algo."}},
  {word:"la toma de decisiones", sentence:"La toma de decisiones en la empresa se volvió más participativa.", meaning:{en:"Decision-making — the process of choosing between options.", tr:"Karar alma — seçenekler arasından seçim yapma süreci.", fa:"تصمیم‌گیری — فرایند انتخاب میان گزینه‌ها.", es:"El proceso de elegir entre opciones."}},
  {word:"delegar", sentence:"Un buen líder sabe cuándo delegar tareas en su equipo.", meaning:{en:"To delegate — to assign responsibility or tasks to someone else.", tr:"Devretmek — sorumluluk veya görevleri başkasına vermek.", fa:"تفویض کردن — واگذار کردن مسئولیت یا وظایف به شخص دیگر.", es:"Asignar responsabilidades o tareas a otra persona."}},
  {word:"el liderazgo", sentence:"Demostró un liderazgo firme durante la crisis financiera.", meaning:{en:"Leadership — the ability and act of guiding a group or organization.", tr:"Liderlik — bir grubu veya kuruluşu yönlendirme yeteneği ve eylemi.", fa:"رهبری — توانایی و عمل هدایت یک گروه یا سازمان.", es:"La capacidad y el acto de guiar a un grupo u organización."}}
]},

{id:"slang-C1", level:"C1", category:"slang", goals:["everyday","travel"], title:{en:"Daily Slang", tr:"Günlük Argo", fa:"اصطلاحات روزمره", es:"Argot cotidiano"}, cards:[
  {word:"estar hasta las narices", sentence:"Estoy hasta las narices de tanta burocracia.", meaning:{en:"To be totally fed up with something.", tr:"Bir şeyden resmen bıkmış, gına gelmiş olmak.", fa:"به‌کل از چیزی خسته و کلافه بودن.", es:"Estar completamente harto de algo."}, note:{en:"Literally «up to your nostrils» — a colorful, very common way to say you've completely had enough.", tr:"Kelimenin tam anlamıyla «burnuna kadar gelmiş» demektir — bir şeye resmen tahammülünün kalmadığını söylemenin renkli ve çok yaygın bir yolu.", fa:"به‌معنای واقعی «تا بینی‌ات پر شدن» — راهی رنگین و بسیار رایج برای گفتن اینکه دیگر واقعاً تحملت تمام شده.", es:"Literalmente «hasta las narices» — una forma colorida y muy común de decir que ya no aguantas más algo."}},
  {word:"ser un rollo", sentence:"La reunión de hoy fue un rollo tremendo.", meaning:{en:"To be boring or a drag.", tr:"Sıkıcı olmak, can sıkıcı olmak.", fa:"خسته‌کننده و کسل‌کننده بودن.", es:"Ser aburrido o pesado."}, note:{en:"Used to describe anything tedious — a meeting, a movie, a chore.", tr:"Toplantı, film veya bir iş gibi sıkıcı herhangi bir şeyi tanımlamak için kullanılır.", fa:"برای توصیف هرچیز کسل‌کننده استفاده می‌شود — یک جلسه، یک فیلم، یک کار روزمره.", es:"Se usa para describir cualquier cosa tediosa — una reunión, una película, una tarea."}},
  {word:"flipar", sentence:"¡Flipé cuando me dijeron el precio del alquiler!", meaning:{en:"To be blown away or totally shocked (Spain).", tr:"Şok olmak, çok şaşırmak (İspanya).", fa:"شدیداً شگفت‌زده یا شوکه شدن (اسپانیا).", es:"Sorprenderse muchísimo o quedar impactado (España)."}, note:{en:"Extremely common in Spain for both good and bad surprises — context tells you which.", tr:"İspanya'da hem iyi hem kötü sürprizler için son derece yaygındır — hangisi olduğunu bağlam belirler.", fa:"در اسپانیا برای شگفتی‌های خوب و بد به یک اندازه بسیار رایج است — بافت جمله مشخص می‌کند کدام است.", es:"Extremadamente común en España tanto para sorpresas buenas como malas — el contexto indica cuál es."}},
  {word:"estar en la luna", sentence:"Perdona, no te escuché, estaba en la luna.", meaning:{en:"To be spaced out or not paying attention.", tr:"Dalgın olmak, hiç dikkat etmemek.", fa:"کاملاً حواس‌پرت بودن.", es:"Estar completamente distraído."}, note:{en:"Interchangeable with estar en las nubes in most everyday speech.", tr:"Günlük konuşmada çoğunlukla estar en las nubes ile birbirinin yerine kullanılabilir.", fa:"در اغلب گفتار روزمره با estar en las nubes قابل تعویض است.", es:"Se puede intercambiar con estar en las nubes en la mayoría del habla cotidiana."}},
  {word:"curro / chamba", sentence:"No puedo salir esta noche, mañana tengo curro temprano.", meaning:{en:"Job / work (Spain: curro, Mexico: chamba).", tr:"İş, çalışma (İspanya: curro, Meksika: chamba).", fa:"کار (اسپانیا: curro، مکزیک: chamba).", es:"Trabajo (España: curro, México: chamba)."}, note:{en:"A casual substitute for trabajo — heard constantly among friends and coworkers.", tr:"Trabajo kelimesinin gündelik bir muadili — arkadaşlar ve iş arkadaşları arasında sürekli duyulur.", fa:"جایگزینی خودمانی برای trabajo — دائماً بین دوستان و همکاران شنیده می‌شود.", es:"Un sustituto informal de trabajo — se escucha constantemente entre amigos y compañeros de trabajo."}},
  {word:"quedar", sentence:"¿Quedamos a las ocho frente al cine?", meaning:{en:"To arrange to meet up with someone.", tr:"Biriyle buluşmak üzere anlaşmak.", fa:"قرار گذاشتن برای دیدن کسی.", es:"Ponerse de acuerdo para verse con alguien."}, note:{en:"A core everyday verb for making plans — quedar con alguien means to make plans to meet.", tr:"Plan yapmak için temel bir günlük fiil — quedar con alguien, biriyle buluşmak için plan yapmak demektir.", fa:"فعلی اصلی و روزمره برای برنامه‌ریزی — quedar con alguien یعنی برنامه‌ریزی برای دیدن کسی.", es:"Un verbo cotidiano esencial para hacer planes — quedar con alguien significa acordar verse."}},
  {word:"menudo + sustantivo", sentence:"¡Menudo lío se armó en la oficina hoy!", meaning:{en:"What a... (used to emphasize, often ironically).", tr:"Ne biçim... (genellikle ironik olarak vurgu yapmak için kullanılır).", fa:"چه... (اغلب برای تأکید، به‌طور کنایه‌آمیز استفاده می‌شود).", es:"Vaya... (se usa para enfatizar, a menudo con ironía)."}, note:{en:"Placed before a noun for emphasis, often sarcastic — menudo lío means what a mess.", tr:"Vurgu için bir ismin önüne konur — genellikle alaycıdır: menudo lío, ne biçim karmaşa demektir.", fa:"برای تأکید قبل از یک اسم می‌آید — اغلب کنایه‌آمیز: menudo lío یعنی چه شلوغی‌ای.", es:"Se coloca antes de un sustantivo para dar énfasis — a menudo con sarcasmo: menudo lío significa vaya desorden."}},
  {word:"dar la lata", sentence:"Deja de dar la lata con el mismo tema.", meaning:{en:"To pester or nag someone repeatedly.", tr:"Birini sürekli sıkıştırmak, dırdır etmek.", fa:"مدام کسی را اذیت کردن یا غر زدن.", es:"Molestar o insistir repetidamente sobre algo."}, note:{en:"Literally to give the tin can — a playful way to complain about someone being annoying.", tr:"Kelimenin tam anlamıyla teneke kutuyu vermek — birinin sinir bozucu olmasından şakayla şikayet etmenin bir yolu.", fa:"به‌معنای واقعی «قوطی حلبی دادن» — راهی شوخ‌طبعانه برای شکایت از آزاردهنده بودن کسی.", es:"Literalmente dar la lata — una forma juguetona de quejarse de que alguien es pesado."}},
  {word:"ponerse las pilas", sentence:"Si quieres aprobar el examen, tienes que ponerte las pilas.", meaning:{en:"To get one's act together and start putting in effort.", tr:"Kendine çekidüzen vermek, işe koyulmak.", fa:"جدی شدن و شروع به تلاش کردن.", es:"Empezar a esforzarse en serio, espabilarse."}, note:{en:"Literally to put in your batteries — a lively way to tell someone to get moving.", tr:"Kelimenin tam anlamıyla pilleri takmak — birine harekete geçmesini söylemenin canlı bir yolu.", fa:"به‌معنای واقعی «باتری‌هایت را بگذار» — راهی پرانرژی برای گفتن به کسی که دست‌به‌کار شود.", es:"Literalmente ponerse las pilas — una forma animada de decirle a alguien que se mueva."}},
  {word:"caer bien / caer mal", sentence:"Tu amigo me cayó muy bien desde el primer momento.", meaning:{en:"To make a good or bad impression on someone.", tr:"Birine iyi veya kötü izlenim bırakmak.", fa:"روی کسی تأثیر خوب یا بد گذاشتن.", es:"Causarle a alguien una buena o mala impresión."}, note:{en:"Different from gustar — caer bien is specifically about how likable a person seems.", tr:"Gustar'dan farklıdır — caer bien özellikle bir kişinin ne kadar sevimli göründüğüyle ilgilidir.", fa:"با gustar فرق دارد — caer bien مشخصاً درباره این است که یک فرد چقدر دوست‌داشتنی به نظر می‌رسد.", es:"Es distinto de gustar — caer bien se refiere específicamente a lo simpática que parece una persona."}}
]}
,
{id:"v-B1-1", level:"B1", category:"vocab", goals:["everyday","exam"], title:{en:"Environment", tr:"Çevre", fa:"محیط زیست", es:"Medio ambiente"}, cards:[
  {word:"el medio ambiente", sentence:"Debemos cuidar el medio ambiente para las próximas generaciones.", meaning:{en:"The environment.", tr:"Çevre.", fa:"محیط زیست.", es:"El conjunto de condiciones naturales que nos rodean."}},
  {word:"el cambio climático", sentence:"El cambio climático está afectando a todo el planeta.", meaning:{en:"Climate change.", tr:"İklim değişikliği.", fa:"تغییرات آب‌وهوایی.", es:"La alteración a largo plazo del clima de la Tierra."}},
  {word:"la contaminación", sentence:"La contaminación del aire es un problema grave en las ciudades grandes.", meaning:{en:"Pollution.", tr:"Kirlilik.", fa:"آلودگی.", es:"La presencia de sustancias dañinas en el aire, el agua o la tierra."}},
  {word:"reciclar", sentence:"En mi casa reciclamos el papel, el vidrio y el plástico.", meaning:{en:"To recycle.", tr:"Geri dönüştürmek.", fa:"بازیافت کردن.", es:"Volver a usar materiales para reducir la basura."}},
  {word:"la energía renovable", sentence:"Muchos países invierten en energía renovable como la solar y la eólica.", meaning:{en:"Renewable energy.", tr:"Yenilenebilir enerji.", fa:"انرژی تجدیدپذیر.", es:"Energía que proviene de fuentes naturales que no se agotan, como el sol o el viento."}},
  {word:"el calentamiento global", sentence:"El calentamiento global provoca el derretimiento de los glaciares.", meaning:{en:"Global warming.", tr:"Küresel ısınma.", fa:"گرمایش جهانی.", es:"El aumento de la temperatura media de la Tierra."}},
  {word:"sostenible", sentence:"Buscamos un estilo de vida más sostenible.", meaning:{en:"Sustainable.", tr:"Sürdürülebilir.", fa:"پایدار.", es:"Que se puede mantener sin agotar los recursos naturales."}},
  {word:"la deforestación", sentence:"La deforestación destruye el hábitat de muchos animales.", meaning:{en:"Deforestation.", tr:"Ormansızlaşma.", fa:"جنگل‌زدایی.", es:"La destrucción o eliminación de los bosques."}},
  {word:"el desperdicio", sentence:"Tiramos mucha comida; el desperdicio de alimentos es un problema mundial.", meaning:{en:"Waste.", tr:"İsraf / atık.", fa:"هدررفت / زباله.", es:"Lo que se pierde o se tira sin aprovechar."}},
  {word:"proteger", sentence:"Es importante proteger las especies en peligro de extinción.", meaning:{en:"To protect.", tr:"Korumak.", fa:"محافظت کردن.", es:"Cuidar algo o a alguien para evitar que sufra daño."}}
]},

{id:"v-B1-2", level:"B1", category:"vocab", goals:["exam","everyday"], title:{en:"Politics & Society", tr:"Siyaset ve Toplum", fa:"سیاست و جامعه", es:"Política y sociedad"}, cards:[
  {word:"el gobierno", sentence:"El gobierno anunció nuevas leyes sobre educación.", meaning:{en:"The government.", tr:"Hükümet.", fa:"دولت.", es:"La institución que dirige y administra un país."}},
  {word:"votar", sentence:"Es un derecho y un deber votar en las elecciones.", meaning:{en:"To vote.", tr:"Oy vermek.", fa:"رأی دادن.", es:"Elegir a un candidato o una opción en una elección."}},
  {word:"la democracia", sentence:"En una democracia, el pueblo elige a sus representantes.", meaning:{en:"Democracy.", tr:"Demokrasi.", fa:"دموکراسی.", es:"Sistema político en el que el pueblo elige a sus gobernantes."}},
  {word:"la desigualdad", sentence:"La desigualdad social sigue siendo un gran desafío en la región.", meaning:{en:"Inequality.", tr:"Eşitsizlik.", fa:"نابرابری.", es:"La falta de igualdad de oportunidades o de condiciones entre las personas."}},
  {word:"los derechos humanos", sentence:"Todos los países deben respetar los derechos humanos.", meaning:{en:"Human rights.", tr:"İnsan hakları.", fa:"حقوق بشر.", es:"Los derechos básicos que tiene toda persona por el simple hecho de existir."}},
  {word:"la ley", sentence:"Esa ley entró en vigor el año pasado.", meaning:{en:"The law.", tr:"Kanun.", fa:"قانون.", es:"Una norma que todos deben cumplir dentro de un país."}},
  {word:"el impuesto", sentence:"Pagamos impuestos para financiar los servicios públicos.", meaning:{en:"Tax.", tr:"Vergi.", fa:"مالیات.", es:"Dinero que se paga obligatoriamente al Estado."}},
  {word:"la manifestación", sentence:"Miles de personas participaron en la manifestación por el clima.", meaning:{en:"Protest / demonstration.", tr:"Gösteri / protesto.", fa:"تظاهرات.", es:"Reunión pública de personas para expresar una opinión o protesta."}},
  {word:"la pobreza", sentence:"El proyecto busca reducir la pobreza en zonas rurales.", meaning:{en:"Poverty.", tr:"Yoksulluk.", fa:"فقر.", es:"La falta de recursos económicos suficientes para vivir bien."}},
  {word:"el ciudadano", sentence:"Como ciudadanos, tenemos derechos y responsabilidades.", meaning:{en:"Citizen.", tr:"Vatandaş.", fa:"شهروند.", es:"Persona que pertenece legalmente a un país o comunidad."}}
]},

  {word:"el presupuesto", sentence:"Hago un presupuesto mensual para controlar mis gastos.", meaning:{en:"Budget.", tr:"Bütçe.", fa:"بودجه.", es:"Plan de los ingresos y gastos previstos."}},

  {word:"la tarjeta de crédito", sentence:"Pagué la cena con la tarjeta de crédito.", meaning:{en:"Credit card.", tr:"Kredi kartı.", fa:"کارت اعتباری.", es:"Tarjeta que permite comprar y pagar después."}},

  {word:"investigar", sentence:"Los estudiantes deben investigar el tema antes de la clase.", meaning:{en:"To research.", tr:"Araştırmak.", fa:"تحقیق کردن.", es:"Buscar información sobre un tema con detalle."}},
  {word:"el requisito", sentence:"Hablar inglés es un requisito para este trabajo.", meaning:{en:"Requirement.", tr:"Gereklilik / şart.", fa:"شرط لازم.", es:"Una condición necesaria para poder hacer algo."}},
  {word:"capacitarse", sentence:"Quiero capacitarme más en tecnología.", meaning:{en:"To train / develop one's skills.", tr:"Kendini geliştirmek / eğitim almak.", fa:"مهارت‌آموزی کردن.", es:"Prepararse o formarse para hacer algo mejor."}}
]},

{id:"v-B1-6", level:"B1", category:"vocab", goals:["everyday"], title:{en:"Relationships", tr:"İlişkiler", fa:"روابط", es:"Relaciones personales"}, cards:[
  {word:"la confianza", sentence:"La confianza es la base de cualquier relación sólida.", meaning:{en:"Trust.", tr:"Güven.", fa:"اعتماد.", es:"La seguridad que sientes en otra persona."}},
  {word:"llevarse bien", sentence:"Mi hermana y yo nos llevamos muy bien.", meaning:{en:"To get along well.", tr:"İyi anlaşmak.", fa:"خوب کنار آمدن با کسی.", es:"Tener una buena relación con alguien."}},
  {word:"discutir", sentence:"A veces discutimos por cosas pequeñas.", meaning:{en:"To argue.", tr:"Tartışmak.", fa:"بحث کردن (دعوا).", es:"Tener un desacuerdo o pelea verbal con alguien."}},
  {word:"reconciliarse", sentence:"Después de la pelea, decidieron reconciliarse.", meaning:{en:"To make up / reconcile.", tr:"Barışmak.", fa:"آشتی کردن.", es:"Volver a llevarse bien después de una discusión."}},
  {word:"apoyar", sentence:"Mis amigos siempre me apoyan en los momentos difíciles.", meaning:{en:"To support.", tr:"Desteklemek.", fa:"حمایت کردن.", es:"Ayudar o animar a alguien en lo que hace."}},
  {word:"comprometerse", sentence:"Se comprometieron después de cinco años juntos.", meaning:{en:"To get engaged / to commit.", tr:"Nişanlanmak / kendini adamak.", fa:"نامزد کردن / متعهد شدن.", es:"Prometer formalmente casarse, o asumir una responsabilidad."}},
  {word:"el vínculo", sentence:"Tienen un vínculo muy especial desde la infancia.", meaning:{en:"Bond / connection.", tr:"Bağ.", fa:"پیوند.", es:"La conexión emocional entre dos personas."}},
  {word:"malentendido", sentence:"Todo fue un malentendido, ya lo aclaramos.", meaning:{en:"Misunderstanding.", tr:"Yanlış anlaşılma.", fa:"سوءتفاهم.", es:"Una confusión al interpretar mal algo que dijo o hizo alguien."}},
  {word:"extrañar", sentence:"Extraño mucho a mi familia desde que me mudé.", meaning:{en:"To miss (someone).", tr:"Özlemek.", fa:"دلتنگ شدن.", es:"Sentir la falta de alguien que está lejos."}},
  {word:"la pareja", sentence:"Llevan diez años siendo pareja.", meaning:{en:"Partner / couple.", tr:"Eş / partner / çift.", fa:"همسر / پارتنر.", es:"La persona con quien alguien tiene una relación amorosa."}}
]},

{id:"v-B1-7", level:"B1", category:"vocab", goals:["everyday","immigration"], title:{en:"Housing", tr:"Konut", fa:"مسکن", es:"Vivienda"}, cards:[
  {word:"el alquiler", sentence:"El alquiler de este apartamento sube cada año.", meaning:{en:"Rent.", tr:"Kira.", fa:"اجاره.", es:"El pago mensual por vivir en una propiedad que no es tuya."}},
  {word:"el propietario / la propietaria", sentence:"Tengo que llamar al propietario porque no funciona la calefacción.", meaning:{en:"Landlord / owner.", tr:"Ev sahibi / mülk sahibi.", fa:"صاحب‌خانه / مالک.", es:"La persona dueña de una vivienda."}},
  {word:"el contrato de arrendamiento", sentence:"Firmamos el contrato de arrendamiento por un año.", meaning:{en:"Lease / rental agreement.", tr:"Kira sözleşmesi.", fa:"قرارداد اجاره.", es:"Documento legal que establece las condiciones del alquiler."}},
  {word:"la fianza", sentence:"Pagamos una fianza equivalente a un mes de alquiler.", meaning:{en:"Security deposit.", tr:"Depozito.", fa:"ودیعه / پول پیش.", es:"Dinero que se deja como garantía al alquilar una vivienda."}},
  {word:"mudarse", sentence:"Nos mudamos a un barrio más tranquilo el mes pasado.", meaning:{en:"To move (house).", tr:"Taşınmak.", fa:"اسباب‌کشی کردن.", es:"Cambiar de vivienda o de lugar de residencia."}},
  {word:"amueblado", sentence:"Buscamos un apartamento amueblado porque no tenemos muebles.", meaning:{en:"Furnished.", tr:"Mobilyalı.", fa:"مبله.", es:"Que ya tiene los muebles necesarios."}},
  {word:"las afueras", sentence:"Prefiero vivir en las afueras, es más tranquilo.", meaning:{en:"The outskirts / suburbs.", tr:"Şehir dışı / banliyö.", fa:"حومه شهر.", es:"Las zonas alrededor del centro de una ciudad."}},
  {word:"la hipoteca", sentence:"Todavía estamos pagando la hipoteca de la casa.", meaning:{en:"Mortgage.", tr:"Mortgage / konut kredisi.", fa:"وام مسکن.", es:"Préstamo bancario para comprar una vivienda."}},
  {word:"el vecindario", sentence:"El vecindario es muy seguro y hay buenos colegios.", meaning:{en:"Neighborhood.", tr:"Mahalle.", fa:"محله.", es:"La zona donde vive alguien junto con sus vecinos."}},
  {word:"reformar", sentence:"Vamos a reformar la cocina el próximo verano.", meaning:{en:"To renovate.", tr:"Tadilat yapmak.", fa:"بازسازی کردن.", es:"Cambiar o mejorar la estructura de una vivienda."}}
]},

{id:"v-B1-8", level:"B1", category:"vocab", goals:["everyday","exam"], title:{en:"Media", tr:"Medya", fa:"رسانه", es:"Medios de comunicación"}, cards:[

  {word:"el periodista", sentence:"El periodista entrevistó al alcalde ayer.", meaning:{en:"Journalist.", tr:"Gazeteci.", fa:"روزنامه‌نگار.", es:"Persona que investiga y escribe noticias."}},
  {word:"la publicidad", sentence:"Hay demasiada publicidad en ese canal de televisión.", meaning:{en:"Advertising.", tr:"Reklam.", fa:"تبلیغات.", es:"Los mensajes que promocionan un producto o servicio."}},
  {word:"la audiencia", sentence:"El programa tiene una gran audiencia los domingos.", meaning:{en:"Audience.", tr:"İzleyici kitlesi.", fa:"مخاطبان.", es:"El público que ve, escucha o lee un medio."}},
  {word:"censurar", sentence:"El gobierno intentó censurar la información sobre el escándalo.", meaning:{en:"To censor.", tr:"Sansürlemek.", fa:"سانسور کردن.", es:"Prohibir o limitar la difusión de información."}},
  {word:"fiable", sentence:"No todas las páginas web son fuentes fiables.", meaning:{en:"Reliable / trustworthy.", tr:"Güvenilir.", fa:"قابل‌اعتماد.", es:"Que se puede creer o confiar en ello."}},
  {word:"el reportaje", sentence:"Vimos un reportaje sobre la crisis del agua.", meaning:{en:"Report / feature story.", tr:"Röportaj / haber dosyası.", fa:"گزارش خبری.", es:"Un trabajo periodístico que investiga un tema a fondo."}}
]},

{id:"v-B1-9", level:"B1", category:"vocab", goals:["everyday","travel"], title:{en:"Cooking", tr:"Yemek Pişirme", fa:"آشپزی", es:"La cocina"}, cards:[
  {word:"picar", sentence:"Primero hay que picar la cebolla en trozos pequeños.", meaning:{en:"To chop / mince.", tr:"Doğramak / ince kıymak.", fa:"خرد کردن.", es:"Cortar un alimento en pedazos pequeños."}},
  {word:"hervir", sentence:"Deja hervir el agua antes de añadir la pasta.", meaning:{en:"To boil.", tr:"Kaynatmak.", fa:"جوشاندن.", es:"Calentar un líquido hasta que burbujee."}},
  {word:"freír", sentence:"Vamos a freír las patatas en aceite bien caliente.", meaning:{en:"To fry.", tr:"Kızartmak.", fa:"سرخ کردن.", es:"Cocinar un alimento en aceite caliente."}},
  {word:"hornear", sentence:"Vamos a hornear un pastel para su cumpleaños.", meaning:{en:"To bake.", tr:"Fırınlamak.", fa:"در فر پختن.", es:"Cocinar algo dentro del horno."}},
  {word:"mezclar", sentence:"Mezcla los huevos con el azúcar hasta que quede suave.", meaning:{en:"To mix.", tr:"Karıştırmak.", fa:"مخلوط کردن.", es:"Combinar dos o más ingredientes."}},
  {word:"el ingrediente", sentence:"Esta receta lleva solo cinco ingredientes.", meaning:{en:"Ingredient.", tr:"Malzeme.", fa:"ماده اولیه (آشپزی).", es:"Cada uno de los elementos que forman parte de una receta."}},
  {word:"la receta", sentence:"Mi abuela me enseñó su receta secreta de sopa.", meaning:{en:"Recipe.", tr:"Tarif.", fa:"دستور پخت.", es:"Las instrucciones para preparar un plato."}},
  {word:"sazonar", sentence:"No olvides sazonar la carne con sal y pimienta.", meaning:{en:"To season.", tr:"Baharatlamak / tatlandırmak.", fa:"چاشنی زدن.", es:"Añadir sal, especias u otros condimentos a un plato."}},
  {word:"la sartén", sentence:"Calienta un poco de aceite en la sartén.", meaning:{en:"Frying pan.", tr:"Tava.", fa:"ماهیتابه.", es:"Utensilio de cocina para freír alimentos."}},
  {word:"a fuego lento", sentence:"Cocina la salsa a fuego lento durante veinte minutos.", meaning:{en:"On low heat / simmering.", tr:"Kısık ateşte.", fa:"با حرارت ملایم.", es:"Cocinar con poca intensidad de calor durante un tiempo prolongado."}}

{id:"v-B1-10", level:"B1", category:"vocab", goals:["career","immigration"], title:{en:"The Workplace", tr:"İş Dünyası", fa:"دنیای کار", es:"El mundo laboral"}, cards:[
  {word:"el contrato", sentence:"Firmé un contrato indefinido con la empresa.", meaning:{en:"Contract.", tr:"Sözleşme.", fa:"قرارداد.", es:"Documento que establece las condiciones de un trabajo."}},
  {word:"la reunión", sentence:"Tenemos una reunión con el equipo a las diez.", meaning:{en:"Meeting.", tr:"Toplantı.", fa:"جلسه.", es:"Encuentro para hablar de temas de trabajo."}},
  {word:"negociar", sentence:"Voy a negociar mi salario antes de aceptar el puesto.", meaning:{en:"To negotiate.", tr:"Pazarlık yapmak / müzakere etmek.", fa:"مذاکره کردن.", es:"Discutir para llegar a un acuerdo, por ejemplo sobre el sueldo."}},
  {word:"el ascenso", sentence:"Le dieron un ascenso después de dos años en la empresa.", meaning:{en:"Promotion.", tr:"Terfi.", fa:"ارتقای شغلی.", es:"Un cambio a un puesto de mayor responsabilidad."}},
  {word:"la entrevista de trabajo", sentence:"Tengo una entrevista de trabajo mañana por la mañana.", meaning:{en:"Job interview.", tr:"İş görüşmesi.", fa:"مصاحبه شغلی.", es:"Conversación formal para evaluar a un candidato a un puesto."}},
  {word:"el currículum", sentence:"Actualicé mi currículum antes de buscar empleo.", meaning:{en:"Résumé / CV.", tr:"Özgeçmiş.", fa:"رزومه.", es:"Documento que resume la experiencia y formación de una persona."}},
  {word:"renunciar", sentence:"Decidió renunciar a su puesto para abrir su propio negocio.", meaning:{en:"To resign / quit.", tr:"İstifa etmek.", fa:"استعفا دادن.", es:"Dejar voluntariamente un trabajo."}},
  {word:"el jefe / la jefa", sentence:"Mi jefa es muy comprensiva con los horarios.", meaning:{en:"Boss.", tr:"Patron / yönetici.", fa:"رئیس.", es:"La persona que dirige a los empleados de una empresa."}},
  {word:"el plazo", sentence:"El plazo para entregar el proyecto es el viernes.", meaning:{en:"Deadline.", tr:"Son tarih / süre.", fa:"مهلت.", es:"La fecha límite para completar algo."}},
  {word:"trabajar en equipo", sentence:"En esta empresa valoran mucho trabajar en equipo.", meaning:{en:"To work as a team.", tr:"Takım hâlinde çalışmak.", fa:"کار تیمی کردن.", es:"Colaborar con otras personas para lograr un objetivo común."}}
]},

{id:"slang-B1", level:"B1", category:"slang", goals:["everyday"], title:{en:"Daily Slang", tr:"Günlük Argo", fa:"اصطلاحات روزمره", es:"Argot cotidiano"}, cards:[
  {word:"estar como una cabra", sentence:"No le hagas caso, está como una cabra.", meaning:{en:"To be a bit crazy / wild (playful).", tr:"Biraz çılgın olmak (esprili bir ifade).", fa:"کمی دیوانه بودن (به‌شوخی).", es:"Estar un poco loco o hacer locuras, de forma cariñosa."},
   note:{en:"A very common Spain expression — literally 'to be like a goat.' Affectionate, not insulting, among friends.", tr:"İspanya'da çok yaygın bir ifade — kelimenin tam anlamıyla 'keçi gibi olmak.' Arkadaşlar arasında hakaret değil, sevecen bir ifadedir.", fa:"عبارتی بسیار رایج در اسپانیا — به‌معنای واقعی «مثل بز بودن». بین دوستان محبت‌آمیز است، نه توهین.", es:"Una expresión muy común en España — literalmente 'estar como una cabra'. Es cariñosa, no insultante, entre amigos."}},
  {word:"curro", sentence:"Hoy tengo mucho curro, no puedo salir.", meaning:{en:"Job / work (informal).", tr:"İş (gündelik dil).", fa:"کار (محاوره‌ای).", es:"Trabajo, de forma coloquial."},
   note:{en:"Very common in Spain as a casual word for 'job' — curro = trabajo, currar = trabajar.", tr:"İspanya'da 'iş' için çok yaygın gündelik bir kelimedir — curro = iş, currar = çalışmak.", fa:"در اسپانیا کلمه‌ای بسیار رایج و محاوره‌ای برای «کار» است — curro = کار، currar = کار کردن.", es:"Muy común en España como forma coloquial de decir 'trabajo' — curro = trabajo, currar = trabajar."}},
  {word:"tener buena onda / tener buen rollo", sentence:"Ese profesor tiene muy buena onda con los estudiantes.", meaning:{en:"To have good vibes / to be easygoing.", tr:"İyi enerjisi olmak / kolay geçinilir olmak.", fa:"انرژی خوبی داشتن / خوش‌برخورد بودن.", es:"Tener una actitud positiva y agradable (México: buena onda, España: buen rollo)."},
   note:{en:"Buena onda is common across Latin America; buen rollo is the equivalent in Spain.", tr:"Buena onda Latin Amerika'da yaygındır; buen rollo ise İspanya'daki karşılığıdır.", fa:"buena onda در آمریکای لاتین رایج است؛ buen rollo معادل آن در اسپانیاست.", es:"Buena onda se usa mucho en América Latina; buen rollo es el equivalente en España."}},
  {word:"estar sin blanca / estar pelado", sentence:"No puedo ir al cine, estoy sin blanca hasta el viernes.", meaning:{en:"To be broke / out of money.", tr:"Parasız kalmak / meteliksiz olmak.", fa:"بی‌پول بودن.", es:"No tener dinero (España: estar sin blanca, muchos países de América Latina: estar pelado)."},
   note:{en:"Estar sin blanca is a Spain classic; estar pelado is heard widely across Latin America.", tr:"Estar sin blanca İspanya'ya özgü klasik bir ifadedir; estar pelado ise Latin Amerika'da yaygın olarak duyulur.", fa:"estar sin blanca اصطلاحی کلاسیک در اسپانیاست؛ estar pelado در سراسر آمریکای لاتین شنیده می‌شود.", es:"Estar sin blanca es un clásico de España; estar pelado se escucha ampliamente en América Latina."}},
  {word:"ni de coña", sentence:"¿Vas a pagar tú la cena? — ¡Ni de coña!", meaning:{en:"No way! (emphatic refusal).", tr:"Asla olmaz! (kesin ret).", fa:"محاله! (رد قاطع).", es:"De ninguna manera, forma enfática de decir que no."},
   note:{en:"A strong, casual way to say 'absolutely not' — common in Spain, a bit rougher in tone.", tr:"'Kesinlikle hayır' demenin güçlü ve gündelik bir yolu — İspanya'da yaygındır, biraz daha sert bir tondadır.", fa:"راهی قوی و خودمانی برای گفتن «قطعاً نه» — در اسپانیا رایج است و لحنی کمی خشن‌تر دارد.", es:"Una forma fuerte e informal de decir 'de ninguna manera' — común en España, con un tono un poco más brusco."}},

{id:'story-A1-Thriller-1', level:'A1', genre:'Thriller', title:{en:'The Mysterious Key', tr:'Gizemli Anahtar', fa:'کلید مرموز', es:'La llave misteriosa'},
 text:"Laura vive sola en un apartamento pequeño. Una noche, ella limpia un armario viejo y encuentra una llave de metal. La llave es vieja y tiene un número: 27.\n\nLaura no reconoce la llave. No es la llave de su casa ni de su carro. '¿De dónde viene esta llave?', piensa Laura.\n\nAl día siguiente, Laura pregunta al portero del edificio sobre la llave. El portero mira la llave con atención. 'Esta llave es de un cuarto en el sótano', dice el portero. 'Pero ese cuarto está cerrado desde hace muchos años'.\n\nLaura siente curiosidad y un poco de miedo. Esa noche, ella baja al sótano con una linterna. El sótano está oscuro y hace frío. Laura busca la puerta número 27.\n\nFinalmente, encuentra la puerta. Con manos temblorosas, pone la llave en la cerradura. La puerta se abre lentamente...\n\nDentro, Laura solo ve cajas viejas y muebles cubiertos de polvo. No hay ningún misterio, solo los recuerdos olvidados de otra familia. Laura sonríe y cierra la puerta con calma.",

{id:'story-A1-Documentary-1', level:'A1', genre:'Documentary', title:{en:'The Otavalo Market', tr:'Otavalo Pazarı', fa:'بازار اوتاوالو', es:'El mercado de Otavalo'},
 text:"En Ecuador, en un pueblo llamado Otavalo, hay un mercado famoso en todo el mundo. Cada sábado, cientos de personas visitan el mercado para comprar y vender productos.\n\nLos vendedores en el mercado son principalmente indígenas de la región. Ellos venden textiles de colores brillantes: mantas, suéteres y sombreros. También venden joyas de plata, cerámica y instrumentos musicales tradicionales.\n\nMuchos turistas viajan a Otavalo solo para visitar este mercado. Caminan entre los puestos, miran los colores y escuchan la música andina en vivo. Algunos turistas practican su español con los vendedores.\n\nEl mercado de Otavalo no es solo un lugar para comprar cosas. Es también un espacio donde la cultura indígena vive y continúa. Las familias enseñan sus tradiciones de generación en generación.\n\nHoy, el mercado de Otavalo es una de las atracciones turísticas más importantes de Ecuador. Representa la historia, el arte y la identidad de un pueblo orgulloso de su cultura.",
