{id:'g-A2-1', level:'A2', title:{en:'Preterite tense — regular verbs (simple past)', tr:'Preterite (Belirli Geçmiş Zaman) — Düzenli Fiiller', fa:'گذشته ساده (Pretérito Indefinido) — افعال باقاعده', es:'Pretérito indefinido — verbos regulares'},
 exp:{en:"Picture this: your friend asks what you did last weekend, and you want to tell a clear, finished story — not a vague one. That's exactly what the preterite is for: actions that happened and wrapped up at a specific point in the past. The pattern is refreshingly regular once you drill it: -AR verbs take -é, -aste, -ó, -amos, -asteis, -aron, while -ER/-IR verbs share -í, -iste, -ió, -imos, -isteis, -ieron. So hablé (I spoke), comí (I ate), and viví (I lived) all describe something done and dusted. Here's the trap almost every learner falls into: dropping the accent mark on the yo and él/ella/usted forms. Without it, hable (present subjunctive) and habló (he/she spoke) turn into completely different words with completely different meanings — that little accent is doing a lot of work. A good trick is to say the ending out loud and feel where the stress lands: -É and -Ó always get the punch. Nail this pattern and you'll be able to narrate your whole week in Spanish without breaking a sweat.",
      tr:"Şunu düşün: arkadaşın sana geçen hafta sonu ne yaptığını soruyor ve sen ona net, bitmiş bir hikâye anlatmak istiyorsun — belirsiz değil. Preterite tam olarak bunun için var: geçmişte belirli bir anda olup biten ve tamamlanan eylemler. Kalıbı bir kez öğrendin mi oldukça düzenli: -AR fiilleri -é, -aste, -ó, -amos, -asteis, -aron alır, -ER/-IR fiilleri ise -í, -iste, -ió, -imos, -isteis, -ieron ile çekilir. Yani hablé (konuştum), comí (yedim) ve viví (yaşadım) hepsi olup bitmiş bir şeyi anlatır. İşte neredeyse herkesin düştüğü tuzak: yo ve él/ella/usted biçimlerindeki aksan işaretini atlamak. Aksan olmadan hable (şimdiki dilek kipi) ile habló (o konuştu) tamamen farklı iki kelimeye dönüşür — o küçük işaret aslında çok iş görüyor. İyi bir ipucu: son eki yüksek sesle söyle ve vurgunun nereye düştüğünü hisset — -É ve -Ó her zaman vurguyu alır. Bu kalıbı oturttuğunda, tüm haftanı hiç terlemeden İspanyolca anlatabilirsin.",
      fa:"یک لحظه فکر کن: دوستت می‌پرسد آخر هفته چه کار کردی، و تو می‌خواهی یک داستان روشن و تمام‌شده تعریف کنی، نه مبهم. Pretérito دقیقاً برای همین است: کارهایی که در یک لحظه‌ی مشخص از گذشته اتفاق افتاده‌اند و تمام شده‌اند. الگویش وقتی چند بار تمرینش کنی خیلی منظم است: افعال -AR می‌گیرند -é, -aste, -ó, -amos, -asteis, -aron، و افعال -ER/-IR مشترکاً -í, -iste, -ió, -imos, -isteis, -ieron می‌گیرند. پس hablé (صحبت کردم)، comí (خوردم) و viví (زندگی کردم) همه چیزهایی هستند که تمام و کمال انجام شده‌اند. حالا این دامی است که تقریباً همه در آن می‌افتند: فراموش کردن علامت تکیه روی صورت‌های yo و él/ella/usted. بدون آن، hable (وجه التزامی حال) و habló (او صحبت کرد) دو کلمه‌ی کاملاً متفاوت با معنی‌های کاملاً متفاوت می‌شوند — آن علامت کوچک کار بزرگی انجام می‌دهد. یک ترفند خوب این است که آخر فعل را بلند بگویی و حس کنی تکیه کجا می‌افتد — روی -É و -Ó همیشه تکیه هست. وقتی این الگو را قرص کنی، می‌توانی کل هفته‌ات را بدون کوچک‌ترین دست‌انداز به اسپانیایی تعریف کنی.",
      es:"Imagínate esto: tu amigo te pregunta qué hiciste el fin de semana pasado, y quieres contarle una historia clara y terminada, no algo vago. Para eso está exactamente el pretérito: acciones que ocurrieron y se completaron en un momento específico del pasado. El patrón es sorprendentemente regular una vez que lo practicas: los verbos -AR llevan -é, -aste, -ó, -amos, -asteis, -aron, mientras que los -ER/-IR comparten -í, -iste, -ió, -imos, -isteis, -ieron. Así que hablé, comí y viví describen algo ya hecho y terminado. Aquí está la trampa en la que casi todo el mundo cae: olvidar la tilde en las formas de yo y él/ella/usted. Sin ella, hable (subjuntivo presente) y habló (pretérito) se convierten en dos palabras totalmente distintas con significados totalmente distintos — esa tildecita hace mucho trabajo. Un buen truco es decir la terminación en voz alta y sentir dónde cae el golpe de voz: -É y -Ó siempre llevan el acento. Domina este patrón y podrás contar toda tu semana en español sin despeinarte."},
 wrong:'Ayer yo hablo con mi jefe.', right:'Ayer yo hablé con mi jefe.',
 blank:{sentence:'Anoche nosotros ___ pizza en casa.', word:'comimos', distractors:['comemos','comieron']},
 wrong2:'La semana pasada ella vive en Madrid por un mes.', right2:'La semana pasada ella vivió en Madrid por un mes.',
 blank2:{sentence:'El año pasado tú ___ a Barcelona por trabajo.', word:'viajaste', distractors:['viajas','viajó']}},

{id:'g-A2-2', level:'A2', title:{en:'Preterite tense — irregular verbs (ser/ir, tener, hacer)', tr:'Preterite — Düzensiz Fiiller (ser/ir, tener, hacer)', fa:'گذشته ساده — افعال بی‌قاعده (ser/ir، tener، hacer)', es:'Pretérito indefinido — verbos irregulares (ser/ir, tener, hacer)'},
 exp:{en:"Here's a fun quirk of Spanish: ser (to be) and ir (to go) are completely different verbs, but in the preterite they borrow the exact same forms — fui, fuiste, fue, fuimos, fuisteis, fueron. Context does all the sorting for you: 'Fui a la playa' is obviously 'went,' while 'Fui profesor' is obviously 'was.' Tener follows its own irregular path: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron. And hacer does too: hice, hiciste, hizo, hicimos, hicisteis, hicieron — notice hizo swaps c for z to keep that sound consistent. There's no getting around it: these just have to be memorized, since they don't follow the -é/-í endings you learned for regular verbs. The one silver lining is a pattern within the irregularity: none of these forms carry a written accent, unlike regular preterites — so if you're tempted to write tuvé or hicé, that's your cue something's off. Learn these three and you've basically covered half of what people actually talk about in the past tense.",
      tr:"İspanyolcanın eğlenceli bir tuhaflığı: ser (olmak) ile ir (gitmek) tamamen farklı fiillerdir, ama preterite'te birebir aynı çekimleri paylaşırlar — fui, fuiste, fue, fuimos, fuisteis, fueron. Hangisinin kastedildiğini bağlam çözer: 'Fui a la playa' açıkça 'gittim' demektir, 'Fui profesor' ise açıkça 'öğretmendim' demektir. Tener kendi düzensiz yolunu izler: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron. Hacer de öyle: hice, hiciste, hizo, hicimos, hicisteis, hicieron — hizo'da c yerine z geldiğine dikkat et, bu ses tutarlılığını korur. Bunun kaçışı yok: bu fiiller ezberlenmek zorunda, çünkü düzenli fiillerde öğrendiğin -é/-í eklerini izlemiyorlar. Tek avantaj, düzensizlik içinde bile bir düzen olması: bu biçimlerin hiçbirinde, düzenli preterite'lerin aksine, aksan işareti yoktur — yani tuvé ya da hicé yazmak isteğine kapılırsan, bir şeylerin yanlış gittiğinin işaretidir bu. Bu üç fiili öğren, insanların geçmiş zamanda gerçekte konuştuğu şeylerin neredeyse yarısını halletmiş olursun.",
      fa:"این یکی از نکات جالب اسپانیایی است: ser (بودن) و ir (رفتن) دو فعل کاملاً متفاوت‌اند، اما در pretérito دقیقاً همان صرف را قرض می‌گیرند — fui, fuiste, fue, fuimos, fuisteis, fueron. متن جمله همه‌چیز را برایت مشخص می‌کند: 'Fui a la playa' واضح است که یعنی «رفتم»، در حالی که 'Fui profesor' واضح است که یعنی «بودم». Tener مسیر بی‌قاعده‌ی خودش را دارد: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron. و hacer هم همین‌طور: hice, hiciste, hizo, hicimos, hicisteis, hicieron — دقت کن که در hizo حرف c به z تبدیل می‌شود تا صدا یکدست بماند. راه فراری نیست: این‌ها را باید حفظ کنی، چون از پسوندهای -é/-í که برای افعال باقاعده یاد گرفتی پیروی نمی‌کنند. اما یک نکته‌ی خوب هم هست: در دل این بی‌قاعدگی یک قاعده وجود دارد — هیچ‌کدام از این صورت‌ها، برخلاف pretérito باقاعده، علامت تکیه ندارند؛ پس اگر وسوسه شدی tuvé یا hicé بنویسی، بدان که یک جای کار می‌لنگد. این سه فعل را یاد بگیر تا تقریباً نیمی از چیزهایی که آدم‌ها واقعاً درباره‌ی گذشته می‌گویند را پوشش داده باشی.",
      es:"Aquí va una curiosidad divertida del español: ser e ir son verbos completamente distintos, pero en pretérito toman prestadas exactamente las mismas formas — fui, fuiste, fue, fuimos, fuisteis, fueron. El contexto se encarga de aclarar todo: 'Fui a la playa' obviamente es de ir, mientras que 'Fui profesor' obviamente es de ser. Tener sigue su propio camino irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron. Y hacer también: hice, hiciste, hizo, hicimos, hicisteis, hicieron — fíjate que hizo cambia la c por z para mantener el sonido. No hay vuelta que darle: estos hay que memorizarlos, porque no siguen las terminaciones -é/-í que aprendiste para los verbos regulares. Lo bueno es que hay un patrón dentro de la irregularidad: ninguna de estas formas lleva tilde, a diferencia de los pretéritos regulares — así que si te dan ganas de escribir tuvé o hicé, esa es tu señal de que algo anda mal. Aprende estos tres y básicamente tendrás cubierta la mitad de lo que la gente realmente dice en pasado."},
 wrong:'Ayer yo hace la tarea.', right:'Ayer yo hice la tarea.',
 blank:{sentence:'El domingo nosotros ___ una fiesta increíble.', word:'tuvimos', distractors:['tenemos','tuvieron']},
 wrong2:'El año pasado ellos son a Perú de vacaciones.', right2:'El año pasado ellos fueron a Perú de vacaciones.',
 blank2:{sentence:'¿Qué ___ tú anoche?', word:'hiciste', distractors:['haces','hizo']}},

{id:'g-A2-3', level:'A2', title:{en:'Imperfect tense (past habits & descriptions)', tr:'Imperfecto (Geçmişte Alışkanlıklar ve Tasvirler)', fa:'گذشته استمراری (Imperfecto) — عادت‌ها و توصیف‌ها', es:'Pretérito imperfecto (hábitos y descripciones)'},
 exp:{en:"Think about how you'd describe your childhood: 'I used to play outside every day, it was always sunny, I was seven.' None of that has a clear endpoint — it's a mood, a routine, a backdrop — and that's exactly the imperfect's job. Use it for ongoing or repeated past actions and for descriptions like age, time, and weather. The endings are steady and predictable: -AR verbs get -aba, -abas, -aba, -ábamos, -abais, -aban, and -ER/-IR verbs get -ía, -ías, -ía, -íamos, -íais, -ían. So hablaba means 'I used to speak' or 'I was speaking,' and comía means 'I used to eat' or 'was eating.' Here's a fact that makes this tense feel much friendlier: there are only three irregular verbs in the whole imperfect system — ser (era, eras, era...), ir (iba, ibas, iba...), and ver (veía, veías, veía...). Everything else, no matter how wild it looks in other tenses, plays by the regular rules here. Once that clicks, the imperfect stops feeling like a memorization chore and starts feeling like the easiest past tense in Spanish.",
      tr:"Çocukluğunu nasıl anlatırdın bir düşün: 'Her gün dışarıda oynardım, hava hep güneşliydi, yedi yaşındaydım.' Bunların hiçbirinin net bir bitiş noktası yok — bir atmosfer, bir alışkanlık, bir arka plan bu — ve imperfecto'nun işi tam olarak bu. Süregelen ya da tekrarlanan geçmiş eylemler ve yaş, saat, hava durumu gibi tasvirler için kullanılır. Ekleri istikrarlı ve tahmin edilebilir: -AR fiilleri -aba, -abas, -aba, -ábamos, -abais, -aban alır, -ER/-IR fiilleri ise -ía, -ías, -ía, -íamos, -íais, -ían alır. Yani hablaba 'konuşurdum' ya da 'konuşuyordum' demek, comía ise 'yerdim' ya da 'yiyordum' demek. İşte bu zamanı çok daha dost canlısı yapan bir gerçek: tüm imperfecto sisteminde sadece üç düzensiz fiil var — ser (era, eras, era...), ir (iba, ibas, iba...) ve ver (veía, veías, veía...). Diğer her fiil, başka zamanlarda ne kadar çılgın görünürse görünsün, burada düzenli kurallara uyar. Bu bir kez kafanda oturunca, imperfecto ezber yükü olmaktan çıkıp İspanyolcanın en kolay geçmiş zamanı gibi hissettirmeye başlar.",
      fa:"یک لحظه فکر کن چطور دوران بچگی‌ات را تعریف می‌کردی: «هر روز بیرون بازی می‌کردم، همیشه آفتابی بود، هفت‌ساله بودم.» هیچ‌کدام از این‌ها نقطه‌ی پایان مشخصی ندارند — یک حال‌وهوا، یک عادت، یک پس‌زمینه‌اند — و این دقیقاً کار imperfecto است. از آن برای کارهای ادامه‌دار یا تکرارشونده در گذشته و برای توصیف‌هایی مثل سن، ساعت و آب‌وهوا استفاده کن. پسوندهایش پایدار و قابل‌پیش‌بینی‌اند: افعال -AR می‌گیرند -aba, -abas, -aba, -ábamos, -abais, -aban، و افعال -ER/-IR می‌گیرند -ía, -ías, -ía, -íamos, -íais, -ían. پس hablaba یعنی «صحبت می‌کردم» و comía یعنی «می‌خوردم». حالا یک نکته که این زمان را خیلی دوست‌داشتنی‌تر می‌کند: در کل سیستم imperfecto فقط سه فعل بی‌قاعده وجود دارد — ser (era, eras, era...)، ir (iba, ibas, iba...) و ver (veía, veías, veía...). بقیه‌ی فعل‌ها، هرقدر هم در زمان‌های دیگر عجیب و غریب به نظر برسند، اینجا از قاعده‌ی عادی پیروی می‌کنند. وقتی این نکته جا بیفتد، imperfecto دیگر شبیه یک تکلیف حفظ‌کردنی نیست، بلکه راحت‌ترین زمان گذشته‌ی اسپانیایی می‌شود.",
      es:"Piensa en cómo describirías tu infancia: 'Jugaba afuera todos los días, siempre hacía sol, tenía siete años.' Nada de eso tiene un punto final claro — es un ambiente, una rutina, un trasfondo — y esa es exactamente la función del imperfecto. Úsalo para acciones continuas o repetidas en el pasado y para descripciones como la edad, la hora y el clima. Las terminaciones son estables y predecibles: los verbos -AR llevan -aba, -abas, -aba, -ábamos, -abais, -aban, y los -ER/-IR llevan -ía, -ías, -ía, -íamos, -íais, -ían. Así que hablaba significa 'solía hablar' o 'estaba hablando', y comía significa 'solía comer' o 'estaba comiendo'. Aquí va un dato que hace este tiempo mucho más amigable: en todo el sistema del imperfecto solo hay tres verbos irregulares — ser (era, eras, era...), ir (iba, ibas, iba...) y ver (veía, veías, veía...). Todos los demás, por muy locos que se pongan en otros tiempos, aquí siguen las reglas normales. Una vez que esto te queda claro, el imperfecto deja de sentirse como un ejercicio de memoria y empieza a sentirse como el tiempo pasado más fácil del español."},
 wrong:'Cuando yo era niño, juego en el parque todos los días.', right:'Cuando yo era niño, jugaba en el parque todos los días.',
 blank:{sentence:'De pequeña, ella ___ mucho miedo a los perros.', word:'tenía', distractors:['tuvo','tiene']},
 wrong2:'Antes nosotros vivimos en una casa pequeña.', right2:'Antes nosotros vivíamos en una casa pequeña.',
 blank2:{sentence:'Mis abuelos ___ en un pueblo muy tranquilo.', word:'vivían', distractors:['vivieron','viven']}},

{id:'g-A2-4', level:'A2', title:{en:'Preterite vs. imperfect — which one to use', tr:'Preterite mi, Imperfecto mu? — Hangisini Kullanmalı', fa:'Pretérito یا Imperfecto — کدام را انتخاب کنیم؟', es:'Indefinido vs. imperfecto — cuál usar'},
 exp:{en:"This is the pairing that trips up almost every Spanish learner, so let's make it simple: preterite is the plot, imperfect is the scenery. If you're narrating a story, the imperfect paints the background — what was going on, how things looked, what used to happen — while the preterite drops in the specific events that actually happened and moved the story forward. They constantly team up in the same sentence: 'Yo dormía (imperfect, the scene — I was sleeping) cuando sonó el teléfono (preterite, the plot twist — the phone rang).' A handy mental trick: if you can put 'used to' or 'was ___-ing' in front of the English translation, reach for the imperfect; if it's a one-time completed action, grab the preterite. The single biggest mistake learners make is treating the whole story as one tense — either narrating everything in preterite (which sounds like a rapid-fire list of events with no atmosphere) or everything in imperfect (which never actually gets anywhere, since nothing ever finishes). Real Spanish speech weaves both together constantly, scene and action, scene and action. Once you start hearing that rhythm, you'll notice it's less a grammar rule and more a storytelling instinct — and it'll start to feel natural embarrassingly fast.",
      tr:"Bu ikili neredeyse her İspanyolca öğrencisinin ayağına dolanır, o yüzden basitleştirelim: preterite olay örgüsüdür, imperfecto ise sahne dekorudur. Bir hikâye anlatıyorsan, imperfecto arka planı boyar — o sırada ne olup bittiğini, işlerin nasıl göründüğünü, neyin alışılagelmiş olduğunu — preterite ise hikâyeyi ileri götüren, gerçekten olmuş belirli olayları araya sokar. İkisi aynı cümlede sürekli birlikte çalışır: 'Yo dormía (imperfecto, sahne — uyuyordum) cuando sonó el teléfono (preterite, olay örgüsündeki dönüş — telefon çaldı).' İşe yarar bir zihinsel ipucu: İngilizce çeviride 'genellikle ...irdi' ya da '...-yordu' diyebiliyorsan imperfecto'ya uzan; tek seferlik, tamamlanmış bir eylemse preterite'i seç. Öğrencilerin yaptığı en büyük hata, tüm hikâyeyi tek bir zamanla anlatmaya çalışmaktır — ya her şeyi preterite ile anlatırlar (bu da atmosferi olmayan, art arda sıralanmış bir olay listesi gibi kulağa gelir) ya da her şeyi imperfecto ile anlatırlar (bu da hiçbir şey hiç bitmediği için asla bir yere varmaz). Gerçek İspanyolca konuşma, sahneyi ve olayı sürekli iç içe örer, sahne ve olay, sahne ve olay. Bu ritmi duymaya başladığında, bunun bir dilbilgisi kuralından çok bir hikâye anlatma içgüdüsü olduğunu fark edeceksin — ve utandırıcı derecede hızlı bir şekilde doğal gelmeye başlayacak.",
      fa:"این جفت تقریباً پای هر زبان‌آموز اسپانیایی را می‌گیرد، پس بیا ساده‌اش کنیم: pretérito داستان است، imperfecto صحنه‌آرایی. اگر داری یک داستان تعریف می‌کنی، imperfecto پس‌زمینه را رنگ می‌زند — چه می‌گذشت، اوضاع چطور بود، چه چیزی عادت بود — و pretérito رویدادهای مشخصی را که واقعاً اتفاق افتاده و داستان را جلو برده‌اند، وارد می‌کند. این دو مدام در یک جمله با هم کار می‌کنند: 'Yo dormía (imperfecto، صحنه — خواب بودم) cuando sonó el teléfono (pretérito، نقطه‌ی چرخش داستان — تلفن زنگ زد).' یک ترفند ذهنی مفید: اگر می‌توانی در ترجمه‌ی انگلیسی «معمولاً... می‌کردم» یا «داشتم... می‌کردم» بگویی، سراغ imperfecto برو؛ اگر یک کنش یک‌باره و تمام‌شده است، pretérito را بردار. بزرگ‌ترین اشتباهی که زبان‌آموزها می‌کنند این است که کل داستان را با یک زمان تعریف می‌کنند — یا همه‌چیز را با pretérito می‌گویند (که مثل یک فهرست تندتند از رویدادها بدون هیچ فضا و حس‌وحالی به گوش می‌رسد) یا همه‌چیز را با imperfecto (که هیچ‌وقت واقعاً به جایی نمی‌رسد، چون هیچ‌چیز تمام نمی‌شود). اسپانیایی واقعی این دو را دائم در هم می‌بافد، صحنه و کنش، صحنه و کنش. وقتی این ریتم را شنیدن یاد بگیری، متوجه می‌شوی این کمتر یک قاعده‌ی دستوری است و بیشتر یک غریزه‌ی قصه‌گویی — و به شکل شرم‌آور سریعی طبیعی به نظر می‌رسد.",
      es:"Esta pareja hace tropezar a casi todo el que aprende español, así que vamos a simplificarlo: el pretérito es la trama, el imperfecto es la escenografía. Si estás narrando una historia, el imperfecto pinta el fondo — lo que estaba pasando, cómo se veían las cosas, qué solía ocurrir — mientras que el pretérito mete los sucesos concretos que realmente pasaron y hacen avanzar la historia. Los dos trabajan juntos constantemente en la misma frase: 'Yo dormía (imperfecto, la escena — estaba durmiendo) cuando sonó el teléfono (pretérito, el giro de la trama — sonó el teléfono).' Un truco mental útil: si en la traducción al inglés puedes decir 'solía' o 'estaba ___-ando/iendo', echa mano del imperfecto; si es una acción única y terminada, usa el pretérito. El error más grande que cometen los estudiantes es narrar toda la historia en un solo tiempo — o todo en pretérito (lo que suena como una lista de eventos sin ambiente) o todo en imperfecto (que nunca llega a ningún lado, porque nada termina nunca). El español real entreteje escena y acción todo el tiempo, escena y acción, escena y acción. En cuanto empieces a escuchar ese ritmo, te darás cuenta de que esto es menos una regla gramatical y más un instinto narrativo — y empezará a sentirse natural con una rapidez vergonzosa."},
 wrong:'Mientras yo cociné, mi hermano llegó a casa.', right:'Mientras yo cocinaba, mi hermano llegó a casa.',
 blank:{sentence:'___ las diez de la noche cuando empezó la tormenta.', word:'Eran', distractors:['Fueron','Son']},
 wrong2:'Cuando era joven, viajé a Francia cada verano.', right2:'Cuando era joven, viajaba a Francia cada verano.',
 blank2:{sentence:'Yo ___ la televisión cuando se cortó la luz.', word:'veía', distractors:['vi','veo']}},

{id:'g-A2-5', level:'A2', title:{en:'Reflexive verbs (me, te, se, nos, os, se)', tr:'Dönüşlü Fiiller (me, te, se, nos, os, se)', fa:'افعال انعکاسی (me, te, se, nos, os, se)', es:'Verbos reflexivos'},
 exp:{en:"Some verbs describe an action that bounces right back onto you — you're both the one doing it and the one it happens to. Getting up (levantarse), showering (ducharse), brushing your teeth (cepillarse los dientes) — in Spanish these need a little pronoun tagging along to show 'to myself.' The pronoun shifts with the subject: me levanto (I get up), te levantas (you get up), se levanta (he/she/you formal get up), nos levantamos (we get up), os levantáis (you all get up, Spain), se levantan (they/you all get up). It sits right before the conjugated verb, never floating off on its own. The mistake that trips people up constantly is dropping the pronoun entirely and just saying the plain verb — 'Yo levanto' sounds like you're lifting something (or someone!) rather than getting yourself out of bed, since levantar without se just means 'to lift.' A good way to lock this in: whenever the action is something you literally do to your own body — wake, shower, dress, brush, sit down — your brain should automatically reach for the matching pronoun before the verb even leaves your mouth. Master this pattern and your morning routine in Spanish will finally make grammatical sense.",
      tr:"Bazı fiiller, eylemin doğrudan sana geri döndüğü bir hareketi anlatır — hem yapan sensin hem de yapılan kişi. Kalkmak (levantarse), duş almak (ducharse), diş fırçalamak (cepillarse los dientes) — İspanyolcada bunlar 'kendime' anlamını göstermek için yanlarında küçük bir zamir taşımalı. Zamir özneye göre değişir: me levanto (kalkarım), te levantas (kalkarsın), se levanta (o/siz kalkar), nos levantamos (kalkarız), os levantáis (siz kalkarsınız, İspanya), se levantan (onlar/sizler kalkar). Zamir her zaman çekimli fiilden hemen önce durur, asla tek başına ortada dolanmaz. İnsanları sürekli tökezleten hata, zamiri tamamen atlayıp düz fiili söylemektir — 'Yo levanto' demek, kendini yataktan kaldırmak yerine bir şeyi (ya da birini!) kaldırıyormuşsun gibi kulağa gelir, çünkü se olmadan levantar sadece 'kaldırmak' demektir. Bunu kafana iyice yerleştirmenin bir yolu: eylem gerçekten kendi bedenine yaptığın bir şeyse — uyanmak, duş almak, giyinmek, fırçalamak, oturmak — beynin fiil ağzından çıkmadan otomatik olarak eşleşen zamire uzanmalı. Bu kalıbı bir öğrendin mi, İspanyolcadaki sabah rutinin sonunda dilbilgisel olarak da anlam kazanır.",
      fa:"بعضی فعل‌ها کنشی را توصیف می‌کنند که مستقیم به خودت برمی‌گردد — هم انجام‌دهنده‌ی کاری و هم کسی که آن کار روی او انجام می‌شود. بلند شدن از خواب (levantarse)، دوش گرفتن (ducharse)، مسواک زدن (cepillarse los dientes) — در اسپانیایی این‌ها به یک ضمیر کوچک همراه نیاز دارند تا معنی «به خودم» را نشان دهند. ضمیر با فاعل تغییر می‌کند: me levanto (بلند می‌شوم)، te levantas (بلند می‌شوی)، se levanta (او/شما بلند می‌شود)، nos levantamos (بلند می‌شویم)، os levantáis (شما بلند می‌شوید، اسپانیا)، se levantan (آن‌ها/شما بلند می‌شوند). ضمیر همیشه درست قبل از فعل صرف‌شده می‌نشیند، هیچ‌وقت جدا و بی‌صاحب رها نمی‌شود. اشتباهی که مدام گریبان زبان‌آموزها را می‌گیرد این است که ضمیر را کاملاً حذف کنند و فقط فعل ساده را بگویند — گفتن 'Yo levanto' بیشتر شبیه این است که داری چیزی (یا کسی!) را بلند می‌کنی، نه اینکه خودت از تخت بلند می‌شوی، چون levantar بدون se فقط یعنی «بلند کردن». یک راه خوب برای جا انداختن این نکته: هر وقت کنش واقعاً کاری است که روی بدن خودت انجام می‌دهی — بیدار شدن، دوش گرفتن، لباس پوشیدن، مسواک زدن، نشستن — مغزت باید قبل از اینکه فعل از دهانت بیرون بیاید، خودکار سراغ ضمیر متناسب برود. این الگو را از حفظ کن تا روتین صبحگاهی‌ات به اسپانیایی بالاخره از نظر دستوری هم معنا پیدا کند.",
      es:"Algunos verbos describen una acción que rebota directamente hacia ti — eres a la vez quien la hace y quien la recibe. Levantarte, ducharte, cepillarte los dientes: en español estas acciones necesitan un pronombre pequeño que las acompañe para mostrar 'a mí mismo'. El pronombre cambia según el sujeto: me levanto, te levantas, se levanta, nos levantamos, os levantáis, se levantan. Va justo antes del verbo conjugado, nunca suelto por ahí. El error que hace tropezar a todo el mundo constantemente es olvidar el pronombre y decir solo el verbo simple — 'Yo levanto' suena como si estuvieras levantando algo (¡o a alguien!) en vez de levantarte tú mismo de la cama, porque levantar sin se solo significa 'alzar'. Una buena manera de fijarlo: cada vez que la acción sea algo que literalmente haces con tu propio cuerpo — despertarte, ducharte, vestirte, cepillarte, sentarte — tu cerebro debería buscar automáticamente el pronombre correspondiente antes de que el verbo salga de tu boca. Domina este patrón y tu rutina matutina en español por fin tendrá sentido gramatical."},
 wrong:'Yo levanto a las siete todos los días.', right:'Yo me levanto a las siete todos los días.',
 blank:{sentence:'Ellos ___ muy tarde los domingos.', word:'se despiertan', distractors:['despiertan','despierta']},
 wrong2:'Nosotros duchamos antes de salir.', right2:'Nosotros nos duchamos antes de salir.',
 blank2:{sentence:'¿A qué hora ___ tú normalmente?', word:'te acuestas', distractors:['acuestas','se acuesta']}},

{id:'g-A2-6', level:'A2', title:{en:'Comparatives & superlatives', tr:'Karşılaştırma ve Üstünlük Dereceleri', fa:'صفات تفضیلی و عالی', es:'Comparativos y superlativos'},
 exp:{en:"Everyone loves a good comparison — this city versus that one, your cousin's cooking versus yours, this month versus last. Spanish gives you three tools for it: más...que (more...than) and menos...que (less...than) for unequal comparisons, and tan...como (as...as) when things are equal — María es más alta que Juan. When you want to crown the winner of a whole group (the best, the biggest, the most expensive), switch to the superlative with el/la/los/las + más/menos: Es la ciudad más grande del país. A handful of common adjectives refuse to follow the más pattern and go irregular instead: bueno becomes mejor (not más bueno), and malo becomes peor (not más malo) — saying 'más bueno' is the single most common slip-up, so it's worth burning into memory early. As a bonus trick for making something sound extra-extreme in casual speech, Spanish speakers often tack -ísimo onto an adjective instead of using más: grandísimo (huge), riquísimo (super tasty) — no que needed, just pure emphasis. Get comfortable with all three tools and you'll be able to settle any argument about which taco stand is truly the best in the barrio.",
      tr:"Herkes iyi bir karşılaştırmayı sever — bu şehir mi o şehir mi, kuzeninin yemeği mi seninki mi, bu ay mı geçen ay mı. İspanyolca bunun için üç araç sunar: eşit olmayan karşılaştırmalar için más...que (daha...den) ve menos...que (daha az...den), eşitlik için ise tan...como (kadar...): María es más alta que Juan. Bütün bir grubun galibini taçlandırmak istediğinde (en iyisi, en büyüğü, en pahalısı), el/la/los/las + más/menos ile üstünlük derecesine geçersin: Es la ciudad más grande del país. Birkaç yaygın sıfat más kalıbını reddedip düzensizleşir: bueno, mejor olur (más bueno değil), malo ise peor olur (más malo değil) — 'más bueno' demek en yaygın hata olduğundan, bunu erkenden belleğe kazımaya değer. Gündelik konuşmada bir şeyi ekstra abartılı göstermek için bonus bir hile: İspanyolca konuşanlar más kullanmak yerine sıfata -ísimo eklerler: grandísimo (koskocaman), riquísimo (müthiş lezzetli) — que gerekmez, sadece saf vurgu. Bu üç araca da alışırsan, mahalledeki hangi taco standının gerçekten en iyisi olduğuna dair her tartışmayı çözebilirsin.",
      fa:"همه عاشق یک مقایسه‌ی خوب‌اند — این شهر یا آن شهر، غذای پختن پسرعمویت یا خودت، این ماه یا ماه پیش. اسپانیایی برای این کار سه ابزار در اختیارت می‌گذارد: más...que (بیشتر از...) و menos...que (کمتر از...) برای مقایسه‌های نابرابر، و tan...como (به‌اندازه‌ی...) وقتی چیزها برابرند — María es más alta que Juan. وقتی می‌خواهی برنده‌ی یک گروه کامل را تاج بگذاری (بهترین، بزرگ‌ترین، گران‌ترین)، سراغ صفت عالی با el/la/los/las + más/menos می‌روی: Es la ciudad más grande del país. چند صفت پرکاربرد از الگوی más سرپیچی می‌کنند و بی‌قاعده می‌شوند: bueno می‌شود mejor (نه más bueno)، و malo می‌شود peor (نه más malo) — گفتن «más bueno» رایج‌ترین لغزش است، پس ارزش دارد زود در ذهنت حک‌اش کنی. یک ترفند اضافه برای اینکه چیزی را در گفتار روزمره خیلی افراطی نشان بدهی: اسپانیایی‌زبان‌ها اغلب به‌جای más، پسوند -ísimo را به صفت می‌چسبانند: grandísimo (خیلی بزرگ)، riquísimo (فوق‌العاده خوشمزه) — نیازی به que نیست، فقط تأکید خالص. با این سه ابزار راحت باش تا بتوانی هر بحثی را درباره‌ی اینکه واقعاً کدام تاکوفروشی محله بهترین است، حل و فصل کنی.",
      es:"A todo el mundo le encanta una buena comparación — esta ciudad contra aquella, la comida de tu primo contra la tuya, este mes contra el pasado. El español te da tres herramientas para eso: más...que y menos...que para comparaciones desiguales, y tan...como cuando las cosas están parejas — María es más alta que Juan. Cuando quieras coronar al ganador de todo un grupo (el mejor, el más grande, el más caro), pasa al superlativo con el/la/los/las + más/menos: Es la ciudad más grande del país. Unos cuantos adjetivos comunes se niegan a seguir el patrón de más y se vuelven irregulares: bueno se convierte en mejor (no más bueno), y malo se convierte en peor (no más malo) — decir 'más bueno' es el resbalón más común de todos, así que vale la pena grabártelo desde ya. Como truco extra para sonar más exagerado en el habla cotidiana, muchos hispanohablantes añaden -ísimo al adjetivo en vez de usar más: grandísimo, riquísimo — sin necesidad de que, pura emoción. Domina las tres herramientas y podrás zanjar cualquier discusión sobre cuál es realmente el mejor puesto de tacos del barrio."},
 wrong:'Mi hermano es más alto yo.', right:'Mi hermano es más alto que yo.',
 blank:{sentence:'Este restaurante es ___ caro como aquel.', word:'tan', distractors:['más','menos']},
 wrong2:'Ella es la más buena estudiante de la clase.', right2:'Ella es la mejor estudiante de la clase.',
 blank2:{sentence:'Este es el hotel ___ caro de toda la ciudad.', word:'más', distractors:['tan','tanto']}},

{id:'g-A2-7', level:'A2', title:{en:'Direct object pronouns (lo, la, los, las)', tr:'Belirtili Nesne Zamirleri (lo, la, los, las)', fa:'ضمایر مفعول مستقیم (lo, la, los, las)', es:'Pronombres de objeto directo'},
 exp:{en:"Nobody wants to say the same noun three times in one conversation — 'Did you buy the bread? Yes, I bought the bread' sounds robotic. That's what direct object pronouns rescue you from: they stand in for the thing (or person) directly receiving the action, so the noun only has to be said once. Lo covers him/it (masculine), la covers her/it (feminine), los and las cover the plural versions. They typically plant themselves right before the conjugated verb: ¿Compraste el pan? — Sí, lo compré. The classic beginner mistake is dragging English word order into Spanish and tacking the pronoun on after the verb instead — saying 'tengo lo' instead of 'lo tengo' is the single most common slip at this level, and it's worth catching yourself every time. Here's a bonus rule that'll come in handy fast: when the pronoun is paired with an infinitive or a gerund, you also get the option of gluing it onto the end instead — quiero comprarlo works just as well as lo quiero comprar. Once lo, la, los, and las become automatic, your Spanish will stop sounding like a list of nouns and start sounding like an actual conversation.",
      tr:"Kimse aynı ismi bir konuşmada üç kez söylemek istemez — 'Ekmeği aldın mı? Evet, ekmeği aldım' kulağa robotik gelir. Belirtili nesne zamirleri seni tam olarak bundan kurtarır: eylemi doğrudan alan şeyin (ya da kişinin) yerine geçerler, böylece isim yalnızca bir kez söylenmiş olur. Lo eril 'onu' için, la dişil 'onu' için, los ve las ise çoğul biçimler için kullanılır. Genellikle çekimli fiilden hemen önce yerleşirler: ¿Compraste el pan? — Sí, lo compré. Klasik başlangıç seviyesi hatası, İngilizce kelime sırasını İspanyolcaya taşıyıp zamiri fiilden sonraya eklemektir — 'lo tengo' demek yerine 'tengo lo' demek, bu düzeyde en sık yapılan tek hatadır ve her seferinde kendini yakalamaya değer. İşte hızlıca işine yarayacak bir bonus kural: zamir bir mastar ya da gerundio ile eşleştiğinde, onu sonuna yapıştırma seçeneğin de vardır — quiero comprarlo, lo quiero comprar kadar geçerlidir. Lo, la, los ve las otomatikleştiğinde, İspanyolcan bir isim listesi gibi değil, gerçek bir sohbet gibi kulağa gelmeye başlar.",
      fa:"هیچ‌کس دوست ندارد یک اسم را در یک مکالمه سه بار تکرار کند — «نان را خریدی؟ بله، نان را خریدم» شبیه حرف‌زدن یک ربات است. ضمایر مفعول مستقیم دقیقاً تو را از این نجات می‌دهند: جایگزین چیزی (یا کسی) می‌شوند که مستقیماً کنش را دریافت می‌کند، تا اسم فقط یک‌بار گفته شود. Lo برای «او/آن را» (مذکر)، la برای «او/آن را» (مؤنث)، و los و las برای صورت‌های جمع به‌کار می‌روند. این‌ها معمولاً درست قبل از فعل صرف‌شده جا خوش می‌کنند: ¿Compraste el pan? — Sí, lo compré. اشتباه کلاسیک زبان‌آموزهای مبتدی این است که ترتیب کلمات انگلیسی را به اسپانیایی می‌آورند و ضمیر را بعد از فعل می‌چسبانند — گفتن «tengo lo» به‌جای «lo tengo» رایج‌ترین لغزش در این سطح است و ارزش دارد هر بار خودت را سر همین اشتباه بگیری. یک قاعده‌ی جایزه هم هست که زود به کارت می‌آید: وقتی ضمیر با یک مصدر یا gerundio همراه می‌شود، این امکان را هم داری که آن را به انتهای فعل بچسبانی — quiero comprarlo دقیقاً به همان اندازه‌ی lo quiero comprar درست است. وقتی lo، la، los و las برایت خودکار شوند، اسپانیایی‌ات دیگر شبیه یک فهرست از اسم‌ها نیست، بلکه شبیه یک گفت‌وگوی واقعی می‌شود.",
      es:"A nadie le gusta decir el mismo sustantivo tres veces en una conversación — '¿Compraste el pan? Sí, compré el pan' suena robótico. De eso te rescatan los pronombres de objeto directo: reemplazan a lo que recibe la acción directamente, así el sustantivo solo hace falta decirlo una vez. Lo cubre a él/eso (masculino), la cubre a ella/eso (femenino), y los y las cubren las versiones en plural. Normalmente se plantan justo antes del verbo conjugado: ¿Compraste el pan? — Sí, lo compré. El error clásico de principiante es arrastrar el orden del inglés al español y pegar el pronombre después del verbo — decir 'tengo lo' en vez de 'lo tengo' es el resbalón más común a este nivel, y vale la pena atraparte a ti mismo cada vez que pase. Aquí va una regla extra que te servirá pronto: cuando el pronombre acompaña a un infinitivo o un gerundio, también tienes la opción de pegarlo al final — quiero comprarlo funciona tan bien como lo quiero comprar. En cuanto lo, la, los y las se vuelvan automáticos, tu español dejará de sonar como una lista de sustantivos y empezará a sonar como una conversación de verdad."},
 wrong:'¿Tienes mi libro? — Sí, tengo lo.', right:'¿Tienes mi libro? — Sí, lo tengo.',
 blank:{sentence:'¿Viste la película? — Sí, ___ vi ayer.', word:'la', distractors:['lo','le']},
 wrong2:'¿Dónde están mis llaves? — No sé, no veo las.', right2:'¿Dónde están mis llaves? — No sé, no las veo.',
 blank2:{sentence:'¿Hiciste los deberes? — Sí, ___ hice esta mañana.', word:'los', distractors:['las','le']}},

{id:'g-A2-8', level:'A2', title:{en:'Indirect object pronouns (me, te, le, nos, les)', tr:'Dolaylı Nesne Zamirleri (me, te, le, nos, les)', fa:'ضمایر مفعول غیرمستقیم (me, te, le, nos, les)', es:'Pronombres de objeto indirecto'},
 exp:{en:"Think about the last time you gave someone a gift, told someone a secret, or sent someone a message — in every one of those, there's a person on the receiving end who isn't the direct object but is very much involved. That's exactly what indirect object pronouns track: who benefits from or receives the action. Me (to me), te (to you), le (to him/her/you formal), nos (to us), les (to them/you all) — and Spanish speakers love adding a + person alongside le/les just to keep things crystal clear, even though it seems repetitive: le compré un regalo a mi madre. The trickiest part for learners is that le and les never change for gender — unlike lo/la, there's no masculine or feminine version, so it's tempting to reach for the direct object pronouns out of habit and get the two families mixed up. A handy way to tell them apart: if you can ask 'to/for whom?' about the sentence, you need an indirect object pronoun; if you can ask 'what/whom directly?', you need lo/la/los/las. Fun fact for later: when le or les would collide with lo/la/los/las in the same sentence, Spanish swaps le/les for se — but that's a puzzle for another day. For now, just get comfortable putting the right person at the receiving end of your sentence, and you'll sound noticeably more natural.",
      tr:"Birine hediye verdiğin, birine bir sır söylediğin ya da birine mesaj gönderdiğin son anı düşün — bunların hepsinde, doğrudan nesne olmayan ama işin tam ortasında olan bir alıcı kişi vardır. Dolaylı nesne zamirlerinin izlediği tam olarak budur: eylemden kim faydalanıyor ya da kim onu alıyor. Me (bana), te (sana), le (ona/size), nos (bize), les (onlara/sizlere) — ve İspanyolca konuşanlar, tekrar gibi görünse de netlik için le/les yanına a + kişi eklemeyi çok sever: le compré un regalo a mi madre. Öğrenciler için en zorlu kısım, le ve les'in cinsiyete göre asla değişmemesidir — lo/la'nın aksine eril ya da dişil biçimi yoktur, bu yüzden alışkanlıkla belirtili nesne zamirlerine uzanıp iki aileyi karıştırmak çok kolaydır. Onları ayırt etmenin işe yarar bir yolu: cümlede 'kime?' diye sorabiliyorsan dolaylı nesne zamiri gerekir; 'neyi/kimi doğrudan?' diye sorabiliyorsan lo/la/los/las gerekir. İleride işine yarayacak ilginç bir bilgi: le ya da les aynı cümlede lo/la/los/las ile çakıştığında, İspanyolca le/les'i se ile değiştirir — ama bu başka bir günün bulmacası. Şimdilik sadece cümlende doğru alıcı kişiyi doğru yere koymaya alış, fark edilir derecede daha doğal duyulacaksın.",
      fa:"به آخرین باری فکر کن که به کسی هدیه دادی، رازی را به کسی گفتی، یا برای کسی پیامی فرستادی — در همه‌ی این‌ها یک نفر گیرنده وجود دارد که مفعول مستقیم نیست ولی کاملاً در ماجرا درگیر است. ضمایر مفعول غیرمستقیم دقیقاً همین را دنبال می‌کنند: چه کسی از کنش سود می‌برد یا آن را دریافت می‌کند. Me (به من)، te (به تو)، le (به او/شما رسمی)، nos (به ما)، les (به آن‌ها/شما جمع) — و اسپانیایی‌زبان‌ها دوست دارند کنار le/les از a + شخص هم استفاده کنند، فقط برای اینکه همه‌چیز کاملاً روشن باشد، حتی اگر تکراری به نظر برسد: le compré un regalo a mi madre. سخت‌ترین بخش برای زبان‌آموزها این است که le و les هیچ‌وقت برای جنسیت تغییر نمی‌کنند — برخلاف lo/la، هیچ صورت مذکر یا مؤنثی ندارند، پس وسوسه‌انگیز است که از سر عادت سراغ ضمایر مفعول مستقیم بروی و این دو خانواده را قاطی کنی. یک راه خوب برای تشخیص‌شان: اگر می‌توانی درباره‌ی جمله بپرسی «برای/به چه کسی؟»، به ضمیر مفعول غیرمستقیم نیاز داری؛ اگر می‌توانی بپرسی «چه چیزی/چه کسی را مستقیماً؟»، به lo/la/los/las نیاز داری. یک نکته‌ی جالب برای بعداً: وقتی le یا les در یک جمله با lo/la/los/las برخورد کنند، اسپانیایی le/les را به se تبدیل می‌کند — اما آن یک معما برای یک روز دیگر است. فعلاً فقط با گذاشتن شخص درست در جای گیرنده‌ی جمله‌ات راحت باش، و به‌طرز محسوسی طبیعی‌تر به نظر خواهی رسید.",
      es:"Piensa en la última vez que le diste un regalo a alguien, le contaste un secreto a alguien o le enviaste un mensaje a alguien — en todos esos casos hay una persona receptora que no es el objeto directo pero que está muy involucrada. Eso es exactamente lo que rastrean los pronombres de objeto indirecto: quién se beneficia o recibe la acción. Me, te, le, nos, les — y a los hispanohablantes les encanta añadir a + persona junto a le/les solo para que quede clarísimo, aunque parezca repetitivo: le compré un regalo a mi madre. La parte más difícil para quien aprende es que le y les nunca cambian de género — a diferencia de lo/la, no tienen versión masculina ni femenina, así que es tentador recurrir por costumbre a los pronombres de objeto directo y mezclar las dos familias. Una forma útil de distinguirlos: si puedes preguntar '¿a/para quién?' sobre la frase, necesitas un pronombre de objeto indirecto; si puedes preguntar '¿qué/a quién directamente?', necesitas lo/la/los/las. Dato curioso para más adelante: cuando le o les chocarían con lo/la/los/las en la misma frase, el español cambia le/les por se — pero ese es un rompecabezas para otro día. Por ahora, simplemente acostúmbrate a poner a la persona correcta en el lugar de receptor de tu frase, y sonarás notablemente más natural."},
 wrong:'A mi madre compré un regalo para su cumpleaños.', right:'A mi madre le compré un regalo para su cumpleaños.',
 blank:{sentence:'¿Qué ___ vas a regalar a tu hermano?', word:'le', distractors:['lo','les']},
 wrong2:'A nosotros escribe una carta cada mes.', right2:'A nosotros nos escribe una carta cada mes.',
 blank2:{sentence:'Mis padres ___ mandan dinero cada mes.', word:'me', distractors:['te','se']}},

{id:'g-A2-9', level:'A2', title:{en:'Future: ir a + infinitive, and simple future', tr:'Gelecek Zaman: ir a + Mastar ve Basit Gelecek', fa:'زمان آینده: ir a + مصدر، و آینده ساده', es:'Futuro: ir a + infinitivo, y futuro simple'},
 exp:{en:"When you're chatting casually about your plans — 'I'm going to call you later,' 'we're going to eat at eight' — Spanish reaches for ir (conjugated) + a + infinitive, exactly like English 'going to': voy a estudiar (I'm going to study). It's the future tense you'll actually use most in daily conversation. For the more formal simple future (Spanish's version of 'will'), you don't even need a new verb chart — just glue these endings onto the whole infinitive: -é, -ás, -á, -emos, -éis, -án, giving you hablaré, comerás, vivirá. Here's a nice memory hook: those endings are basically the present tense of haber (he, has, ha, hemos, habéis, han) stripped down, which is exactly why they attach to the full infinitive instead of a stem like other tenses. Most verbs stay perfectly regular here, but a dozen common ones shrink their infinitive before adding the endings — tener becomes tendré, hacer becomes haré, poder becomes podré — so don't be thrown off if a few familiar verbs look slightly different. The mistake to watch for is forgetting the a in ir a + infinitive and saying something like 'voy estudiar' — that little a is doing real grammatical work, not just filler. Master both forms and you'll be equally ready for texting your friend about tonight and making bigger promises about next year.",
      tr:"Planlarından gündelik dille bahsederken — 'seni sonra ararım', 'saat sekizde yemek yiyeceğiz' — İspanyolca, tıpkı İngilizcedeki 'going to' gibi ir (çekimli) + a + mastar kalıbına başvurur: voy a estudiar (çalışacağım). Gündelik konuşmada gerçekten en çok kullanacağın gelecek zaman kalıbı budur. Daha resmi olan basit gelecek zaman için (İspanyolcanın 'will' karşılığı) yeni bir çekim tablosuna bile ihtiyacın yok — sadece şu ekleri mastarın tamamına yapıştır: -é, -ás, -á, -emos, -éis, -án, böylece hablaré, comerás, vivirá elde edersin. İşte güzel bir hatırlatma ipucu: bu ekler aslında haber fiilinin şimdiki zaman çekiminin (he, has, ha, hemos, habéis, han) sadeleştirilmiş hâlidir, tam da bu yüzden diğer zamanlardaki gibi bir gövdeye değil, mastarın tamamına eklenirler. Fiillerin çoğu burada tamamen düzenli kalır, ama yaygın kullanılan bir düzine fiil, ekleri eklemeden önce mastarını kısaltır — tener, tendré olur; hacer, haré olur; poder, podré olur — o yüzden tanıdık birkaç fiil biraz farklı göründüğünde şaşırma. Dikkat etmen gereken hata, ir a + mastar kalıbındaki a'yı unutup 'voy estudiar' gibi bir şey söylemektir — o küçük a sadece dolgu değil, gerçek bir dilbilgisi işi yapar. Her iki biçimi de öğren, hem bu akşam için arkadaşına mesaj atmaya hem de gelecek yıl için daha büyük sözler vermeye eşit derecede hazır olursun.",
      fa:"وقتی داری غیررسمی درباره‌ی برنامه‌هایت حرف می‌زنی — «بعداً بهت زنگ می‌زنم»، «ساعت هشت غذا می‌خوریم» — اسپانیایی سراغ ir (صرف‌شده) + a + مصدر می‌رود، دقیقاً مثل «going to» در انگلیسی: voy a estudiar (قرار است درس بخوانم). این همان زمان آینده‌ای است که در گفت‌وگوی روزمره واقعاً بیشتر از همه استفاده‌اش می‌کنی. برای آینده‌ی ساده‌ی رسمی‌تر (معادل «will» در اسپانیایی)، حتی نیازی به جدول صرف جدید نداری — فقط این پسوندها را به کل مصدر بچسبان: -é, -ás, -á, -emos, -éis, -án، که hablaré, comerás, vivirá را می‌سازند. یک ترفند خوب برای به‌خاطر سپردن: این پسوندها اساساً همان صرف زمان حال فعل haber هستند (he, has, ha, hemos, habéis, han) که ساده شده‌اند، و دقیقاً به همین دلیل به کل مصدر می‌چسبند نه به ریشه‌ای مثل زمان‌های دیگر. اغلب فعل‌ها اینجا کاملاً باقاعده می‌مانند، اما حدود دوازده فعل پرکاربرد قبل از اضافه‌کردن پسوندها مصدرشان را کوتاه می‌کنند — tener می‌شود tendré، hacer می‌شود haré، poder می‌شود podré — پس اگر چند فعل آشنا کمی متفاوت به نظر رسیدند، جا نخور. اشتباهی که باید مراقبش باشی، فراموش‌کردن a در ir a + مصدر است، مثل گفتن «voy estudiar» — آن a کوچک فقط پرکننده نیست، کار دستوری واقعی انجام می‌دهد. هر دو صورت را یاد بگیر تا هم برای پیامک‌دادن به دوستت درباره‌ی امشب و هم برای دادن قول‌های بزرگ‌تر درباره‌ی سال آینده به یک اندازه آماده باشی.",
      es:"Cuando hablas informalmente de tus planes — 'te voy a llamar más tarde', 'vamos a comer a las ocho' — el español recurre a ir (conjugado) + a + infinitivo, igual que el 'going to' del inglés: voy a estudiar. Es el tiempo futuro que realmente más vas a usar en la conversación diaria. Para el futuro simple, más formal (el equivalente del 'will' en español), ni siquiera necesitas una tabla de conjugación nueva — solo pega estas terminaciones al infinitivo completo: -é, -ás, -á, -emos, -éis, -án, y obtienes hablaré, comerás, vivirá. Aquí va un truco de memoria bonito: esas terminaciones son básicamente el presente del verbo haber (he, has, ha, hemos, habéis, han) simplificado, y por eso se pegan al infinitivo completo en vez de a una raíz como en otros tiempos. La mayoría de los verbos se mantienen perfectamente regulares aquí, pero una docena de verbos comunes acortan su infinitivo antes de añadir las terminaciones — tener se convierte en tendré, hacer en haré, poder en podré — así que no te sorprendas si algún verbo conocido se ve un poco distinto. El error a vigilar es olvidar la a de ir a + infinitivo y decir algo como 'voy estudiar' — esa pequeña a hace un trabajo gramatical de verdad, no es solo relleno. Domina las dos formas y estarás igual de listo para mandarle un mensaje a tu amigo sobre esta noche que para hacer promesas más grandes sobre el año que viene."},
 wrong:'Mañana yo voy estudiar para el examen.', right:'Mañana yo voy a estudiar para el examen.',
 blank:{sentence:'El próximo año nosotros ___ a otra ciudad.', word:'viajaremos', distractors:['viajamos','viajábamos']},
 wrong2:'Yo hablar con el jefe mañana.', right2:'Yo hablaré con el jefe mañana.',
 blank2:{sentence:'¿Dónde ___ tú el próximo verano?', word:'trabajarás', distractors:['trabajas','trabajabas']}},

{id:'g-A2-10', level:'A2', title:{en:'Affirmative tú commands', tr:'Olumlu Sen Emir Kipi', fa:'امر مثبت با «تو» (tú)', es:'Imperativo afirmativo (tú)'},
 exp:{en:"Bossing a friend around in Spanish — 'Speak up,' 'Eat your vegetables,' 'Close the door' — is easier than you'd expect, because for most verbs the affirmative tú command is just a disguise: it borrows the exact same form as él/ella in the present tense. Habla (speak), come (eat), escribe (write) — no new conjugation to learn, just repurpose one you already know. Of course, Spanish wouldn't be Spanish without a handful of troublemakers: ven (venir), ten (tener), ve (ir), haz (hacer), pon (poner), sal (salir), and sé (ser) all break the pattern and have to be learned by heart. A classic trick to lock in those seven irregulars is to string them into one absurd little scene in your head: 'Ven (come here), ten (have) paciencia, ve (go), haz (do) tus tareas, pon (put) la mesa, sal (leave) ya, y sé (be) bueno' — reciting it as one chain makes them stick far better than memorizing them as a scattered list. Watch out for one sneaky mix-up: sé here means 'be' (from ser), which looks identical to sé meaning 'I know' (from saber) — context is your only guide, so don't let the overlap throw you. Get comfortable with this handful of irregulars and giving orders in Spanish, from friendly nudges to actual bossiness, will feel completely natural.",
      tr:"İspanyolcada bir arkadaşına emir vermek — 'Yüksek sesle konuş', 'Sebzeni ye', 'Kapıyı kapat' — düşündüğünden daha kolay, çünkü çoğu fiilde olumlu sen emir kipi aslında bir kılık değiştirmedir: şimdiki zamanın o (él/ella) biçimiyle birebir aynıdır. Habla (konuş), come (ye), escribe (yaz) — öğrenilecek yeni bir çekim yok, zaten bildiğin bir biçimi yeniden kullanıyorsun. Elbette İspanyolca, birkaç baş belası olmadan İspanyolca olmazdı: ven (venir'den), ten (tener'den), ve (ir'den), haz (hacer'den), pon (poner'den), sal (salir'den) ve sé (ser'den) hepsi kalıbı bozar ve ezbere öğrenilmesi gerekir. Bu yedi düzensiz fiili kafana oturtmanın klasik bir yolu, onları zihninde saçma tek bir sahneye dizmektir: 'Ven (buraya gel), ten (sahip ol) paciencia, ve (git), haz (yap) tus tareas, pon (koy) la mesa, sal (çık) ya, y sé (ol) bueno' — bunu tek bir zincir gibi tekrarlamak, dağınık bir liste olarak ezberlemekten çok daha iyi akılda kalır. Sinsi bir karışıklığa dikkat et: buradaki sé, 'ol' anlamına gelir (ser'den), ve 'biliyorum' anlamındaki sé (saber'den) ile birebir aynı görünür — tek rehberin bağlamdır, bu çakışma seni şaşırtmasın. Bu bir avuç düzensiz fiile alıştığında, İspanyolcada emir vermek — dostça bir dürtmeden gerçek bir patronluğa kadar — tamamen doğal gelecek.",
      fa:"دستور دادن به یک دوست به اسپانیایی — «بلندتر حرف بزن»، «سبزیجاتت را بخور»، «در را ببند» — از آنچه فکر می‌کنی راحت‌تر است، چون در اغلب فعل‌ها امر مثبت با «تو» فقط یک نقاب است: دقیقاً همان صورت او (él/ella) در زمان حال را قرض می‌گیرد. Habla (صحبت کن)، come (بخور)، escribe (بنویس) — هیچ صرف جدیدی برای یادگرفتن نیست، فقط چیزی را که از قبل بلدی دوباره به کار می‌بری. البته اسپانیایی بدون چند فعل شرور، اسپانیایی نمی‌شد: ven (از venir)، ten (از tener)، ve (از ir)، haz (از hacer)، pon (از poner)، sal (از salir) و sé (از ser) همه از الگو سرپیچی می‌کنند و باید از حفظ یاد گرفته شوند. یک ترفند کلاسیک برای جا انداختن این هفت فعل بی‌قاعده این است که آن‌ها را در ذهنت به یک صحنه‌ی کوچک و مسخره وصل کنی: «Ven (بیا اینجا)، ten (داشته باش) paciencia، ve (برو)، haz (انجام بده) tus tareas، pon (بگذار) la mesa، sal (برو بیرون) ya، y sé (باش) bueno» — این را مثل یک زنجیره پشت سر هم تکرار کردن، خیلی بهتر از حفظ‌کردن به‌صورت یک فهرست پراکنده در ذهن می‌ماند. مراقب یک اشتباه موذی هم باش: sé در اینجا یعنی «باش» (از ser)، که دقیقاً شبیه sé به معنی «می‌دانم» (از saber) است — تنها راهنمایت متن جمله است، پس نگذار این هم‌پوشانی گولت بزند. با این مشت کوچک از فعل‌های بی‌قاعده راحت شو، تا دستور دادن به اسپانیایی — از یک تلنگر دوستانه تا واقعاً رئیس‌بازی درآوردن — کاملاً طبیعی به نظر برسد.",
      es:"Mandar a un amigo en español — 'Habla más alto', 'Come tus verduras', 'Cierra la puerta' — es más fácil de lo que parece, porque en la mayoría de los verbos el imperativo afirmativo en tú es solo un disfraz: toma prestada exactamente la misma forma que él/ella en presente. Habla, come, escribe — no hay una conjugación nueva que aprender, solo reutilizas una que ya conoces. Claro que el español no sería español sin un puñado de rebeldes: ven (venir), ten (tener), ve (ir), haz (hacer), pon (poner), sal (salir) y sé (ser) rompen el patrón y hay que aprenderlos de memoria. Un truco clásico para fijar estos siete irregulares es encadenarlos en una escena absurda en tu cabeza: 'Ven, ten paciencia, ve, haz tus tareas, pon la mesa, sal ya, y sé bueno' — recitarlo como una sola cadena se te queda grabado mucho mejor que memorizarlos como una lista suelta. Cuidado con una confusión traicionera: sé aquí significa 'be' del verbo ser, que se ve idéntico a sé de 'yo sé' del verbo saber — tu única guía es el contexto, así que no dejes que ese cruce te despiste. Domina este puñado de irregulares y dar órdenes en español, desde un empujoncito amistoso hasta mandar de verdad, te saldrá completamente natural."},
 wrong:'Hablas más despacio, por favor.', right:'Habla más despacio, por favor.',
 blank:{sentence:'___ la puerta, hace mucho frío.', word:'Cierra', distractors:['Cierras','Cerrar']},
 wrong2:'Tienes paciencia, ya casi llegamos.', right2:'Ten paciencia, ya casi llegamos.',
 blank2:{sentence:'___ tu cuarto antes de salir a jugar.', word:'Ordena', distractors:['Ordenas','Ordenar']}}

{id:"g-C1-1", level:"C1", title:{en:"Subjunctive — Advanced Nuances (por más que, quienquiera que, el hecho de que)", tr:"Dilek-Şart Kipi — İleri Düzey İncelikler (por más que, quienquiera que, el hecho de que)", fa:"وجه التزامی — نکات ظریف پیشرفته (por más que، quienquiera que، el hecho de que)", es:"Subjuntivo — matices avanzados"},
 exp:{en:"Think of the subjunctive as your radar for 'this isn't a hard fact, it's up for debate' — and by C1 that radar has to catch signals most learners miss. Por más que + subjunctive means 'no matter how much' (Por más que insistas, no cambiaré de idea — No matter how much you insist, I won't change my mind). Quienquiera que + subjunctive means 'whoever' (Quienquiera que sea, no abriré la puerta — Whoever it is, I won't open the door). And el hecho de que ('the fact that') almost always pulls the subjunctive, because it frames something as a point under discussion rather than a flat statement — compare El hecho de que llueva no significa que cancelemos ('The fact that it's raining doesn't mean we're cancelling') with a plain statement of fact. The classic trap: because these phrases don't look like the ojalá or quiero que you learned early on, your brain defaults to the indicative — resist that urge and scan for the hidden trigger. Once you start spotting por más que and el hecho de que on sight, you'll sound like someone who reads Spanish novels for fun, not just textbooks.",
      tr:"Dilek-şart kipini şöyle düşün: 'bu kesin bir gerçek değil, tartışmaya açık' sinyalini yakalayan bir radar — ve C1 seviyesinde bu radarın çoğu öğrencinin gözünden kaçan sinyalleri de yakalaması gerekiyor. Por más que + dilek-şart kipi 'ne kadar ısrar edersen et' anlamına gelir (Por más que insistas, no cambiaré de idea — Ne kadar ısrarcı olursan ol, fikrimi değiştirmeyeceğim). Quienquiera que + dilek-şart kipi 'her kim olursa olsun' demektir (Quienquiera que sea, no abriré la puerta — Her kim olursa olsun, kapıyı açmayacağım). Ve el hecho de que ('şu gerçeği') neredeyse her zaman dilek-şart kipini gerektirir, çünkü bir şeyi kesin bir ifade yerine tartışılan bir konu olarak sunar — mesela El hecho de que llueva no significa que cancelemos ('Yağmur yağıyor olması iptal edeceğimiz anlamına gelmez') cümlesini düz bir gerçek ifadesiyle karşılaştır. En yaygın tuzak şu: bu ifadeler erken öğrendiğin ojalá ya da quiero que gibi görünmediği için beynin otomatik olarak haber kipine kayar — bu dürtüye direnip gizli tetikleyiciyi ara. Por más que ve el hecho de que'yi görür görmez tanımaya başladığında, artık sadece ders kitabı değil, roman okuyan biri gibi konuşursun.",
      fa:"وجه التزامی را مثل یک رادار در نظر بگیر که سیگنال «این یک واقعیت قطعی نیست، هنوز جای بحث دارد» را می‌گیرد — و در سطح C1 این رادار باید سیگنال‌هایی را هم بگیرد که اکثر زبان‌آموزها از دستشان در می‌رود. por más que + التزامی یعنی «هرقدر هم که» (Por más que insistas, no cambiaré de idea — هرقدر هم اصرار کنی، نظرم را عوض نمی‌کنم). quienquiera que + التزامی یعنی «هر که باشد» (Quienquiera que sea, no abriré la puerta — هر که باشد، در را باز نمی‌کنم). و el hecho de que («این واقعیت که») تقریباً همیشه التزامی می‌گیرد، چون چیزی را به‌جای بیان قطعی، به‌عنوان موضوعی در حال بحث مطرح می‌کند — مثلاً El hecho de que llueva no significa que cancelemos («این‌که باران می‌بارد به این معنا نیست که لغو می‌کنیم») را با یک جمله‌ی خبری ساده مقایسه کن. تله‌ی رایج این‌جاست: چون این عبارات شبیه ojalá یا quiero que که اول یاد گرفتی نیستند، ذهنت خودکار می‌رود سراغ اخباری — جلوی این عادت را بگیر و دنبال محرک پنهان بگرد. وقتی por más que و el hecho de que را در نگاه اول تشخیص بدهی، دیگر مثل کسی حرف می‌زنی که رمان اسپانیایی می‌خواند، نه فقط کتاب درسی.",
      es:"Piensa en el subjuntivo como tu radar para 'esto no es un hecho seguro, está en discusión' — y en el nivel C1 ese radar tiene que captar señales que la mayoría de estudiantes se pierden. Por más que + subjuntivo significa 'por mucho que' (Por más que insistas, no cambiaré de idea). Quienquiera que + subjuntivo significa 'sea quien sea' (Quienquiera que sea, no abriré la puerta). Y el hecho de que casi siempre exige subjuntivo, porque presenta algo como un tema de discusión en vez de una afirmación directa — compara El hecho de que llueva no significa que cancelemos con una simple constatación de un hecho. La trampa clásica: como estas expresiones no se parecen al ojalá o al quiero que que aprendiste al principio, el cerebro tiende a usar el indicativo por defecto — resiste ese impulso y busca el disparador escondido. En cuanto empieces a detectar por más que y el hecho de que a simple vista, vas a sonar como alguien que lee novelas en español por gusto, no solo libros de texto."},
 wrong:"Por más que insistes, no cambiaré de idea.", right:"Por más que insistas, no cambiaré de idea.",
 blank:{sentence:"Quienquiera que ___, tendrá que esperar su turno.", word:"sea", distractors:["es","será"]},
 wrong2:"El hecho de que ella tiene razón no cambia mi postura.", right2:"El hecho de que ella tenga razón no cambia mi postura.",
 blank2:{sentence:"El hecho de que ___ mucho dinero no significa que sea feliz.", word:"tenga", distractors:["tiene","tendría"]}},

{id:"g-C1-2", level:"C1", title:{en:"Verbal Periphrases (llevar + gerund, acabar de, volver a, dejar de)", tr:"Fiil Çevrimleri (llevar + gerundio, acabar de, volver a, dejar de)", fa:"ترکیب‌های فعلی (llevar + gerund، acabar de، volver a، dejar de)", es:"Perífrasis verbales (llevar + gerundio, acabar de, volver a, dejar de)"},
 exp:{en:"Here's a party trick fluent speakers do without thinking: they stack two verbs together to say in three words what English needs a whole sentence for. Llevar + gerund shows how long something has been going on (Llevo tres años viviendo aquí — I've been living here for three years) — and yes, that's a whole 'I have been -ing for' construction packed into one tidy verb pair. Acabar de + infinitive means something just happened (Acabo de llegar — I just arrived). Volver a + infinitive means doing something again (Volvió a llamar — She called again). Dejar de + infinitive means stopping a habit (Dejé de fumar — I quit smoking). The mistake most learners make is reaching for the literal translation instead — saying he estado viviendo aquí por tres años when llevo tres años viviendo aquí is what a native would actually say. Master these four and you'll stop translating from your native language in your head and start thinking directly in Spanish rhythms.",
      tr:"İşte akıcı konuşanların düşünmeden yaptığı bir numara: İngilizcenin koca bir cümleyle anlattığını, üç kelimeyle söylemek için iki fiili art arda dizerler. Llevar + gerundio, bir şeyin ne kadar süredir devam ettiğini gösterir (Llevo tres años viviendo aquí — Üç yıldır burada yaşıyorum) — evet, İngilizcedeki koca 'I have been -ing for' yapısının tamamı bu küçük fiil ikilisine sığıyor. Acabar de + mastar, bir şeyin az önce olduğunu belirtir (Acabo de llegar — Az önce geldim). Volver a + mastar, bir şeyi tekrar yapmak demektir (Volvió a llamar — Tekrar aradı). Dejar de + mastar ise bir alışkanlığı bırakmak anlamına gelir (Dejé de fumar — Sigarayı bıraktım). Çoğu öğrencinin yaptığı hata, bunun yerine kelimesi kelimesine çeviriye yönelmek — 'he estado viviendo aquí por tres años' demek, oysa bir anadili konuşanın gerçekten söyleyeceği şey llevo tres años viviendo aquí'dir. Bu dördünü ustalaşırsan, kafanda ana dilinden çeviri yapmayı bırakıp doğrudan İspanyolca ritmiyle düşünmeye başlarsın.",
      fa:"این هم یک ترفند کوچک که اسپانیایی‌زبان‌های روان بدون فکر کردن انجام می‌دهند: دو فعل را پشت سر هم می‌چینند تا چیزی را در سه کلمه بگویند که انگلیسی یک جمله کامل لازم دارد. llevar + gerund نشان می‌دهد چیزی چه مدت ادامه داشته (Llevo tres años viviendo aquí — سه سال است اینجا زندگی می‌کنم) — بله، کل ساختار «مدتی است که...» انگلیسی در همین یک جفت فعل کوچک جا شده. acabar de + مصدر یعنی چیزی همین الان اتفاق افتاده (Acabo de llegar — همین الان رسیدم). volver a + مصدر یعنی دوباره انجام دادن کاری (Volvió a llamar — دوباره زنگ زد). dejar de + مصدر یعنی ترک کردن یک عادت (Dejé de fumar — سیگار را ترک کردم). اشتباهی که اغلب زبان‌آموزها می‌کنند این است که سراغ ترجمه تحت‌اللفظی می‌روند — می‌گویند he estado viviendo aquí por tres años، درحالی‌که چیزی که یک اسپانیایی‌زبان بومی واقعاً می‌گوید llevo tres años viviendo aquí است. اگر این چهارتا را مسلط شوی، دیگر در ذهنت از زبان مادری ترجمه نمی‌کنی و مستقیم با ریتم اسپانیایی فکر می‌کنی.",
      es:"Aquí va un truco que los hablantes fluidos hacen sin pensar: encadenan dos verbos para decir en tres palabras lo que el inglés necesita una frase entera para expresar. Llevar + gerundio muestra cuánto tiempo lleva pasando algo (Llevo tres años viviendo aquí) — y sí, toda esa construcción de 'I have been -ing for' del inglés cabe en esta pareja de verbos tan compacta. Acabar de + infinitivo indica que algo acaba de suceder (Acabo de llegar). Volver a + infinitivo significa hacer algo de nuevo (Volvió a llamar). Dejar de + infinitivo significa dejar un hábito (Dejé de fumar). El error más común es recurrir a la traducción literal en vez de esto — decir he estado viviendo aquí por tres años cuando lo que diría un hablante nativo es llevo tres años viviendo aquí. Domina estas cuatro y dejarás de traducir mentalmente desde tu idioma natal para empezar a pensar directamente con el ritmo del español."},
 wrong:"Llevo tres años que vivo aquí.", right:"Llevo tres años viviendo aquí.",
 blank:{sentence:"___ de llegar cuando empezó a llover.", word:"Acabé", distractors:["Acabo","Acababa"]},
 wrong2:"Ella volvió llamar a su hermana ayer.", right2:"Ella volvió a llamar a su hermana ayer.",
 blank2:{sentence:"Mi abuelo ___ de fumar hace veinte años.", word:"dejó", distractors:["dejaba","deja"]}},

{id:"g-C1-3", level:"C1", title:{en:"Formal vs. Informal Register", tr:"Resmi ve Gayriresmi Dil Kullanımı", fa:"سطح رسمی و غیررسمی زبان", es:"Registro formal e informal"},
 exp:{en:"Every language has an unwritten dress code, and Spanish's is stricter than most — walk into a job interview in flip-flops (grammatically speaking) and people notice immediately. Usted signals formality and distance (job interviews, addressing elders, official writing); tú signals closeness. Formal writing favors longer connectors (no obstante, por consiguiente) and avoids casual fillers, while everyday speech leans on shorter sentences, tú forms, and relaxed fillers like bueno or o sea. The giveaway mistake that trips up even advanced learners: switching between tú and usted mid-email, or worse, opening a formal letter with Estimado señor and then slipping into oye by paragraph two — pick a register and stay in it. A handy mental shortcut: usted is a blazer, tú is a t-shirt — decide what the situation is wearing before you open your mouth, and your Spanish will feel instantly more native.",
      tr:"Her dilin yazılmamış bir kıyafet kodu vardır ve İspanyolcanınki çoğundan daha katıdır — bir iş görüşmesine (dilbilgisi açısından) terlikle girersen insanlar hemen fark eder. Usted, resmiyeti ve mesafeyi işaret eder (iş görüşmeleri, büyüklere hitap, resmi yazışma); tú ise yakınlığı gösterir. Resmi yazı, uzun bağlaçları tercih eder (no obstante, por consiguiente) ve gündelik dolgu kelimelerinden kaçınırken, günlük konuşma daha kısa cümlelere, tú kullanımına ve bueno ya da o sea gibi rahat dolgu kelimelerine dayanır. İleri düzey öğrencileri bile ele veren hata şu: bir e-postanın ortasında tú ile usted arasında gidip gelmek, ya da daha kötüsü, resmi bir mektuba Estimado señor diye başlayıp ikinci paragrafta oye demeye kaymak — bir üslup seç ve ona sadık kal. Aklında kalacak bir ipucu: usted bir blazer ceket, tú ise bir tişört — ağzını açmadan önce durumun ne giydiğine karar ver, İspanyolcan anında daha anadili gibi hissettirir.",
      fa:"هر زبانی یک آداب پوشش نانوشته دارد و مال اسپانیایی از خیلی زبان‌های دیگر سخت‌گیرانه‌تر است — اگر با دمپایی (از نظر گرامری) وارد یک مصاحبه شغلی شوی، فوراً متوجه می‌شوند. usted نشانه رسمیت و فاصله است (مصاحبه شغلی، خطاب به بزرگ‌ترها، نوشتار رسمی)؛ tú نشانه صمیمیت است. نوشتار رسمی به سمت پیوندهای بلندتر می‌رود (no obstante، por consiguiente) و از کلمات پرکننده خودمانی پرهیز می‌کند، درحالی‌که گفتار روزمره به جملات کوتاه‌تر، صورت tú و کلمات پرکننده راحتی مثل bueno یا o sea تکیه دارد. اشتباهی که حتی زبان‌آموزهای پیشرفته را هم لو می‌دهد این است: وسط یک ایمیل بین tú و usted جابه‌جا شدن، یا بدتر، یک نامه رسمی را با Estimado señor شروع کردن و در پاراگراف دوم به oye لغزیدن — یک سطح را انتخاب کن و رویش بمان. یک ترفند ذهنی ساده: usted یک کت‌وشلوار است، tú یک تی‌شرت — قبل از باز کردن دهانت تصمیم بگیر موقعیت چه پوشیده، اسپانیایی‌ات فوراً بومی‌تر به نظر می‌رسد.",
      es:"Todo idioma tiene un código de vestimenta no escrito, y el del español es más estricto que la mayoría — si te presentas a una entrevista de trabajo en chanclas (gramaticalmente hablando), la gente lo nota al instante. Usted marca formalidad y distancia (entrevistas de trabajo, dirigirse a mayores, escritura oficial); tú marca cercanía. La escritura formal prefiere conectores más largos (no obstante, por consiguiente) y evita muletillas informales, mientras que el habla cotidiana se apoya en oraciones más cortas, el uso de tú y muletillas relajadas como bueno u o sea. El error que delata incluso a estudiantes avanzados: cambiar entre tú y usted a mitad de un correo, o peor, empezar una carta formal con Estimado señor y deslizarse hacia un oye en el segundo párrafo — elige un registro y mantente en él. Un truco fácil de recordar: usted es un traje, tú es una camiseta — decide qué lleva puesta la situación antes de abrir la boca, y tu español sonará mucho más natural al instante."},
 wrong:"Oye, ¿usted me puede pasar el informe?", right:"¿Podría usted facilitarme el informe, por favor?",
 blank:{sentence:"Estimado señor Ruiz, le escribo para solicitar información adicional; ___, quedo a la espera de su respuesta.", word:"asimismo", distractors:["o sea","bueno"]},
 wrong2:"Hola profe, oye, no entiendo ni papa de la clase, ¿me explicas otra vez?", right2:"Buenas tardes, profesor. Quisiera pedirle que, por favor, me explique nuevamente ese punto de la clase.",
 blank2:{sentence:"¿___ tienes un momento para revisar mi propuesta?", word:"Oye", distractors:["Disculpe","Estimado"]}},

{id:"g-C1-4", level:"C1", title:{en:"Idioms & Figurative Language", tr:"Deyimler ve Mecazi Dil", fa:"اصطلاحات و زبان مجازی", es:"Modismos y lenguaje figurado"},
 exp:{en:"This is where Spanish stops being a rulebook and starts being alive — idioms are the inside jokes of a language, and once you can drop one naturally, people stop hearing 'a foreigner speaking well' and start hearing 'a person who gets it.' Grammatically, most behave like normal verb phrases and conjugate normally: tomar el pelo a alguien (to pull someone's leg, literally 'take someone's hair'), meter la pata (to put your foot in it, literally 'stick in the paw'), estar en las nubes (to daydream, literally 'be in the clouds'), no tener pelos en la lengua (to speak bluntly, literally 'have no hairs on the tongue'). There's a whole family of these worth collecting too — dar en el clavo ('to hit the nail on the head', to get something exactly right) works the same way. The trap: learners nail the conjugation but swap out a fixed piece, saying meter el pie instead of meter la pata, and native ears catch it instantly — idioms don't bend, even when logic says they should. Picture the literal image behind each one (pulling hair, sticking in a paw, floating in clouds) and the meaning sticks a lot better than rote memorization ever will.",
      tr:"Burada İspanyolca artık bir kurallar kitabı olmaktan çıkıp canlanmaya başlıyor — deyimler bir dilin iç şakalarıdır ve birini doğal şekilde kullanabildiğinde, insanlar artık 'iyi konuşan bir yabancı' değil, 'anlayan biri' duymaya başlar. Dilbilgisi açısından çoğu normal fiil öbekleri gibi davranır ve normal şekilde çekimlenir: tomar el pelo a alguien (birine takılmak, kelimesi kelimesine 'birinin saçını almak'), meter la pata (pot kırmak, kelimesi kelimesine 'pençeyi sokmak'), estar en las nubes (dalıp gitmek, kelimesi kelimesine 'bulutlarda olmak'), no tener pelos en la lengua (dobra dobra konuşmak, kelimesi kelimesine 'dilinde saç olmamak'). Bu ailenin bir üyesi daha var, biriktirmeye değer: dar en el clavo ('çiviye tam vurmak', bir şeyi tam isabetle söylemek/yapmak) da aynı şekilde çalışır. Tuzak şu: öğrenciler çekimi doğru yapar ama sabit parçayı değiştirir, meter la pata yerine meter el pie der ve anadili konuşan kulaklar bunu anında yakalar — deyimler mantık öyle söylese bile esnemez. Her birinin arkasındaki gerçek görüntüyü hayal et (saç çekmek, pençe sokmak, bulutlarda süzülmek), anlam ezberden çok daha iyi aklında kalır.",
      fa:"اینجاست که اسپانیایی از یک کتاب قانون بودن دست می‌کشد و زنده می‌شود — اصطلاحات، جوک‌های داخلی یک زبان‌اند و وقتی بتوانی یکی را طبیعی به کار ببری، دیگر مردم «یک خارجی که خوب حرف می‌زند» نمی‌شنوند، بلکه «کسی که واقعاً می‌فهمد» می‌شنوند. از نظر گرامری، اغلب آن‌ها مثل عبارات فعلی معمولی رفتار می‌کنند و به‌طور عادی صرف می‌شوند: tomar el pelo a alguien (کسی را دست انداختن، به‌معنای واقعی «موی کسی را گرفتن»)، meter la pata (گاف دادن، به‌معنای واقعی «پنجه را فرو کردن»)، estar en las nubes (حواس‌پرت بودن، به‌معنای واقعی «در ابرها بودن»)، no tener pelos en la lengua (رک حرف زدن، به‌معنای واقعی «مو روی زبان نداشتن»). یک عضو دیگر از این خانواده هم ارزش جمع‌کردن دارد: dar en el clavo («درست به میخ زدن»، دقیقاً درست گفتن یا انجام دادن کاری) هم به همین شکل کار می‌کند. تله این‌جاست: زبان‌آموزها صرف فعل را درست انجام می‌دهند اما بخش ثابت را عوض می‌کنند، مثلاً به‌جای meter la pata می‌گویند meter el pie، و گوش بومی فوراً متوجه می‌شود — اصطلاحات، حتی اگر منطق چیز دیگری بگوید، خم نمی‌شوند. تصویر واقعی پشت هر کدام را در ذهنت مجسم کن (کشیدن مو، فرو کردن پنجه، شناور بودن در ابرها)، معنا خیلی بهتر از حفظ طوطی‌وار در ذهنت می‌ماند.",
      es:"Aquí es donde el español deja de ser un manual de reglas y empieza a tener vida — los modismos son los chistes internos de un idioma, y en cuanto sueltas uno con naturalidad, la gente deja de escuchar 'un extranjero que habla bien' y empieza a escuchar 'alguien que lo entiende de verdad'. Gramaticalmente, la mayoría se comporta como frases verbales normales y se conjugan con normalidad: tomar el pelo a alguien, meter la pata, estar en las nubes, no tener pelos en la lengua. Hay otro miembro de esta familia que vale la pena coleccionar: dar en el clavo (acertar exactamente con algo) funciona igual. La trampa: los estudiantes conjugan bien el verbo pero cambian la pieza fija, dicen meter el pie en vez de meter la pata, y un oído nativo lo detecta al instante — los modismos no se doblan, aunque la lógica diga que deberían. Imagínate la imagen literal detrás de cada uno (tirar del pelo, meter una pata, flotar entre nubes) y el significado se te queda grabado mucho mejor que con la memorización mecánica."},
 wrong:"Él tomó el pelo de su hermano.", right:"Él le tomó el pelo a su hermano.",
 blank:{sentence:"Cuando dije eso delante de su jefe, metí la ___.", word:"pata", distractors:["mano","cabeza"]},
 wrong2:"No tiene pelo en la lengua, siempre dice lo que piensa.", right2:"No tiene pelos en la lengua, siempre dice lo que piensa.",
 blank2:{sentence:"Perdona, estaba en las ___ y no te escuché.", word:"nubes", distractors:["estrellas","montañas"]}},

{id:"g-C1-5", level:"C1", title:{en:"Nominalization & Academic Style (el hecho de, la posibilidad de)", tr:"İsimleştirme ve Akademik Üslup (el hecho de, la posibilidad de)", fa:"اسم‌سازی و سبک آکادمیک (el hecho de، la posibilidad de)", es:"Nominalización y estilo académico"},
 exp:{en:"If plain writing is jeans and a t-shirt, academic Spanish is the tuxedo version — it dresses up simple ideas in noun form to sound more considered and to cram more meaning into fewer sentences. Instead of 'es posible que llueva,' formal writing might say 'existe la posibilidad de que llueva.' Common patterns: el hecho de que (the fact that), la posibilidad de que (the possibility that), la necesidad de + infinitive (the need to). These phrases are usually followed by subjunctive when they introduce something uncertain or evaluated. Here's the tripwire nearly everyone hits: dropping the de before que — writing la posibilidad que instead of la posibilidad de que — even though the noun form always needs that little de as a bridge to the clause. A quick trick for building your own: take any adjective you already know (posible, necesario) and its noun cousin is right there waiting (posibilidad, necesidad) — learn the pair once and you can nominalize on the fly.",
      tr:"Sade yazı kot pantolon ve tişörtse, akademik İspanyolca bunun smokin versiyonudur — basit fikirleri isim biçimine sokarak daha derinlemesine düşünülmüş göstermeye ve daha az cümleye daha fazla anlam sığdırmaya çalışır. 'Es posible que llueva' yerine, resmi yazıda 'existe la posibilidad de que llueva' denebilir. Yaygın kalıplar: el hecho de que (... gerçeği), la posibilidad de que (... olasılığı), la necesidad de + mastar (...ihtiyacı). Bu ifadeler belirsiz ya da değerlendirilen bir şeyi tanıttıklarında genellikle dilek-şart kipiyle devam eder. Neredeyse herkesin takıldığı tuzak şu: que'den önceki de'yi düşürmek — la posibilidad que demek, oysa doğrusu la posibilidad de que'dir, çünkü isim biçimi cümleye bağlanmak için her zaman o küçük de köprüsüne ihtiyaç duyar. Kendi cümlelerini kurmak için hızlı bir ipucu: zaten bildiğin herhangi bir sıfatı al (posible, necesario), isim hali zaten orada seni bekliyor (posibilidad, necesidad) — çifti bir kez öğren, sonra anında isimleştirme yapabilirsin.",
      fa:"اگر نوشتار ساده مثل شلوار جین و تی‌شرت است، اسپانیایی آکادمیک نسخه‌ی کت‌وشلوار رسمی آن است — ایده‌های ساده را به شکل اسم درمی‌آورد تا سنجیده‌تر به نظر برسد و معنای بیشتری را در جملات کمتر جا بدهد. به‌جای «es posible que llueva»، نوشتار رسمی ممکن است بگوید «existe la posibilidad de que llueva». الگوهای رایج: el hecho de que (این واقعیت که)، la posibilidad de que (احتمال اینکه)، la necesidad de + مصدر (نیاز به). این عبارات معمولاً وقتی چیزی نامطمئن یا مورد ارزیابی را معرفی می‌کنند با التزامی همراه می‌شوند. تله‌ای که تقریباً همه در آن می‌افتند این است: انداختن de قبل از que — نوشتن la posibilidad que به‌جای la posibilidad de que، درحالی‌که شکل اسمی همیشه به آن de کوچک به‌عنوان پل نیاز دارد تا به جمله وصل شود. یک ترفند سریع برای ساختن نمونه‌های خودت: هر صفتی که از قبل بلدی را بردار (posible، necesario)، اسم متناظرش همان‌جا منتظرت است (posibilidad، necesidad) — این جفت را یک‌بار یاد بگیر، بعد هر وقت خواستی می‌توانی اسم‌سازی کنی.",
      es:"Si el lenguaje sencillo es unos jeans y una camiseta, el español académico es la versión de esmoquin — viste ideas simples con forma de sustantivo para sonar más elaborado y meter más significado en menos oraciones. En vez de 'es posible que llueva', un texto formal podría decir 'existe la posibilidad de que llueva'. Patrones comunes: el hecho de que, la posibilidad de que, la necesidad de + infinitivo. Estas frases suelen ir seguidas de subjuntivo cuando introducen algo incierto o valorado. La trampa en la que casi todo el mundo cae: olvidarse del de antes de que — escribir la posibilidad que en vez de la posibilidad de que, cuando la forma nominal siempre necesita ese pequeño de como puente hacia la oración. Un truco rápido para construir las tuyas: toma cualquier adjetivo que ya conozcas (posible, necesario) y su primo sustantivo está ahí mismo esperando (posibilidad, necesidad) — aprende el par una vez y podrás nominalizar sobre la marcha."},
 wrong:"Existe la posibilidad que llueva mañana.", right:"Existe la posibilidad de que llueva mañana.",
 blank:{sentence:"Los científicos plantean la posibilidad de que el virus ___ mutado.", word:"haya", distractors:["ha","había"]},
 wrong2:"El hecho que ella no llamó me preocupa.", right2:"El hecho de que ella no llamara me preocupa.",
 blank2:{sentence:"___ hecho de que no respondiera nos pareció sospechoso.", word:"El", distractors:["Un","Ese"]}},

{id:"g-C1-6", level:"C1", title:{en:"High-Level Connectors (no obstante, en cuanto a, de ahí que, so pena de)", tr:"İleri Düzey Bağlaçlar (no obstante, en cuanto a, de ahí que, so pena de)", fa:"حرف‌ربط‌های سطح بالا (no obstante، en cuanto a، de ahí que، so pena de)", es:"Conectores de alto nivel"},
 exp:{en:"Connectors are the seasoning of a language — swap salt for a pinch of saffron and the exact same ingredients suddenly taste completely different, which is exactly what these four do to an ordinary sentence. No obstante = however/nevertheless (more formal than pero). En cuanto a = as for/regarding, used to shift topic. De ahí que = which is why/hence (usually followed by subjunctive, since it introduces a logical consequence). So pena de = under penalty of (very formal, mostly legal or written). The mistake that gives away non-native writing instantly: tacking a de onto no obstante, writing no obstante de la lluvia instead of the correct no obstante la lluvia — no obstante already does its job without help. Sprinkle even one or two of these into an essay or a formal email and it stops reading like a translated text and starts reading like something a native speaker actually wrote.",
      tr:"Bağlaçlar bir dilin baharatıdır — tuzu bir tutam safranla değiştir, aynı malzemeler birdenbire tamamen farklı bir tat verir, bu dört bağlaç da sıradan bir cümleye tam olarak bunu yapar. No obstante = ancak/yine de (pero'dan daha resmi). En cuanto a = ...'ye gelince, konu değiştirmek için kullanılır. De ahí que = bu yüzden/dolayısıyla (genellikle dilek-şart kipiyle devam eder, çünkü mantıksal bir sonucu tanıtır). So pena de = ...cezası altında (çok resmi, çoğunlukla hukuki ya da yazılı metinlerde). Anadili olmayan birinin yazdığını anında ele veren hata şu: no obstante'nin sonuna de eklemek, doğrusu no obstante la lluvia iken no obstante de la lluvia demek — no obstante zaten yardımsız işini görür. Bir denemeye ya da resmi bir e-postaya bunlardan bir ya da ikisini serpiştirdiğinde, artık çevrilmiş bir metin gibi değil, anadili konuşan birinin gerçekten yazdığı bir şey gibi okunur.",
      fa:"حرف‌ربط‌ها ادویه‌ی یک زبان‌اند — نمک را با یک‌ذره زعفران عوض کن، همان مواد اولیه ناگهان طعمی کاملاً متفاوت می‌گیرند، و این چهار مورد دقیقاً همین کار را با یک جمله معمولی می‌کنند. no obstante = با این حال/بااین‌وجود (رسمی‌تر از pero). en cuanto a = در مورد/راجع به، برای تغییر موضوع استفاده می‌شود. de ahí que = از این رو/به همین دلیل (معمولاً با التزامی همراه می‌شود، چون نتیجه‌ای منطقی را معرفی می‌کند). so pena de = تحت مجازات (بسیار رسمی، بیشتر در متون حقوقی یا نوشتاری). اشتباهی که فوراً غیربومی بودن نوشته را لو می‌دهد این است: چسباندن de به انتهای no obstante، یعنی نوشتن no obstante de la lluvia به‌جای شکل درست no obstante la lluvia — no obstante خودش بدون کمک هم کارش را انجام می‌دهد. اگر حتی یکی دو تا از این‌ها را در یک مقاله یا ایمیل رسمی بپاشی، دیگر مثل یک متن ترجمه‌شده خوانده نمی‌شود، بلکه مثل چیزی می‌شود که واقعاً یک بومی نوشته.",
