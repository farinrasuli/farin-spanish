      es:"Los conectores son la especia de un idioma — cambia la sal por una pizca de azafrán y los mismos ingredientes de repente saben completamente distinto, y eso es justo lo que estos cuatro le hacen a una oración común. No obstante = sin embargo (más formal que pero). En cuanto a = respecto a, se usa para cambiar de tema. De ahí que = por eso/por lo cual (suele ir seguido de subjuntivo, porque introduce una consecuencia lógica). So pena de = bajo pena de (muy formal, sobre todo en textos legales o escritos). El error que delata al instante un texto no nativo: pegarle un de a no obstante, escribiendo no obstante de la lluvia en vez de lo correcto, no obstante la lluvia — no obstante ya hace su trabajo sin ayuda. Espolvorea uno o dos de estos en un ensayo o un correo formal y dejará de sonar a texto traducido para sonar a algo que realmente escribió un hablante nativo."},
 wrong:"No obstante de la lluvia, salimos a caminar.", right:"No obstante la lluvia, salimos a caminar.",
 blank:{sentence:"___ al presupuesto, lo discutiremos en la próxima reunión.", word:"En cuanto", distractors:["No obstante","De ahí"]},
 wrong2:"El precio subió mucho, de ahí que nadie compra el producto.", right2:"El precio subió mucho, de ahí que nadie compre el producto.",
 blank2:{sentence:"Está prohibido fumar en el edificio, ___ multa.", word:"so pena de", distractors:["no obstante de","en cuanto a"]}},

{id:"g-C1-7", level:"C1", title:{en:"Subjunctive in Complex Concessive Clauses (por muy...que, por mucho que)", tr:"Karmaşık Ayrıcalık Cümlelerinde Dilek-Şart Kipi (por muy...que, por mucho que)", fa:"وجه التزامی در جمله‌های امتیازی پیچیده (por muy...que، por mucho que)", es:"Subjuntivo en oraciones concesivas complejas"},
 exp:{en:"These are the ultimate 'yeah, but so what' sentences — you concede the obstacle is real, then bulldoze straight through it anyway. Por muy + adjective/adverb + que + subjunctive: Por muy cansado que estés, tienes que terminar el informe (No matter how tired you are, you have to finish the report). Por mucho + noun + que + subjunctive: Por mucho dinero que tenga, nunca está satisfecho (No matter how much money he has, he's never satisfied). Notice the built-in cheat sheet: muy pairs with adjectives and adverbs exactly like it always does, and mucho pairs with nouns exactly like it always does — the concessive structure just recycles a rule you already know. The subjunctive is used because the degree is treated as hypothetical, not a specific fact, even if it's clearly true in real life, and that's precisely where learners slip — 'but he obviously IS tired, why not indicative?' — the grammar isn't asking about reality, it's asking about framing. The same pattern stretches to por muchas veces que lo intentes ('no matter how many times you try'), so once it clicks here, it clicks everywhere.",
      tr:"Bunlar nihai 'evet ama ne olmuş yani' cümleleridir — engelin gerçek olduğunu kabul edip, yine de dosdoğru üzerinden geçersin. Por muy + sıfat/zarf + que + dilek-şart kipi: Por muy cansado que estés, tienes que terminar el informe (Ne kadar yorgun olursan ol, raporu bitirmen gerekiyor). Por mucho + isim + que + dilek-şart kipi: Por mucho dinero que tenga, nunca está satisfecho (Ne kadar parası olursa olsun, asla tatmin olmuyor). Yapının içine gizlenmiş kopya kağıdına dikkat et: muy her zamanki gibi sıfat ve zarflarla eşleşir, mucho da her zamanki gibi isimlerle eşleşir — bu ayrıcalık yapısı sadece zaten bildiğin bir kuralı geri dönüştürüyor. Dilek-şart kipi kullanılır çünkü derece, gerçek hayatta açıkça doğru olsa bile varsayımsal bir şey olarak ele alınır, ve öğrencilerin tam olarak burada kaydığı yer de bu — 'ama adam gerçekten yorgun, neden haber kipi olmasın?' — dilbilgisi gerçekliği sormuyor, çerçevelemeyi soruyor. Aynı kalıp por muchas veces que lo intentes'e ('kaç kere denersen dene') kadar uzanır, yani burada bir kere oturduğunda her yerde oturur.",
      fa:"این‌ها نهایتِ جمله‌های «باشه، ولی که چی» هستند — قبول می‌کنی مانع واقعی است، بعد بی‌اعتنا از رویش رد می‌شوی. por muy + صفت/قید + que + التزامی: Por muy cansado que estés, tienes que terminar el informe (هرقدر هم خسته باشی، باید گزارش را تمام کنی). por mucho + اسم + que + التزامی: Por mucho dinero que tenga, nunca está satisfecho (هرقدر هم پول داشته باشد، هیچ‌وقت راضی نیست). به تقلب‌نامه‌ی درون‌ساخته دقت کن: muy درست مثل همیشه با صفت و قید جفت می‌شود، mucho هم درست مثل همیشه با اسم جفت می‌شود — این ساختار امتیازی فقط قاعده‌ای را که از قبل بلدی بازیافت می‌کند. التزامی استفاده می‌شود چون میزان آن، حتی اگر در واقعیت آشکارا درست باشد، به‌عنوان چیزی فرضی در نظر گرفته می‌شود، و دقیقاً همین‌جاست که زبان‌آموزها می‌لغزند — «ولی او واقعاً که خسته است، چرا اخباری نه؟» — گرامر درباره واقعیت نمی‌پرسد، درباره قاب‌بندی می‌پرسد. همین الگو تا por muchas veces que lo intentes («هرقدر هم امتحان کنی») هم کشیده می‌شود، پس وقتی اینجا جا بیفتد، همه‌جا جا می‌افتد.",
      es:"Estas son las frases definitivas de 'ya, pero qué más da' — admites que el obstáculo es real y aun así pasas por encima sin más. Por muy + adjetivo/adverbio + que + subjuntivo: Por muy cansado que estés, tienes que terminar el informe. Por mucho + sustantivo + que + subjuntivo: Por mucho dinero que tenga, nunca está satisfecho. Fíjate en la chuleta que ya trae incorporada: muy se combina con adjetivos y adverbios exactamente como siempre lo hace, y mucho se combina con sustantivos exactamente como siempre lo hace — esta estructura concesiva solo recicla una regla que ya conoces. Se usa el subjuntivo porque el grado se trata como algo hipotético, no como un hecho concreto, aunque en la vida real sea claramente cierto, y ahí es exactamente donde resbalan los estudiantes — 'pero está claro que SÍ está cansado, ¿por qué no indicativo?' — la gramática no pregunta por la realidad, pregunta por el enfoque. El mismo patrón se estira hasta por muchas veces que lo intentes, así que en cuanto lo entiendes aquí, lo entiendes en todas partes."},
 wrong:"Por muy cansado que estás, tienes que terminar el informe.", right:"Por muy cansado que estés, tienes que terminar el informe.",
 blank:{sentence:"Por mucho dinero que ___, nunca está satisfecho.", word:"tenga", distractors:["tiene","tendrá"]},
 wrong2:"Por muy rápido que corres, no vas a alcanzarlo.", right2:"Por muy rápido que corras, no vas a alcanzarlo.",
 blank2:{sentence:"Por muy difícil que ___ el examen, ella siempre aprueba.", word:"sea", distractors:["es","fue"]}},

{id:"g-C1-8", level:"C1", title:{en:"Article Usage — Special Cases", tr:"Tanımlık Kullanımı — Özel Durumlar", fa:"کاربرد حرف تعریف — موارد خاص", es:"El uso del artículo — casos especiales"},
 exp:{en:"Articles feel like the easy part of Spanish until you hit C1, where the tiny words end up carrying real meaning. Drop the article after ser + profession or nationality unless it's modified (Es médico, but Es un médico excelente — a plain profession needs no article, but the moment you add an opinion like 'excellent,' the article comes back). Use the definite article for generic statements about a whole category (El café es bueno para concentrarse — coffee in general, not one specific cup). And abstract nouns often take the article when they're the subject of the sentence (La libertad es un derecho), but not when used more generally after certain verbs. The classic English-speaker slip is saying Es un médico with no adjective at all, dragging over the English habit of always using 'a' before a profession — Spanish doesn't need it until you're describing, not just naming. Quick rule of thumb to keep in your back pocket: no adjective, no article; add an adjective, and the article comes home.",
      tr:"Tanımlıklar C1'e kadar İspanyolcanın kolay kısmı gibi hissettirir, ama bu seviyede o küçücük kelimeler gerçek anlam taşımaya başlar. Ser + meslek/uyruk sonrasında tanımlık düşer, tabii nitelenmiş değilse (Es médico ama Es un médico excelente — sade bir meslek tanımlık istemez, ama 'mükemmel' gibi bir görüş eklediğin an tanımlık geri döner). Bütün bir kategori hakkında genel bir ifade için belirli tanımlık kullanılır (El café es bueno para concentrarse — belirli bir fincan değil, genel olarak kahve). Soyut isimler cümlenin öznesi olduklarında genellikle tanımlık alır (La libertad es un derecho), ama bazı fiillerden sonra daha genel kullanıldıklarında almazlar. İngilizce konuşanların klasik hatası, hiç sıfat kullanmadan Es un médico demek, İngilizcedeki meslekten önce her zaman 'a' kullanma alışkanlığını İspanyolcaya taşımak — İspanyolca, sadece isimlendirirken değil, betimlerken tanımlığa ihtiyaç duyar. Cebinde tutabileceğin kısa bir kural: sıfat yoksa tanımlık yok; sıfat eklersen tanımlık geri gelir.",
      fa:"حروف تعریف تا سطح C1 قسمت آسان اسپانیایی به نظر می‌رسند، اما در این سطح این کلمات کوچک شروع می‌کنند به حمل معنای واقعی. بعد از ser + شغل/ملیت، حرف تعریف حذف می‌شود مگر اینکه توصیف شده باشد (Es médico، اما Es un médico excelente — یک شغل ساده حرف تعریف نمی‌خواهد، اما همین که یک نظر مثل «عالی» اضافه می‌کنی، حرف تعریف برمی‌گردد). برای بیان کلی درباره یک دسته کامل از حرف تعریف معین استفاده می‌شود (El café es bueno para concentrarse — قهوه به‌طور کلی، نه یک فنجان خاص). اسم‌های انتزاعی وقتی فاعل جمله باشند معمولاً حرف تعریف می‌گیرند (La libertad es un derecho)، اما بعد از برخی فعل‌ها وقتی کلی‌تر به کار می‌روند، نمی‌گیرند. لغزش کلاسیک انگلیسی‌زبان‌ها این است که بدون هیچ صفتی می‌گویند Es un médico و عادت انگلیسی «همیشه قبل از شغل a بگذار» را به اسپانیایی می‌کشانند — اسپانیایی تا وقتی فقط نام می‌بری نه توصیف می‌کنی، به آن نیازی ندارد. یک قانون سرانگشتی برای همیشه در جیب داشته باش: بدون صفت، بدون حرف تعریف؛ صفت اضافه کن، حرف تعریف برمی‌گردد.",
      es:"Los artículos parecen la parte fácil del español hasta que llegas a C1, donde esas palabritas terminan cargando un significado real. Se omite el artículo después de ser + profesión o nacionalidad, a menos que esté modificado (Es médico, pero Es un médico excelente — una profesión sencilla no necesita artículo, pero en cuanto añades una opinión como 'excelente', el artículo vuelve). Se usa el artículo definido para afirmaciones genéricas sobre toda una categoría (El café es bueno para concentrarse — el café en general, no una taza en concreto). Y los sustantivos abstractos suelen llevar artículo cuando son el sujeto de la oración (La libertad es un derecho), pero no cuando se usan de forma más general después de ciertos verbos. El desliz clásico de los angloparlantes es decir Es un médico sin ningún adjetivo, arrastrando la costumbre del inglés de poner siempre 'a' antes de una profesión — el español no lo necesita mientras solo estés nombrando, no describiendo. Una regla rápida para guardarte en el bolsillo: sin adjetivo, sin artículo; añade un adjetivo, y el artículo vuelve a casa."},
 wrong:"Mi padre es un ingeniero.", right:"Mi padre es ingeniero.",
 blank:{sentence:"___ paciencia es una virtud que pocos cultivan.", word:"La", distractors:["Una","Esa"]},
 wrong2:"Ella es una doctora.", right2:"Ella es doctora.",
 blank2:{sentence:"Mi hermano quiere ser ___ arquitecto reconocido internacionalmente.", word:"un", distractors:["el","buen"]}},

{id:"g-C1-9", level:"C1", title:{en:"Collocations & Set Expressions (dar un paseo, tomar una decisión, prestar atención)", tr:"Sözcük Ortaklıkları ve Kalıp İfadeler (dar un paseo, tomar una decisión, prestar atención)", fa:"همایندهای واژگانی و عبارات ثابت (dar un paseo، tomar una decisión، prestar atención)", es:"Colocaciones y expresiones idiomáticas"},
 exp:{en:"Verbs and nouns in Spanish pair off like couples who always show up to the party together — try to bring a different date and everyone notices immediately. You dar (give) a walk, not 'take' one: dar un paseo. You tomar (take) a decision: tomar una decisión. You prestar (lend) attention: prestar atención. The same logic covers hacer una pregunta (to ask a question, literally 'to make a question') — another verb-noun couple that just doesn't swap partners. The single most common mistake, especially for English speakers, is dragging over the English verb: saying hacer una decisión because English 'makes' a decision, when Spanish insists on tomar. Swapping the verb, even for a 'synonym,' sounds foreign — so treat each pairing as one word with a space in the middle, memorize the couple, not the individuals, and your Spanish will suddenly sound a lot less like a dictionary and a lot more like a person.",
      tr:"İspanyolcada fiiller ve isimler, partiye her zaman birlikte gelen çiftler gibi eşleşir — farklı biriyle gelmeye kalkarsan herkes anında fark eder. Yürüyüş İspanyolcada 'verilir': dar un paseo (yürüyüşe çıkmak). Karar Türkçede 'verilir' ama İspanyolcada 'alınır': tomar una decisión. Dikkat ise 'ödünç verilir': prestar atención. Aynı mantık hacer una pregunta (soru sormak, kelimesi kelimesine 'bir soru yapmak') için de geçerli — bu da eşini değiştirmeyen başka bir fiil-isim çifti. En yaygın hata, özellikle İngilizce konuşanlarda, İngilizce fiili İspanyolcaya taşımaktır: İngilizce karar 'yapıldığı' (make a decision) için hacer una decisión demek, oysa İspanyolca ısrarla tomar ister. Fiili bir 'eş anlamlıyla' bile değiştirmek kulağa yabancı gelir — bu yüzden her eşleşmeyi ortasında boşluk olan tek bir kelime gibi ele al, çifti ezberle, tek tek kelimeleri değil, ve İspanyolcan birdenbire sözlükten çok daha az, bir insandan çok daha fazla çıkacak.",
      fa:"در اسپانیایی، فعل‌ها و اسم‌ها مثل زوج‌هایی که همیشه با هم به مهمانی می‌آیند جفت می‌شوند — اگر بخواهی با یک همراه دیگر بیایی، همه فوراً متوجه می‌شوند. قدم‌زدن در اسپانیایی «داده» می‌شود: dar un paseo. تصمیم در فارسی «گرفته» می‌شود اما در اسپانیایی «برداشته» می‌شود: tomar una decisión. توجه هم «قرض داده» می‌شود: prestar atención. همین منطق برای hacer una pregunta (سؤال پرسیدن، به‌معنای واقعی «یک سؤال ساختن») هم صدق می‌کند — یک زوج فعل-اسم دیگر که همراهش را عوض نمی‌کند. رایج‌ترین اشتباه، مخصوصاً برای انگلیسی‌زبان‌ها، کشیدن فعل انگلیسی به اسپانیایی است: چون انگلیسی تصمیم را «می‌سازد» (make a decision)، hacer una decisión می‌گویند، درحالی‌که اسپانیایی سرسختانه tomar می‌خواهد. تعویض فعل، حتی با یک «مترادف»، عجیب به گوش می‌رسد — پس هر جفت را مثل یک کلمه با یک فاصله در وسطش در نظر بگیر، زوج را حفظ کن، نه تک‌تک کلمات را، و اسپانیایی‌ات ناگهان خیلی کمتر شبیه فرهنگ لغت و خیلی بیشتر شبیه یک انسان به نظر می‌رسد.",
      es:"En español, los verbos y los sustantivos se emparejan como parejas que siempre llegan juntas a la fiesta — si intentas traer a otra pareja, todo el mundo lo nota al instante. Un paseo se 'da': dar un paseo. Una decisión se 'toma': tomar una decisión. Y la atención se 'presta': prestar atención. La misma lógica cubre hacer una pregunta — otra pareja verbo-sustantivo que simplemente no cambia de compañero. El error más común, sobre todo entre angloparlantes, es arrastrar el verbo del inglés: decir hacer una decisión porque en inglés 'se hace' (make) una decisión, cuando el español insiste en tomar. Cambiar el verbo, incluso por un 'sinónimo', suena raro — así que trata cada combinación como una sola palabra con un espacio en medio, memoriza la pareja, no las piezas por separado, y tu español de repente sonará mucho menos a diccionario y mucho más a persona de verdad."},
 wrong:"Vamos a hacer un paseo por el parque.", right:"Vamos a dar un paseo por el parque.",
 blank:{sentence:"Todavía no he ___ una decisión sobre el trabajo.", word:"tomado", distractors:["hecho","dado"]},
 wrong2:"Por favor, da atención a las instrucciones.", right2:"Por favor, presta atención a las instrucciones.",
 blank2:{sentence:"El comité tiene que ___ una decisión antes del viernes.", word:"tomar", distractors:["hacer","dar"]}},

{id:"g-C1-10", level:"C1", title:{en:"Nuances of the Past — Pluperfect & Beyond", tr:"Geçmiş Zamanın İncelikleri — Pluscuamperfecto ve Ötesi", fa:"ظرافت‌های گذشته — گذشته دورتر از گذشته (pluscuamperfecto) و فراتر", es:"Matices del pasado — pluscuamperfecto y otros"},
 exp:{en:"Telling a story in Spanish past tenses is like directing a movie with four different camera settings, and by C1 you're expected to switch between them without the audience noticing the cut. The pluperfect (había hablado) describes an action completed before another past action — a 'past before the past': Cuando llegué, ella ya había salido (When I arrived, she had already left). At this level, the real skill is choosing correctly among all the past tenses together: pretérito for a completed, bounded event, like a photograph freezing one moment; imperfecto for background, ongoing states, or habits, like the video rolling behind that photograph; pluscuamperfecto for what happened even earlier, the flashback inside the flashback; and the present perfect (he hablado) for a past action still relevant now, a file that hasn't been closed yet. The mistake that trips up even strong students is reaching for pretérito when they mean pluscuamperfecto — saying cuando llegué, ella ya salió instead of ella ya había salido, which erases the crucial sense that she left before you even got there. Keep those four camera angles straight and any story you tell will have the kind of depth and timing that makes native listeners lean in.",
      tr:"İspanyolca geçmiş zamanlarla hikaye anlatmak, dört farklı kamera ayarıyla film yönetmek gibidir, ve C1 seviyesinde izleyici kesmeyi fark etmeden aralarında geçiş yapman beklenir. Pluscuamperfecto (había hablado), başka bir geçmiş eylemden önce tamamlanmış bir eylemi anlatır — 'geçmişin geçmişi': Cuando llegué, ella ya había salido (Vardığımda, o zaten çıkmıştı). Bu seviyede asıl beceri, tüm geçmiş zamanlar arasında doğru seçim yapabilmektir: pretérito, bir anı donduran bir fotoğraf gibi, tamamlanmış ve sınırlı bir olay için; imperfecto, o fotoğrafın arkasında akan video gibi, arka plan, süregelen durumlar veya alışkanlıklar için; pluscuamperfecto, geri dönüşün içindeki geri dönüş gibi, daha önce olan bir şey için; pretérito perfecto (he hablado) ise henüz kapanmamış bir dosya gibi, hâlâ şimdiki zamanla ilgili geçmiş bir eylem için kullanılır. Güçlü öğrencileri bile ele veren hata, pluscuamperfecto gerekirken pretérito'ya uzanmak — ella ya había salido yerine cuando llegué, ella ya salió demek, bu da onun sen daha oraya varmadan önce çıktığı kritik anlamı siler. Bu dört kamera açısını doğru tut, anlattığın her hikaye anadili konuşanları öne eğdirecek türden bir derinlik ve zamanlama kazanır.",
      fa:"روایت کردن یک داستان با زمان‌های گذشته اسپانیایی مثل کارگردانی یک فیلم با چهار تنظیم دوربین مختلف است، و در سطح C1 از تو انتظار می‌رود بدون اینکه مخاطب متوجه برش شود بین آن‌ها جابه‌جا شوی. گذشته دورتر از گذشته (pluscuamperfecto — había hablado) کنشی را توصیف می‌کند که قبل از کنش دیگری در گذشته کامل شده — «گذشتهِ گذشته»: Cuando llegué, ella ya había salido (وقتی رسیدم، او قبلاً رفته بود). در این سطح، مهارت اصلی این است که به‌درستی از میان همه زمان‌های گذشته انتخاب کنی: pretérito، مثل یک عکس که یک لحظه را منجمد می‌کند، برای رویدادی کامل و محدود؛ imperfecto، مثل ویدیویی که پشت آن عکس در حال پخش است، برای پس‌زمینه، حالت‌های ادامه‌دار یا عادت‌ها؛ pluscuamperfecto، مثل فلاش‌بک داخل فلاش‌بک، برای چیزی که حتی زودتر اتفاق افتاده؛ و ماضی نقلی (he hablado)، مثل پرونده‌ای که هنوز بسته نشده، برای کنش گذشته‌ای که هنوز به حال مرتبط است. اشتباهی که حتی زبان‌آموزهای قوی را هم گیر می‌اندازد این است که به‌جای pluscuamperfecto سراغ pretérito می‌روند — به‌جای ella ya había salido می‌گویند cuando llegué, ella ya salió، که این حس حیاتی را پاک می‌کند که او قبل از رسیدن تو رفته بود. این چهار زاویه دوربین را درست نگه دار، هر داستانی که تعریف کنی آن نوع عمق و زمان‌بندی را پیدا می‌کند که شنونده‌های بومی را جذب خودش می‌کند.",
      es:"Contar una historia con los tiempos del pasado en español es como dirigir una película con cuatro ajustes de cámara distintos, y en el nivel C1 se espera que cambies entre ellos sin que el público note el corte. El pluscuamperfecto (había hablado) describe una acción terminada antes de otra acción pasada — un 'pasado del pasado': Cuando llegué, ella ya había salido. En este nivel, la verdadera habilidad está en elegir correctamente entre todos los tiempos del pasado juntos: el pretérito, como una foto que congela un instante, para un evento completo y delimitado; el imperfecto, como el video que corre detrás de esa foto, para el trasfondo, estados continuos o hábitos; el pluscuamperfecto, como el flashback dentro del flashback, para lo que pasó incluso antes; y el pretérito perfecto (he hablado), como un archivo que todavía no se ha cerrado, para una acción pasada que sigue siendo relevante ahora. El error que hace tropezar incluso a los mejores estudiantes es recurrir al pretérito cuando hace falta el pluscuamperfecto — decir cuando llegué, ella ya salió en vez de ella ya había salido, lo que borra el matiz clave de que ella se fue incluso antes de que tú llegaras. Mantén esos cuatro ángulos de cámara claros y cualquier historia que cuentes tendrá esa profundidad y ese ritmo que hacen que los hablantes nativos se inclinen para escuchar mejor."},
 wrong:"Cuando llegué, ella ya salió.", right:"Cuando llegué, ella ya había salido.",
 blank:{sentence:"Nunca ___ tal cosa antes de mudarme a España.", word:"había visto", distractors:["vi","he visto"]},
 wrong2:"Mientras yo cociné, mi hermana ponía la mesa.", right2:"Mientras yo cocinaba, mi hermana ponía la mesa.",
 blank2:{sentence:"Esta semana ya ___ tres informes; necesito un descanso.", word:"he terminado", distractors:["terminé","había terminado"]}}
,
{id:"g-B1-1", level:"B1", title:{en:"The Present Perfect (he hablado, has comido)", tr:"Yakın Geçmiş Zaman (he hablado, has comido)", fa:"ماضی نقلی (he hablado, has comido)", es:"Pretérito perfecto compuesto (he hablado, has comido)"},
 exp:{en:"Picture this: your friend in Madrid asks '¿Has comido?' the moment you walk in — not '¿Comiste?' — because in Spanish, when something is still relevant to right now, you reach for the present perfect. It's built from haber (he, has, ha, hemos, habéis, han) plus a past participle, and for regular verbs that participle is dead simple: hablar → hablado, comer → comido, vivir → vivido — just swap the ending for -ado or -ido. The tricky part is the irregular participles, and this is exactly where learners trip up: your brain wants to regularize 'escribir' into 'escribido', but it's actually escrito, and the same goes for hecho (hacer), dicho (decir), visto (ver), and puesto (poner). A good trick: most of these irregular ones are short and a little unexpected, so if a participle feels too easy, double-check it. Master this handful of troublemakers and the present perfect becomes one of the most useful tenses in your whole toolkit — perfect for talking about your day, your week, your life so far.",
      tr:"Şunu düşün: Madrid'deki arkadaşın kapıdan girer girmez sana 'Comiste?' değil, '¿Has comido?' diye sorar — çünkü İspanyolcada bir şey hâlâ şimdiki zamanla bağlantılıysa, yakın geçmiş zamana başvurursun. Bu zaman, haber fiili (he, has, ha, hemos, habéis, han) artı bir geçmiş zaman ortacından oluşur ve düzenli fiillerde bu ortacı yapmak çok kolaydır: hablar → hablado, comer → comido, vivir → vivido — sadece sonu -ado veya -ido yaparsın. Zor kısım düzensiz ortaçlardır ve öğrencilerin asıl tökezlediği yer tam da burasıdır: beynin 'escribir'i 'escribido' yapmak ister ama doğrusu escrito'dur, aynı şey hecho (hacer), dicho (decir), visto (ver) ve puesto (poner) için de geçerlidir. İşe yarar bir ipucu: bu düzensizlerin çoğu kısa ve biraz beklenmedik biçimlerdir, yani bir ortaç sana fazla kolay geliyorsa bir kez daha kontrol et. Bu bir avuç asi fiili hakla, yakın geçmiş zaman elindeki en kullanışlı zamanlardan biri olsun — günün, haftan, hayatın şimdiye kadar ne olduğu hakkında konuşmak için birebir.",
      fa:"یک لحظه فکر کن: دوستت در مادرید همین که وارد می‌شوی می‌پرسد «¿Has comido؟» نه «¿Comiste؟» — چون در اسپانیایی وقتی چیزی هنوز با همین الان مرتبط است، سراغ ماضی نقلی می‌روی. این زمان از فعل haber (he, has, ha, hemos, habéis, han) به‌علاوه‌ی اسم مفعول ساخته می‌شود و در فعل‌های باقاعده ساختنش خیلی ساده است: hablar → hablado، comer → comido، vivir → vivido — فقط پایان فعل را به -ado یا -ido تبدیل می‌کنی. قسمت سخت، اسم مفعول‌های بی‌قاعده‌اند و دقیقاً همین‌جاست که بیشتر زبان‌آموزها گیر می‌کنند: ذهنت می‌خواهد escribir را به escribido تبدیل کند، اما درستش escrito است، و همین اتفاق برای hecho (از hacer)، dicho (از decir)، visto (از ver) و puesto (از poner) هم می‌افتد. یک ترفند خوب: بیشتر این بی‌قاعده‌ها کوتاه و کمی غیرمنتظره‌اند، پس اگر یک اسم مفعول برایت خیلی ساده به نظر رسید، دوباره چکش کن. این مشت کوچک از فعل‌های سرکش را که یاد بگیری، ماضی نقلی یکی از کاربردی‌ترین زمان‌های دستور زبانت می‌شود — عالی برای حرف زدن درباره‌ی روزت، هفته‌ات و زندگی‌ات تا همین الان.",
      es:"Imagínate esto: tu amigo en Madrid te pregunta '¿Has comido?' apenas entras por la puerta — no '¿Comiste?' — porque en español, cuando algo todavía tiene conexión con el presente, usas el pretérito perfecto. Se forma con haber (he, has, ha, hemos, habéis, han) más un participio pasado, y en los verbos regulares ese participio es facilísimo: hablar → hablado, comer → comido, vivir → vivido — solo cambias la terminación por -ado o -ido. Lo complicado son los participios irregulares, y aquí es justo donde tropieza la mayoría: tu cabeza quiere regularizar 'escribir' como 'escribido', pero en realidad es escrito, y lo mismo pasa con hecho (hacer), dicho (decir), visto (ver) y puesto (poner). Un truco útil: casi todos estos irregulares son cortos y un poco inesperados, así que si un participio te parece demasiado fácil, revísalo dos veces. Domina a este puñado de rebeldes y el pretérito perfecto se convierte en uno de los tiempos más útiles de tu arsenal — perfecto para hablar de tu día, tu semana, tu vida hasta ahora."},
 wrong:"Yo he hablo con ella hoy.", right:"Yo he hablado con ella hoy.",
 blank:{sentence:"Todavía no ___ nada hoy.", word:"he comido", distractors:["como","comí"]},
 wrong2:"Todavía no he escribido la carta.", right2:"Todavía no he escrito la carta.",
 blank2:{sentence:"¿Alguna vez tú ___ paella valenciana?", word:"has comido", distractors:["comes","comiste"]}},

{id:"g-B1-2", level:"B1", title:{en:"Present Subjunctive — How It's Formed", tr:"Şimdiki Dilek Kipi — Nasıl Oluşturulur", fa:"وجه التزامی حال — نحوه ساخت آن", es:"Subjuntivo presente — cómo se forma"},
 exp:{en:"The subjunctive has this scary reputation, but here's a secret: forming it is basically just a vowel swap, not a whole new system to learn from scratch. Start from the yo form of the present indicative, chop off the -o, and then flip the vowel — -ar verbs borrow the 'e' family of endings (hable, hables, hable, hablemos, habléis, hablen), while -er/-ir verbs borrow the 'a' family (coma, comas, coma, comamos, comáis, coman). A handful of high-frequency verbs refuse to play along and just have to be memorized: ser → sea, estar → esté, haber → haya, ir → vaya, saber → sepa, dar → dé. Watch that last one especially — dé needs its accent mark, or it turns into the word 'de' (of/from) and confuses everyone including you. One trick that helps it stick: think 'ar verbs act like er verbs, and er/ir verbs act like ar verbs' — the endings literally swap teams. Nail this pattern once and you'll be forming subjunctive on autopilot for every verb you meet from here on out.",
      tr:"Dilek kipinin ürkütücü bir ünü var ama sana bir sır vereyim: onu oluşturmak aslında sıfırdan öğrenilecek yeni bir sistem değil, sadece bir ünlü değişimi. Şimdiki zamanın yo (ben) biçiminden başla, sondaki -o'yu at, sonra ünlüyü ters çevir: -ar fiilleri 'e' ailesinin eklerini ödünç alır (hable, hables, hable, hablemos, habléis, hablen), -er/-ir fiilleri ise 'a' ailesinin eklerini ödünç alır (coma, comas, coma, comamos, comáis, coman). Birkaç sık kullanılan fiil bu kurala uymaz ve doğrudan ezberlenmesi gerekir: ser → sea, estar → esté, haber → haya, ir → vaya, saber → sepa, dar → dé. Özellikle sonuncusuna dikkat et: dé, aksan işaretini almazsa 'de' (-den/-dan) kelimesine dönüşür ve hem seni hem karşındakini karıştırır. Aklında kalması için işe yarayan bir yöntem: '-ar fiilleri -er gibi davranır, -er/-ir fiilleri de -ar gibi davranır' diye düşün — ekler kelimenin tam anlamıyla taraf değiştirir. Bu kalıbı bir kez kavradın mı, bundan sonra karşına çıkan her fiilde dilek kipini otomatik olarak kurarsın.",
      fa:"وجه التزامی شهرت ترسناکی دارد، اما یک رازی برایت می‌گویم: ساختنش در واقع فقط جابه‌جایی یک مصوت است، نه یک سیستم کاملاً جدید که باید از صفر یاد بگیری. از صورت yo (من) در زمان حال اخباری شروع کن، -o آخر را حذف کن و بعد مصوت را برعکس کن: فعل‌های -ar پسوندهای خانواده‌ی «e» را قرض می‌گیرند (hable, hables, hable, hablemos, habléis, hablen) و فعل‌های -er/-ir پسوندهای خانواده‌ی «a» را قرض می‌گیرند (coma, comas, coma, comamos, comáis, coman). چند فعل پرکاربرد از این قاعده سرپیچی می‌کنند و باید صرفاً حفظ شوند: ser → sea، estar → esté، haber → haya، ir → vaya، saber → sepa، dar → dé. مخصوصاً به آخری دقت کن: dé باید علامت تکیه‌اش را داشته باشد، وگرنه تبدیل می‌شود به کلمه‌ی de (از) و همه از جمله خودت را گیج می‌کند. یک ترفند که کمک می‌کند در ذهنت بماند: فکر کن «فعل‌های -ar مثل -er رفتار می‌کنند و فعل‌های -er/-ir مثل -ar» — پسوندها واقعاً جای هم را عوض می‌کنند. این الگو را یک بار قشنگ یاد بگیری، از این به بعد برای هر فعلی که ببینی وجه التزامی را خودکار می‌سازی.",
      es:"El subjuntivo tiene fama de dar miedo, pero aquí va un secreto: formarlo es básicamente un cambio de vocal, no un sistema nuevo que tengas que aprender desde cero. Parte de la forma yo del presente de indicativo, quítale la -o y después invierte la vocal: los verbos -ar toman prestadas las terminaciones de la familia 'e' (hable, hables, hable, hablemos, habléis, hablen), mientras que los verbos -er/-ir toman prestadas las de la familia 'a' (coma, comas, coma, comamos, comáis, coman). Un puñado de verbos muy frecuentes se niegan a seguir la regla y hay que memorizarlos sin más: ser → sea, estar → esté, haber → haya, ir → vaya, saber → sepa, dar → dé. Presta especial atención a ese último: dé necesita su tilde, o se convierte en la palabra 'de' y confunde a todo el mundo, incluido tú. Un truco que ayuda a que se te quede: piensa 'los verbos -ar actúan como -er, y los -er/-ir actúan como -ar' — las terminaciones literalmente cambian de bando. Domina este patrón una vez y formarás el subjuntivo en piloto automático para cualquier verbo que te encuentres de ahora en adelante."},
 wrong:"Espero que tú hablas más despacio.", right:"Espero que tú hables más despacio.",
 blank:{sentence:"Quiero que ella ___ más verduras.", word:"coma", distractors:["come","comió"]},
 wrong2:"Ojalá que él es puntual.", right2:"Ojalá que él sea puntual.",
 blank2:{sentence:"Espero que ustedes ___ a la fiesta.", word:"vayan", distractors:["van","fueron"]}},

{id:"g-B1-3", level:"B1", title:{en:"Subjunctive with Wishes & Requests (quiero que...)", tr:"Dilek ve Rica Bildiren Dilek Kipi (quiero que...)", fa:"التزامی برای آرزو و درخواست (quiero que...)", es:"Subjuntivo con deseos y peticiones (quiero que...)"},
 exp:{en:"You know that moment when you want your roommate to finally do the dishes, or you're hoping your flight arrives on time? Spanish has a special grammatical signal for exactly that: whenever the verb describes something you want someone else to do, it flips into the subjunctive, because it's not a fact yet — it's just a wish. The trigger phrases to lock in are quiero que, espero que, ojalá que, necesito que, and prefiero que, all followed by a subject change and a subjunctive verb. The single most common slip-up is forgetting to make that switch — saying 'quiero que tú vienes' out of habit instead of 'quiero que tú vengas', because indicative just feels more natural at first. Here's the shortcut: if the subject stays the same, skip 'que' entirely and just use the infinitive — quiero comer, not quiero que como — but the second a new subject walks in, 'que' plus subjunctive follows right behind. Think of que as a little red flag: every time you see it after a wish or desire, your brain should light up and reach for the subjunctive ending. Get that reflex down and sentences like 'ojalá que tengas un buen viaje' will start rolling off your tongue without a second thought.",
      tr:"Ev arkadaşının bulaşıkları bir kere olsun yıkamasını istediğin ya da uçağının zamanında inmesini umduğun o anı bilir misin? İspanyolca'da tam da bunun için özel bir dilbilgisi sinyali var: fiil, başka birinin yapmasını istediğin bir şeyi anlatıyorsa dilek kipine döner, çünkü bu henüz bir gerçek değil — sadece bir dilek. Ezberlemen gereken tetikleyici ifadeler quiero que, espero que, ojalá que, necesito que ve prefiero que'dir; hepsinin ardından özne değişimi ve dilek kipinde bir fiil gelir. En yaygın hata, bu geçişi yapmayı unutmaktır — alışkanlıkla 'quiero que tú vienes' demek, oysa doğrusu 'quiero que tú vengas'tır, çünkü başlangıçta bildirme kipi kulağa daha doğal gelir. İşte kestirme yol: özne değişmiyorsa 'que'yi tamamen unut ve doğrudan mastar kullan — quiero comer, quiero que como değil — ama yeni bir özne devreye girer girmez hemen ardından 'que' artı dilek kipi gelir. 'Que'yi küçük bir kırmızı bayrak gibi düşün: onu bir dilekten sonra her gördüğünde, beynin yanıp dilek kipi ekine uzanmalı. Bu refleksi kaptığında, 'ojalá que tengas un buen viaje' gibi cümleler hiç düşünmeden ağzından dökülmeye başlayacak.",
      fa:"آن لحظه‌ای را می‌شناسی که دلت می‌خواهد هم‌خانه‌ات بالاخره ظرف‌ها را بشوید یا امیدواری پروازت به‌موقع برسد؟ اسپانیایی دقیقاً برای همین یک نشانه‌ی دستوری خاص دارد: هر وقت فعل چیزی را توصیف می‌کند که می‌خواهی فرد دیگری انجامش دهد، به وجه التزامی می‌رود، چون هنوز یک واقعیت نیست — فقط یک آرزوست. عبارات محرکی که باید حفظشان کنی quiero que، espero que، ojalá que، necesito que و prefiero que هستند که همه با تغییر فاعل و فعل التزامی همراه‌اند. رایج‌ترین اشتباه این است که این تغییر را فراموش می‌کنی — از روی عادت می‌گویی «quiero que tú vienes» به‌جای «quiero que tú vengas»، چون در ابتدا وجه اخباری طبیعی‌تر به نظر می‌رسد. این هم یک میان‌بر: اگر فاعل عوض نشود، «que» را کلاً کنار بگذار و از مصدر استفاده کن — quiero comer، نه quiero que como — اما همین که فاعل جدیدی وارد می‌شود، بلافاصله «que» به‌همراه فعل التزامی می‌آید. به «que» مثل یک پرچم قرمز کوچک نگاه کن: هر بار بعد از یک آرزو دیدیش، ذهنت باید روشن شود و سراغ پایان‌بندی التزامی برود. این رفلکس را که یاد بگیری، جمله‌هایی مثل «ojalá que tengas un buen viaje» بدون فکر کردن از دهانت بیرون می‌آید.",
      es:"¿Conoces ese momento en que quieres que tu compañero de piso por fin lave los platos, o esperas que tu vuelo llegue a tiempo? El español tiene una señal gramatical especial justo para eso: cuando el verbo describe algo que quieres que haga otra persona, cambia al subjuntivo, porque todavía no es un hecho — es solo un deseo. Las frases clave que debes memorizar son quiero que, espero que, ojalá que, necesito que y prefiero que, todas seguidas de un cambio de sujeto y un verbo en subjuntivo. El error más común es olvidarse de hacer ese cambio — decir 'quiero que tú vienes' por costumbre en lugar de 'quiero que tú vengas', porque al principio el indicativo simplemente suena más natural. Aquí tienes el atajo: si el sujeto no cambia, olvídate del 'que' y usa directamente el infinitivo — quiero comer, no quiero que como — pero en cuanto entra un sujeto nuevo, el 'que' más subjuntivo le sigue de inmediato. Piensa en 'que' como una banderita roja: cada vez que lo veas después de un deseo, tu cerebro debería encenderse y buscar la terminación de subjuntivo. Domina ese reflejo y frases como 'ojalá que tengas un buen viaje' te saldrán solas, sin pensarlo dos veces."},
 wrong:"Quiero que tú vienes conmigo mañana.", right:"Quiero que tú vengas conmigo mañana.",
 blank:{sentence:"Espero que ustedes ___ un buen viaje.", word:"tengan", distractors:["tienen","tuvieron"]},
 wrong2:"Mis padres quieren que yo estudio medicina.", right2:"Mis padres quieren que yo estudie medicina.",
 blank2:{sentence:"Ojalá que ___ buen tiempo este fin de semana.", word:"haga", distractors:["hace","hizo"]}},

{id:"g-B1-4", level:"B1", title:{en:"Subjunctive with Doubt & Denial (no creo que, dudo que)", tr:"Şüphe ve İnkâr Bildiren Dilek Kipi (no creo que, dudo que)", fa:"التزامی برای شک و انکار (no creo que، dudo que)", es:"Subjuntivo con duda y negación (no creo que, dudo que)"},
 exp:{en:"Here's a fun quirk: the exact same verb, creer, can trigger two completely different moods depending on one tiny word — no. Say 'creo que' and you're stating a fact as far as you're concerned, so the verb after it stays in the indicative: creo que ella es inteligente. But slap a 'no' in front — no creo que — and suddenly you're expressing doubt, not certainty, so the verb jumps to the subjunctive: no creo que él tenga razón. The same flip happens with dudo que, no es cierto que, and no pienso que, all of which signal 'I'm not sure this is true' and demand the subjunctive. The trap most learners fall into is treating creer as an automatic subjunctive trigger and using it even in the positive form, saying something like 'creo que ella sea inteligente' when it should just be es. The cleanest way to remember it: certainty stays grounded in the indicative, doubt floats off into the subjunctive — and 'no' is the switch that flips one into the other. Once that clicks, you'll hear the difference between confidence and hesitation in every conversation you have.",
      tr:"İşte eğlenceli bir ayrıntı: aynı fiil, creer, minicik bir kelimeye bağlı olarak tamamen farklı iki kipi tetikleyebilir — no. 'Creo que' dediğinde, senin açından bunu bir gerçek olarak sunuyorsun demektir, bu yüzden sonrasındaki fiil bildirme kipinde kalır: creo que ella es inteligente. Ama önüne bir 'no' koyduğunda — no creo que — birden kesinlik değil şüphe ifade etmiş olursun, bu yüzden fiil dilek kipine sıçrar: no creo que él tenga razón. Aynı değişim dudo que, no es cierto que ve no pienso que ile de olur; hepsi 'bunun doğru olduğundan emin değilim' anlamına gelir ve dilek kipi ister. Çoğu öğrencinin düştüğü tuzak, creer'i otomatik bir dilek kipi tetikleyicisi sanıp olumlu biçiminde bile kullanmaktır; 'creo que ella sea inteligente' gibi bir şey söylerler, oysa sadece es olmalıdır. Bunu akılda tutmanın en kolay yolu şu: kesinlik bildirme kipinin sağlam zemininde kalır, şüphe ise dilek kipine doğru havalanır — ve 'no' da birini diğerine çeviren düğmedir. Bu netleştiğinde, her sohbette özgüven ile tereddüt arasındaki farkı duymaya başlayacaksın.",
      fa:"یک نکته‌ی جالب: یک فعل، creer، بسته به یک کلمه‌ی کوچک می‌تواند دو وجه کاملاً متفاوت را فعال کند — no. اگر بگویی «creo que»، یعنی از نظر تو این یک واقعیت است، پس فعل بعدش در وجه اخباری می‌ماند: creo que ella es inteligente. اما یک «no» جلویش بگذاری — no creo que — ناگهان داری شک را بیان می‌کنی، نه یقین را، پس فعل به وجه التزامی می‌پرد: no creo que él tenga razón. همین تغییر با dudo que، no es cierto que و no pienso que هم اتفاق می‌افتد که همگی یعنی «مطمئن نیستم این درست باشد» و التزامی می‌خواهند. دامی که بیشتر زبان‌آموزها در آن می‌افتند این است که creer را یک محرک خودکار برای التزامی می‌دانند و حتی در حالت مثبتش هم آن را به کار می‌برند و می‌گویند «creo que ella sea inteligente» درحالی‌که باید فقط es باشد. ساده‌ترین راه برای به‌خاطر سپردنش: یقین روی زمینِ محکم وجه اخباری می‌ماند، شک به سمت وجه التزامی اوج می‌گیرد — و «no» همان کلیدی است که یکی را به دیگری تبدیل می‌کند. وقتی این نکته برایت جا بیفتد، در هر مکالمه‌ای تفاوت میان اطمینان و تردید را می‌شنوی.",
      es:"Aquí hay un dato curioso: el mismo verbo, creer, puede activar dos modos completamente distintos según una palabra diminuta — no. Di 'creo que' y estás afirmando algo como un hecho, así que el verbo que sigue se queda en indicativo: creo que ella es inteligente. Pero pon un 'no' delante — no creo que — y de repente estás expresando duda, no certeza, así que el verbo salta al subjuntivo: no creo que él tenga razón. El mismo cambio ocurre con dudo que, no es cierto que y no pienso que, que señalan 'no estoy seguro de que esto sea verdad' y exigen subjuntivo. La trampa en la que caen la mayoría de los estudiantes es tratar creer como un disparador automático de subjuntivo y usarlo incluso en su forma positiva, diciendo algo como 'creo que ella sea inteligente' cuando debería ser simplemente es. La forma más fácil de recordarlo: la certeza se queda con los pies en la tierra del indicativo, la duda se eleva hacia el subjuntivo — y el 'no' es el interruptor que pasa de uno al otro. Cuando esto te quede claro, empezarás a oír la diferencia entre seguridad y duda en cada conversación."},
 wrong:"No creo que él tiene razón.", right:"No creo que él tenga razón.",
 blank:{sentence:"Dudo que ellos ___ la verdad.", word:"digan", distractors:["dicen","dijeron"]},
 wrong2:"Creo que ella sea muy inteligente.", right2:"Creo que ella es muy inteligente.",
 blank2:{sentence:"No es cierto que nosotros ___ el dinero.", word:"tengamos", distractors:["tenemos","tuvimos"]}},

{id:"g-B1-5", level:"B1", title:{en:"The Conditional (hablaría, comería, viviría)", tr:"Şart-İstek Kipi (hablaría, comería, viviría)", fa:"زمان شرطی (hablaría, comería, viviría)", es:"El condicional simple (hablaría, comería, viviría)"},
 exp:{en:"Ever caught yourself daydreaming about what you'd do if you won the lottery, or wanted to ask a favor a little more politely? That's the conditional's whole job — it's the Spanish 'would' tense. For regular verbs it couldn't be simpler: just tack -ía, -ías, -ía, -íamos, -íais, -ían onto the entire infinitive, no chopping required — hablar → hablaría, comer → comería, vivir → viviría. The catch is a small group of high-frequency verbs that use a shortened, slightly mangled stem instead: tener → tendría, poner → pondría, salir → saldría, hacer → haría, decir → diría, poder → podría, querer → querría. The classic mistake is trying to regularize these — saying 'yo hacería' instead of 'yo haría' because your brain wants to keep the whole infinitive intact. Here's the good news: these are the exact same irregular stems used in the future tense, so if you've already fought with tendré, pondré, and saldré, you've basically already learned tendría, pondría, and saldría for free. Once the pattern settles in, you'll be fantasizing about lottery wins and world travel in perfectly conjugated Spanish without even trying.",
      tr:"Piyangoyu kazansan ne yapardın diye hayal kurduğun ya da bir ricayı biraz daha kibarca sormak istediğin oldu mu hiç? Şart-istek kipinin bütün işi tam olarak bu — İspanyolca'nın 'yapardım' zamanı. Düzenli fiillerde bundan daha basit bir şey olamaz: -ía, -ías, -ía, -íamos, -íais, -ían eklerini hiçbir şey kesmeden doğrudan mastarın tamamına eklersin — hablar → hablaría, comer → comería, vivir → viviría. İş, kısaltılmış ve biraz değişmiş bir kök kullanan küçük bir grup sık kullanılan fiile gelince zorlaşır: tener → tendría, poner → pondría, salir → saldría, hacer → haría, decir → diría, poder → podría, querer → querría. Klasik hata bunları düzenli hale getirmeye çalışmaktır — beynin mastarı bozmadan tutmak istediği için 'yo haría' yerine 'yo hacería' demek gibi. İyi haber şu: bunlar gelecek zamanda kullanılan düzensiz köklerle birebir aynı, yani tendré, pondré ve saldré ile zaten boğuştuysan, tendría, pondría ve saldría'yı da bedavaya öğrenmiş sayılırsın. Kalıp yerleştiğinde, piyango kazanmayı ve dünyayı gezmeyi hiç zorlanmadan kusursuz çekimlenmiş bir İspanyolcayla hayal edeceksin.",
      fa:"تا حالا شده در رویا فرو بروی که اگر لاتاری برنده می‌شدی چه‌کار می‌کردی، یا بخواهی درخواستی را کمی مؤدبانه‌تر مطرح کنی؟ کار زمان شرطی دقیقاً همین است — زمان «انجام می‌دادم» در اسپانیایی. در فعل‌های باقاعده چیزی از این ساده‌تر نیست: فقط پسوندهای -ía, -ías, -ía, -íamos, -íais, -ían را بدون هیچ بریدنی به کل مصدر اضافه می‌کنی — hablar → hablaría، comer → comería، vivir → viviría. نکته‌ی سخت، گروه کوچکی از فعل‌های پرکاربردند که از ریشه‌ای کوتاه‌شده و کمی تغییریافته استفاده می‌کنند: tener → tendría، poner → pondría، salir → saldría، hacer → haría، decir → diría، poder → podría، querer → querría. اشتباه رایج این است که سعی می‌کنی این‌ها را باقاعده کنی — می‌گویی «yo hacería» به‌جای «yo haría» چون ذهنت می‌خواهد مصدر را دست‌نخورده نگه دارد. خبر خوب این است که این‌ها دقیقاً همان ریشه‌های بی‌قاعده‌ای هستند که در زمان آینده استفاده می‌شوند، پس اگر قبلاً با tendré، pondré و saldré کلنجار رفته‌ای، در واقع tendría، pondría و saldría را هم مجانی یاد گرفته‌ای. وقتی این الگو جا بیفتد، بدون کوچک‌ترین زحمتی درباره‌ی برنده‌شدن در لاتاری و گشتن دور دنیا با اسپانیایی کاملاً صرف‌شده رویاپردازی می‌کنی.",
      es:"¿Alguna vez te has puesto a fantasear con lo que harías si ganaras la lotería, o has querido pedir un favor de forma un poco más educada? Ese es justo el trabajo del condicional — es el tiempo del 'haría' en español. En los verbos regulares no puede ser más sencillo: solo añades -ía, -ías, -ía, -íamos, -íais, -ían al infinitivo completo, sin recortar nada — hablar → hablaría, comer → comería, vivir → viviría. El truco está en un grupo pequeño de verbos muy frecuentes que usan una raíz acortada y un poco deformada: tener → tendría, poner → pondría, salir → saldría, hacer → haría, decir → diría, poder → podría, querer → querría. El error clásico es intentar regularizarlos — decir 'yo hacería' en vez de 'yo haría' porque tu cabeza quiere mantener el infinitivo intacto. La buena noticia es que estas son exactamente las mismas raíces irregulares que se usan en el futuro, así que si ya luchaste con tendré, pondré y saldré, básicamente ya te aprendiste tendría, pondría y saldría gratis. Cuando el patrón se asiente, fantasearás con ganar la lotería y viajar por el mundo en un español perfectamente conjugado sin ni siquiera esforzarte."},
 wrong:"Yo hacería la tarea si tuviera tiempo.", right:"Yo haría la tarea si tuviera tiempo.",
 blank:{sentence:"Con más dinero, nosotros ___ una casa más grande.", word:"tendríamos", distractors:["tenemos","tuvimos"]},
 wrong2:"Si ganara la lotería, yo viajo por todo el mundo.", right2:"Si ganara la lotería, yo viajaría por todo el mundo.",
 blank2:{sentence:"¿___ usted ayudarme con esta maleta?", word:"Podría", distractors:["Puede","Pudo"]}},

{id:"g-B1-6", level:"B1", title:{en:"Relative Pronouns (que, quien, donde, cuyo)", tr:"İlgi Zamirleri (que, quien, donde, cuyo)", fa:"ضمایر موصولی (que، quien، donde، cuyo)", es:"Pronombres relativos (que, quien, donde, cuyo)"},
 exp:{en:"If Spanish relative pronouns were tools in a toolbox, que would be the trusty screwdriver you reach for nine times out of ten — it covers both people and things ('that,' 'which,' 'who') and it's almost always your safest bet. Quien and quienes are pickier: they only refer to people, and they typically show up right after a preposition or a comma, not as the main connector in a simple sentence — so 'la mujer que vive al lado' beats 'la mujer quien vive al lado' every time. Donde simply swaps in for a place ('el pueblo donde nací'). The one that trips almost everyone up is cuyo — it means 'whose,' but here's the twist: it agrees in gender and number with the noun that comes right after it, not with the person who owns the thing. So if a boy's mother is a teacher, you say 'el chico cuya madre es profesora' — cuya matches madre (feminine), not chico (masculine), even though 'chico' is the owner. A good way to remember it: cuyo is basically glued to the word standing next to it and couldn't care less who the owner is. Get comfortable with that one twist and you'll sound noticeably more sophisticated the moment you use it correctly.",
      tr:"İspanyolca ilgi zamirleri bir alet kutusundaki aletler olsaydı, que on seferden dokuzunda elini attığın güvenilir tornavida olurdu — hem insanları hem nesneleri kapsar (ki/-en/-dığı) ve neredeyse her zaman en güvenli seçimindir. Quien ve quienes daha seçicidir: yalnızca insanlara işaret ederler ve genellikle basit bir cümlede ana bağlayıcı olarak değil, bir edattan ya da virgülden hemen sonra ortaya çıkarlar — bu yüzden 'la mujer que vive al lado', 'la mujer quien vive al lado'ya karşı her zaman kazanır. Donde ise sadece bir yerin yerine geçer ('el pueblo donde nací'). Neredeyse herkesi tökezleten ise cuyo'dur — 'kimin' anlamına gelir ama işte can alıcı nokta: hemen sonrasında gelen isimle cinsiyet ve sayı bakımından uyumlu olur, o şeyin sahibiyle değil. Yani bir çocuğun annesi öğretmense, 'el chico cuya madre es profesora' dersin — cuya, madre (dişil) ile uyumludur, chico (eril) ile değil, chico sahibi olsa bile. Bunu akılda tutmanın iyi bir yolu: cuyo neredeyse yanındaki kelimeye yapışıktır ve sahibin kim olduğu pek umurunda değildir. Bu küçük inceliği kavradığında, onu doğru kullandığın anda belirgin şekilde daha bilgili duyulacaksın.",
      fa:"اگر ضمایر موصولی اسپانیایی ابزارهای یک جعبه‌ابزار بودند، que همان پیچ‌گوشتی قابل‌اعتمادی بود که نه از ده بار سراغش می‌روی — هم افراد و هم اشیا را پوشش می‌دهد (که) و تقریباً همیشه امن‌ترین انتخاب توست. quien و quienes سخت‌گیرترند: فقط به افراد اشاره می‌کنند و معمولاً درست بعد از یک حرف اضافه یا ویرگول می‌آیند، نه به‌عنوان ربط‌دهنده‌ی اصلی در یک جمله‌ی ساده — پس «la mujer que vive al lado» همیشه بر «la mujer quien vive al lado» برتری دارد. donde فقط جای مکان را می‌گیرد («el pueblo donde nací»). آنی که تقریباً همه را گیر می‌اندازد cuyo است — به معنای «که مالِ اوست»، اما نکته‌ی جالب اینجاست: از نظر جنسیت و تعداد با اسمی که بلافاصله بعدش می‌آید مطابقت می‌کند، نه با کسی که صاحب آن چیز است. پس اگر مادرِ یک پسر معلم باشد، می‌گویی «el chico cuya madre es profesora» — cuya با madre (مؤنث) مطابقت دارد، نه با chico (مذکر)، با اینکه chico صاحب است. یک راه خوب برای به‌خاطر سپردنش: cuyo تقریباً به کلمه‌ی کناری‌اش چسبیده و اصلاً برایش مهم نیست صاحب چه کسی است. این پیچش کوچک را که یاد بگیری، همان لحظه‌ای که درست به کارش ببری، لحنت به‌شکل محسوسی حرفه‌ای‌تر به گوش می‌رسد.",
      es:"Si los pronombres relativos del español fueran herramientas en una caja, que sería el destornillador de confianza al que recurres nueve de cada diez veces — cubre tanto a personas como a cosas ('que', 'quien', 'el cual') y casi siempre es tu opción más segura. Quien y quienes son más exigentes: solo se refieren a personas, y normalmente aparecen justo después de una preposición o una coma, no como conector principal en una oración simple — así que 'la mujer que vive al lado' gana siempre a 'la mujer quien vive al lado'. Donde simplemente sustituye a un lugar ('el pueblo donde nací'). El que hace tropezar a casi todo el mundo es cuyo — significa 'de quién', pero aquí está el truco: concuerda en género y número con el sustantivo que viene justo después, no con la persona dueña de la cosa. Así que si la madre de un chico es profesora, dices 'el chico cuya madre es profesora' — cuya concuerda con madre (femenino), no con chico (masculino), aunque 'chico' sea el dueño. Una buena forma de recordarlo: cuyo está prácticamente pegado a la palabra que tiene al lado y le importa poco quién es el dueño. Domina ese pequeño giro y sonarás notablemente más elegante en el momento en que lo uses bien."},
 wrong:"La mujer quien vive al lado es médica.", right:"La mujer que vive al lado es médica.",
 blank:{sentence:"Este es el pueblo ___ nací.", word:"donde", distractors:["que","quien"]},
 wrong2:"Ese es el chico cuyo madre es profesora.", right2:"Ese es el chico cuya madre es profesora.",
 blank2:{sentence:"El señor con ___ hablé ayer es mi vecino.", word:"quien", distractors:["que","donde"]}},

{id:"g-B1-7", level:"B1", title:{en:"Por vs. Para", tr:"Por ve Para Farkı", fa:"تفاوت Por و Para", es:"Por vs. para"},
 exp:{en:"Por and para are the two words most likely to keep you up at night, because English mashes them both into one tiny word: 'for.' But Spanish splits that job in two, and once you see the split, it actually makes life easier, not harder. Use por for cause or reason (why something happens — because of), duration, an exchange or price, the means you use (by phone, by bus), and movement through or around a place. Use para for purpose or goal (in order to do something), a destination, a deadline, a recipient, and personal opinion (para mí = in my opinion). The mix-up that catches almost everyone is movement: say 'caminamos para el parque' and you're announcing the park as your final destination, but 'caminamos por el parque' means you're strolling around inside it — very different afternoons. Here's the quick test worth memorizing: if you can swap the word for 'because of,' reach for por; if you can swap it for 'in order to,' reach for para. Keep that one test in your back pocket and por/para stops being a coin flip and starts being a decision you can actually make.",
      tr:"Por ve para, seni geceleri uyutmayacak en olası iki kelimedir, çünkü İngilizce ikisini de tek bir küçük kelimeye sıkıştırır: 'for'. Ama İspanyolca bu görevi ikiye böler ve bu ayrımı bir kez gördüğünde, aslında hayatını zorlaştırmak yerine kolaylaştırır. Por'u sebep ya da neden için (bir şey neden olur — yüzünden), süre için, değiş tokuş ya da fiyat için, kullandığın araç için (telefonla, otobüsle) ve bir yerin içinden ya da çevresinden geçme için kullan. Para'yı ise amaç ya da hedef için (bir şeyi yapmak amacıyla), varış noktası için, son tarih için, alıcı için ve kişisel görüş için (para mí = bence) kullan. Neredeyse herkesi yakalayan karışıklık harekettir: 'caminamos para el parque' dersen parkı son varış noktan olarak duyurmuş olursun, ama 'caminamos por el parque' parkın içinde dolaştığın anlamına gelir — çok farklı iki öğleden sonrası. İşte ezberlemeye değer hızlı test: eğer kelimeyi 'yüzünden' ile değiştirebiliyorsan por'a, 'yapmak amacıyla' ile değiştirebiliyorsan para'ya yönel. Bu testi cebinde tut, por/para artık yazı tura atmak olmaktan çıkıp gerçekten verebileceğin bir karar haline gelsin.",
      fa:"por و para دو کلمه‌ای هستند که به احتمال زیاد بیشترین بی‌خوابی را برایت ایجاد می‌کنند، چون انگلیسی هر دو را در یک کلمه‌ی کوچک خلاصه می‌کند: for. اما اسپانیایی این وظیفه را به دو قسمت تقسیم می‌کند و وقتی این تقسیم را ببینی، در واقع زندگی را ساده‌تر می‌کند، نه سخت‌تر. از por برای علت یا دلیل (چرا اتفاقی می‌افتد — به‌خاطر)، مدت‌زمان، مبادله یا قیمت، وسیله‌ای که استفاده می‌کنی (با تلفن، با اتوبوس) و عبور از میان یا اطراف مکانی استفاده کن. از para برای هدف یا مقصود (به‌منظور انجام کاری)، مقصد، مهلت زمانی، گیرنده و نظر شخصی (para mí = به نظر من) استفاده کن. سردرگمی‌ای که تقریباً همه را گیر می‌اندازد، حرکت است: اگر بگویی «caminamos para el parque» یعنی پارک را مقصد نهایی‌ات اعلام کرده‌ای، اما «caminamos por el parque» یعنی داری داخل پارک قدم می‌زنی — دو بعدازظهر کاملاً متفاوت. این هم آزمایش سریعی که ارزش حفظ‌کردن دارد: اگر می‌توانی کلمه را با «به‌خاطر» جایگزین کنی، سراغ por برو؛ اگر می‌توانی با «به‌منظور» جایگزینش کنی، سراغ para برو. این آزمایش را همیشه همراهت داشته باش تا por/para دیگر شیر یا خط نباشد و به تصمیمی تبدیل شود که واقعاً می‌توانی بگیری.",
      es:"Por y para son las dos palabras que más probablemente te quitarán el sueño, porque en inglés ambas se reducen a una sola palabra diminuta: 'for'. Pero el español divide ese trabajo en dos, y una vez que ves la división, la verdad es que te facilita la vida en lugar de complicártela. Usa por para la causa o el motivo (por qué pasa algo — a causa de), la duración, un intercambio o precio, el medio que usas (por teléfono, por autobús) y el movimiento a través de o alrededor de un lugar. Usa para para el propósito o la meta (con el fin de hacer algo), un destino, una fecha límite, un destinatario y la opinión personal (para mí). La confusión que atrapa a casi todo el mundo es el movimiento: si dices 'caminamos para el parque' estás anunciando el parque como tu destino final, pero 'caminamos por el parque' significa que estás paseando dentro de él — dos tardes muy distintas. Aquí está la prueba rápida que vale la pena memorizar: si puedes cambiarlo por 'a causa de', usa por; si puedes cambiarlo por 'con el propósito de', usa para. Guarda esa prueba en tu bolsillo trasero y por/para dejará de ser un volado para convertirse en una decisión que realmente puedes tomar."},
 wrong:"Este regalo es por ti.", right:"Este regalo es para ti.",
 blank:{sentence:"Trabajo ___ ganar dinero para viajar.", word:"para", distractors:["por","a"]},
 wrong2:"Caminamos para el parque durante una hora.", right2:"Caminamos por el parque durante una hora.",
 blank2:{sentence:"Gracias ___ tu ayuda, lo logré.", word:"por", distractors:["para","de"]}},

{id:"g-B1-8", level:"B1", title:{en:"Estar + Gerund — Present & Past Progressive", tr:"Estar + Ulaç — Şimdiki ve Geçmiş Zamanda Süreklilik", fa:"Estar + وجه وصفی — استمراری حال و گذشته", es:"Estar + gerundio — presente y pasado continuo"},
 exp:{en:"You know that classic parent line, '¿qué estás haciendo?' — asked in that tone that means they already caught you red-handed? That's the progressive in action: it zooms in on an action happening in this exact instant, or happening at one specific moment in the past. Build it with estar (estoy, estás, está, estamos, estáis, están) plus a gerund — -ando for -ar verbs, -iendo for -er/-ir verbs — and to shift the whole thing into the past, just swap estar for its imperfect form: estaba, estabas, estaba, estábamos, estabais, estaban, keeping the same gerund. A mistake that sneaks in constantly is bolting estar onto a conjugated verb instead of an actual gerund — saying 'estoy estudia' instead of 'estoy estudiando,' when the second half always needs that -ando/-iendo ending, no exceptions. Watch out too for gerunds that change shape: leer becomes leyendo (that lonely 'i' between vowels always turns into a 'y'), and stem-changing verbs like dormir and pedir carry their vowel shift right into the gerund — durmiendo, pidiendo. A handy way to remember it: whenever you picture someone caught mid-action, snapshot-style, that's your cue to reach for estar plus gerund. Nail this pattern and you'll be able to narrate exactly what everyone around you is doing, moment by moment, like a play-by-play announcer.",
      tr:"Ebeveynlerin o klasik cümlesini bilir misin, '¿qué estás haciendo?' — seni suçüstü yakaladıkları o tonla söylenen? İşte süreklilik yapısı tam olarak bu işi yapar: tam şu anda gerçekleşen ya da geçmişte belirli bir anda gerçekleşmekte olan bir eylemi yakından gösterir. Bunu estar (estoy, estás, está, estamos, estáis, están) artı bir ulaçla kurarsın — -ar fiillerinde -ando, -er/-ir fiillerinde -iendo — ve her şeyi geçmişe taşımak için sadece estar'ı öğrenilen geçmiş zaman biçimiyle değiştirirsin: estaba, estabas, estaba, estábamos, estabais, estaban, aynı ulaç kalarak. Sürekli sızan bir hata, estar'ı gerçek bir ulaç yerine çekimlenmiş bir fiile eklemektir — 'estoy estudiando' yerine 'estoy estudia' demek gibi; oysa ikinci yarı istisnasız her zaman o -ando/-iendo ekini ister. Şeklini değiştiren ulaçlara da dikkat et: leer, leyendo olur (ünlüler arasındaki yalnız 'i' her zaman 'y'ye dönüşür) ve dormir, pedir gibi kök değişimi olan fiiller bu ünlü değişimini ulaca kadar taşır — durmiendo, pidiendo. İşe yarayan bir hatırlama yöntemi: birini tam eylem ortasında, fotoğraf çeker gibi yakaladığını hayal ettiğinde, bu senin estar artı ulaç kullanma işaretin olsun. Bu kalıbı kaptığında, etrafındaki herkesin o an ne yaptığını, adım adım, bir spor spikeri gibi anlatabilir hale geleceksin.",
      fa:"آن جمله‌ی کلاسیک والدین را می‌شناسی، «¿qué estás haciendo؟» — با آن لحنی که یعنی همین الان مچت را گرفته‌اند؟ این دقیقاً کار زمان استمراری است: روی کاری زوم می‌کند که همین لحظه در حال انجام است، یا در یک لحظه‌ی مشخص از گذشته در حال انجام بوده. آن را با estar (estoy, estás, está, estamos, estáis, están) به‌علاوه‌ی وجه وصفی می‌سازی — برای فعل‌های -ar پسوند -ando و برای فعل‌های -er/-ir پسوند -iendo — و برای بردنش به گذشته، فقط estar را با صورت ماضی استمراری‌اش عوض می‌کنی: estaba, estabas, estaba, estábamos, estabais, estaban، درحالی‌که همان وجه وصفی می‌ماند. اشتباهی که مدام سر می‌زند این است که estar را به یک فعل صرف‌شده وصل می‌کنی نه به یک وجه وصفی واقعی — می‌گویی «estoy estudia» به‌جای «estoy estudiando»، درحالی‌که نیمه‌ی دوم همیشه و بدون استثنا آن پسوند -ando/-iendo را می‌خواهد. مراقب وجه وصفی‌هایی هم باش که شکلشان عوض می‌شود: leer به leyendo تبدیل می‌شود (آن i تنها میان دو مصوت همیشه به y تبدیل می‌شود) و فعل‌های با تغییر ریشه مثل dormir و pedir این تغییر مصوت را تا وجه وصفی هم با خودشان می‌برند — durmiendo، pidiendo. یک راه کاربردی برای به‌خاطر سپردن: هر وقت کسی را تصور کردی که وسط انجام کاری، مثل یک عکس، غافلگیر شده، این نشانه‌ی توست که سراغ estar به‌علاوه‌ی وجه وصفی بروی. این الگو را که یاد بگیری، می‌توانی دقیقاً کاری که هرکس اطرافت انجام می‌دهد را لحظه‌به‌لحظه، مثل یک گزارشگر ورزشی روایت کنی.",
      es:"¿Conoces esa frase clásica de los padres, '¿qué estás haciendo?' — dicha en ese tono que significa que ya te agarraron con las manos en la masa? Eso es el gerundio compuesto en acción: se enfoca en una acción que ocurre justo en este instante, o que ocurría en un momento específico del pasado. Se construye con estar (estoy, estás, está, estamos, estáis, están) más un gerundio — -ando para verbos -ar, -iendo para verbos -er/-ir — y para llevarlo todo al pasado, solo cambias estar por su forma en imperfecto: estaba, estabas, estaba, estábamos, estabais, estaban, manteniendo el mismo gerundio. Un error que se cuela constantemente es pegar estar a un verbo conjugado en vez de a un gerundio de verdad — decir 'estoy estudia' en lugar de 'estoy estudiando', cuando la segunda mitad siempre necesita esa terminación -ando/-iendo, sin excepciones. Cuidado también con los gerundios que cambian de forma: leer se convierte en leyendo (esa 'i' solitaria entre vocales siempre se transforma en 'y'), y los verbos con cambio de raíz como dormir y pedir arrastran ese cambio de vocal hasta el gerundio — durmiendo, pidiendo. Una forma útil de recordarlo: cada vez que te imagines a alguien pillado a mitad de una acción, como en una foto, esa es tu señal para usar estar más gerundio. Domina este patrón y podrás narrar exactamente lo que está haciendo cada persona a tu alrededor, momento a momento, como un comentarista deportivo."},
 wrong:"Ahora mismo estoy estudia para el examen.", right:"Ahora mismo estoy estudiando para el examen.",
 blank:{sentence:"¿Qué ___ tú en este momento?", word:"estás haciendo", distractors:["haces","hiciste"]},
 wrong2:"Cuando llamaste, yo estaba durmo.", right2:"Cuando llamaste, yo estaba durmiendo.",
 blank2:{sentence:"Ellos ___ el periódico cuando empezó a llover.", word:"estaban leyendo", distractors:["leían","leyeron"]}},

{id:"g-B1-9", level:"B1", title:{en:"Impersonal SE & Passive SE (se dice, se vende, se necesita)", tr:"Kişisiz SE ve Edilgen SE Yapısı (se dice, se vende, se necesita)", fa:"SE غیرشخصی و SE مجهول (se dice، se vende، se necesita)", es:"Se impersonal y pasiva refleja (se dice, se vende, se necesita)"},
 exp:{en:"Next time you're wandering around a Spanish-speaking city, look at the signs: se vende, se alquila, se habla español — that little se is doing some serious grammatical work. You use se plus a verb in the third person whenever you want to talk about an action without pointing a finger at exactly who's doing it — either because you're making a general statement (impersonal se: se dice que..., aquí se come muy bien) or because you're describing what happens to something without naming the doer (passive se: se vende, se venden). The rule that trips up almost everyone, in both directions, is number agreement: the verb has to match the noun that follows it, not stay stuck in one form. So it's se vende una casa but se venden dos casas — and just as easily wrong the other way, se necesita un cocinero, not se necesitan, if you're only hiring one. Here's a way to keep it straight: se doesn't care who did it, but it cares a lot about how many of the thing there are — let the noun right after se decide singular or plural, every single time. Get that agreement locked in and you'll read every 'se busca', 'se vende' and 'se prohíbe' sign around you like a local instead of a tourist.",
      tr:"Bir dahaki sefere İspanyolca konuşulan bir şehirde dolaşırken tabelalara bak: se vende, se alquila, se habla español — o küçük se, ciddi bir dilbilgisi işi yapıyor. Se artı üçüncü şahıs fiilini, bir eylemden bahsederken tam olarak kimin yaptığını işaret etmek istemediğinde kullanırsın — ya genel bir ifade yaptığın için (kişisiz se: se dice que..., aquí se come muy bien) ya da kim yaptığını söylemeden bir şeyin başına ne geldiğini anlattığın için (edilgen se: se vende, se venden). Neredeyse herkesi, her iki yönde de tökezleten kural sayı uyumudur: fiil, tek bir biçimde takılı kalmak yerine kendisinden sonra gelen isimle uyuşmalıdır. Yani se vende una casa ama se venden dos casas'tır — ve aynı kolaylıkla tersi de yanlış olur: sadece bir kişi işe alıyorsan se necesitan değil se necesita un cocinero denir. İşte bunu netleştirmenin bir yolu: se, kimin yaptığını umursamaz ama kaç tane olduğunu ciddi şekilde umursar — se'den hemen sonra gelen ismin tekil mi çoğul mu olduğuna her seferinde karar vermesine izin ver. Bu uyumu bir kez kaptın mı, çevrendeki her 'se busca', 'se vende' ve 'se prohíbe' tabelasını bir turist gibi değil, yerli biri gibi okursun.",
      fa:"دفعه‌ی بعد که در یک شهر اسپانیایی‌زبان قدم می‌زنی، به تابلوها نگاه کن: se vende، se alquila، se habla español — آن se کوچک دارد یک کار دستوری جدی انجام می‌دهد. وقتی می‌خواهی درباره‌ی کاری صحبت کنی بدون اینکه دقیقاً بگویی چه کسی آن را انجام می‌دهد، از se به‌همراه فعل سوم‌شخص استفاده می‌کنی — یا چون داری یک جمله‌ی کلی می‌گویی (se غیرشخصی: se dice que...، aquí se come muy bien) یا چون داری توضیح می‌دهی چه اتفاقی برای چیزی می‌افتد بدون نام‌بردن از انجام‌دهنده (se مجهول: se vende، se venden). قانونی که تقریباً همه را، در هر دو جهت، گیر می‌اندازد تطابق در عدد است: فعل باید با اسمی که بعدش می‌آید مطابقت داشته باشد، نه اینکه در یک شکل ثابت بماند. پس می‌شود se vende una casa اما se venden dos casas — و به همان راحتی برعکسش هم اشتباه است: اگر فقط یک نفر استخدام می‌کنی، se necesita un cocinero درست است نه se necesitan. این هم یک راه برای روشن نگه‌داشتنش: برای se مهم نیست چه کسی آن کار را کرده، اما خیلی مهم است چند تا از آن چیز وجود دارد — بگذار اسمی که درست بعد از se می‌آید تعیین کند مفرد باشد یا جمع، هر بار. این تطابق را که یاد بگیری، هر تابلوی «se busca»، «se vende» و «se prohíbe» دور و برت را مثل یک بومی می‌خوانی، نه مثل یک توریست.",
      es:"La próxima vez que camines por una ciudad de habla hispana, fíjate en los letreros: se vende, se alquila, se habla español — ese pequeño se está haciendo un trabajo gramatical serio. Usas se más un verbo en tercera persona cuando quieres hablar de una acción sin señalar exactamente quién la hace — ya sea porque haces una afirmación general (se impersonal: se dice que..., aquí se come muy bien) o porque describes lo que le pasa a algo sin nombrar a quien lo hace (pasiva refleja: se vende, se venden). La regla que hace tropezar a casi todo el mundo, en ambas direcciones, es la concordancia de número: el verbo tiene que coincidir con el sustantivo que le sigue, no quedarse fijo en una sola forma. Así que es se vende una casa pero se venden dos casas — y con la misma facilidad se equivoca al revés, se necesita un cocinero, no se necesitan, si solo estás contratando a uno. Aquí tienes una forma de tenerlo claro: a se no le importa quién lo hizo, pero sí le importa mucho cuántas cosas hay — deja que el sustantivo justo después de se decida si va en singular o plural, siempre. Domina esa concordancia y leerás cada letrero de 'se busca', 'se vende' y 'se prohíbe' como un local, no como un turista."},
 wrong:"Se vende dos apartamentos en este edificio.", right:"Se venden dos apartamentos en este edificio.",
 blank:{sentence:"___ mucho español en esta ciudad.", word:"Se habla", distractors:["Se hablan","Hablan"]},
 wrong2:"Se necesitan un cocinero con experiencia.", right2:"Se necesita un cocinero con experiencia.",
 blank2:{sentence:"Aquí ___ tarjetas de crédito.", word:"se aceptan", distractors:["se acepta","aceptan"]}},

{id:"g-B1-10", level:"B1", title:{en:"Discourse Connectors (sin embargo, por lo tanto, además, aunque)", tr:"Söylem Bağlaçları (sin embargo, por lo tanto, además, aunque)", fa:"ادات ربط گفتمانی (sin embargo، por lo tanto، además، aunque)", es:"Conectores de discurso (sin embargo, por lo tanto, además, aunque)"},
 exp:{en:"Want to sound like you've actually lived in a Spanish-speaking country instead of just studied it from a textbook? Discourse connectors are the secret sauce — they're the little words fluent speakers use to stitch ideas together the way native speech actually flows. Sin embargo (however) introduces a contrast, por lo tanto (therefore) introduces a consequence, además (furthermore, also) piles on extra information, aunque (although, even though) introduces a concession, and mientras tanto (meanwhile) shows two things happening side by side in time. The mistake that catches even confident learners is picking a connector based on a vague feeling that 'both halves are true,' instead of actually checking how the two ideas relate — that's exactly how you end up with something like 'no tengo mucho dinero, por lo tanto quiero viajar,' which sounds like wanting to travel is caused by being broke, when really it's a contrast and needs sin embargo. A quick trick: mentally swap in the closest one-word English equivalent — but, so, also, even though, meanwhile — and see which one actually makes logical sense in the sentence; if it doesn't fit in English, it won't fit in Spanish either. Nail these five little words and your Spanish will stop sounding like a string of separate sentences and start sounding like one connected thought — which, honestly, is the whole trick to sounding fluent.",
      tr:"İspanyolca konuşulan bir ülkede gerçekten yaşamış gibi mi duyulmak istiyorsun, yoksa sadece kitaptan öğrenmiş gibi mi? Söylem bağlaçları gizli malzemedir — akıcı konuşanların fikirleri, gerçek konuşmanın aktığı şekilde birbirine dikmek için kullandığı küçük kelimelerdir. Sin embargo (ancak) bir karşıtlık sunar, por lo tanto (bu nedenle) bir sonuç sunar, además (ayrıca, üstelik) fazladan bilgi ekler, aunque (her ne kadar) bir çelişki/ödün sunar ve mientras tanto (bu arada) zaman içinde yan yana gerçekleşen iki şeyi gösterir. Kendine güvenen öğrencileri bile yakalayan hata, iki fikrin gerçekten nasıl ilişkili olduğuna bakmak yerine, 'her iki yarı da doğru' hissine dayanarak bir bağlaç seçmektir — işte tam da bu yüzden 'no tengo mucho dinero, por lo tanto quiero viajar' gibi bir cümleyle karşılaşırsın; bu, seyahat etmek istemenin parasız olmaktan kaynaklandığı gibi bir izlenim verir, oysa aslında bir karşıtlıktır ve sin embargo gerekir. Hızlı bir ipucu: zihninde en yakın tek kelimelik Türkçe karşılığını koy — ama, bu yüzden, ayrıca, her ne kadar, bu arada — ve cümlede mantıklı olup olmadığına bak; kendi dilinde oturmuyorsa İspanyolcada da oturmaz. Bu beş küçük kelimeyi kaptığında, İspanyolcan art arda dizilmiş ayrı cümleler gibi değil, tek bir bağlantılı düşünce gibi duymaya başlayacak — ki dürüst olmak gerekirse, akıcı duyulmanın bütün sırrı da budur.",
      fa:"دلت می‌خواهد طوری به‌نظر برسد که واقعاً در یک کشور اسپانیایی‌زبان زندگی کرده‌ای، نه اینکه فقط از روی کتاب یادش گرفته‌ای؟ ادات ربط گفتمانی همان مواد مخفی هستند — کلمات کوچکی که گویشورهای روان برای به‌هم‌دوختن ایده‌ها، همان‌طور که گفتار واقعی جریان دارد، به کار می‌برند. sin embargo (با این حال) یک تضاد را معرفی می‌کند، por lo tanto (بنابراین) یک نتیجه را معرفی می‌کند، además (علاوه بر این) اطلاعات اضافه می‌کند، aunque (اگرچه) یک امتیاز/تناقض را معرفی می‌کند و mientras tanto (در همین حین) نشان می‌دهد دو چیز هم‌زمان با هم اتفاق می‌افتند. اشتباهی که حتی زبان‌آموزهای مطمئن را هم گیر می‌اندازد این است که ادات ربط را بر اساس این حس مبهم انتخاب می‌کنند که «هر دو نیمه درست‌اند»، به‌جای اینکه واقعاً بررسی کنند این دو ایده چه رابطه‌ای با هم دارند — دقیقاً به همین دلیل است که به جمله‌ای مثل «no tengo mucho dinero, por lo tanto quiero viajar» می‌رسی، که انگار خواستن سفر نتیجه‌ی بی‌پولی است، درحالی‌که در واقع یک تضاد است و sin embargo می‌خواهد. یک ترفند سریع: در ذهنت نزدیک‌ترین معادل تک‌کلمه‌ای فارسی را جایگزین کن — اما، پس، همچنین، اگرچه، در همین حین — و ببین در جمله از نظر منطقی جور درمی‌آید یا نه؛ اگر در زبان خودت جور درنمی‌آید، در اسپانیایی هم جور درنمی‌آید. این پنج کلمه‌ی کوچک را که یاد بگیری، اسپانیایی‌ات دیگر مثل رشته‌ای از جمله‌های جدا از هم به‌نظر نمی‌رسد و مثل یک فکر به‌هم‌پیوسته می‌شود — که راستش را بخواهی، تمام راز روان به‌نظررسیدن همین است.",
      es:"¿Quieres sonar como si de verdad hubieras vivido en un país hispanohablante y no como si solo lo hubieras estudiado en un libro? Los conectores de discurso son el ingrediente secreto — son las palabritas que usan los hablantes fluidos para unir ideas tal como fluye el habla real. Sin embargo introduce un contraste, por lo tanto introduce una consecuencia, además añade información extra, aunque introduce una concesión, y mientras tanto muestra dos cosas que ocurren al mismo tiempo. El error que atrapa incluso a estudiantes con confianza es elegir un conector basándose en la sensación vaga de que 'las dos partes son verdad', en lugar de fijarse realmente en cómo se relacionan las dos ideas — así es exactamente como terminas con algo como 'no tengo mucho dinero, por lo tanto quiero viajar', que suena como si querer viajar fuera consecuencia de estar sin dinero, cuando en realidad es un contraste y necesita sin embargo. Un truco rápido: sustituye mentalmente por el equivalente más cercano en una sola palabra — pero, así que, además, aunque, mientras tanto — y fíjate si tiene sentido lógico en la frase; si no encaja en tu idioma, tampoco encajará en español. Domina estas cinco palabritas y tu español dejará de sonar como una serie de frases sueltas para empezar a sonar como una sola idea conectada — que, honestamente, es todo el truco para sonar fluido."},
 wrong:"No tengo mucho dinero, por lo tanto quiero viajar este año.", right:"No tengo mucho dinero, sin embargo quiero viajar este año.",
 blank:{sentence:"Llovía mucho; ___, decidimos salir a caminar.", word:"sin embargo", distractors:["además","por lo tanto"]},
 wrong2:"Habla tres idiomas, sin embargo toca el piano.", right2:"Habla tres idiomas, además toca el piano.",
 blank2:{sentence:"Él cocinaba la cena; ___, ella ponía la mesa.", word:"mientras tanto", distractors:["sin embargo","aunque"]}}
];

{id:'slang-A1', level:'A1', category:'slang', goals:['everyday'], title:{en:'Daily Slang', tr:'Günlük Argo', fa:'اصطلاحات روزمره', es:'Argot cotidiano'}, cards:[
  {word:'¡Qué padre! / ¡Qué guay!', sentence:'¡Qué padre está tu carro nuevo!', meaning:{en:'How cool! (México: qué padre, España: qué guay)', tr:'Ne harika! (Meksika: qué padre, İspanya: qué guay)', fa:'چقدر باحال! (مکزیک: qué padre، اسپانیا: qué guay)', es:'¡Qué genial! (México: qué padre, España: qué guay)'},
   note:{en:'A casual way to say something is awesome — the exact phrase varies by country.', tr:'Bir şeyin harika olduğunu söylemenin gündelik yolu — ülkeye göre değişir.', fa:'راهی خودمانی برای گفتن اینکه چیزی فوق‌العاده است — بسته به کشور فرق می‌کند.', es:'Una forma informal de decir que algo es genial — la expresión exacta cambia según el país.'}},
  {word:'vale', sentence:'¿Nos vemos a las ocho? — Vale.', meaning:{en:'Okay / alright (very common in Spain).', tr:"Tamam / peki (İspanya'da çok yaygın).", fa:'باشه / اوکی (در اسپانیا خیلی رایج).', es:'Vale / de acuerdo (muy común en España).'},
   note:{en:'Used constantly in Spain to mean "okay" or to confirm you understood.', tr:"İspanya'da «tamam» anlamında ya da anladığını onaylamak için sürekli kullanılır.", fa:'در اسپانیا مدام برای گفتن «باشه» یا تأیید فهمیدن چیزی استفاده می‌شود.', es:'Se usa constantemente en España para decir "de acuerdo" o confirmar que entendiste.'}},
  {word:'no pasa nada', sentence:'Perdón por llegar tarde. — No pasa nada.', meaning:{en:"It's okay / no worries.", tr:'Sorun değil / önemli değil.', fa:'مهم نیست / اشکالی نداره.', es:'No hay problema / no te preocupes.'},
   note:{en:'A relaxed way to tell someone not to worry about something small.', tr:'Birine küçük bir şey için endişelenmemesini söylemenin rahat bir yolu.', fa:'راهی خودمانی برای گفتن به کسی که نگران چیز کوچکی نباشد.', es:'Una forma relajada de decirle a alguien que no se preocupe por algo pequeño.'}},
  {word:'genial', sentence:'¡Genial! Nos vemos el sábado.', meaning:{en:'Great! Awesome!', tr:'Harika!', fa:'عالیه!', es:'¡Genial! ¡Increíble!'},
   note:{en:'A simple, upbeat way to react positively to news.', tr:'Bir habere olumlu tepki vermenin basit ve neşeli bir yolu.', fa:'راهی ساده و پرانرژی برای واکنش مثبت به یک خبر.', es:'Una forma simple y animada de reaccionar positivamente a una noticia.'}},
  {word:'chévere / chido', sentence:'Esta fiesta está muy chévere.', meaning:{en:'Cool / nice (Latin America: chévere / chido)', tr:'Harika / güzel (Latin Amerika: chévere / chido)', fa:'باحال / خوب (آمریکای لاتین: chévere / chido)', es:'Genial / bacán (América Latina: chévere / chido)'},
   note:{en:'Very common casual praise across Latin America — chévere leans Caribbean/Andean, chido leans Mexican.', tr:"Latin Amerika'da çok yaygın samimi bir övgü — chévere daha çok Karayip/And bölgesinde, chido ise Meksika'da kullanılır.", fa:'ستایشی خودمانی و بسیار رایج در آمریکای لاتین — chévere بیشتر در کارائیب/آند و chido بیشتر در مکزیک به کار می‌رود.', es:'Un elogio informal muy común en toda América Latina — chévere se usa más en el Caribe y los Andes, chido es más mexicano.'}},
  {word:'oye', sentence:'Oye, ¿tienes un minuto?', meaning:{en:'Hey (used to get attention).', tr:'Hey (dikkat çekmek için).', fa:'هی (برای جلب توجه).', es:'Oye (se usa para llamar la atención de alguien).'},
   note:{en:'Literally means "listen" — used the way English speakers use "hey."', tr:'Kelimenin tam anlamıyla "dinle" demektir — İngilizcedeki "hey" gibi kullanılır.', fa:'به معنای واقعی «گوش کن» است — مثل «هی» در انگلیسی استفاده می‌شود.', es:'Literalmente significa "escucha" — se usa como un saludo casual para llamar la atención.'}},
  {word:'un montón', sentence:'Te quiero un montón.', meaning:{en:'A lot / tons.', tr:'Bir sürü / çok fazla.', fa:'خیلی زیاد.', es:'Mucho / un montón.'},
   note:{en:'A casual intensifier — literally means "a pile."', tr:'Kelimenin tam anlamıyla "bir yığın" demek olan gündelik bir pekiştirici.', fa:'به معنای واقعی «یک توده» — یک تشدیدکننده خودمانی.', es:'Un intensificador informal — literalmente significa "una pila".'}},
  {word:'¿qué onda? / ¿qué tal?', sentence:'¿Qué onda, cómo has estado?', meaning:{en:"What's up? How's it going?", tr:'Naber? Nasıl gidiyor?', fa:'چه خبر؟ اوضاع چطوره؟', es:'¿Qué tal? ¿Cómo va todo?'},
   note:{en:'Casual greeting — qué onda leans Mexican, qué tal works everywhere.', tr:"Samimi bir selamlama — qué onda daha çok Meksika'da kullanılır, qué tal her yerde geçerlidir.", fa:'احوال‌پرسی خودمانی — qué onda بیشتر مکزیکی است، qué tal همه‌جا کاربرد دارد.', es:'Saludo informal — qué onda es más mexicano, qué tal funciona en cualquier país.'}},
  {word:'estar en las nubes', sentence:'Perdón, estaba en las nubes.', meaning:{en:'To be daydreaming / not paying attention.', tr:'Dalıp gitmek / hayal kurmak.', fa:'در رؤیا بودن / حواس‌پرت بودن.', es:'Estar distraído, sin prestar atención.'},
   note:{en:'Literally "to be in the clouds" — a fun idiom for spacing out.', tr:'Kelimenin tam anlamıyla "bulutların içinde olmak" — dalıp gitmek için eğlenceli bir deyim.', fa:'به معنای واقعی «در ابرها بودن» — اصطلاحی بامزه برای حواس‌پرتی.', es:'Literalmente "estar en las nubes" — una expresión divertida para cuando alguien está distraído.'}},
  {word:'ni idea', sentence:'¿Dónde está Marcos? — Ni idea.', meaning:{en:'No idea / no clue.', tr:'Hiçbir fikrim yok.', fa:'هیچ ایده‌ای ندارم.', es:'Ni idea / no tengo ni idea.'},
   note:{en:'A short, casual way to say you have no idea.', tr:'"Bilmiyorum" demenin kısa ve samimi bir yolu.', fa:'راهی کوتاه و خودمانی برای گفتن اینکه نمی‌دانی.', es:'Una forma corta e informal de decir que no sabes algo.'}}
]}
,
