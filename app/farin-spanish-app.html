      tr:"Küçük bir gerçeklik kontrolü: İspanyolca konuşanlar edilgen çatıyı İngilizce konuşanlara göre çok daha az kullanır, bu yüzden ona başvurduğunda doğru kullanman önemli. Bu yapı, dikkati eylemi yapandan eylemin etkilediği şeye kaydırır: ser + (özneyle cinsiyet ve sayı bakımından mutlaka uyumlu olması gereken!) geçmiş zaman ortacı + por + sorumlu kişi. 'El libro fue escrito por Cervantes' cümlesinde Cervantes değil, kitap ön plandadır. Bunu haber başlıklarında ve resmi yazılarda sürekli görürsün — 'el sospechoso fue detenido', 'la ley fue aprobada' — ama günlük sohbette İspanyolca genelde etken çatıyı ya da kişisiz se yapısını tercih eder ('se vende', 'se rompió'). Klasik başlangıç hatası, ortaç uyumunu unutmaktır — la carta gibi dişil bir özne için fue escrita yerine fue escrito demek — bu uyum tercihe bağlı değildir. Hızlı bir hile: eyleme '¿por quién?' diye sorabiliyorsan, ser ile edilgen çatı iyi bir seçimdir. Bunu ustalaştırdığında resmi İspanyolca — haber makaleleri, resmi duyurular — birden çok daha az ürkütücü gelmeye başlar.",
      fa:"یک واقعیت جالب: اسپانیایی‌زبان‌ها واقعاً خیلی کمتر از انگلیسی‌زبان‌ها از وجه مجهول استفاده می‌کنند، پس وقتی سراغش می‌روی، ارزشش را دارد که درست استفاده‌اش کنی. این ساختار توجه را از کسی که کاری را انجام می‌دهد به چیزی که اتفاق برایش می‌افتد منتقل می‌کند: ser + اسم مفعول (که باید حتماً از نظر جنسیت و شمار با فاعل مطابقت داشته باشد!) + por + مسئول کار. 'El libro fue escrito por Cervantes' کتاب را، نه سروانتس را، در کانون توجه قرار می‌دهد. این ساختار را مدام در تیترهای خبری و نوشتار رسمی می‌بینی — 'el sospechoso fue detenido'، 'la ley fue aprobada' — اما در گفت‌وگوی روزمره اسپانیایی معمولاً وجه معلوم یا ساختار غیرشخصی se را ترجیح می‌دهد ('se vende'، 'se rompió'). اشتباه کلاسیک زبان‌آموزان تازه‌کار فراموش‌کردن مطابقت اسم مفعول است، مثلاً برای فاعل مؤنثی مثل la carta گفتن fue escrito به‌جای fue escrita — این مطابقت اختیاری نیست. یک ترفند سریع: اگر بتوانی درباره‌ی کار بپرسی '¿por quién؟'، مجهول با ser انتخاب خوبی است. این را که مسلط شوی، اسپانیایی رسمی — مقاله‌های خبری، اعلامیه‌های رسمی — ناگهان خیلی کمتر ترسناک به‌نظر می‌رسد.",
      es:"Un dato curioso: los hispanohablantes en realidad usan la voz pasiva mucho menos que los angloparlantes, así que cuando la uses, vale la pena hacerlo bien. La estructura desplaza el foco de quién hace una acción a lo que le sucede a algo: ser + participio (¡que tiene que concordar en género y número con el sujeto!) + por + quien es responsable. 'El libro fue escrito por Cervantes' pone al libro, no a Cervantes, en el centro. La verás constantemente en titulares de noticias y textos formales — 'el sospechoso fue detenido', 'la ley fue aprobada' — pero en la conversación cotidiana el español suele preferir la voz activa o el se impersonal ('se vende', 'se rompió'). El error clásico de principiante es olvidar la concordancia del participio, decir fue escrito para un sujeto femenino como la carta en vez de fue escrita — esa concordancia no es opcional. Un truco rápido: si puedes preguntar '¿por quién?' sobre la acción, la pasiva con ser es una buena opción. Domina esto y el español formal — artículos de noticias, comunicados oficiales — de repente te resultará mucho menos intimidante."},
 wrong:'El libro escribió por Cervantes.', right:'El libro fue escrito por Cervantes.',
 blank:{sentence:'La nueva ley ___ por el parlamento ayer.', word:'fue aprobada', distractors:['aprobó','ha aprobado']},
 wrong2:'Los ladrones fueron arrestar por la policía.', right2:'Los ladrones fueron arrestados por la policía.',
 blank2:{sentence:'Estos cuadros ___ por un artista muy famoso.', word:'fueron pintados', distractors:['pintaron','han pintado']}},

{id:'g-B2-5', level:'B2', title:{en:"Reported Speech (estilo indirecto)", tr:"Aktarılan Konuşma (estilo indirecto)", fa:"نقل‌قول غیرمستقیم (estilo indirecto)", es:"El estilo indirecto (discurso referido)"},
 exp:{en:"You know that moment when you're retelling a conversation to a friend — 'she said she was tired,' not 'she said I am tired'? English shifts tenses back automatically, and so does Spanish, just with its own set of rules. When you report what someone said using dijo que, preguntó si, and similar phrases, the verb tense usually steps back one notch: presente → imperfecto, pretérito → pluscuamperfecto, futuro → condicional. Questions turn indirect with si for yes/no questions, or keep the original question word (qué, dónde, cuándo) for everything else. Direct commands get the biggest makeover of all, jumping into the subjunctive: '¡Terminen la tarea!' becomes 'Nos dijo que termináramos la tarea.' The trap most learners fall into is forgetting to shift the tense at all and just copying the original sentence word for word — dijo que ella está cansada instead of dijo que ella estaba cansada. A useful shortcut: picture each tense taking one step backward in time, like a line of dominoes falling in sequence. Once that backward shift feels automatic, gossiping and storytelling in Spanish gets a whole lot smoother.",
      tr:"Bir arkadaşına bir konuşmayı yeniden anlattığın anı bilirsin — 'yorgun olduğunu söyledi', 'yorgunum dedi' değil? İngilizce zamanları otomatik olarak geriye kaydırır, İspanyolca da öyle yapar, sadece kendi kurallarıyla. Birinin söylediğini dijo que, preguntó si ve benzeri ifadelerle aktarırken fiil zamanı genellikle bir basamak geriye kayar: presente → imperfecto, pretérito → pluscuamperfecto, futuro → condicional. Sorular, evet/hayır soruları için si ile dolaylı hâle gelir, geri kalanı için ise orijinal soru sözcüğünü (qué, dónde, cuándo) korur. Doğrudan emirler en büyük değişimi yaşar ve subjunktife atlar: '¡Terminen la tarea!' cümlesi 'Nos dijo que termináramos la tarea.' olur. Çoğu öğrencinin düştüğü tuzak, zamanı hiç geriye kaydırmadan orijinal cümleyi olduğu gibi kopyalamaktır — dijo que ella está cansada yerine dijo que ella estaba cansada demek gerekirken. İşe yarar bir kısayol: her zamanın, art arda düşen domino taşları gibi, zamanda bir adım geriye gittiğini hayal et. Bu geriye kayma senin için otomatik hâle geldiğinde, İspanyolca dedikodu yapmak ve hikâye anlatmak çok daha akıcı hâle gelir.",
      fa:"اون لحظه رو می‌شناسی که یک مکالمه رو برای دوستت تعریف می‌کنی — 'گفت خسته است' نه 'گفت من خسته‌ام'؟ انگلیسی زمان فعل‌ها را خودکار به عقب می‌برد، اسپانیایی هم همین کار را می‌کند، فقط با قوانین خودش. وقتی حرف کسی را با dijo que، preguntó si و عبارات مشابه نقل می‌کنی، معمولاً زمان فعل یک پله به عقب می‌رود: حال ساده → ناقص، گذشته‌ی ساده → گذشته‌ی بعید، آینده → شرطی. سؤال‌ها برای سؤالات بله/خیر با si غیرمستقیم می‌شوند، و برای بقیه همان کلمه‌ی پرسشی اصلی (qué، dónde، cuándo) را حفظ می‌کنند. امرهای مستقیم بیشترین تغییر را می‌بینند و مستقیم به التزامی می‌پرند: '¡Terminen la tarea!' می‌شود 'Nos dijo que termináramos la tarea.' دامی که بیشتر زبان‌آموزان توش می‌افتند این است که اصلاً زمان را عقب نمی‌برند و جمله‌ی اصلی را عیناً کپی می‌کنند — dijo que ella está cansada به‌جای dijo que ella estaba cansada. یک میان‌بر مفید: تصور کن هر زمان یک قدم به عقب برمی‌دارد، مثل یک ردیف دومینو که پشت سر هم می‌افتند. وقتی این عقب‌رفتن برایت خودکار شد، غیبت‌کردن و داستان‌تعریف‌کردن به اسپانیایی خیلی روان‌تر می‌شود.",
      es:"¿Conoces ese momento en que le cuentas a un amigo una conversación — 'dijo que estaba cansada', no 'dijo que estoy cansada'? El inglés retrocede los tiempos verbales automáticamente, y el español también, aunque con sus propias reglas. Cuando cuentas lo que alguien dijo usando dijo que, preguntó si y frases similares, el tiempo verbal normalmente retrocede un paso: presente → imperfecto, pretérito → pluscuamperfecto, futuro → condicional. Las preguntas se vuelven indirectas con si para las de sí/no, o mantienen la palabra interrogativa original (qué, dónde, cuándo) para el resto. Las órdenes directas sufren el cambio más grande de todos, saltando al subjuntivo: '¡Terminen la tarea!' se convierte en 'Nos dijo que termináramos la tarea.' La trampa en la que caen la mayoría de estudiantes es no retroceder el tiempo en absoluto y copiar la frase original tal cual — dijo que ella está cansada en vez de dijo que ella estaba cansada. Un atajo útil: imagina cada tiempo dando un paso hacia atrás, como una fila de fichas de dominó cayendo en cadena. En cuanto ese retroceso se vuelva automático para ti, cotillear y contar historias en español te saldrá muchísimo más fluido."},
 wrong:'Me dijo que ella está cansada.', right:'Me dijo que ella estaba cansada.',
 blank:{sentence:'Ana me preguntó si yo ___ ir al cine con ella.', word:'quería', distractors:['quiero','querré']},
 wrong2:'Él dijo que llegará tarde.', right2:'Él dijo que llegaría tarde.',
 blank2:{sentence:'El profesor nos dijo que ___ la tarea para el lunes.', word:'termináramos', distractors:['terminamos','terminaremos']}},

{id:'g-B2-6', level:'B2', title:{en:"Future Perfect & Conditional Perfect", tr:"Bitmiş Gelecek Zaman ve Bitmiş Koşul Kipi", fa:"آینده‌ی کامل و شرطی کامل", es:"El futuro perfecto y el condicional perfecto"},
 exp:{en:"Ever wondered how to say 'by the time you arrive, I'll already be done' or 'I would have gone, but...' in Spanish? These two tenses are your answer, and they're basically mirror images of each other. The future perfect (habré, habrás, habrá... + participle) describes what will already be finished by some future point: 'Para las diez, ya habré terminado el proyecto' — by ten, the project will already be done. The conditional perfect (habría + participle) looks the opposite direction, describing what would have happened but didn't, often for regrets or guesses about the past: 'Habría ido a la fiesta, pero tuve que trabajar.' Learners often mix these two up because they both use a form of haber plus a participle — the giveaway is habré (future) versus habría (conditional), just one letter apart but worlds apart in meaning. A handy way to keep them straight: future perfect looks forward from now to a finished future action, conditional perfect looks backward with a 'would have' tinge of regret. Once these settle in, you'll be able to speculate about deadlines and second-guess the past like a true Spanish pro.",
      tr:"'Sen varana kadar ben zaten bitirmiş olacağım' ya da 'giderdim ama...' demeyi İspanyolcada hiç merak ettin mi? Bu iki zaman tam da cevabın, ve birbirlerinin neredeyse ayna görüntüsüler. Bitmiş gelecek zaman (habré, habrás, habrá... + ortaç) gelecekteki bir noktaya kadar zaten tamamlanmış olacak şeyleri anlatır: 'Para las diez, ya habré terminado el proyecto' — saat ona kadar proje zaten bitmiş olacak. Bitmiş koşul kipi (habría + ortaç) tam tersi yöne bakar, gerçekleşecekken gerçekleşmeyen şeyleri anlatır, çoğunlukla pişmanlık ya da geçmişe dair tahmin için: 'Habría ido a la fiesta, pero tuve que trabajar.' Öğrenciler bu ikisini sık sık karıştırır çünkü ikisi de haber'in bir hâlini artı ortaç kullanır — ipucu habré (gelecek) ile habría (koşul) arasında, sadece bir harf fark ama anlamca dünyalar kadar uzak. Onları ayırt etmenin pratik bir yolu: bitmiş gelecek zaman şimdiden ileriye, tamamlanmış bir gelecek eyleme bakar; bitmiş koşul kipi ise geriye bakar, 'yapardım' tadında bir pişmanlıkla. Bunlar yerleştiğinde, son teslim tarihleri hakkında tahminde bulunabilir ve geçmişi gerçek bir İspanyolca ustası gibi sorgulayabilirsin.",
      fa:"تا حالا به این فکر کردی که چطور بگی 'تا وقتی برسی، من دیگه کارم تموم شده' یا 'می‌رفتم، ولی...' به اسپانیایی؟ این دو زمان جواب توئن، و اساساً تصویر آینه‌ای هم‌دیگه‌اند. آینده‌ی کامل (habré، habrás، habrá... + اسم مفعول) کاری را توصیف می‌کند که تا یک نقطه‌ی مشخص در آینده قبلاً تمام شده خواهد بود: 'Para las diez, ya habré terminado el proyecto' — تا ساعت ده، پروژه از قبل تمام شده خواهد بود. شرطی کامل (habría + اسم مفعول) به سمت مخالف نگاه می‌کند و کاری را توصیف می‌کند که قرار بود اتفاق بیفتد اما نیفتاد، اغلب برای پشیمانی یا حدس درباره‌ی گذشته: 'Habría ido a la fiesta, pero tuve que trabajar.' زبان‌آموزان اغلب این دو را قاطی می‌کنند چون هر دو از یک صرف haber به‌علاوه‌ی اسم مفعول استفاده می‌کنند — نشانه‌ی تشخیص habré (آینده) در برابر habría (شرطی) است، فقط یک حرف فرق دارند اما از نظر معنا فرسنگ‌ها با هم فاصله دارند. یک راه کاربردی برای گم‌نکردنشان: آینده‌ی کامل از الان به جلو، به سمت یک کار آینده‌ی تمام‌شده نگاه می‌کند؛ شرطی کامل به عقب نگاه می‌کند، با آن رنگ‌وبوی پشیمانی 'کاش می‌کردم'. وقتی این‌ها جا بیفتند، می‌توانی درباره‌ی ضرب‌الاجل‌ها حدس بزنی و مثل یک حرفه‌ای واقعی اسپانیایی درباره‌ی گذشته دوباره‌فکری کنی.",
      es:"¿Alguna vez te has preguntado cómo decir 'para cuando llegues, ya habré terminado' o 'habría ido, pero...' en español? Estos dos tiempos son tu respuesta, y son básicamente imágenes espejo el uno del otro. El futuro perfecto (habré, habrás, habrá... + participio) describe lo que ya estará terminado en un momento futuro: 'Para las diez, ya habré terminado el proyecto' — para las diez, el proyecto ya estará hecho. El condicional perfecto (habría + participio) mira en la dirección opuesta, describiendo lo que habría pasado pero no pasó, muchas veces para arrepentimientos o suposiciones sobre el pasado: 'Habría ido a la fiesta, pero tuve que trabajar.' Los estudiantes suelen confundir estos dos tiempos porque ambos usan una forma de haber más un participio — la pista está en habré (futuro) frente a habría (condicional), solo una letra de diferencia pero mundos aparte en significado. Una forma práctica de no mezclarlos: el futuro perfecto mira hacia adelante, desde ahora hasta una acción futura ya terminada; el condicional perfecto mira hacia atrás, con ese toque de 'habría hecho' y arrepentimiento. Cuando esto se asiente, podrás especular sobre plazos y cuestionar el pasado como un verdadero experto en español."},
 wrong:'Para las diez, ya habré terminando el proyecto.', right:'Para las diez, ya habré terminado el proyecto.',
 blank:{sentence:'Cuando llegues, nosotros ya ___.', word:'habremos salido', distractors:['saldremos','hemos salido']},
 wrong2:'Yo había ido a la fiesta, pero tuve que trabajar.', right2:'Yo habría ido a la fiesta, pero tuve que trabajar.',
 blank2:{sentence:'Si hubiera sabido la verdad, ___ de otra manera.', word:'habría actuado', distractors:['actuaría','había actuado']}},

{id:'g-B2-7', level:'B2', title:{en:"Special Uses of the Gerund (seguir, llevar, ir + gerundio)", tr:"Ulacın Özel Kullanımları (seguir, llevar, ir + gerundio)", fa:"کاربردهای ویژه‌ی وجه وصفی (seguir، llevar، ir + gerundio)", es:"Usos especiales del gerundio (seguir, llevar, ir + gerundio)"},
 exp:{en:"Spanish loves to sneak extra meaning into the gerund by pairing it with a helper verb, and once you learn these three combos, you'll sound way more fluent. Seguir/continuar + gerund means 'to keep on doing something': 'Sigue trabajando allí' — she's still working there. Llevar + [amount of time] + gerund expresses how long something has been going on, which trips up a lot of English speakers because there's no direct word-for-word equivalent: 'Llevo dos años estudiando español' literally reads like 'I carry two years studying Spanish,' but it simply means 'I've been studying Spanish for two years.' Ir + gerund adds a sense of gradual, step-by-step progress: 'La situación va mejorando' — things are slowly getting better, bit by bit. The mistake to watch for is using the infinitive instead of the gerund after these verbs — sigue trabajar is wrong, it has to be sigue trabajando, no exceptions. A good way to remember: seguir keeps something going, llevar carries a duration, and ir walks a process forward step by step. Master this trio and your Spanish will start sounding a lot less like a list of facts and a lot more like a story unfolding.",
      tr:"İspanyolca, gerundio'yu bir yardımcı fiille eşleştirerek ona fazladan anlam sıkıştırmayı sever, ve bu üç kombinasyonu öğrendiğinde çok daha akıcı konuşursun. Seguir/continuar + gerundio 'bir şeyi yapmaya devam etmek' anlamına gelir: 'Sigue trabajando allí' — hâlâ orada çalışıyor. Llevar + [zaman miktarı] + gerundio bir şeyin ne kadar süredir devam ettiğini ifade eder, ve birebir karşılığı olmadığı için İngilizce konuşanların çoğunu şaşırtır: 'Llevo dos años estudiando español' kelimesi kelimesine 'iki yıldır İspanyolca çalışmayı taşıyorum' gibi okunur ama basitçe 'iki yıldır İspanyolca çalışıyorum' anlamına gelir. Ir + gerundio, yavaş yavaş, adım adım ilerleme duygusu katar: 'La situación va mejorando' — işler yavaş yavaş, adım adım düzeliyor. Dikkat edilmesi gereken hata, bu fiillerden sonra gerundio yerine mastar kullanmaktır — sigue trabajar yanlıştır, sigue trabajando olmalı, istisnasız. İyi bir hatırlama yolu: seguir bir şeyi devam ettirir, llevar bir süreyi taşır, ir ise bir süreci adım adım ileriye yürütür. Bu üçlüde ustalaştığında İspanyolcan artık bir gerçekler listesi gibi değil, açılan bir hikâye gibi kulağa gelmeye başlar.",
      fa:"اسپانیایی عاشق اینه که با جفت‌کردن گروندیو با یک فعل کمکی، معنای اضافه‌ای درونش قاچاقی جا بده، و همین که این سه ترکیب را یاد بگیری، خیلی روان‌تر به‌نظر می‌رسی. seguir/continuar + گروندیو یعنی 'به کاری ادامه دادن': 'Sigue trabajando allí' — هنوز آنجا کار می‌کند. llevar + [مدت‌زمان] + گروندیو نشان می‌دهد چیزی چه مدت است ادامه دارد، و چون معادل کلمه‌به‌کلمه ندارد خیلی از انگلیسی‌زبان‌ها را گیج می‌کند: 'Llevo dos años estudiando español' تحت‌اللفظی چیزی شبیه 'دو سال است که مطالعه‌ی اسپانیایی را حمل می‌کنم' است، اما به‌سادگی یعنی 'دو سال است که دارم اسپانیایی می‌خوانم'. ir + گروندیو حس پیشرفت تدریجی و قدم‌به‌قدم اضافه می‌کند: 'La situación va mejorando' — اوضاع کم‌کم، قدم‌به‌قدم دارد بهتر می‌شود. اشتباهی که باید مراقبش باشی استفاده از مصدر به‌جای گروندیو بعد از این افعال است — sigue trabajar غلط است، باید sigue trabajando باشد، بدون استثنا. یک راه خوب برای به‌خاطرسپاری: seguir چیزی را ادامه‌دار نگه می‌دارد، llevar یک مدت‌زمان را حمل می‌کند، و ir یک روند را قدم‌به‌قدم جلو می‌برد. این سه‌تایی را که یاد بگیری، اسپانیایی‌ات دیگر شبیه فهرستی از حقایق نیست، بلکه بیشتر شبیه داستانی است که دارد باز می‌شود.",
      es:"Al español le encanta meter significado extra en el gerundio combinándolo con un verbo auxiliar, y en cuanto aprendas estas tres combinaciones, sonarás muchísimo más fluido. Seguir/continuar + gerundio significa 'seguir haciendo algo': 'Sigue trabajando allí' — todavía trabaja ahí. Llevar + [cantidad de tiempo] + gerundio expresa desde hace cuánto ocurre algo, y suele confundir a los angloparlantes porque no existe un equivalente palabra por palabra: 'Llevo dos años estudiando español' significa simplemente 'he estado estudiando español durante dos años'. Ir + gerundio añade una idea de progreso gradual, paso a paso: 'La situación va mejorando' — las cosas mejoran poco a poco. El error que hay que vigilar es usar el infinitivo en vez del gerundio después de estos verbos — sigue trabajar está mal, tiene que ser sigue trabajando, sin excepciones. Una buena forma de recordarlo: seguir mantiene algo en marcha, llevar carga una duración, e ir avanza un proceso paso a paso. Domina este trío y tu español empezará a sonar mucho menos como una lista de datos y mucho más como una historia que se va desarrollando."},
 wrong:'Ella sigue trabajar en la misma empresa.', right:'Ella sigue trabajando en la misma empresa.',
 blank:{sentence:'Llevo dos años ___ español.', word:'estudiando', distractors:['estudiado','estudiar']},
 wrong2:'La situación va mejorar poco a poco.', right2:'La situación va mejorando poco a poco.',
 blank2:{sentence:'Mi abuela lleva toda la vida ___ en ese pueblo.', word:'viviendo', distractors:['vivido','vive']}},

{id:'g-B2-8', level:'B2', title:{en:"Verbs with Fixed Prepositions (soñar con, pensar en, consistir en...)", tr:"Sabit Edatlı Fiiller (soñar con, pensar en, consistir en...)", fa:"افعال با حرف‌اضافه‌ی ثابت (soñar con، pensar en، consistir en...)", es:"Verbos con preposición fija (soñar con, pensar en, consistir en...)"},
 exp:{en:"Here's a trap that catches even advanced learners: your brain wants to translate the English preposition directly, and Spanish just refuses to cooperate. Many Spanish verbs are permanently glued to one specific preposition, and it often doesn't match the English version at all: soñar con (to dream about/of, literally 'to dream with'), pensar en (to think about), consistir en (to consist of), tratarse de (to be about), depender de (to depend on). Say sueño en instead of sueño con and a native speaker will still understand you, but it'll sound off in a way you won't be able to unhear once you know the correct version. The safest approach — really the only reliable one — is to memorize each verb glued to its preposition as a single inseparable chunk, the same way you'd memorize a phrasal verb in English. A fun trick: make up a silly mental image for each pairing, like picturing yourself literally dreaming 'with' (con) someone riding a llama through Sudamérica — the weirder the image, the better it sticks. Get these pairings under your belt and a whole category of small, everyday mistakes just disappears.",
      tr:"İşte ileri düzey öğrencileri bile yakalayan bir tuzak: beynin İngilizce edatı doğrudan çevirmek ister, ama İspanyolca buna hiç yanaşmaz. Birçok İspanyolca fiil kalıcı olarak belirli bir edata yapışıktır, ve bu çoğu zaman İngilizce karşılığıyla hiç örtüşmez: soñar con (bir şeyi hayal etmek), pensar en (bir şeyi düşünmek), consistir en (bir şeyden oluşmak), tratarse de (bir şeyle ilgili olmak), depender de (bir şeye bağlı olmak). Sueño con yerine sueño en desen, anadili konuşan biri seni yine de anlar, ama doğru versiyonu bir kez öğrendikten sonra kulağına tuhaf gelmeye devam eder. En güvenli yaklaşım — aslında tek güvenilir yaklaşım — her fiili edatıyla yapışık, ayrılmaz tek bir kalıp olarak ezberlemektir, tıpkı İngilizcede bir phrasal verb ezberler gibi. Eğlenceli bir hile: her ikili için saçma bir zihinsel görüntü uydur, mesela birini Güney Amerika'da lama sırtında gezerken 'con' (birlikte) hayal ettiğini düşün — görüntü ne kadar tuhafsa o kadar akılda kalır. Bu ikilileri iyice oturttuğunda, küçük ve günlük hataların koca bir kategorisi ortadan kalkıyor.",
      fa:"این یک تله است که حتی زبان‌آموزان پیشرفته را هم گیر می‌اندازد: مغزت می‌خواهد حرف‌اضافه‌ی انگلیسی را مستقیم ترجمه کند، و اسپانیایی به‌سادگی همکاری نمی‌کند. بسیاری از افعال اسپانیایی برای همیشه به یک حرف‌اضافه‌ی خاص چسبیده‌اند، و این اغلب اصلاً با معادل انگلیسی‌شان یکی نیست: soñar con (رؤیای چیزی را دیدن)، pensar en (به چیزی فکر کردن)، consistir en (شامل چیزی بودن)، tratarse de (درباره‌ی چیزی بودن)، depender de (به چیزی بستگی داشتن). اگر به‌جای sueño con بگویی sueño en، یک گویشور بومی بازهم منظورت را می‌فهمد، اما طوری عجیب به‌نظر می‌رسد که وقتی نسخه‌ی درست را یاد بگیری، دیگر نمی‌توانی نادیده‌اش بگیری. امن‌ترین راه — راستش تنها راه قابل‌اعتماد — این است که هر فعل را چسبیده به حرف‌اضافه‌اش، به‌عنوان یک واحد جداناشدنی، حفظ کنی، درست مثل حفظ‌کردن یک phrasal verb در انگلیسی. یک ترفند بامزه: برای هر جفت یک تصویر ذهنی مسخره بساز، مثلاً خودت را تصور کن که واقعاً 'با' (con) کسی داری خواب می‌بینی که سوار لاما در سراسر آمریکای جنوبی می‌گردد — هرچه تصویر عجیب‌تر باشد، بهتر در ذهن می‌ماند. این جفت‌ها را که خوب یاد بگیری، یک دسته‌ی کامل از اشتباهات کوچک روزمره به‌سادگی ناپدید می‌شود.",
      es:"Aquí hay una trampa que atrapa incluso a estudiantes avanzados: tu cerebro quiere traducir la preposición del inglés directamente, y el español simplemente se niega a cooperar. Muchos verbos en español están pegados de forma permanente a una preposición específica, y muchas veces no coincide en absoluto con el inglés: soñar con, pensar en, consistir en, tratarse de, depender de. Si dices sueño en en vez de sueño con, un hablante nativo te seguirá entendiendo, pero sonará raro de una forma que ya no podrás dejar de notar una vez que sepas la versión correcta. La estrategia más segura — de verdad, la única fiable — es memorizar cada verbo pegado a su preposición como una sola unidad inseparable, igual que memorizarías un phrasal verb en inglés. Un truco divertido: inventa una imagen mental ridícula para cada pareja, como imaginarte literalmente soñando 'con' alguien montando una llama por Sudamérica — cuanto más rara sea la imagen, mejor se te queda. Domina estas parejas y toda una categoría de pequeños errores cotidianos simplemente desaparece."},
 wrong:'Siempre sueño en viajar por Sudamérica.', right:'Siempre sueño con viajar por Sudamérica.',
 blank:{sentence:'No pienses tanto ___ el pasado.', word:'en', distractors:['de','con']},
 wrong2:'La reunión se trata en el nuevo proyecto.', right2:'La reunión se trata del nuevo proyecto.',
 blank2:{sentence:'El resultado final ___ del esfuerzo de todo el equipo.', word:'depende', distractors:['sueña','consiste']}},

{id:'g-B2-9', level:'B2', title:{en:"Advanced Concessive & Causal Connectors (a pesar de que, puesto que, dado que...)", tr:"İleri Düzey Zıtlık ve Neden Bağlaçları (a pesar de que, puesto que, dado que...)", fa:"حروف ربط پیشرفته‌ی تقابلی و علّی (a pesar de que، puesto que، dado que...)", es:"Conectores concesivos y causales avanzados (a pesar de que, puesto que, dado que...)"},
 exp:{en:"Want to sound less like a textbook and more like someone giving a real, reasoned argument in Spanish? These connectors are exactly the upgrade you're looking for. A pesar de que introduces a contrast — 'despite the fact that' — and needs que right before a conjugated clause; without a verb, you drop the que (a pesar de + noun/infinitive, but a pesar de que + verb). Puesto que, ya que, and dado que all mean 'since/given that' and introduce a reason the listener already knows or accepts as fact — and unlike porque, all three can open the sentence and don't directly answer a spoken '¿por qué?' question. A common mix-up is using porque at the start of a sentence the way these words are used, or forgetting que after a pesar de when a full clause follows — 'a pesar de tiene trabajo' is missing its que. Here's a trick to keep them straight: porque answers a question someone actually asked; puesto que/ya que/dado que announce a reason nobody needed to ask about, because it's already obvious. Sprinkle these into your Spanish and your arguments will suddenly sound sharper, more confident, and a lot more native.",
      tr:"İspanyolcada ders kitabı gibi değil, gerçek ve mantıklı bir argüman sunan biri gibi konuşmak ister misin? Bu bağlaçlar tam da aradığın yükseltme. A pesar de que bir zıtlığı — 'gerçeğine rağmen' — tanıtır ve çekimli bir cümlecikten hemen önce que gerektirir; fiil yoksa que kalkar (a pesar de + isim/mastar, ama a pesar de que + fiil). Puesto que, ya que ve dado que hepsi 'çünkü/madem ki bu bir gerçek' anlamına gelir ve dinleyicinin zaten bildiği ya da gerçek kabul ettiği bir nedeni tanıtır — ve porque'nin aksine, üçü de cümleye başlayabilir ve sesli sorulan bir '¿por qué?' sorusuna doğrudan cevap vermez. Sık yapılan bir karışıklık, porque'yi cümle başında bu bağlaçlar gibi kullanmak ya da tam bir cümlecik geldiğinde a pesar de'den sonra que'yi unutmaktır — 'a pesar de tiene trabajo' cümlesinde que eksik. Onları ayırt etmek için bir hile: porque, birinin gerçekten sorduğu bir soruyu cevaplar; puesto que/ya que/dado que ise kimsenin sormasına gerek olmayan, zaten belli olan bir nedeni duyurur. Bunları İspanyolcana serpiştir, argümanların birden daha keskin, daha kendinden emin ve çok daha yerli gibi kulağa gelmeye başlasın.",
      fa:"می‌خواهی به اسپانیایی کمتر شبیه کتاب درسی و بیشتر شبیه کسی حرف بزنی که یک استدلال واقعی و منطقی ارائه می‌دهد؟ این حروف ربط دقیقاً همان ارتقایی هستند که دنبالش هستی. a pesar de que یک تقابل را معرفی می‌کند — 'با وجود اینکه' — و درست پیش از یک جمله‌واره‌ی صرف‌شده به que نیاز دارد؛ وقتی فعلی نباشد، que حذف می‌شود (a pesar de + اسم/مصدر، اما a pesar de que + فعل). puesto que، ya que و dado que همگی به معنای 'از آنجا که/چون این یک واقعیت است' هستند و دلیلی را معرفی می‌کنند که شنونده از قبل می‌داند یا آن را بدیهی می‌داند — و برخلاف porque، هر سه می‌توانند در ابتدای جمله بیایند و مستقیماً به یک '¿por qué؟' گفته‌شده پاسخ نمی‌دهند. یک اشتباه رایج این است که porque را در ابتدای جمله مثل این حروف ربط به کار ببرند، یا وقتی یک جمله‌واره‌ی کامل می‌آید، que را بعد از a pesar de فراموش کنند — در 'a pesar de tiene trabajo' جای que خالی است. برای اینکه گم‌شان نکنی یک ترفند: porque به سؤالی پاسخ می‌دهد که واقعاً کسی پرسیده؛ puesto que/ya que/dado que دلیلی را اعلام می‌کنند که لازم نبوده کسی بپرسدش، چون از قبل روشن است. این‌ها را در اسپانیایی‌ات بپاش، استدلال‌هایت ناگهان دقیق‌تر، مطمئن‌تر و خیلی بومی‌تر به‌نظر می‌رسند.",
      es:"¿Quieres sonar menos a libro de texto y más a alguien que da un argumento real y razonado en español? Estos conectores son justo la mejora que buscas. A pesar de que introduce un contraste — 'aunque sea cierto que' — y necesita que justo antes de una cláusula conjugada; sin verbo, se elimina el que (a pesar de + sustantivo/infinitivo, pero a pesar de que + verbo). Puesto que, ya que y dado que significan todos 'porque, dado que es un hecho' e introducen una razón que el oyente ya conoce o da por sentada — y, a diferencia de porque, los tres pueden abrir la oración y no responden directamente a un '¿por qué?' hablado. Una confusión habitual es usar porque al principio de la frase como si fuera uno de estos conectores, u olvidar el que después de a pesar de cuando sigue una cláusula completa — 'a pesar de tiene trabajo' le falta el que. Aquí tienes un truco para no mezclarlos: porque responde a una pregunta que alguien realmente hizo; puesto que/ya que/dado que anuncian una razón que nadie necesitó preguntar, porque ya es evidente. Añade estos conectores a tu español y tus argumentos sonarán de repente más agudos, más seguros y mucho más naturales."},
 wrong:'A pesar de tiene mucho trabajo, sale a caminar cada día.', right:'A pesar de que tiene mucho trabajo, sale a caminar cada día.',
 blank:{sentence:'___ no tenía experiencia, consiguió el trabajo gracias a su actitud.', word:'Aunque', distractors:['Porque','Ya que']},
 wrong2:'Como hace mucho calor, así que bebemos mucha agua.', right2:'Como hace mucho calor, bebemos mucha agua.',
 blank2:{sentence:'___ los precios han subido tanto, mucha gente ahorra menos.', word:'Dado que', distractors:['Aunque','A pesar de que']}},

{id:'g-B2-10', level:'B2', title:{en:"Ser vs. Estar — Advanced & Idiomatic Uses", tr:"Ser ve Estar — İleri Düzey ve Deyimsel Kullanımlar", fa:"Ser در برابر Estar — کاربردهای پیشرفته و اصطلاحی", es:"Ser y estar: usos avanzados e idiomáticos"},
 exp:{en:"Just when you thought you'd mastered ser and estar, Spanish throws you a curveball: a handful of adjectives flip their entire meaning depending on which verb you pick, and the results can be pretty funny if you get it wrong. Ser listo means 'clever,' while estar listo means 'ready' — so telling someone eres listo para el examen when you meant estás listo turns 'you're ready for the exam' into 'you're a clever one for the exam,' which just sounds odd. Ser aburrido describes something boring, while estar aburrido means someone is bored — the same word, two completely different vibes. Ser rico means 'wealthy,' but estar rico means 'delicious' — so complimenting a soup with es rica might get you a confused look, since está rica is what you actually want to say. The trick worth remembering: ser gives an inherent identity or trait, estar gives a temporary state or condition, and this handful of adjectives just makes that contrast painfully obvious. Keep a running mental list of these tricky pairs, because context and the verb you choose really do change the entire message. Master these and you'll not only avoid some awkward mix-ups, you'll also start catching jokes and wordplay that rely on exactly this switch.",
      tr:"Tam ser ve estar'ı öğrendiğini düşündüğün anda, İspanyolca sana bir sürpriz hazırlıyor: bir avuç sıfat, hangi fiili seçtiğine bağlı olarak anlamını tamamen değiştiriyor, ve yanlış yaparsan sonuç oldukça komik olabiliyor. Ser listo 'zeki' demektir, estar listo ise 'hazır' demektir — yani estás listo demek isterken eres listo para el examen dersen, 'sınava hazırsın' cümlesi 'sınav için kurnaz birisin'e dönüşür, ki bu tuhaf kaçar. Ser aburrido bir şeyin sıkıcı olduğunu anlatır, estar aburrido ise birinin sıkıldığını anlatır — aynı kelime, tamamen farklı iki hava. Ser rico 'zengin' demektir, ama estar rico 'lezzetli' demektir — yani bir çorbayı es rica diyerek övmeye çalışman kafa karıştırıcı bir bakış kazandırabilir, çünkü aslında söylemek istediğin está rica'dır. Akılda tutmaya değer hile şu: ser kalıcı bir kimlik ya da özellik verir, estar geçici bir durum ya da hâl verir, ve bu bir avuç sıfat bu zıtlığı acı verecek kadar belirgin hâle getirir. Bu çetrefilli ikilileri aklında bir listede tut, çünkü bağlam ve seçtiğin fiil gerçekten tüm mesajı değiştiriyor. Bunlara hâkim olduğunda hem garip karışıklıklardan kaçınırsın hem de tam bu değişime dayanan şakaları ve kelime oyunlarını yakalamaya başlarsın.",
      fa:"دقیقاً وقتی فکر می‌کنی ser و estar را یاد گرفته‌ای، اسپانیایی یک غافلگیری برایت دارد: چند صفت هست که بسته به اینکه کدام فعل را انتخاب کنی، کاملاً معنایشان عوض می‌شود، و اگر اشتباه کنی نتیجه می‌تواند خیلی خنده‌دار باشد. ser listo یعنی 'باهوش'، در حالی که estar listo یعنی 'آماده' — پس اگر بخواهی بگویی estás listo ولی به‌جایش بگویی eres listo para el examen، جمله‌ی 'برای امتحان آماده‌ای' تبدیل می‌شود به 'برای امتحان زرنگی'، که عجیب به‌نظر می‌رسد. ser aburrido توصیف چیزی خسته‌کننده است، در حالی که estar aburrido یعنی کسی حوصله‌اش سر رفته — یک کلمه، دو حال‌وهوای کاملاً متفاوت. ser rico یعنی 'ثروتمند'، اما estar rico یعنی 'خوشمزه' — پس تعریف‌کردن از یک سوپ با es rica ممکن است یک نگاه گیج نصیبت کند، چون چیزی که واقعاً می‌خواهی بگویی está rica است. ترفندی که ارزش به‌خاطرسپردن دارد: ser یک هویت یا ویژگی ذاتی می‌دهد، estar یک حالت یا وضعیت موقت می‌دهد، و همین چند صفت این تقابل را دردناک‌آشکار می‌کند. یک فهرست ذهنی از این جفت‌های موذی نگه‌دار، چون بافت جمله و فعلی که انتخاب می‌کنی واقعاً کل پیام را عوض می‌کند. این‌ها را که مسلط شوی، نه‌تنها از سوءتفاهم‌های ناجور دور می‌مانی، بلکه شروع می‌کنی به فهمیدن جوک‌ها و بازی‌های کلامی که دقیقاً روی همین تفاوت سوار هستند.",
      es:"Justo cuando creías haber dominado ser y estar, el español te lanza una curva: un puñado de adjetivos cambian por completo de significado según el verbo que elijas, y el resultado puede ser bastante gracioso si te equivocas. Ser listo significa 'inteligente', mientras que estar listo significa 'preparado' — así que decir eres listo para el examen cuando querías decir estás listo convierte 'estás preparado para el examen' en 'eres un vivo para el examen', lo cual suena raro. Ser aburrido describe algo tedioso, mientras que estar aburrido significa que alguien se aburre — la misma palabra, dos sensaciones completamente distintas. Ser rico significa 'adinerado', pero estar rico significa 'delicioso' — así que elogiar una sopa con es rica puede ganarte una mirada confusa, porque lo que realmente quieres decir es está rica. El truco que vale la pena recordar: ser da una identidad o rasgo inherente, estar da un estado o condición temporal, y este puñado de adjetivos simplemente hace ese contraste dolorosamente evidente. Mantén una lista mental de estas parejas complicadas, porque el contexto y el verbo que elijas de verdad cambian todo el mensaje. Domina esto y no solo evitarás confusiones incómodas, también empezarás a pillar chistes y juegos de palabras que dependen exactamente de este cambio."},
 wrong:'Estoy muy listo, siempre saco buenas notas.', right:'Soy muy listo, siempre saco buenas notas.',
 blank:{sentence:'La película ___ tan aburrida que me dormí.', word:'era', distractors:['estaba','fue']},
 wrong2:'¿Ya eres lista para salir?', right2:'¿Ya estás lista para salir?',
 blank2:{sentence:'Esta sopa ___ riquísima, ¿qué le pusiste?', word:'está', distractors:['es','fue']}}
