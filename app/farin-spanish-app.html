<meta charset="UTF-8">
<title>Farin Spanish</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf1e2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farin Spanish">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf1e2; --bg-elevated:#fffaf2; --bg-sunken:#f6e3c6;
    --ink:#14332e; --ink-soft:#4d6b66; --ink-faint:#8aa19c;
    --border:#e5e1d8; --border-soft:#eeebe3;
    --accent:#ff7a59; --accent-ink:#ffffff; --accent-soft:#ffe7de; --accent-strong:#e85c3b;
    --cat-diag:#A99BEA; --cat-diag-soft:#ece5ff;
    --cat-gram:#FFA53D; --cat-gram-soft:#ffedd1;
    --cat-voc:#5FC9B8; --cat-voc-soft:#d6f5ef;
    --cat-lis:#FF8FB3; --cat-lis-soft:#ffe1ef;
    --cat-story:#7C93FF; --cat-story-soft:#e5eaff;
    --cat-review:#FFD166; --cat-review-soft:#fff3d2;
    --success:#2ecc71; --success-soft:#dff7e7;
    --error:#ff4444; --error-soft:#ffe1df;
    --shadow:0 1px 2px rgba(20,51,46,.08), 0 8px 24px -12px rgba(20,51,46,.22);
    --glow-badge:0 0 0 2px rgba(46,204,113,.55), 0 0 30px 4px rgba(46,204,113,.55);
    --radius:28px;
    --clay-orange:#FFA53D; --clay-orange-deep:#E8790A;
    --clay-coral:#FF6F5E; --clay-coral-deep:#E44736;
    --clay-lavender:#A99BEA; --clay-lavender-deep:#7C68D6;
    --clay-sage:#8FAE85; --clay-sage-deep:#5F8455;
    --clay-sky:#4FC3E8; --clay-sky-deep:#1F8FB0;
    --clay-shadow:inset 0 2px 3px rgba(255,255,255,.4), inset 0 -14px 22px -10px rgba(0,0,0,.2), 0 14px 30px -12px rgba(0,0,0,.32);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14201f; --bg-elevated:#1c2b28; --bg-sunken:#0e1715;
      --ink:#eef5f2; --ink-soft:#a9c2bd; --ink-faint:#77938d;
      --border:#2b433d; --border-soft:#203330;
      --accent:#ff8a6b; --accent-ink:#1a1210; --accent-soft:#3a281f; --accent-strong:#ffa382;
      --cat-diag:#a78bfa; --cat-diag-soft:#2e2350;
      --cat-gram:#ffb648; --cat-gram-soft:#3a2a10;
      --cat-voc:#2dd4bf; --cat-voc-soft:#0f3630;
      --cat-lis:#ff6bab; --cat-lis-soft:#3a1c2c;
      --cat-story:#7c93ff; --cat-story-soft:#232a4a;
      --cat-review:#ffd83d; --cat-review-soft:#3a3012;
      --success:#4ade80; --success-soft:#1c3a28;
      --error:#ff6b6b; --error-soft:#3d2420;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --glow-badge:0 0 0 2px rgba(74,222,128,.5), 0 0 30px 4px rgba(74,222,128,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14201f; --bg-elevated:#1c2b28; --bg-sunken:#0e1715;
    --ink:#eef5f2; --ink-soft:#a9c2bd; --ink-faint:#77938d;
    --border:#2b433d; --border-soft:#203330;
    --accent:#ff8a6b; --accent-ink:#1a1210; --accent-soft:#3a281f; --accent-strong:#ffa382;
    --cat-diag:#a78bfa; --cat-diag-soft:#2e2350;
    --cat-gram:#ffb648; --cat-gram-soft:#3a2a10;
    --cat-voc:#2dd4bf; --cat-voc-soft:#0f3630;
    --cat-lis:#ff6bab; --cat-lis-soft:#3a1c2c;
    --cat-story:#7c93ff; --cat-story-soft:#232a4a;
    --cat-review:#ffd83d; --cat-review-soft:#3a3012;
    --success:#4ade80; --success-soft:#1c3a28;
    --error:#ff6b6b; --error-soft:#3d2420;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#fdf1e2; --bg-elevated:#fffaf2; --bg-sunken:#f6e3c6;
    --ink:#14332e; --ink-soft:#4d6b66; --ink-faint:#8aa19c;
    --border:#e5e1d8; --border-soft:#eeebe3;
    --accent:#ff7a59; --accent-ink:#ffffff; --accent-soft:#ffe7de; --accent-strong:#e85c3b;
    --cat-diag:#A99BEA; --cat-diag-soft:#ece5ff;
    --cat-gram:#FFA53D; --cat-gram-soft:#ffedd1;
    --cat-voc:#5FC9B8; --cat-voc-soft:#d6f5ef;
    --cat-lis:#FF8FB3; --cat-lis-soft:#ffe1ef;
    --cat-story:#7C93FF; --cat-story-soft:#e5eaff;
    --cat-review:#FFD166; --cat-review-soft:#fff3d2;
    --success:#2ecc71; --success-soft:#dff7e7;
    --error:#ff4444; --error-soft:#ffe1df;
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:84px;}
  @media (min-width:481px){
    body{background:var(--bg-sunken);}
    #app{min-height:100dvh; box-shadow:var(--shadow); border-left:1px solid var(--border); border-right:1px solid var(--border);}
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  p{margin:0;}
  button{font:inherit; cursor:pointer;}
  input{font:inherit;}
  .visually-hidden{position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  .heart-wrap{position:relative; display:inline-flex; vertical-align:-3px;}
  .heart-pulse{display:inline-flex; animation:heart-beat 1.7s ease-in-out infinite;}
  @keyframes heart-beat{0%,100%{transform:scale(1);} 50%{transform:scale(1.18);}}
  .sparkle{position:absolute; width:7px; height:7px; background:currentColor; clip-path:polygon(50% 0%,61% 35%,100% 50%,61% 65%,50% 100%,39% 65%,0% 50%,39% 35%); opacity:0; animation:sparkle-twinkle 1.8s ease-in-out infinite;}
  .sparkle-1{top:-6px; right:-8px; animation-delay:0s;}
  .sparkle-2{bottom:-4px; left:-9px; width:5px; height:5px; animation-delay:.6s;}
  .sparkle-3{top:1px; right:13px; width:5px; height:5px; animation-delay:1.2s;}
  @keyframes sparkle-twinkle{0%,100%{opacity:0; transform:scale(0) rotate(0deg);} 50%{opacity:1; transform:scale(1) rotate(25deg);}}

  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint);}
  .display{font-family:'Fredoka',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-weight:700; letter-spacing:-.02em;}
  .num{font-variant-numeric:tabular-nums; font-family:'Plus Jakarta Sans',-apple-system,sans-serif; font-weight:800;}

  /* ---- topbar ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 8px; gap:10px;}
  .wordmark{font-weight:800; font-size:19px; letter-spacing:-.01em;}
  .wordmark span{color:var(--accent);}
  .streak-chip{display:flex; align-items:center; gap:5px; background:var(--bg-elevated); border:1px solid var(--border); padding:6px 10px 6px 8px; border-radius:999px; font-weight:700; font-size:13px;}
  .icon-btn{background:none; border:1px solid var(--border); width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:0 0 auto;}
  .icon-btn:hover{color:var(--ink); border-color:var(--ink-faint);}
  .lang-btn{background:var(--bg-elevated); border:1px solid var(--border); border-radius:999px; height:34px; padding:0 12px; font-weight:800; font-size:12px; letter-spacing:.03em; color:var(--ink-soft); flex:0 0 auto;}
  .lang-btn:hover{color:var(--ink); border-color:var(--ink-faint);}

  /* ---- generic layout ---- */
  .screen{padding:4px 20px 28px;}
  .stack{display:flex; flex-direction:column; gap:14px;}
  .row{display:flex; align-items:center; gap:10px;}
  .between{justify-content:space-between;}

  .card{background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .card-flat{background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px; box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 10px 22px -14px rgba(20,51,46,.22);}
  .badge-unlock-shine{position:relative; overflow:hidden; box-shadow:var(--glow-badge), var(--shadow); animation:badge-pulse 1.6s ease-in-out infinite;}
  .badge-unlock-shine::after{content:''; position:absolute; top:-60%; left:-60%; width:35%; height:220%; background:linear-gradient(120deg, transparent, rgba(255,255,255,.8), transparent); transform:rotate(22deg); animation:badge-shine-sweep 2.2s ease-in-out infinite; pointer-events:none;}
  @keyframes badge-pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.02);}}
  @keyframes badge-shine-sweep{0%{left:-60%;} 55%{left:130%;} 100%{left:130%;}}
  .card-name{background:radial-gradient(circle at 88% -14%, rgba(255,255,255,.6), transparent 55%), linear-gradient(135deg, var(--cat-diag-soft) 0%, var(--bg-elevated) 145%); border-color:var(--cat-diag-soft);}
  .greeting-banner{position:relative; display:flex; align-items:center; justify-content:center; text-align:center; background:var(--accent-soft); color:var(--accent-strong); border-radius:var(--radius); padding:15px 16px; font-weight:800; font-size:17px; margin-bottom:14px;}
  .greeting-banner .sparkle-1{top:6px; right:10%;}
  .greeting-banner .sparkle-2{bottom:8px; left:8%; width:5px; height:5px;}
  .greeting-banner .sparkle-3{top:40%; right:22%; width:5px; height:5px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; padding:13px 20px; font-weight:700; font-size:15px; border:1px solid transparent; width:100%; transition:transform .08s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
  .btn-whatsapp{background:#2e9e5b; color:#fff;}
  .btn-sm{padding:9px 14px; font-size:13px; width:auto;}
  .btn-block{width:100%;}
  .link-btn{background:none;border:none;color:var(--ink-soft); font-size:13px; font-weight:600; text-decoration:underline; padding:6px;}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.02em;}
  .badge-recommended{background:var(--accent-soft); color:var(--accent-strong);}
  .badge-done{background:var(--success-soft); color:var(--success);}

  .progress-track{height:7px; background:var(--bg-sunken); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease;}

  /* ---- diagnostic ---- */
  .diag-hero{padding:26px 20px 14px; text-align:center; position:relative;}
  .diag-hero .display{font-size:28px; line-height:1.15;}
  .compass-mark{width:56px;height:56px;border-radius:20px;background:var(--cat-diag-soft);color:var(--cat-diag);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .opt-list{display:flex; flex-direction:column; gap:10px;}
  .opt{display:flex; align-items:center; gap:12px; text-align:start; padding:15px 16px; border-radius:22px; border:1.5px solid var(--border); background:var(--bg-elevated); color:var(--ink); width:100%;}
  .opt:hover{border-color:var(--ink-faint);}
  .opt.selected{border-color:var(--accent); background:var(--accent-soft);}
  .opt .opt-ic{flex:0 0 auto; color:var(--ink-faint);}
  .opt.selected .opt-ic{color:var(--accent-strong);}
  .opt-main{font-weight:600; font-size:15px;}
  .opt-sub{font-size:12.5px; color:var(--ink-faint); margin-top:1px;}

  .q-progress{display:flex; gap:6px; padding:16px 20px 0;}
  .q-progress i{flex:1; height:4px; border-radius:2px; background:var(--border);}
  .q-progress i.done{background:var(--accent);}

  .name-input{width:100%; padding:15px 16px; border-radius:22px; border:1.5px solid var(--border); background:var(--bg-elevated); color:var(--ink); font-size:16px;}
  .name-input:focus{border-color:var(--accent);}
  .field-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; display:block;}
  .unlock-error{background:var(--error-soft); color:var(--error); border-radius:14px; padding:10px 13px; font-size:13px; font-weight:600;}
  .lead-box{width:100%; resize:none; border:1.5px dashed var(--border); border-radius:14px; background:var(--bg-sunken); color:var(--ink); font-family:inherit; font-size:13px; line-height:1.6; padding:12px 13px; -webkit-user-select:all; user-select:all;}
  .lead-box:focus{border-color:var(--accent); border-style:solid;}

  /* ---- tiles (bento, claymorphism) ---- */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .tile{position:relative; overflow:hidden; border-radius:32px; padding:18px; text-align:start; border:none; color:#fff; display:flex; flex-direction:column; justify-content:flex-end; gap:3px; min-height:152px; box-shadow:var(--clay-shadow); background-image:radial-gradient(circle at 14% 10%, rgba(255,255,255,.4), transparent 46%);}
  .tile::before{content:''; position:absolute; top:-35%; left:-25%; width:65%; height:190%; background:linear-gradient(120deg, rgba(255,255,255,.4), rgba(255,255,255,0) 65%); transform:rotate(-16deg); pointer-events:none;}
  .tile .sparkle{color:#fff;}

  /* ---- clay banner (Speaking Club / Story World hero, glassy + sparkly) ---- */
  .clay-banner{position:relative; overflow:hidden; border-radius:32px; padding:26px 20px 22px; color:#fff; box-shadow:var(--clay-shadow); background-image:radial-gradient(circle at 12% 8%, rgba(255,255,255,.4), transparent 46%); margin-bottom:16px;}
  .clay-banner::before{content:''; position:absolute; top:-35%; left:-25%; width:65%; height:190%; background:linear-gradient(120deg, rgba(255,255,255,.4), rgba(255,255,255,0) 65%); transform:rotate(-16deg); pointer-events:none;}
  .clay-banner .sparkle{color:#fff;}
  .clay-banner-illustration{width:104px; height:104px; object-fit:contain; display:block; margin:0 auto 12px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.18)); animation:tile-float 4.5s ease-in-out infinite;}
  .clay-banner-title{font-family:'Fredoka',-apple-system,sans-serif; font-weight:700; font-size:19px; text-align:center; color:#fff; letter-spacing:-.01em;}
  .clay-banner-sub{font-size:12.5px; color:rgba(255,255,255,.9); text-align:center; margin-top:6px; font-weight:600; line-height:1.4;}

  /* ---- profile character card (glassy, sparkly, colored) ---- */
  .character-card{position:relative; overflow:hidden; border:none; border-radius:32px; padding:20px 20px 24px; text-align:center; margin-top:10px; box-shadow:var(--clay-shadow); background-image:radial-gradient(circle at 14% 8%, rgba(255,255,255,.4), transparent 46%);}
  .character-card::before{content:''; position:absolute; top:-35%; left:-25%; width:65%; height:190%; background:linear-gradient(120deg, rgba(255,255,255,.4), rgba(255,255,255,0) 65%); transform:rotate(-16deg); pointer-events:none;}
  .character-card .sparkle{color:#fff;}
  .character-portrait{width:210px; height:210px; object-fit:contain; display:block; margin:0 auto 4px; filter:drop-shadow(0 12px 14px rgba(0,0,0,.2)); animation:tile-float 4.5s ease-in-out infinite; position:relative; z-index:1;}
  .tile-ic{width:36px;height:36px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .tile-illustration{position:absolute; top:6px; right:2px; width:72px; height:72px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.16));}
  .tile-illustration img, .tile-illustration svg{width:100%; height:100%; object-fit:contain; animation:tile-float 4.5s ease-in-out infinite;}
  .tile:nth-child(2) .tile-illustration img{animation-delay:.3s;}
  .tile:nth-child(3) .tile-illustration img{animation-delay:.6s;}
  .tile:nth-child(4) .tile-illustration img{animation-delay:.9s;}
  .tile:nth-child(5) .tile-illustration svg{animation-delay:1.2s;}
  @keyframes tile-float{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-5px) rotate(-2deg);}}
  .tile-title{font-weight:800; font-size:15px; color:#fff;}
  .tile-sub{font-size:11.5px; color:rgba(255,255,255,.88); font-weight:700;}

  /* ---- hero card (dashboard, bold color-block + progress ring) ---- */
  .hero-card{width:100%; text-align:start; border:none; border-radius:28px; padding:22px 20px; color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow); background-image:radial-gradient(circle at 88% -18%, rgba(255,255,255,.5), transparent 55%);}
  .hero-eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.78);}
  .hero-name{font-size:23px; margin-top:5px; color:#fff;}
  .hero-pill{background:rgba(255,255,255,.22); color:#fff;}
  .ring-wrap{position:relative; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800;}

  /* ---- stat chips (icon-badge stats, shared by dashboard + profile) ---- */
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .stat-box{display:flex; align-items:center; gap:8px; background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:22px; padding:9px 8px;}
  .stat-box-ic{flex:0 0 auto; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .stat-box-ic svg{width:15px; height:15px;}
  .stat-num{font-size:15px; font-weight:800; line-height:1.15;}
  .stat-lab{font-size:9.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin-top:1px;}

  /* ---- featured tile (roadmap hero card in the dashboard grid) ---- */
  .tile-featured{width:100%; text-align:start; border:none; border-radius:26px; padding:18px 18px 16px; color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow); background-image:radial-gradient(circle at 92% 0%, rgba(255,255,255,.35), transparent 60%);}
  .tile-featured-title{font-weight:800; font-size:16px; margin-top:4px; color:#fff;}
  .tile-featured-ic{flex:0 0 auto; width:38px; height:38px; border-radius:14px; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center;}
  .tile-featured-progress{display:flex; align-items:center; gap:10px; margin-top:16px;}
  .tile-featured-progress .progress-track{flex:1; background:rgba(255,255,255,.28);}
  .tile-featured-progress span{font-size:12px; font-weight:700; color:rgba(255,255,255,.92); flex:0 0 auto;}

  /* ---- badges ---- */
  .badge-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
  .badge-cell{border-radius:var(--radius); padding:14px 8px; text-align:center; border:1px solid var(--border-soft); background:var(--bg-elevated); display:flex; flex-direction:column; align-items:center; gap:7px; box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 10px 20px -14px rgba(20,51,46,.2);}
  .badge-cell.locked{opacity:.45; box-shadow:none;}
  .badge-cell .badge-ic{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 2px 3px rgba(255,255,255,.4), inset 0 -6px 10px -4px rgba(0,0,0,.18);}
  .badge-cell .badge-name{font-size:10.5px; font-weight:700; line-height:1.25;}

  /* ---- list rows ---- */
  .item-row{display:flex; align-items:center; gap:13px; padding:15px 16px; border-radius:22px; border:1px solid var(--border-soft); background:var(--bg-elevated); width:100%; text-align:start;}
  .item-row:hover{border-color:var(--ink-faint);}
  .item-ic{flex:0 0 auto; width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .item-body{flex:1; min-width:0;}
  .item-title{font-weight:700; font-size:14.5px;}
  .item-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .chevron{color:var(--ink-faint); flex:0 0 auto;}

  /* ---- roadmap rows (study link + separate done toggle) ---- */
  .roadmap-row{display:flex; align-items:stretch; border-radius:22px; border:1px solid var(--border-soft); background:var(--bg-elevated); overflow:hidden;}
  .roadmap-study{flex:1; display:flex; align-items:center; gap:13px; padding:15px 14px; text-align:start; min-width:0; background:none; border:none; color:inherit; text-decoration:none;}

function renderPracticeRecommendation(profile){
  const rec = PRACTICE_RECOMMENDATION[profile.priorityArea] || PRACTICE_RECOMMENDATION.grammar;
  return `<div class="card" style="margin-top:14px;">
    <div class="eyebrow">${L('Your game plan','Senin oyun planın','برنامه بازی تو','Tu plan de juego')}</div>
    <p style="font-size:13.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5;">${esc(L(rec.blurb.en,rec.blurb.tr,rec.blurb.fa,rec.blurb.es))}</p>
    <div class="stack" style="gap:8px; margin-top:14px;">
      ${PRACTICE_SECTIONS.map(sec=>{
        const emphasized = rec.emphasize.includes(sec.key);
        return `<button class="item-row" data-action="nav" data-view="${sec.view}">
          <span class="item-ic" style="background:var(--cat-${sec.cat}-soft); color:var(--cat-${sec.cat});">${ICONS[sec.icon]}</span>
          <div class="item-body">
            <div class="item-title">${esc(L(sec.label.en,sec.label.tr,sec.label.fa,sec.label.es))}</div>
          </div>
          ${emphasized ? `<span class="pill badge-recommended">${L('Start here','Buradan başla','از اینجا شروع کن','Empieza aquí')}</span>` : `<span class="chevron">${ICONS.chev}</span>`}
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

const GRAMMAR_ITEMS = [
{id:'g-A1-1', level:'A1', title:{en:'The verb SER (to be — identity)', tr:'"Ser" Fiili (olmak — kimlik)', fa:'فعل Ser (بودن — هویت)', es:'El verbo SER (identidad)'},
 exp:{en:'Think about the stuff that doesn\'t change when you have a bad day: your name, your job, where you\'re from. That\'s exactly what ser covers — the deep, stays-the-same-tomorrow kind of "to be." Use it for identity, profession, nationality, and what something is made of. The forms are soy, eres, es, somos, sois, son — short, punchy, and worth memorizing cold. A handy trick: many teachers group ser\'s uses under the acronym DOCTOR (Description, Occupation, Characteristic, Time, Origin, Relationship) — if your sentence fits one of those, reach for ser. So "Soy Ana, soy profesora, soy de México" strings together three separate ser facts about the same person, and none of them change by tomorrow morning. Nail this one and half of Spanish self-introductions are already in your pocket.',
      tr:'Kötü bir günün ortasında bile değişmeyen şeyleri düşün: adın, mesleğin, nereli olduğun. Ser fiilinin alanı tam olarak bu — yarın da aynı kalacak, köklü bir "olmak" hâli. Kimlik, meslek, uyruk ve bir şeyin neyden yapıldığını anlatırken kullanılır. Çekimleri şöyle: soy, eres, es, somos, sois, son — kısa, net ve ezbere bilinmesi gereken formlar. İşine yarayacak bir ipucu: birçok öğretmen ser fiilinin kullanım alanlarını DOCTOR kısaltmasıyla anlatır (Description-tanım, Occupation-meslek, Characteristic-özellik, Time-zaman, Origin-köken, Relationship-ilişki) — cümlen bunlardan birine uyuyorsa ser\'e yönel. Yani "Soy Ana, soy profesora, soy de México" cümlesi aynı kişi hakkında üç ayrı ser gerçeğini art arda sıralar ve hiçbiri yarın sabah değişmez. Bunu bir kez oturttun mu, İspanyolca kendini tanıtmanın yarısını cebine atmış olursun.',
      fa:'به چیزهایی فکر کن که حتی در بدترین روزت هم عوض نمی‌شن: اسمت، شغلت، اهل کجا بودنت. فعل ser دقیقاً همینا رو پوشش می‌ده — یه جور «بودن» ریشه‌ای که فردا هم همونه. برای هویت، شغل، ملیت و جنس چیزها ازش استفاده می‌کنیم. صرفش اینه: soy, eres, es, somos, sois, son — کوتاه، محکم و ارزشش رو داره که از حفظ بلدشون باشی. یه ترفند خوب: خیلی از معلم‌ها کاربردهای ser رو زیر مخفف DOCTOR جمع می‌کنن (توصیف، شغل، ویژگی، زمان، خاستگاه، رابطه) — اگه جمله‌ت تو یکی از این‌ها جا می‌شه، برو سراغ ser. پس «Soy Ana, soy profesora, soy de México» سه تا حقیقتِ ser رو پشت سر هم درباره‌ی یه نفر ردیف می‌کنه، و هیچ‌کدومشون فردا صبح عوض نمی‌شه. این یکی رو قرص کن، نصف معرفی‌کردن خودت به اسپانیایی رو از قبل حل کردی.',
      es:'Piensa en lo que no cambia ni en tu peor día: tu nombre, tu trabajo, de dónde eres. Eso es justo el territorio de ser — el "ser" profundo que sigue igual mañana. Se usa para identidad, profesión, nacionalidad y de qué está hecho algo. Las formas son soy, eres, es, somos, sois, son — cortas, directas y que vale la pena memorizar de memoria. Un truco útil: muchos profesores agrupan los usos de ser en el acrónimo DOCTOR (Descripción, Ocupación, Característica, Tiempo, Origen, Relación) — si tu frase encaja en una de esas, usa ser. Así, "Soy Ana, soy profesora, soy de México" encadena tres datos con ser sobre la misma persona, y ninguno cambia mañana por la mañana. Domina esto y ya tienes medio camino hecho para presentarte en español.'},
 wrong:'Yo estoy médico.', right:'Yo soy médico.',
 blank:{sentence:'Ella ___ profesora.', word:'es', distractors:['está','son']},
 wrong2:'Tú es estudiante.', right2:'Tú eres estudiante.',
 blank2:{sentence:'Nosotros ___ de Argentina.', word:'somos', distractors:['es','son']}},

{id:'g-A1-2', level:'A1', title:{en:'The verb ESTAR (to be — location & state)', tr:'"Estar" Fiili (olmak — yer ve durum)', fa:'فعل Estar (بودن — مکان و حالت)', es:'El verbo ESTAR (ubicación y estado)'},
 exp:{en:'Now for estar\'s turn — the verb for everything that could be different tomorrow. Feeling tired today? Coffee too hot right now? Standing in the kitchen this second? All estar. Use it for location (where something or someone is) and for temporary states or conditions — moods, feelings, physical conditions that come and go. The forms: estoy, estás, está, estamos, estáis, están. Here\'s the classic trap: learners often say "soy cansado" instead of "estoy cansado" for "I\'m tired" — but tiredness passes, so estar is the one you want. A quick way to keep ser and estar apart: if you could answer the question "for how long?", it\'s usually estar. Get comfortable with estoy, estás, está and you\'ll sound noticeably more natural talking about how you feel and where you are.',
      tr:'Şimdi sıra estar\'da — yarın değişebilecek her şeyin fiili. Bugün yorgun musun? Kahve şu an çok mu sıcak? Şu anda mutfakta mı duruyorsun? Hepsi estar. Yer (bir şeyin ya da birinin nerede olduğu) ve geçici durumlar için kullanılır — gelip geçen ruh hâlleri, duygular, fiziksel durumlar. Çekimleri: estoy, estás, está, estamos, estáis, están. Klasik tuzak şu: öğrenciler genelde "yorgunum" derken yanlışlıkla "soy cansado" der, oysa doğrusu "estoy cansado"dur — çünkü yorgunluk geçicidir, dolayısıyla estar gerekir. Ser ile estar\'ı ayırt etmenin hızlı bir yolu: cümlene "ne kadar süredir?" diye sorabiliyorsan, genelde estar\'a ihtiyacın var demektir. estoy, estás, está\'yı iyice oturt, nasıl hissettiğini ve nerede olduğunu anlatırken kulağa fark edilir derecede daha doğal geleceksin.',
      fa:'حالا نوبت estar می‌رسه — فعل هر چیزی که ممکنه فردا فرق کنه. امروز خسته‌ای؟ قهوه همین الان خیلی داغه؟ همین لحظه تو آشپزخونه‌ای؟ همه‌ی این‌ها estar. برای مکان (کجا بودن یه چیز یا یه نفر) و حالت‌ها یا شرایط موقتی استفاده می‌شه — حال‌وهوایی که میاد و می‌ره، احساسات، شرایط جسمی. صرفش: estoy, estás, está, estamos, estáis, están. یه تله‌ی کلاسیک اینه: خیلی از زبان‌آموزها به‌جای «estoy cansado» می‌گن «soy cansado» برای «خسته‌ام» — ولی خستگی موقتیه، پس estar همونیه که می‌خوای. یه راه سریع برای جدا کردن ser از estar: اگه بتونی به جمله‌ت جواب «چقدر طول می‌کشه؟» بدی، معمولاً estar لازمه. با estoy, estás, está راحت شو، اون‌وقت وقتی درباره‌ی حالت و مکانت حرف می‌زنی، به‌طرز محسوسی طبیعی‌تر به نظر می‌رسی.',
      es:'Ahora le toca a estar — el verbo para todo lo que podría ser distinto mañana. ¿Estás cansado hoy? ¿El café está demasiado caliente ahora mismo? ¿Estás en la cocina en este momento? Todo eso es estar. Se usa para la ubicación (dónde está algo o alguien) y para estados o condiciones temporales — ánimos, sentimientos, condiciones físicas que van y vienen. Las formas: estoy, estás, está, estamos, estáis, están. Aquí va la trampa clásica: mucha gente dice "soy cansado" en vez de "estoy cansado" — pero el cansancio pasa, así que necesitas estar. Un truco rápido para diferenciarlos: si puedes responder a "¿por cuánto tiempo?", casi siempre es estar. Domina estoy, estás, está y sonarás notablemente más natural hablando de cómo te sientes y dónde estás.'},
 wrong:'El café es caliente ahora mismo.', right:'El café está caliente ahora mismo.',
 blank:{sentence:'Los niños ___ en el parque.', word:'están', distractors:['son','es']},
 wrong2:'Yo soy en la cocina.', right2:'Yo estoy en la cocina.',
 blank2:{sentence:'¿Cómo ___ tú hoy?', word:'estás', distractors:['eres','es']}},

{id:'g-A1-3', level:'A1', title:{en:'Gender & articles (el/la, un/una)', tr:'Cinsiyet ve Tanımlıklar (el/la, un/una)', fa:'جنسیت و حروف تعریف (el/la، un/una)', es:'Género y artículos (el/la, un/una)'},
 exp:{en:'Here\'s a fact that trips up a lot of English speakers: in Spanish, even a table has a gender. Every noun is either masculine or feminine, and the article in front of it has to match — el/un for masculine, la/una for feminine. The good news is there\'s a shortcut: most nouns ending in -o are masculine (el libro) and most ending in -a are feminine (la mesa). The bad news is Spanish loves exceptions — la mano (the hand) and el día (the day) both break the pattern, so those are worth memorizing by heart rather than guessing. The easiest way to lock a noun\'s gender in your memory is to never learn it alone — always learn it with its article, so it\'s "la mano," not just "mano." Once you build that habit, gender stops feeling like a guessing game and starts feeling automatic.',
      tr:'İngilizce konuşanları sıkça şaşırtan bir gerçek var: İspanyolcada bir masanın bile cinsiyeti oluyor. Her isim ya eril ya da dişildir ve önündeki tanımlık buna uymak zorundadır — eril için el/un, dişil için la/una. İyi haber şu ki bir kestirme yol var: -o ile biten isimlerin çoğu erildir (el libro), -a ile bitenlerin çoğu dişildir (la mesa). Kötü haber ise İspanyolca istisnaları seviyor — la mano (el) ve el día (gün) bu kalıbı bozar, bu yüzden tahmin etmek yerine ezbere bilmekte fayda var. Bir ismin cinsiyetini akılda tutmanın en kolay yolu, onu asla tek başına öğrenmemek — her zaman tanımlığıyla birlikte öğren, yani sadece "mano" değil, "la mano" olarak. Bu alışkanlığı edindiğinde cinsiyet artık bir tahmin oyunu gibi değil, otomatik bir refleks gibi hissettirir.',
      fa:'یه واقعیت هست که خیلی از فارسی‌زبان‌ها و انگلیسی‌زبان‌ها رو غافلگیر می‌کنه: تو اسپانیایی حتی یه میز هم جنسیت داره. هر اسم یا مذکره یا مؤنث، و حرف تعریفی که جلوش میاد باید باهاش جور باشه — el/un برای مذکر، la/una برای مؤنث. خبر خوب اینه که یه میان‌بر هست: اغلب اسم‌هایی که به -o ختم می‌شن مذکرن (el libro) و اغلب اسم‌هایی که به -a ختم می‌شن مؤنثن (la mesa). خبر بد اینه که اسپانیایی عاشق استثناست — la mano (دست) و el día (روز) هر دو این الگو رو می‌شکنن، برای همین بهتره این‌ها رو حفظ کنی نه حدس بزنی. ساده‌ترین راه برای اینکه جنسیت یه اسم تو ذهنت بمونه اینه که هیچ‌وقت تنها یادش نگیری — همیشه با حرف تعریفش یاد بگیر، یعنی نه فقط «mano»، بلکه «la mano». وقتی این عادت رو بسازی، جنسیت دیگه شبیه بازی حدس‌زدن نیست و خودکار می‌شه.',
      es:'Aquí va un dato que sorprende a mucha gente: en español hasta una mesa tiene género. Todo sustantivo es masculino o femenino, y el artículo que lo acompaña debe coincidir — el/un para masculino, la/una para femenino. La buena noticia es que hay un atajo: la mayoría de los sustantivos terminados en -o son masculinos (el libro) y la mayoría de los terminados en -a son femeninos (la mesa). La mala noticia es que al español le encantan las excepciones — la mano y el día rompen ese patrón, así que conviene memorizarlos en vez de adivinar. La forma más fácil de fijar el género de un sustantivo en la memoria es no aprenderlo nunca solo — apréndelo siempre con su artículo, o sea "la mano" y no solo "mano". Una vez que adquieras ese hábito, el género deja de sentirse como un juego de adivinanzas y se vuelve automático.'},
 wrong:'La libro es interesante.', right:'El libro es interesante.',
 blank:{sentence:'___ mesa es nueva.', word:'La', distractors:['El','Los']},
 wrong2:'Quiero comprar una coche.', right2:'Quiero comprar un coche.',
 blank2:{sentence:'Necesito ___ paraguas porque llueve.', word:'un', distractors:['una','unos']}},

{id:'g-A1-4', level:'A1', title:{en:'Plural nouns & agreement', tr:'Çoğul İsimler ve Uyum', fa:'جمع اسم‌ها و مطابقت', es:'Sustantivos plurales y concordancia'},
 exp:{en:'Making things plural in Spanish is simple at first glance — until you remember that every word riding along with the noun has to jump on board too. The basic rule: add -s to nouns ending in a vowel and -es to nouns ending in a consonant. But here\'s the part beginners forget: articles and adjectives have to agree in number as well, so it\'s not enough to pluralize just the noun. Watch the whole phrase travel together: la casa grande becomes las casas grandes — article, noun, and adjective all pick up their plural markers at once. A useful way to think about it: Spanish nouns don\'t travel alone, they travel with an entourage, and the whole entourage has to match. Get this rhythm into your fingers and your sentences will suddenly sound a lot more polished.',
      tr:'İspanyolcada çoğul yapmak ilk bakışta basit görünür — ta ki isimle birlikte gelen her kelimenin de bu değişime uyması gerektiğini hatırlayana kadar. Temel kural: ünlü ile biten isimlere -s, ünsüz ile bitenlere -es eklenir. Ama yeni başlayanların unuttuğu kısım şu: tanımlıklar ve sıfatlar da sayı bakımından uyum sağlamalı, yani sadece ismi çoğullaştırmak yetmez. Tüm öbeğin birlikte nasıl değiştiğine bak: la casa grande, las casas grandes olur — tanımlık, isim ve sıfat aynı anda çoğul ekini alır. Şöyle düşünmek işine yarayabilir: İspanyolca isimler tek başına dolaşmaz, yanlarında bir maiyetle gezerler ve tüm maiyet uyum içinde olmalıdır. Bu ritmi parmaklarına yerleştir, cümlelerin birden çok daha derli toplu duyulmaya başlayacak.',
      fa:'جمع بستن تو اسپانیایی در نگاه اول ساده به نظر می‌رسه — تا وقتی یادت بیاد هر کلمه‌ای که همراه اسم میاد هم باید همین تغییر رو بکنه. قانون پایه: به اسم‌هایی که با حرف صدادار تموم می‌شن -s و به اونایی که با حرف بی‌صدا تموم می‌شن -es اضافه می‌کنیم. اما چیزی که تازه‌کارها یادشون می‌ره اینه: حروف تعریف و صفت‌ها هم باید از نظر تعداد مطابقت داشته باشن، یعنی فقط جمع بستن اسم کافی نیست. ببین چطور کل عبارت با هم حرکت می‌کنه: la casa grande می‌شه las casas grandes — حرف تعریف، اسم و صفت هر سه با هم علامت جمع می‌گیرن. یه راه خوب برای فکر کردن به این قضیه: اسم‌های اسپانیایی تنها سفر نمی‌کنن، با یه دسته همراه حرکت می‌کنن و کل اون دسته باید هماهنگ باشه. این ریتم رو تو دستت جا بنداز، جمله‌هات یهو خیلی مرتب‌تر به گوش می‌رسن.',
      es:'Hacer el plural en español parece sencillo a primera vista — hasta que recuerdas que cada palabra que acompaña al sustantivo también tiene que subirse al cambio. La regla básica: añade -s a los sustantivos terminados en vocal y -es a los terminados en consonante. Pero esto es lo que los principiantes olvidan: los artículos y adjetivos también deben concordar en número, así que no basta con pluralizar solo el sustantivo. Fíjate cómo viaja junta toda la frase: la casa grande se convierte en las casas grandes — artículo, sustantivo y adjetivo reciben la marca de plural a la vez. Una forma útil de verlo: los sustantivos en español no viajan solos, viajan con un séquito, y todo el séquito tiene que coincidir. Métete este ritmo en los dedos y tus frases sonarán de repente mucho más pulidas.'},
 wrong:'Los casa son grande.', right:'Las casas son grandes.',
 blank:{sentence:'Tengo dos ___ nuevos.', word:'libros', distractors:['libro','libras']},
 wrong2:'Las ciudad son bonitas.', right2:'Las ciudades son bonitas.',
 blank2:{sentence:'Hay tres ___ en la mesa.', word:'flores', distractors:['flor','floras']}},

{id:'g-A1-5', level:'A1', title:{en:'Regular -AR verbs (present tense)', tr:'Düzenli -AR Fiilleri (şimdiki zaman)', fa:'افعال باقاعده -AR (زمان حال)', es:'Verbos regulares -AR (presente)'},
 exp:{en:'Good news for anyone starting out: -ar verbs are the most common verb family in Spanish, and once you learn the pattern, you unlock hundreds of verbs at once. Take off the -ar ending and add: -o, -as, -a, -amos, -áis, -an. Watch it in action with hablar (to speak): hablo, hablas, habla, hablamos, habláis, hablan — six endings, one predictable rhythm. The most common slip-up is leaving the verb in its infinitive form inside a sentence, saying something like "yo hablar" instead of conjugating it to "yo hablo" — the infinitive is just the verb\'s dictionary form, it never stands in for a real subject. Here\'s the memory hook: notice that every ending except the "yo" form starts with an -a, almost echoing the -ar itself, so the pattern practically hums along with the verb family\'s name. Learn hablar cold and verbs like trabajar, estudiar, and caminar will basically conjugate themselves.',
      tr:'Yeni başlayanlar için iyi haber: -ar fiilleri İspanyolcadaki en yaygın fiil ailesidir ve kalıbı bir kez öğrendiğinde yüzlerce fiili birden çözmüş olursun. -ar ekini at, şunları ekle: -o, -as, -a, -amos, -áis, -an. hablar (konuşmak) ile uygulamada gör: hablo, hablas, habla, hablamos, habláis, hablan — altı ek, tek bir öngörülebilir ritim. En yaygın hata, fiili cümle içinde mastar hâlinde bırakmaktır; "yo hablar" demek yerine çekimleyip "yo hablo" demek gerekir — mastar sadece fiilin sözlükteki hâlidir, gerçek bir özneyle asla yer değiştiremez. İşte hatırlama ipucu: "yo" hâli dışındaki her ekin -a ile başladığına dikkat et, bu neredeyse -ar\'ın kendisiyle yankılanır, yani kalıp fiil ailesinin adıyla adeta uyum içinde mırıldanır. hablar\'ı iyice oturt, trabajar, estudiar ve caminar gibi fiiller kendiliğinden çekimlenmeye başlayacak.',
      fa:'خبر خوب برای تازه‌کارها: فعل‌های -ar پرکاربردترین خانواده‌ی فعل تو اسپانیایی هستن، و وقتی الگوشون رو یاد بگیری، صدها فعل رو یه‌جا باز می‌کنی. -ar رو حذف کن و این‌ها رو اضافه کن: -o, -as, -a, -amos, -áis, -an. با hablar (صحبت کردن) تو عمل ببینش: hablo, hablas, habla, hablamos, habláis, hablan — شش پسوند، یه ریتم قابل‌پیش‌بینی. رایج‌ترین اشتباه اینه که فعل رو تو جمله به همون شکل مصدری ول کنی، یعنی به‌جای صرف کردنش و گفتن «yo hablo»، بگی «yo hablar» — مصدر فقط شکل دیکشنری فعله و هیچ‌وقت جای فاعل واقعی رو نمی‌گیره. حالا یه ترفند حافظه: توجه کن که همه‌ی پسوندها به‌جز صورت «yo» با -a شروع می‌شن، تقریباً انگار خودِ -ar رو تکرار می‌کنن، پس الگو عملاً با اسم خانواده‌ی فعل هم‌آهنگه. hablar رو قرص یاد بگیر، اون‌وقت فعل‌هایی مثل trabajar، estudiar و caminar تقریباً خودشون صرف می‌شن.',
      es:'Buena noticia para quien empieza: los verbos -ar son la familia de verbos más común en español, y una vez que aprendes el patrón, desbloqueas cientos de verbos de golpe. Quita la terminación -ar y añade: -o, -as, -a, -amos, -áis, -an. Míralo en acción con hablar: hablo, hablas, habla, hablamos, habláis, hablan — seis terminaciones, un ritmo predecible. El error más común es dejar el verbo en infinitivo dentro de una frase, decir algo como "yo hablar" en vez de conjugarlo como "yo hablo" — el infinitivo es solo la forma de diccionario del verbo, nunca sustituye a un sujeto real. Aquí va el truco para recordarlo: fíjate en que todas las terminaciones menos la de "yo" empiezan con -a, casi haciendo eco al propio -ar, así que el patrón prácticamente tararea junto con el nombre de la familia de verbos. Aprende bien hablar y verbos como trabajar, estudiar y caminar prácticamente se conjugarán solos.'},
 wrong:'Ella hablar español muy bien.', right:'Ella habla español muy bien.',
 blank:{sentence:'Nosotros ___ mucho por teléfono.', word:'hablamos', distractors:['hablan','hablas']},
 wrong2:'Tú trabaja los sábados.', right2:'Tú trabajas los sábados.',
 blank2:{sentence:'Ellos ___ en una oficina.', word:'trabajan', distractors:['trabaja','trabajamos']}},

{id:'g-A1-6', level:'A1', title:{en:'Regular -ER/-IR verbs (present tense)', tr:'Düzenli -ER/-IR Fiilleri (şimdiki zaman)', fa:'افعال باقاعده -ER/-IR (زمان حال)', es:'Verbos regulares -ER/-IR (presente)'},
 exp:{en:'After -ar verbs, -er and -ir verbs are the next two families you need — and the good news is they\'re basically cousins, sharing almost identical endings. Comer (to eat): como, comes, come, comemos, coméis, comen. Vivir (to live): vivo, vives, vive, vivimos, vivís, viven. Compare them closely and you\'ll notice only two forms actually differ — comemos/vivimos and coméis/vivís — everywhere else the endings match exactly. The mistake learners make most is assuming -ir verbs behave completely differently from -er verbs, when really only the "nosotros" and "vosotros" spots change, so there\'s far less to memorize than it looks. A simple memory hook: if -er and -ir were siblings, they\'d only argue about "we" and "you all" — everything else they agree on. Master comer and vivir together and you\'ve quietly picked up the pattern for verbs like leer, escribir, and abrir too.',
      tr:'-ar fiillerinden sonra ihtiyacın olan iki aile daha var: -er ve -ir fiilleri — iyi haber şu ki bunlar neredeyse kuzen sayılır, ekleri birbirine çok benzer. Comer (yemek yemek): como, comes, come, comemos, coméis, comen. Vivir (yaşamak): vivo, vives, vive, vivimos, vivís, viven. İkisini yan yana koyup dikkatlice bak, sadece iki hâlin gerçekten farklı olduğunu fark edeceksin — comemos/vivimos ve coméis/vivís — geri kalan her yerde ekler birebir aynı. Öğrencilerin en sık yaptığı hata, -ir fiillerinin -er fiillerinden tamamen farklı davrandığını sanmaktır; oysa sadece "biz" ve "sizler" kısmı değişir, yani göründüğünden çok daha az ezber gerekir. Basit bir hatırlama ipucu: -er ve -ir kardeş olsaydı, sadece "biz" ve "sizler" konusunda tartışırlardı — geri kalan her şeyde anlaşırlardı. comer ve vivir\'i birlikte iyice öğren, leer, escribir ve abrir gibi fiillerin kalıbını da sessizce cebine atmış olursun.',
      fa:'بعد از فعل‌های -ar، دو خانواده‌ی دیگه لازمت می‌شه: فعل‌های -er و -ir — خبر خوب اینه که تقریباً پسرعمو-دخترعمو حساب می‌شن، پسوندهاشون تقریباً یکسانه. Comer (خوردن): como, comes, come, comemos, coméis, comen. Vivir (زندگی کردن): vivo, vives, vive, vivimos, vivís, viven. اگه دقیق کنارشون بذاری، می‌بینی فقط دو صورت واقعاً فرق دارن — comemos/vivimos و coméis/vivís — بقیه‌ی جاها پسوندها دقیقاً یکی‌ان. رایج‌ترین اشتباه زبان‌آموزها اینه که فکر می‌کنن فعل‌های -ir کاملاً متفاوت از -er رفتار می‌کنن، در حالی که فقط بخش «ما» و «شما (جمع)» عوض می‌شه، پس خیلی کمتر از چیزی که به نظر می‌رسه باید حفظ کنی. یه ترفند حافظه‌ی ساده: اگه -er و -ir خواهر و برادر بودن، فقط سر «ما» و «شما» بحث می‌کردن — تو بقیه‌ی چیزها توافق داشتن. comer و vivir رو با هم قرص کن، اون‌وقت بی‌سروصدا الگوی فعل‌هایی مثل leer، escribir و abrir رو هم یاد گرفتی.',
      es:'Después de los verbos -ar, las dos familias que necesitas son -er e -ir — y la buena noticia es que son casi primos, comparten terminaciones casi idénticas. Comer: como, comes, come, comemos, coméis, comen. Vivir: vivo, vives, vive, vivimos, vivís, viven. Compáralos de cerca y notarás que solo dos formas son realmente distintas — comemos/vivimos y coméis/vivís — en todo lo demás las terminaciones coinciden exactamente. El error más común es asumir que los verbos -ir se comportan de forma totalmente distinta a los -er, cuando en realidad solo cambian los lugares de "nosotros" y "vosotros", así que hay mucho menos que memorizar de lo que parece. Un truco sencillo: si -er e -ir fueran hermanos, solo discutirían por "nosotros" y "vosotros" — en todo lo demás estarían de acuerdo. Domina comer y vivir juntos y sin darte cuenta ya tienes el patrón de verbos como leer, escribir y abrir.'},
 wrong:'Yo come pizza los viernes.', right:'Yo como pizza los viernes.',
 blank:{sentence:'¿Dónde ___ tú?', word:'vives', distractors:['vive','vivo']},
 wrong2:'Nosotros vive en Madrid.', right2:'Nosotros vivimos en Madrid.',
 blank2:{sentence:'Ellos ___ frutas todos los días.', word:'comen', distractors:['come','comemos']}},

{id:'g-A1-7', level:'A1', title:{en:'The verb TENER (to have) & expressions', tr:'"Tener" Fiili (sahip olmak) ve Kalıplar', fa:'فعل Tener (داشتن) و عبارات آن', es:'El verbo TENER y sus expresiones'},
 exp:{en:'Tener literally means "to have," but its real superpower shows up in a handful of expressions where Spanish reaches for "have" and English reaches for "be." The verb conjugates as tengo, tienes, tiene, tenemos, tenéis, tienen. Where things get fun is the idioms built on it: tener hambre (to be hungry, literally "to have hunger"), tener sed (to be thirsty), tener sueño (to be sleepy), and tener + a number (to be that many years old). The trap almost every beginner falls into is translating word for word and saying something like "soy veinte años" for "I\'m twenty" — but age in Spanish is a thing you have, not a thing you are, so it has to be tengo veinte años. A good way to remember which feelings use tener: think of them as things your body is "carrying" — you\'re literally holding hunger, thirst, or sleepiness like a bag, so tener fits. Once tengo hambre and tengo sueño feel natural on your tongue, you\'ll reach for tener automatically instead of translating in your head.',
      tr:'Tener kelime anlamıyla "sahip olmak" demek, ama gerçek gücünü İspanyolcanın "have" dediği, Türkçenin ise "olmak" dediği bir avuç kalıpta gösterir. Fiil şöyle çekimlenir: tengo, tienes, tiene, tenemos, tenéis, tienen. İşin eğlenceli kısmı, üzerine kurulu deyimler: tener hambre (aç olmak, kelimesi kelimesine "açlığa sahip olmak"), tener sed (susamış olmak), tener sueño (uykulu olmak) ve tener + sayı (o kadar yaşında olmak). Neredeyse her yeni başlayanın düştüğü tuzak, kelimesi kelimesine çevirip "yirmi yaşındayım" için "soy veinte años" demektir — oysa İspanyolcada yaş, olunan değil, sahip olunan bir şeydir, dolayısıyla doğrusu tengo veinte años\'tır. Hangi duyguların tener aldığını hatırlamanın iyi bir yolu: onları vücudunun "taşıdığı" şeyler gibi düşün — açlığı, susuzluğu ya da uykuyu adeta bir çanta gibi taşıyorsun, bu yüzden tener yerine oturuyor. tengo hambre ve tengo sueño dilinde doğal hissettirmeye başladığında, kafanda çeviri yapmak yerine otomatik olarak tener\'e yöneleceksin.',
      fa:'Tener از نظر لغوی یعنی «داشتن»، ولی قدرت واقعیش تو یه مشت اصطلاح خودشو نشون می‌ده که اسپانیایی سراغ «داشتن» می‌ره ولی فارسی سراغ «بودن». صرف فعل اینه: tengo, tienes, tiene, tenemos, tenéis, tienen. جای جالب قضیه اصطلاح‌هایی‌ان که روش ساخته شدن: tener hambre (گرسنه بودن، تحت‌اللفظی «گرسنگی داشتن»)، tener sed (تشنه بودن)، tener sueño (خواب‌آلود بودن) و tener + عدد (فلان‌قدر سال داشتن). تله‌ای که تقریباً هر تازه‌کاری توش می‌افته اینه که کلمه‌به‌کلمه ترجمه می‌کنه و برای «بیست سالمه» می‌گه «soy veinte años» — ولی تو اسپانیایی سن چیزیه که داری، نه چیزی که هستی، پس باید بگی tengo veinte años. یه راه خوب برای یادآوری اینکه کدوم احساسات با tener میان: فکر کن این‌ها چیزهایی‌ان که بدنت داره «حمل» می‌کنه — انگار گرسنگی، تشنگی یا خواب‌آلودگی رو مثل یه کیف با خودت داری، برای همین tener جفت‌وجورش می‌کنه. وقتی tengo hambre و tengo sueño رو زبونت راحت گفت، دیگه به‌جای ترجمه کردن تو ذهنت، خودکار سراغ tener می‌ری.',
      es:'Tener significa literalmente "poseer", pero su verdadero superpoder aparece en un puñado de expresiones donde el español recurre a "tener" y otros idiomas recurren a "ser" o "estar". El verbo se conjuga así: tengo, tienes, tiene, tenemos, tenéis, tienen. Lo divertido son los modismos construidos sobre él: tener hambre, tener sed, tener sueño, y tener + un número (tener __ años). La trampa en la que casi todo principiante cae es traducir palabra por palabra y decir "soy veinte años" — pero en español la edad es algo que tienes, no algo que eres, así que debe ser tengo veinte años. Una buena forma de recordar qué sensaciones usan tener: piensa en ellas como cosas que tu cuerpo "carga" — literalmente llevas el hambre, la sed o el sueño como si fueran una bolsa, así que tener encaja perfecto. Cuando tengo hambre y tengo sueño te salgan naturales, recurrirás a tener automáticamente en lugar de traducir en tu cabeza.'},
 wrong:'Yo soy veinte años.', right:'Yo tengo veinte años.',
 blank:{sentence:'Ella ___ mucha hambre.', word:'tiene', distractors:['tienes','tengo']},
 wrong2:'Nosotros somos mucho sueño.', right2:'Nosotros tenemos mucho sueño.',
 blank2:{sentence:'¿Cuántos años ___ tú?', word:'tienes', distractors:['tiene','tengo']}},

{id:'g-A1-8', level:'A1', title:{en:'GUSTAR (to like)', tr:'"Gustar" Fiili (hoşlanmak)', fa:'فعل Gustar (دوست داشتن)', es:'GUSTAR (gustar)'},
 exp:{en:'Gustar is the verb that breaks English speakers\' brains a little at first, because it doesn\'t work like "to like" at all — it works backwards. Instead of "I like coffee," Spanish literally says something closer to "coffee is pleasing to me": the thing you like becomes the subject of the sentence, and you show up as an indirect object with me/te/le/nos/os/les. Because the thing liked is the subject, the verb has to agree with it — use gusta if one thing is liked and gustan if there are several: me gusta el café (singular, one coffee-loving fact) but me gustan los perros (plural, because perros is plural). The classic beginner mistake is treating gustar like a normal "I like" verb and saying "yo gusto el café" — but that would actually mean something closer to "I am pleasing to coffee," which is not the compliment you\'re going for. A useful mental flip: instead of "I like it," think "it pleases me," and the word order suddenly makes sense. Once that backwards logic clicks, gustar stops being a grammar headache and turns into one of the most natural-feeling verbs in the language.',
      tr:'Gustar, İngilizce ve Türkçe konuşanların kafasını ilk başta biraz karıştıran bir fiildir, çünkü "hoşlanmak" gibi çalışmaz — tam tersine işler. İspanyolca "kahveyi seviyorum" demek yerine, kelimesi kelimesine "kahve bana hoş geliyor" gibi bir şey der: sevdiğin şey cümlenin öznesi olur, sen ise me/te/le/nos/os/les ile dolaylı tümleç olarak ortaya çıkarsın. Sevilen şey özne olduğu için fiil de ona uymalıdır — tek bir şey seviliyorsa gusta, birden fazla ise gustan kullanılır: me gusta el café (tekil, tek bir kahve sevgisi gerçeği) ama me gustan los perros (çoğul, çünkü perros çoğuldur). Yeni başlayanların klasik hatası, gustar\'ı sıradan bir "seviyorum" fiili gibi ele alıp "yo gusto el café" demektir — ama bu aslında "kahveye hoş görünüyorum" gibi bir anlama gelir ki yapmak istediğin iltifat bu değildir. İşe yarayacak bir zihinsel çevirme: "onu seviyorum" yerine "o bana hoş geliyor" diye düşün, kelime sırası birden anlam kazanır. Bu tersine mantık oturduğunda, gustar bir dilbilgisi baş belası olmaktan çıkıp dildeki en doğal hissettiren fiillerden birine dönüşür.',
      fa:'Gustar فعلیه که اولش کمی ذهن زبان‌آموز رو به‌هم می‌ریزه، چون اصلاً مثل «دوست داشتن» عمل نمی‌کنه — برعکس کار می‌کنه. به‌جای «من قهوه رو دوست دارم»، اسپانیایی تحت‌اللفظی چیزی نزدیک به «قهوه برام خوشایند است» می‌گه: چیزی که دوستش داری فاعل جمله می‌شه، و خودت به شکل مفعول غیرمستقیم با me/te/le/nos/os/les ظاهر می‌شی. چون چیزِ موردعلاقه فاعله، فعل باید باهاش مطابقت کنه — اگه یه چیز دوست داشته بشه gusta و اگه چند تا باشه gustan به کار می‌ره: me gusta el café (مفرد، یه حقیقتِ عاشقِ‌قهوه‌بودن) ولی me gustan los perros (جمع، چون perros جمعه). اشتباه کلاسیک تازه‌کارها اینه که با gustar مثل یه فعل معمولیِ «دوست دارم» رفتار می‌کنن و می‌گن «yo gusto el café» — ولی این در واقع چیزی نزدیک به «من برای قهوه خوشایندم» معنی می‌ده که اصلاً همون تعریفی نیست که می‌خواستی بکنی. یه چرخش ذهنی مفید: به‌جای «من دوستش دارم»، فکر کن «اون برام خوشایند است»، اون‌وقت ترتیب کلمه‌ها یهو معنی پیدا می‌کنه. وقتی این منطق برعکس جا بیفته، gustar دیگه دردسر گرامری نیست و می‌شه یکی از طبیعی‌ترین فعل‌های این زبون.',
      es:'Gustar es el verbo que al principio revuelve un poco la cabeza de los hablantes de otros idiomas, porque no funciona nada como "querer" — funciona al revés. En vez de pensar "yo quiero el café", el español literalmente dice algo más parecido a "el café me resulta agradable": lo que te gusta se convierte en el sujeto de la oración, y tú apareces como objeto indirecto con me/te/le/nos/os/les. Como lo que gusta es el sujeto, el verbo debe concordar con ello — se usa gusta si es una sola cosa y gustan si son varias: me gusta el café (singular, un solo hecho) pero me gustan los perros (plural, porque perros es plural). El error clásico de principiante es tratar gustar como un verbo normal y decir "yo gusto el café" — pero eso significaría algo más cercano a "yo le resulto agradable al café", que no es precisamente el cumplido que buscabas. Un giro mental útil: en vez de "yo lo quiero", piensa "eso me agrada a mí", y el orden de las palabras de repente cobra sentido. Cuando esa lógica al revés hace clic, gustar deja de ser un dolor de cabeza gramatical y se convierte en uno de los verbos que más natural se siente en el idioma.'},
 wrong:'Yo gusto el café.', right:'Me gusta el café.',
 blank:{sentence:'A ella ___ los perros.', word:'le gustan', distractors:['le gusta','gusta']},
 wrong2:'Nosotros gustamos la música.', right2:'Nos gusta la música.',
 blank2:{sentence:'¿Te ___ las películas de terror?', word:'gustan', distractors:['gusta','gustas']}},

{id:'g-A1-9', level:'A1', title:{en:'Question words', tr:'Soru Kelimeleri', fa:'کلمات پرسشی', es:'Palabras interrogativas'},
 exp:{en:'Curious about someone\'s name, their plans, or the price of that jacket in the window? Spanish hands you a compact toolkit for exactly that: qué (what), quién (who), dónde (where), cuándo (when), cómo (how), cuánto (how much/many), and por qué (why) — learn these seven and you can start a conversation about almost anything. Every one of them carries an accent mark when used as a question word, which is a small but real detail worth getting right. Two things make Spanish questions look different on the page: they open with an upside-down question mark (¿) before the sentence even starts, working like a heads-up that a question is coming, and they often flip the usual subject-verb order, so "tú vives" becomes "¿dónde vives tú?" rather than staying in statement order. A common slip is forgetting that opening ¿ altogether, or leaving the word order untouched like a plain English question — but Spanish speakers rely on that upside-down mark to know a question is coming from the very first word. Get comfortable flipping the order and dropping that ¿ in front, and asking questions in Spanish will start to feel like second nature instead of a translation exercise.',
      tr:'Birinin adını, planlarını ya da vitrindeki o ceketin fiyatını mı merak ediyorsun? İspanyolca tam da bunun için kompakt bir araç seti sunar: qué (ne), quién (kim), dónde (nerede), cuándo (ne zaman), cómo (nasıl), cuánto (ne kadar) ve por qué (neden) — bu yedisini öğren, hemen hemen her konuda sohbete başlayabilirsin. Soru kelimesi olarak kullanıldıklarında hepsi vurgu işareti taşır, küçük ama doğru yapılması gereken gerçek bir ayrıntı bu. İspanyolca sorularını sayfada farklı gösteren iki şey var: cümle daha başlamadan önüne ters bir soru işareti (¿) konur, sanki bir sorunun geleceğini haber verir gibi, ve genellikle olağan özne-fiil sırası tersine döner, yani "tú vives" ifadesi düz cümle sırasında kalmak yerine "¿dónde vives tú?" olur. Yaygın bir hata, o baştaki ¿\'yi tamamen unutmak ya da kelime sırasını düz bir cümle gibi olduğu gibi bırakmaktır — oysa İspanyolca konuşanlar bir sorunun geldiğini daha ilk kelimeden anlamak için o ters işarete güvenir. Sırayı tersine çevirmeyi ve baştaki ¿\'yi koymayı iyice oturt, İspanyolcada soru sormak bir çeviri egzersizi olmaktan çıkıp ikinci doğan gibi hissettirmeye başlayacak.',
      fa:'کنجکاوی اسم یه نفر رو، برنامه‌هاشو، یا قیمت اون ژاکت تو ویترین رو بدونی؟ اسپانیایی دقیقاً برای همین یه جعبه‌ابزار جمع‌وجور می‌ده: qué (چه)، quién (چه کسی)، dónde (کجا)، cuándo (چه زمانی)، cómo (چگونه)، cuánto (چقدر) و por qué (چرا) — این هفت‌تا رو یاد بگیر، می‌تونی درباره‌ی تقریباً هر چیزی مکالمه رو شروع کنی. وقتی به‌عنوان کلمه‌ی پرسشی استفاده می‌شن، همه‌شون علامت تکیه (accent) دارن، یه جزئیات کوچیک ولی واقعی که ارزش درست انجام دادن داره. دو چیز جمله‌های پرسشی اسپانیایی رو رو کاغذ متفاوت نشون می‌ده: قبل از شروع جمله یه علامت سؤال وارونه (¿) میاد، انگار داره از قبل خبر می‌ده که یه سؤال در راهه، و اغلب ترتیب معمولِ فاعل-فعل برعکس می‌شه، یعنی «tú vives» به‌جای اینکه به شکل جمله‌ی خبری بمونه، می‌شه «¿dónde vives tú؟». یه اشتباه رایج اینه که اون ¿ اول رو کلاً یادت بره یا ترتیب کلمات رو مثل یه سؤال ساده‌ی فارسی دست‌نخورده بذاری — ولی اسپانیایی‌زبان‌ها به اون علامت وارونه تکیه می‌کنن تا از همون کلمه‌ی اول بفهمن یه سؤال داره میاد. ترتیب رو برعکس کردن و اون ¿ رو جلو گذاشتن رو قرص کن، اون‌وقت سؤال پرسیدن به اسپانیایی به‌جای یه تمرین ترجمه، حس یه چیز طبیعی و بی‌فکر رو می‌ده.',
      es:'¿Tienes curiosidad por el nombre de alguien, sus planes o el precio de esa chaqueta en el escaparate? El español te da un kit compacto justo para eso: qué, quién, dónde, cuándo, cómo, cuánto y por qué — aprende estas siete y puedes empezar una conversación sobre casi cualquier cosa. Todas llevan tilde cuando se usan como palabra interrogativa, un detalle pequeño pero real que vale la pena hacer bien. Dos cosas hacen que las preguntas en español se vean distintas en la página: empiezan con un signo de interrogación invertido (¿) antes incluso de que arranque la frase, como un aviso de que viene una pregunta, y muchas veces invierten el orden habitual de sujeto y verbo, así que "tú vives" se convierte en "¿dónde vives tú?" en vez de quedarse en orden de enunciado. Un desliz común es olvidarse por completo de ese ¿ inicial o dejar el orden de palabras intacto como en una pregunta directa — pero los hispanohablantes confían en ese signo invertido para saber desde la primera palabra que viene una pregunta. Domina invertir el orden y poner ese ¿ al frente, y preguntar en español empezará a sentirse natural en lugar de un ejercicio de traducción.'},
 wrong:'Tú vives dónde?', right:'¿Dónde vives tú?',
 blank:{sentence:'¿___ te llamas?', word:'Cómo', distractors:['Qué','Dónde']},
 wrong2:'Él vive dónde ahora?', right2:'¿Dónde vive él ahora?',
 blank2:{sentence:'¿___ cuesta el billete?', word:'Cuánto', distractors:['Cuándo','Cómo']}},

{id:'g-A1-10', level:'A1', title:{en:'Negation & possessive adjectives', tr:'Olumsuzluk ve İyelik Sıfatları', fa:'منفی‌سازی و صفات ملکی', es:'Negación y adjetivos posesivos'},
 exp:{en:'Two small but mighty tools in this lesson: how to say "not" and how to say "my," "your," "his/her." Negation in Spanish couldn\'t be simpler — just drop "no" right before the verb and the whole sentence flips meaning: yo no hablo francés. No extra helper verb needed, unlike English\'s "do not." Possessive adjectives work a little differently than you might expect: mi, tu, su, and nuestro go before the noun, and they have to agree in number with the thing owned, not with the owner — so it\'s mi libro but mis libros, even though "I" haven\'t multiplied, only my books have. The mistake that trips people up most is matching the possessive to themselves instead of to the noun, saying "mis casa" when there\'s only one house, or forgetting the -s entirely when there are several things. A simple way to remember it: the possessive always looks at what comes right after it, never back at the owner — so let the noun decide singular or plural, and the possessive will follow along automatically. Master this pair together and you can now say what\'s not true and what\'s yours in the same breath.',
      tr:'Bu derste iki küçük ama güçlü araç var: "değil" nasıl denir ve "benim," "senin," "onun" nasıl söylenir. İspanyolcada olumsuzluk yapmak son derece basittir — sadece fiilin hemen önüne "no" koy, cümlenin anlamı tamamen tersine döner: yo no hablo francés. İngilizcedeki "do not" gibi ekstra bir yardımcı fiile gerek yok. İyelik sıfatları beklediğinden biraz farklı çalışır: mi, tu, su ve nuestro isimden önce gelir ve sayı bakımından sahibiyle değil, sahip olunan şeyle uyumlu olmalıdır — yani mi libro ama mis libros, "ben" çoğalmadım, sadece kitaplarım çoğaldı. İnsanları en çok şaşırtan hata, iyelik sıfatını kendilerine göre değil, isme göre uyumlu yapmayı unutmak, tek bir ev varken "mis casa" demek ya da birden fazla şey varken -s\'i tamamen atlamaktır. Hatırlaması kolay bir yol: iyelik sıfatı her zaman hemen sonrasına bakar, asla geriye, sahibine dönüp bakmaz — bırak tekil ya da çoğul olduğuna isim karar versin, iyelik sıfatı otomatik olarak onu izleyecektir. Bu ikiliyi birlikte oturt, artık tek nefeste hem neyin doğru olmadığını hem de neyin sana ait olduğunu söyleyebilirsin.',
      fa:'تو این درس دو تا ابزار کوچیک ولی قدرتمند داریم: چطور بگیم «نه/نیست» و چطور بگیم «مالِ من»، «مالِ تو»، «مالِ او». منفی کردن تو اسپانیایی از این ساده‌تر نمی‌شه — فقط «no» رو درست قبل از فعل بذار و کل جمله معنیش برعکس می‌شه: yo no hablo francés. برخلاف بعضی زبون‌ها، هیچ فعل کمکی اضافه‌ای لازم نیست. صفت‌های ملکی یه‌کم متفاوت از چیزی که فکرشو می‌کنی کار می‌کنن: mi، tu، su و nuestro قبل از اسم میان، و باید از نظر تعداد با چیزی که مال کسیه مطابقت داشته باشن، نه با خودِ مالک — پس می‌شه mi libro ولی mis libros، درحالی‌که «من» چند نفر نشدم، فقط کتاب‌هام زیاد شدن. اشتباهی که بیشتر از همه گیر مردم میفته اینه که صفت ملکی رو با خودشون مطابقت می‌دن نه با اسم، مثلاً وقتی فقط یه خونه هست می‌گن «mis casa»، یا وقتی چند تا چیز هست -s رو کلاً یادشون می‌ره. یه راه ساده برای به‌خاطر سپردنش: صفت ملکی همیشه به چیزی که درست بعدش میاد نگاه می‌کنه، نه به مالک برمی‌گرده عقب — پس بذار اسم تصمیم بگیره مفرده یا جمع، صفت ملکی خودش خودکار همراهیش می‌کنه. این دوتا رو با هم قرص کن، اون‌وقت می‌تونی تو یه نفس هم بگی چی درست نیست هم بگی چی مالِ توئه.',
      es:'Dos herramientas pequeñas pero poderosas en esta lección: cómo decir "no" y cómo decir "mi," "tu," "su." La negación en español no podría ser más sencilla — basta con poner "no" justo antes del verbo y toda la frase cambia de sentido: yo no hablo francés. No hace falta ningún verbo auxiliar extra, a diferencia del "do not" del inglés. Los adjetivos posesivos funcionan un poco distinto de lo que esperarías: mi, tu, su y nuestro van antes del sustantivo, y deben concordar en número con lo que se posee, no con quien posee — así que es mi libro pero mis libros, aunque "yo" no me haya multiplicado, solo mis libros. El error que más tropieza a la gente es hacer que el posesivo concuerde consigo mismos en vez de con el sustantivo, diciendo "mis casa" cuando hay una sola casa, u olvidando la -s por completo cuando hay varias cosas. Una forma sencilla de recordarlo: el posesivo siempre mira a lo que viene justo después, nunca hacia atrás, hacia el dueño — deja que el sustantivo decida si es singular o plural, y el posesivo lo seguirá automáticamente. Domina este par juntos y ahora puedes decir en el mismo aliento qué no es cierto y qué es tuyo.'},
 wrong:'No yo hablo francés.', right:'Yo no hablo francés.',
 blank:{sentence:'Esta es ___ casa.', word:'mi', distractors:['mis','me']},
 wrong2:'Estos son mis amigo.', right2:'Estos son mis amigos.',
 blank2:{sentence:'¿Dónde están ___ llaves?', word:'tus', distractors:['tu','su']}}
,


{id:'g-B2-1', level:'B2', title:{en:"The Subjunctive in Adverbial Clauses (cuando, aunque, en cuanto...)", tr:"Zarf Cümlelerinde Subjunktif (cuando, aunque, en cuanto...)", fa:"حالت التزامی در جمله‌های قیدی (cuando، aunque، en cuanto...)", es:"El subjuntivo en cláusulas adverbiales (cuando, aunque, en cuanto...)"},
 exp:{en:"Picture this: you text a friend and promise 'I'll call you when I get home' — in Spanish, that little word 'when' quietly triggers a whole different verb form, and that's the trick worth mastering here. When words like cuando, aunque, en cuanto, and hasta que point to something that hasn't happened yet — a future or hypothetical moment — the verb that follows goes in the subjunctive. But if they're describing a habit or something already finished, you stay in the indicative: 'Cuando llego a casa, ceno' (habit, indicative) vs. 'Cuando llegue a casa, cenaré' (future, subjunctive). The mistake almost everyone makes at first is defaulting to the future tense after cuando, because English does exactly that ('when I get home, I will call you') — Spanish never puts a future-tense verb right after these trigger words when the meaning is future. A good gut-check: if you could swap the connector for 'whenever that eventually happens,' subjunctive is calling your name. Nail this distinction and you'll sound noticeably more natural — it's one of those markers native speakers instantly clock.",
      tr:"Şunu hayal et: bir arkadaşına mesaj atıp 'eve varınca seni ararım' diyorsun — İspanyolcada o küçük 'cuando' kelimesi sessizce bambaşka bir fiil kipini devreye sokuyor, ve burada ustalaşmaya değer olan hile de tam bu. Cuando, aunque, en cuanto ve hasta que gibi bağlaçlar henüz gerçekleşmemiş bir şeye — gelecekteki ya da varsayımsal bir ana — işaret ettiğinde, sonrasındaki fiil subjunktif olur. Ama alışılmış ya da zaten tamamlanmış bir şeyi anlatıyorlarsa, haber kipinde kalırsın: 'Cuando llego a casa, ceno' (alışkanlık, haber kipi) ile 'Cuando llegue a casa, cenaré' (gelecek, subjunktif) arasındaki fark tam olarak bu. Herkesin başta yaptığı hata, cuando'dan sonra gelecek zaman kullanmaktır, çünkü İngilizce tam olarak böyle işler ('when I get home, I will call you') — ama İspanyolca anlam gelecekle ilgiliyse bu bağlaçlardan hemen sonra asla gelecek zamanlı bir fiil koymaz. Hızlı bir kontrol yöntemi: eğer bağlacı 'bu ne zaman gerçekleşirse' diye değiştirebiliyorsan, orada subjunktif seni çağırıyor demektir. Bu ayrımı oturttuğunda belirgin biçimde daha doğal konuşursun — bu, anadili konuşanların anında fark ettiği işaretlerden biri.",
      fa:"یک لحظه تصورش کن: به دوستت پیام می‌دی و می‌گی 'وقتی رسیدم خونه بهت زنگ می‌زنم' — توی اسپانیایی، همون کلمه‌ی کوچیک 'cuando' یواشکی یک وجه فعلی کاملاً متفاوت رو فعال می‌کنه، و نکته‌ای که اینجا ارزش یادگرفتن داره همینه. وقتی کلماتی مثل cuando، aunque، en cuanto و hasta que به چیزی اشاره دارند که هنوز اتفاق نیفتاده — یک لحظه‌ی آینده یا فرضی — فعل بعد از آن‌ها به‌صورت التزامی می‌آید. اما اگر یک عادت یا کاری تمام‌شده را توصیف کنند، در وجه اخباری می‌مانی: 'Cuando llego a casa, ceno' (عادت، اخباری) در برابر 'Cuando llegue a casa, cenaré' (آینده، التزامی). اشتباهی که تقریباً همه در ابتدا مرتکب می‌شوند این است که بعد از cuando زمان آینده به کار می‌برند، چون انگلیسی دقیقاً همین‌طور عمل می‌کند ('when I get home, I will call you') — اما اسپانیایی وقتی معنا آینده است، هرگز بلافاصله بعد از این حروف ربط فعل آینده نمی‌گذارد. یک راه سریع برای چک‌کردن: اگر بتوانی حرف ربط را با 'هر وقت که بالاخره اتفاق بیفتد' جایگزین کنی، آنجا التزامی صدایت می‌زند. این تفاوت را که جا بیندازی، به‌طور محسوسی طبیعی‌تر حرف می‌زنی — این یکی از آن نشانه‌هایی است که گویشوران بومی فوراً متوجه‌اش می‌شوند.",
      es:"Imagínate: le escribes a un amigo y le prometes 'te llamo cuando llegue a casa' — en español, esa palabrita 'cuando' activa en secreto un modo verbal totalmente distinto, y ese es el truco que vale la pena dominar aquí. Cuando palabras como cuando, aunque, en cuanto y hasta que señalan algo que todavía no ha pasado — un momento futuro o hipotético —, el verbo que las sigue va en subjuntivo. Pero si describen un hábito o algo ya terminado, te quedas en indicativo: 'Cuando llego a casa, ceno' (hábito, indicativo) frente a 'Cuando llegue a casa, cenaré' (futuro, subjuntivo). El error que casi todo el mundo comete al principio es poner el futuro después de cuando, porque en inglés se hace justo así ('when I get home, I will call you') — pero el español nunca pone un verbo en futuro justo después de estos conectores cuando el sentido es futuro. Un truco rápido: si puedes cambiar el conector por 'siempre que eso llegue a pasar', ahí está pidiendo subjuntivo a gritos. Domina esta distinción y sonarás notablemente más natural — es una de esas señales que los hablantes nativos detectan al instante."},
 wrong:'Cuando llego a casa, te llamaré.', right:'Cuando llegue a casa, te llamaré.',
 blank:{sentence:'En cuanto ___ el informe, te lo envío.', word:'termine', distractors:['termino','terminaré']},
 wrong2:'Aunque llueve mañana, iremos a la playa.', right2:'Aunque llueva mañana, iremos a la playa.',
 blank2:{sentence:'No saldremos hasta que ___ de llover.', word:'pare', distractors:['para','paró']}},

{id:'g-B2-2', level:'B2', title:{en:"Past Subjunctive (imperfecto de subjuntivo)", tr:"Geçmiş Zaman Subjunktifi (imperfecto de subjuntivo)", fa:"التزامی گذشته (imperfecto de subjuntivo)", es:"El imperfecto de subjuntivo"},
 exp:{en:"Here's the good news: once you learn one verb form, you basically unlock this whole tense for free. To build the past subjunctive, grab the ellos/ellas form of the preterite, chop off -ron, and tack on -ra, -ras, -ra, -ramos, -rais, -ran — so hablaron becomes hablara, tuvieron becomes tuviera, and fueron becomes fuera. You'll reach for it whenever a past-tense trigger like quería que, esperaba que, or era importante que forces the subjunctive, and also inside hypothetical si-clauses like si tuviera tiempo. The most common slip-up is trying to build this tense from the present-tense stem instead of the preterite — remember, the preterite is always your starting point. A handy memory trick: since the preterite ellos form is often irregular anyway (tuvieron, fueron, dijeron), if you already know your irregular preterites, the past subjunctive basically comes free — you're just swapping the ending. Once this clicks, a whole layer of more sophisticated Spanish — wishes, doubts, hypotheticals — opens right up.",
      tr:"İyi haber şu: bir tek fiil şeklini öğrendiğinde, aslında bu zamanın tamamını bedavaya kapmış oluyorsun. Geçmiş zaman subjunktifini oluşturmak için preterite'in ellos/ellas hâlini al, -ron'u kes ve -ra, -ras, -ra, -ramos, -rais, -ran ekle — böylece hablaron, hablara olur; tuvieron, tuviera olur; fueron ise fuera olur. Quería que, esperaba que ya da era importante que gibi geçmiş zamanlı bir tetikleyici subjunktifi zorunlu kıldığında, ve si tuviera tiempo gibi varsayımsal si-cümlelerinde bu zamana başvurursun. En sık yapılan hata, bu zamanı preterite yerine şimdiki zaman kökünden kurmaya çalışmaktır — unutma, başlangıç noktan her zaman preterite'tir. İşe yarar bir hafıza hilesi: preterite'in ellos hâli zaten sık sık düzensiz olduğundan (tuvieron, fueron, dijeron), düzensiz preterite'lerini biliyorsan geçmiş zaman subjunktifi neredeyse bedavaya geliyor — sadece eki değiştiriyorsun. Bu oturduğunda, dilekler, şüpheler, varsayımlar gibi daha sofistike bir İspanyolca katmanı birden önünde açılıyor.",
      fa:"خبر خوب اینه: به‌محض اینکه یک صرف فعل رو یاد بگیری، عملاً کل این زمان رو مجانی به‌دست میاری. برای ساختن التزامی گذشته، صرف preterite برای ellos/ellas را بردار، -ron را قطع کن و به‌جایش -ra، -ras، -ra، -ramos، -rais، -ran بگذار — این‌طوری hablaron می‌شود hablara، tuvieron می‌شود tuviera، و fueron می‌شود fuera. هر وقت فعلی در زمان گذشته مثل quería que، esperaba que یا era importante que وجه التزامی را اجباری کند، و همچنین در جمله‌های شرطی فرضی با si مثل si tuviera tiempo، به این زمان نیاز پیدا می‌کنی. رایج‌ترین اشتباه این است که این زمان را از ریشه‌ی حال ساده بسازند نه از preterite — یادت باشد، preterite همیشه نقطه‌ی شروع توست. یک ترفند خوب برای به‌خاطرسپاری: چون صرف ellos در preterite معمولاً خودش بی‌قاعده است (tuvieron، fueron، dijeron)، اگر preterite‌های بی‌قاعده را بلد باشی، التزامی گذشته تقریباً مجانی به‌دستت می‌آید — فقط پایانه را عوض می‌کنی. وقتی این جا بیفتد، یک لایه‌ی کامل از اسپانیایی پیچیده‌تر — آرزوها، شک‌ها، فرض‌ها — یک‌دفعه برایت باز می‌شود.",
      es:"Buenas noticias: en cuanto aprendes una sola forma verbal, básicamente te llevas todo este tiempo gratis. Para formar el imperfecto de subjuntivo, toma la forma de ellos/ellas del pretérito, quítale el -ron y añade -ra, -ras, -ra, -ramos, -rais, -ran — así hablaron se convierte en hablara, tuvieron en tuviera, y fueron en fuera. Lo vas a necesitar cada vez que un verbo en pasado como quería que, esperaba que o era importante que exija subjuntivo, y también dentro de oraciones hipotéticas con si, como si tuviera tiempo. El error más común es intentar construir este tiempo desde el presente en lugar del pretérito — recuerda, el pretérito es siempre tu punto de partida. Un truco útil: como la forma de ellos del pretérito ya suele ser irregular (tuvieron, fueron, dijeron), si ya conoces tus pretéritos irregulares, el imperfecto de subjuntivo prácticamente viene gratis — solo cambias la terminación. Cuando esto te encaja, se te abre de golpe toda una capa de español más sofisticado — deseos, dudas, hipótesis."},
 wrong:'Quería que tú vengas a la fiesta.', right:'Quería que tú vinieras a la fiesta.',
 blank:{sentence:'Si yo ___ más tiempo, aprendería otro idioma.', word:'tuviera', distractors:['tengo','tendría']},
 wrong2:'Era importante que ella estudia más.', right2:'Era importante que ella estudiara más.',
 blank2:{sentence:'Mis padres esperaban que yo ___ médico.', word:'fuera', distractors:['soy','sería']}},

{id:'g-B2-3', level:'B2', title:{en:"Hypothetical 'If' Clauses (si + past subjunctive + conditional)", tr:"'Si' ile Varsayımsal Koşul Cümleleri", fa:"جمله‌های شرطی فرضی با si", es:"Oraciones condicionales hipotéticas con 'si'"},
 exp:{en:"Ever caught yourself daydreaming out loud — 'if I had a million dollars, I'd quit my job tomorrow'? Spanish has a specific, non-negotiable structure for exactly that kind of daydream. For situations that are hypothetical, unlikely, or flat-out contrary to reality in the present or future, the formula is: si + imperfecto de subjuntivo, + condicional simple. 'Si tuviera dinero, viajaría por el mundo' means 'If I had money, I would travel the world' — it's a wish, not a plan, and the grammar makes that crystal clear. The single most common mistake learners make is mixing tenses — sticking the conditional (viajaría) or even the present (tengo) into the si-clause itself, when only the past subjunctive belongs there. Think of it as a strict rule of the game: si never sits next to the conditional in the same clause, full stop. Get this pairing locked in and you'll be able to muse, dream, and complain hypothetically like a true native — 'si fuera millonario...' awaits.",
      tr:"Hiç kendini yüksek sesle hayal kurarken yakaladın mı — 'bir milyon dolarım olsa, yarın işi bırakırdım' gibi? İspanyolca, tam da bu tür hayaller için kesin ve pazarlıksız bir yapıya sahip. Şimdiki ya da gelecekteki varsayımsal, olası olmayan ya da gerçeğe tamamen aykırı durumlar için formül şu: si + imperfecto de subjuntivo, + condicional simple. 'Si tuviera dinero, viajaría por el mundo' cümlesi 'Param olsa, dünyayı gezerdim' anlamına gelir — bu bir plan değil, bir dilektir, ve dil bilgisi bunu apaçık ortaya koyar. Öğrencilerin yaptığı en yaygın hata zamanları karıştırmaktır — si cümleciğinin içine koşul kipini (viajaría) hatta şimdiki zamanı (tengo) sokuşturmak, oysa orada sadece imperfecto de subjuntivo yer alabilir. Bunu oyunun katı bir kuralı gibi düşün: si, aynı cümlecikte asla koşul kipinin yanında durmaz, nokta. Bu ikiliyi oturttuğunda gerçek bir yerli gibi varsayımsal olarak hayal kurabilir, düşlerini paylaşabilir, hatta şikâyet edebilirsin — 'si fuera millonario...' seni bekliyor.",
      fa:"تا حالا شده با صدای بلند خیال‌پردازی کنی — 'اگه یک میلیون دلار داشتم، فردا از کارم استعفا می‌دادم'؟ اسپانیایی برای دقیقاً همین نوع رویاپردازی یک ساختار مشخص و غیرقابل‌مذاکره دارد. برای موقعیت‌های فرضی، بعید یا کاملاً خلاف واقع در زمان حال یا آینده، فرمول این است: si + التزامی گذشته + شرطی ساده. 'Si tuviera dinero, viajaría por el mundo' یعنی 'اگر پول داشتم، دنیا را می‌گشتم' — این یک آرزوست نه یک برنامه، و دستور زبان این را کاملاً روشن می‌کند. رایج‌ترین اشتباه زبان‌آموزان قاطی‌کردن زمان‌هاست — گذاشتن شرطی (viajaría) یا حتی حال ساده (tengo) داخل خود جمله‌واره‌ی si، درحالی‌که آنجا فقط جای التزامی گذشته است. این را مثل یک قانون سخت‌گیرانه‌ی بازی در نظر بگیر: si هرگز کنار شرطی در همان جمله‌واره نمی‌نشیند، نقطه، تمام. این ترکیب را که یاد بگیری، می‌توانی مثل یک بومی واقعی خیال‌پردازی کنی، رویا ببافی و حتی فرضی گله کنی — 'si fuera millonario...' منتظرت است.",
      es:"¿Alguna vez te has pillado soñando despierto en voz alta — 'si tuviera un millón de dólares, dejaría mi trabajo mañana mismo'? El español tiene una estructura concreta e innegociable justo para ese tipo de fantasía. Para situaciones hipotéticas, poco probables o totalmente contrarias a la realidad en presente o futuro, la fórmula es: si + imperfecto de subjuntivo, + condicional simple. 'Si tuviera dinero, viajaría por el mundo' expresa un deseo, no un plan, y la gramática lo deja clarísimo. El error más común entre estudiantes es mezclar los tiempos — meter el condicional (viajaría) o incluso el presente (tengo) dentro de la propia cláusula con si, cuando ahí solo cabe el imperfecto de subjuntivo. Piénsalo como una regla estricta del juego: si nunca va al lado del condicional en la misma cláusula, punto final. Domina esta pareja y podrás fantasear, soñar y quejarte hipotéticamente como un nativo de verdad — 'si fuera millonario...' te espera."},
 wrong:'Si tengo más dinero, viajaría por el mundo.', right:'Si tuviera más dinero, viajaría por el mundo.',
 blank:{sentence:'Si ___ hablar cualquier idioma, elegiría el japonés.', word:'pudiera', distractors:['puedo','podría']},
 wrong2:'Si sabría la respuesta, te la diría.', right2:'Si supiera la respuesta, te la diría.',
 blank2:{sentence:'Si nosotros ___ en España, hablaríamos español todos los días.', word:'viviéramos', distractors:['vivimos','viviríamos']}},

{id:'g-B2-4', level:'B2', title:{en:"Passive Voice with SER (ser + past participle)", tr:"SER ile Edilgen Çatı (ser + geçmiş zaman ortacı)", fa:"وجه مجهول با Ser (ser + اسم مفعول)", es:"La voz pasiva con SER (ser + participio)"},
 exp:{en:"Quick reality check: Spanish speakers actually use the passive voice far less than English speakers do, so when you do reach for it, it's worth using correctly. The structure shifts the spotlight from who performs an action to what happens to something: ser + past participle (which has to agree in gender and number with the subject!) + por + the person responsible. 'El libro fue escrito por Cervantes' puts the book, not Cervantes, front and center. You'll see it constantly in news headlines and formal writing — 'el sospechoso fue detenido', 'la ley fue aprobada' — but in everyday chat, Spanish usually reaches for the active voice or the impersonal se instead ('se vende', 'se rompió'). The classic beginner mistake is forgetting the participle agreement, saying fue escrito for a feminine subject like la carta instead of fue escrita — that agreement is not optional. A quick trick: if you can ask '¿por quién?' about the action, ser-passive is a solid choice. Master this and formal Spanish — news articles, official announcements — will suddenly read a lot less intimidating.",
